ь оси с сохранением её непрерывности","Изменение частоты записи с глубиной без смещения осей","Разломы лучше всего выделяются на кубах когерентности и вертикальных разрезах."],["Как влияет наклон ВНК по площади залежи на подсчёт запасов?","Может указывать на гидродинамику или разобщённость и меняет объём","Указывает только на ошибки привязки каротажа и не меняет объём","Говорит о подъёме ВНК при разработке и не влияет на начальные запасы","Запасы растут всегда, а контуры нефтеносности не меняются","Наклон важен при оценке связанности блоков и уточнении контура нефтеносности."]]}],"color":"#A8703A"},{"id":"phys","name":"Физика пласта","subs":[{"name":"Фильтрационно-ёмкостные свойства","q":[["Что такое открытая пористость?","Доля объёма сообщающихся пор в объёме породы","Доля всех пустот в породе, включая изолированные","Доля пор, в которых вода подвижна","Объём трещин на единицу объёма породы","Для запасов важны связанные поры, поскольку изолированные не участвуют в фильтрации."],["В каких единицах в практике измеряют проницаемость?","В миллидарси","В мПа·с","В м³/(сут·МПа)","В м²/с","1 Дарси примерно равен 1 мкм². В практике используют мД, так как значения чаще составляют единицы и сотни мД."],["В чём заключается эффект Клинкенберга?","Газовая проницаемость завышена при низких давлениях из-за проскальзывания у стенок пор","Газовая проницаемость занижена из-за сжатия газа","Проницаемость растёт при снижении эффективного давления","Вязкость газа падает при высоком давлении","Поэтому измерения газопроницаемости приводят к жидкостной проницаемости с поправкой."],["Что такое песчанистость?","Отношение эффективной толщины к общей толщине пласта","Отношение объёма песка к объёму глин в породе","Доля песчаных зёрен в скелете породы","Отношение нефтенасыщенной толщины к эффективной","Песчанистость показывает, какая часть разреза пласта представлена коллектором."],["Что связывает уравнение Арчи?","Сопротивление породы с пористостью и водонасыщенностью","Проницаемость с пористостью и остаточной водой","Скорость волны с пористостью","Капиллярное давление с насыщенностью","Формула служит основой для определения насыщения по данным электрического каротажа."],["Что такое абсолютная проницаемость?","Проницаемость породы при насыщении одной инертной фазой","Проницаемость по нефти при остаточной водонасыщенности","Проницаемость при пластовом давлении и температуре для любых фаз","Сумма фазовых проницаемостей по нефти и воде","Её измеряют обычно по газу или инертной жидкости."],["Что такое эффективная пористость?","Доля пор, участвующих в фильтрации подвижных флюидов","Доля всех пор, включая изолированные","Пористость, измеренная по акустическому каротажу","Доля нефтенасыщенных пор","Связанная вода и микропоры в неё не входят."],["Какой метод определения пористости на керне основан на законе Бойля?","Газоволюметрический","Метод насыщения жидкостью Преображенского","Метод ртутной порометрии","Метод ядерного магнитного резонанса","Определяется объём пор или скелета по изменению давления газа."],["Как обычно связаны пористость и проницаемость в песчаниках?","Положительной, но не строго однозначной зависимостью","Строго функционально по закону Дарси","Обратной зависимостью: выше пористость — ниже проницаемость","Связь есть только в карбонатах","Важен размер пор: при одинаковой пористости проницаемость может отличаться на порядки."],["Термин \"бесконечно действующий пласт\" при проведении ГДИС означает, что:","изменение пластового давления, инициируемое разработкой пласта, не достигло внешних границ пласта (или границ зон дренирования скважины)","забойное давление постоянно","дебит нефти является постоянной величиной","изменение пластового давления, инициируемое разработкой пласта, достигло внешних границ пласта","Пока волна давления не дошла до границ, поведение скважины такое же, как в бесконечном пласте. Это режим радиального притока, по которому определяют проницаемость и скин. После достижения границ начинается граничный режим.","lzs-26"],["Радиус исследования при ГДИС составляет:","десятки-сотни метров","около 10 метров","первые метры","первые сантиметры","ГДИС охватывают зону дренирования вокруг скважины, поэтому радиус обычно составляет десятки и сотни метров и растёт с длительностью исследования. Сантиметры и первые метры — это масштаб керна и малоглубинных методов ГИС.","lzs-27"],["Дайте определение - Градиент - это:","вектор, характеризующий направление в сторону возрастания функции","величина, показывающая изменение давления в данной точке","нет правильного ответа","величина, равная сумме частных производных второго порядка","Градиент — вектор, направленный в сторону наибольшего возрастания функции, а его длина равна скорости этого возрастания. Сумма вторых частных производных — это оператор Лапласа, а не градиент.","lzs-30"],["Остаточная нефтенасыщенность определяется как:","Значение нефтенасыщенности, при котором нефть становится неподвижной фазой","Значение нефтенасыщенности, при котором нефть становится подвижной фазой","Значение нефтенасыщенности, при котором нефть и вода становятся неподвижными фазами","Нет правильных ответов","При снижении до Sor фазовая проницаемость по нефти становится нулевой: оставшаяся нефть удержана капиллярными силами и не течёт, а вода продолжает двигаться.","lzs-50"],["Относительная фазовая проницаемость по нефти изменяется в пределах:","от 0 до 1","от 0.5 до 1","от 0 до 10","от 0 до 0.5","ОФП — это отношение фазовой проницаемости к абсолютной, поэтому она безразмерна. Она равна 0, когда нефть неподвижна, и близка к 1, когда нефть является единственной подвижной фазой.","lzs-51"]]},{"name":"Смачиваемость и капиллярность","q":[["Что характеризует смачиваемость?","Предпочтение твёрдой поверхности контактировать с одной из фаз","Соотношение подвижностей воды и нефти","Способность породы впитывать бурый раствор под давлением","Межфазное натяжение между нефтью и водой","Смачиваемость определяет распределение флюидов в порах, ОФП и эффективность вытеснения."],["Что такое капиллярное давление?","Разность давлений между несмачивающей и смачивающей фазами","Разность давлений между кровлей и подошвой пласта","Давление, необходимое для разрыва покрышки","Разность давлений фаз на контакте и в скважине","Именно оно определяет переходную зону и удержание воды в мелких порах."],["Что такое остаточная (связанная) водонасыщенность?","Вода, которая удерживается в порах и не вытесняется при притоке нефти","Вода, оставшаяся после заводнения в промытой зоне","Вода в глинах, не участвующая в подсчёте запасов","Подвижная вода в переходной зоне","Она занимает часть порового объёма, поэтому её учитывают при расчёте запасов."],["Для чего используют J-функцию Леверетта?","Для приведения капиллярных кривых образцов разной пористости и проницаемости к одному виду","Для пересчёта лабораторных ОФП с образца на ячейку модели с другой толщиной","Для определения смачиваемости по результатам капилляриметрии образцов керна","Для приведения проницаемости по газу к проницаемости по жидкости","J-функция позволяет обобщать данные по керну и строить насыщенность по высоте над контактом."],["Чему равна сумма ОФП нефти и воды в двухфазном потоке?","Обычно меньше единицы","Строго единице при любом насыщении","Больше единицы в гидрофильных породах","Единице только при остаточной водонасыщенности","Фазы мешают друг другу, поэтому сумма относительных проницаемостей меньше единицы."],["Какому краевому углу соответствует гидрофильная поверхность?","Менее 90°, если угол измерен через воду","Более 120°, если угол измерен через воду","Около 90°, если угол измерен через нефть","Менее 90°, если угол измерен через нефть","Малый угол через воду означает, что вода растекается по породе и является смачивающей фазой."],["Что такое насыщенность породы?","Доля порового объёма, занятая данным флюидом","Отношение массы флюида к массе скелета","Объём флюида на единицу объёма породы","Доля пор, связанных с внешней средой","Сумма насыщенностей воды, нефти и газа равна единице."],["Что такое переходная зона в залежи?","Интервал изменения насыщенности над уровнем свободной воды","Интервал между кровлей и подошвой покрышки","Промытая зона вокруг скважины","Зона смешения пластовой и закачанной воды","Высота зоны тем больше, чем меньше проницаемость породы."],["Какой метод измерения смачиваемости считается стандартным лабораторным?","Метод Аммотта","Метод Закса-Бютнера","Метод центрифуги Закса","Метод Хасслера-Бруннера","Он основан на сравнении самопроизвольной и принудительной пропитки."],["Что такое уровень свободной воды (УСВ)?","Отметка, где капиллярное давление равно нулю","Положение ВНК по данным каротажа","Подошва переходной зоны с максимальным капиллярным давлением","Статический уровень в законсервированной скважине","ВНК лежит выше УСВ на высоту, соответствующую пороговому давлению."]]},{"name":"Свойства пластовых флюидов","q":[["Что показывает коэффициент сжимаемости нефти?","Относительное изменение объёма при изменении давления","Изменение вязкости при изменении давления","Отношение объёма газа к объёму нефти","Изменение плотности с температурой","Сжимаемость определяет запас упругой энергии выше давления насыщения."],["Каково обычно значение объёмного коэффициента нефти?","Больше единицы","Меньше единицы","Равно единице выше давления насыщения","Равно плотности нефти","В пласте в нефти растворён газ, поэтому её объём больше объёма дегазированной нефти."],["Что такое газосодержание нефти?","Объём газа, растворённого в единице объёма дегазированной нефти","Объём свободного газа в единице порового объёма","Отношение добытого газа к добытой нефти за всю историю","Массовая доля метана в нефтяной смеси","Газосодержание влияет на плотность, вязкость и давление насыщения нефти."],["Как вязкость нефти меняется с ростом температуры?","Снижается","Не меняется до температуры начала кристаллизации парафина","Сначала растёт, потом снижается","Растёт из-за выделения газа","Поэтому тепловые методы эффективны для высоковязких нефтей."],["Что такое PVT-исследования?","Исследования зависимости свойств флюидов от давления, объёма и температуры","Исследования фазовых проницаемостей на керне","Исследования проницаемости при разных температурах","Гидродинамические исследования при трёх режимах","На основе PVT рассчитывают запасы и поведение пласта."],["Как изменяется вязкость нефти ниже давления насыщения при снижении давления?","Растёт из-за выделения газа","Снижается из-за расширения жидкости","Не меняется, так как нефть уже насыщена","Снижается, так как нефть теряет тяжёлые компоненты","Растворённый газ разжижает нефть, а его потеря делает её вязче."],["Что характеризует коэффициент сверхсжимаемости Z?","Отклонение реального газа от идеального","Отношение объёма газа в пласте к объёму на поверхности","Способность газа растворяться в нефти","Изменение вязкости газа с давлением","Уравнение состояния: PV = ZnRT."],["Что такое конденсатогазовый фактор?","Количество конденсата на единицу объёма газа","Отношение добытого газа к добытому конденсату за год","Отношение давления начала конденсации к пластовому","Доля тяжёлых фракций в нефти","Он характеризует содержание жидких углеводородов в газе."],["Какова типичная вязкость пластовой воды?","Около 0,3–1 мПа·с","Около 5–10 мПа·с","Около 20–50 мПа·с","Около 0,01–0,03 мПа·с","Вода маловязкая, её вязкость снижается с ростом температуры."],["Явление ретроградной конденсации - это","переход газовой фазы в жидкую при падении давления ниже точки росы и постоянной температуре в пределах критической и крикодентермы","переход жидкой фазы в газовую при падении давления ниже точки росы и постоянной температуре в пределах критической и крикодентермы","переход газовой фазы в жидкую при падении давления ниже точки росы","переход газовой фазы в жидкую при падении температуры","«Ретроградная» значит обратная: обычно при снижении давления жидкость испаряется, а здесь газ конденсируется. Эффект проявляется при температуре между критической точкой и крикондентермой. Третий вариант неполон — без условия по температуре это не ретроградный процесс.","lzs-17"],["Объемный коэффициент газа определяется как:","Объем газа в пластовых условиях, необходимый для производства одного кубического метра газа в стандартных условиях","Масса газа в пластовых условиях, необходимая для производства одного кубического метра газа в стандартных условиях","Количество газа в пластовых условиях, необходимое для производства одного кубического метра газа в стандартных условиях","Объем газа в стандартных условиях, необходимый для производства одного кубического метра газа в пластовых условиях","Bg = Vпл / Vст: это отношение объёмов, а не масс, и пластовый объём стоит в числителе. Поскольку газ в пласте сжат, Bg намного меньше единицы.","lzs-18"],["Давление насыщения определяется как давление, при котором:","начинается выделение газа из нефти","плотность нефти уменьшается","вязкость нефти уменьшается","происходит выпадение асфальтенов","Давление насыщения — максимальное давление, при котором из нефти при данной температуре выделяется первый пузырёк растворённого газа. Выше него нефть однофазна, ниже него появляется свободный газ.","lzs-19"]]},{"name":"Механические свойства пород","q":[["Дайте определение коэффициента Пуассона - это?","Соотношение относительных поперечных и продольных деформаций","Относительное удлинение образца при растяжении","Коэффициент, характеризующий сдвиг при касательном напряжении","Относительное изменение поперечных размеров образца при растяжении","ν = −εпоперечн / εпродольн. Это отношение двух деформаций; для большинства пород оно составляет 0,1–0,4. Последний вариант называет лишь поперечную деформацию без сравнения с продольной.","lzs-65"],["Модуль упругости - это:","напряжение при относительной деформации, равной 1","сила, приходящаяся на единицу площади","напряжение при относительной деформации, равной 0.5","напряжение при относительной деформации, равной 0.75","По закону Гука σ = E·ε. Если подставить ε = 1, то σ = E: это физический смысл модуля. Сила на единицу площади — определение напряжения, а не модуля.","lzs-66"],["Что понимается под хрупкой деформацией горной породы?","Порода разрушается по трещинам дробления, субперпендикулярным наименьшему главному напряжению","Порода разрушается путем образования трещин скола","Порода \"течет\", т.к. деформация распределена равномерно","Порода не изменяется визуально","При хрупкой деформации порода разрушается без заметной пластической деформации, образуя трещины отрыва перпендикулярно наименьшему главному напряжению. «Течение» — это пластическая деформация.","lzs-81"]]},{"name":"Практические ситуации","q":[["Почему проницаемость керна по газу выше, чем по жидкости?","Из-за проскальзывания молекул газа у стенок пор","Из-за низкой плотности газа и турбулентности в порах","Из-за растворения цемента сухим газом","Из-за более высокой вязкости газа по сравнению с нефтью","Это эффект Клинкенберга, поэтому вводят поправку к жидкостной проницаемости."],["В гидрофильном коллекторе вода при заводнении обычно:","Занимает мелкие поры и вытесняет нефть капиллярной пропиткой","Движется только по крупным порам, оставляя нефть в мелких","Покрывает зёрна плёнкой нефти и не вытесняет её капиллярно","Занимает всё поровое пространство только после прорыва","Смачивающая фаза движется по стенкам и мелким порам, а нефть остаётся в центре крупных пор."],["Выше давления насыщения приток к скважине обеспечивается в основном:","Упругим расширением флюидов и породы или напором воды","Расширением выделившегося из нефти газа","Расширением газовой шапки над залежью","Гравитационным стеканием нефти","Свободного газа выше Рнас нет, поэтому работает упругий запас или внешний напор."],["Что произойдёт с дебитом нефти, если забойное давление снизить ниже давления насыщения вокруг скважины?","Прирост замедлится из-за появления газа и снижения ОФП по нефти","Дебит будет расти строго пропорционально депрессии","Дебит упадёт до нуля при первых пузырьках газа","Дебит вырастет быстрее, так как вязкость нефти снизится","Свободный газ занимает поровое пространство, индикаторная линия изгибается."]]}],"color":"#16A5C4"},{"id":"lift","name":"Механические способы эксплуатации скважин","subs":[{"name":"УЭЦН","q":[["Что входит в состав погружной части УЭЦН?","Насос, газосепаратор, гидрозащита и электродвигатель","Плунжер, цилиндр и клапаны","Эжектор, пакер и НКТ","Статор, ротор и клапан-отсекатель","Двигатель вращает вал секций насоса. Гидрозащита предохраняет двигатель от пластовой жидкости, а сепаратор отводит газ."],["Для чего применяется частотный преобразователь с УЭЦН?","Для регулирования частоты вращения и подачи насоса","Для защиты кабеля от пробоя изоляции","Для компенсации реактивной мощности в сети","Для повышения напряжения на вводе трансформатора","Изменение частоты позволяет подобрать режим под приток и плавно запускать насос, уменьшая нагрузки."],["Что происходит при большом содержании свободного газа на приёме ЭЦН?","Падает напор, возможен срыв подачи","Растёт ток двигателя из-за увеличения подачи","Снижается вязкость и растёт напор насоса","Насос работает с повышенной подачей","Газ заполняет каналы рабочих колёс, поэтому применяют газосепараторы, диспергаторы или увеличивают глубину спуска."],["Что контролирует погружная телеметрия ТМС?","Давление на приёме, температуру и вибрацию погружного агрегата","Подачу насоса и обводнённость продукции","Давление на устье и дебит газа","Сопротивление изоляции станции управления","По этим данным защищают ЭЦН от перегрева и срыва подачи и оптимизируют режим скважины."],["Что означает маркировка ЭЦН5-125-1300?","Габарит 5, подача 125 м³/сут, напор 1300 м","Габарит 5, напор 125 м, подача 1300 м³/сут","Подача 5 м³/ч, напор 125 м, глубина спуска 1300 м","Габарит 5, мощность 125 кВт, напор 1300 м","Подача и напор указаны в номинальной точке. Насос подбирают так, чтобы рабочая точка находилась в рекомендуемой зоне."],["Что такое напорная характеристика ЭЦН?","Зависимость напора от подачи","Зависимость мощности от частоты вращения","Зависимость давления на приёме от дебита","Зависимость КПД от напряжения","С ростом подачи напор снижается, а рабочая точка должна быть в зоне высокого КПД."],["Почему нельзя допускать работу ЭЦН без притока?","Двигатель перегреется без охлаждения жидкостью","Снижается давление на приёме и растёт дебит","Рабочие колёса начинают вращаться в обратную сторону","Срабатывает обратный клапан и закрывает НКТ","ПЭД охлаждается потоком жидкости, поэтому при срыве подачи срабатывает защита."],["Что такое кабельная линия УЭЦН?","Подача электроэнергии с поверхности к двигателю","Передача сигнала обратной связи на станцию управления","Подвеска насоса в скважине","Контроль сопротивления изоляции НКТ","Кабель — один из частых элементов отказа, поэтому его контролируют при каждом спуске."],["Что происходит при неправильном направлении вращения ЭЦН?","Подача резко снижается","Двигатель сразу останавливается по защите от недогруза","Растёт напор, но падает КПД","Срабатывает обратный клапан","Правильное вращение проверяют при запуске сравнением подачи и давления."]]},{"name":"УШГН","q":[["Какую функцию выполняет станок-качалка?","Преобразует вращение электродвигателя в возвратно-поступательное движение штанг","Создаёт вращение колонны штанг на устье","Повышает давление на приёме насоса","Уравновешивает гидростатику столба жидкости в НКТ","Кривошипно-шатунный механизм и балансир передают движение колонне штанг, приводящей плунжер насоса."],["Что такое коэффициент подачи штангового насоса?","Отношение фактической подачи к теоретической","Отношение объёма цилиндра к объёму вредного пространства","Отношение длины хода плунжера к длине хода штока","Отношение давления на выкиде к давлению на приёме","На подачу влияют газ, утечки и деформация штанг, поэтому коэффициент обычно меньше единицы."],["Что такое динамический уровень?","Уровень жидкости в затрубье работающей скважины","Уровень жидкости в затрубье остановленной скважины","Высота столба жидкости над приёмом насоса","Уровень жидкости в НКТ работающей скважины","В простаивающей скважине определяют статический уровень. Разница между ними связана с депрессией на пласт."],["Каким прибором определяют уровень жидкости в затрубье?","Эхолотом","Дебитомером","Глубинным манометром на проволоке","Динамографом","Звуковой импульс отражается от поверхности жидкости, и по времени прихода рассчитывается глубина уровня."],["Что показывает динамограмма штанговой установки?","Зависимость нагрузки на полированный шток от его перемещения","Зависимость давления на приёме от времени","Зависимость подачи от числа качаний","Изменение нагрузки на двигатель за сутки","Форма карты позволяет диагностировать утечки, газ, неполное заполнение насоса и обрыв штанг."],["Для чего предназначен газовый якорь?","Для отделения свободного газа перед входом в насос","Для удержания НКТ от смещения при работе насоса","Для дополнительного растворения газа в нефти","Для сжатия газа перед входом в насос","Якорь уменьшает количество газа на приёме, повышая коэффициент наполнения насоса."],["Что входит в штанговый насос?","Цилиндр, плунжер и клапаны","Рабочие колёса и направляющие аппараты","Винт и обойма из эластомера","Сопло, камера смешения и диффузор","Движение плунжера открывает всасывающий и нагнетательный клапаны."],["Какие причины снижают подачу ШГН?","Газ в насосе, утечки и деформация штанг","Низкая плотность отбираемой жидкости","Большое погружение насоса под уровень","Увеличение диаметра плунжера","Все они снижают коэффициент подачи по сравнению с теоретическим."],["Что такое длина хода и число качаний?","Параметры режима работы штангового насоса","Параметры газлифтного клапана","Параметры подбора электродвигателя ЭЦН","Параметры скважинной диаграммы притока","Теоретическая подача пропорциональна площади плунжера, ходу и числу качаний."],["Для чего нужен противовес станка-качалки?","Для уравновешивания нагрузки на двигатель","Для увеличения длины хода точки подвеса","Для снижения веса колонны штанг в жидкости","Для компенсации растяжения штанг","Хорошая балансировка снижает пики тока и затраты на энергию."],["Какая проблема характерна для УШГН в искривлённых скважинах?","Истирание штанг и НКТ","Кавитация на приёме из-за низкой вязкости","Перегрев погружного двигателя","Срыв подачи из-за забивания рабочих колёс","Трение на участках набора кривизны ускоряет износ и обрывы."]]},{"name":"Другие способы и продуктивность","q":[["За счёт чего работает газлифт?","За счёт снижения плотности столба жидкости закачанным газом","За счёт вращения потока винтовой парой","За счёт энергии сжатого газа, толкающего поршень","За счёт нагрева жидкости газом с поверхности","Газ разгазирует жидкость в трубах, забойное давление падает и пласт отдаёт больше жидкости."],["В каких условиях особенно эффективны винтовые насосы?","При добыче вязкой нефти и жидкости с механическими примесями","При высоком газовом факторе и больших глубинах","При большом дебите маловязкой жидкости","В скважинах с очень большой глубиной спуска и высокой температурой","Винтовая пара создаёт объёмную подачу без резких ускорений и хорошо работает с вязкими средами."],["Что такое коэффициент продуктивности скважины?","Отношение дебита к депрессии","Отношение дебита к забойному давлению","Отношение депрессии к дебиту","Отношение дебита к пластовому давлению","Он показывает, сколько жидкости даёт скважина на единицу перепада давления, и лежит в основе подбора насоса."],["За счёт чего работает скважинный струйный насос?","За счёт энергии рабочей жидкости, подаваемой с поверхности","За счёт перепада давления на гидромоторе","За счёт энергии сжатого газа в затрубье","За счёт вращения рабочих колёс от электродвигателя","Струя в сопле создаёт разрежение и подсасывает пластовую жидкость. В насосе нет движущихся частей."],["Что такое фонтанный способ эксплуатации?","Подъём жидкости только за счёт пластовой энергии","Подъём жидкости за счёт газа, закачиваемого с поверхности","Подъём жидкости в период глушения","Подъём за счёт закачки воды в НКТ","Фонтанирование возможно, пока забойное давление превышает давление столба жидкости."],["Что ограничивает эффективность газлифта?","Большие затраты энергии на сжатие газа","Невозможность работы с песком","Низкая надёжность скважинных клапанов при любых дебитах","Необходимость подъёма НКТ для регулировки режима","Газлифт прост, но энергетически менее эффективен при низких давлениях."],["Что характеризует индикаторная диаграмма скважины?","Зависимость дебита от депрессии","Зависимость забойного давления от времени после остановки","Зависимость напора насоса от подачи","Изменение уровня в затрубье со временем","По её наклону определяют коэффициент продуктивности."],["Что такое кривая притока Вогеля?","Зависимость притока от забойного давления при режиме растворённого газа","Зависимость потерь давления в НКТ от дебита","Зависимость обводнённости от выработки запасов","Падение дебита во времени при постоянной депрессии","Ниже давления насыщения приток нелинеен, и прямая Дарси уже не работает."]]},{"name":"Практические ситуации","q":[["Ток УЭЦН снижен, подача упала, давление на приёме растёт. Наиболее вероятная причина?","Износ насоса, негерметичность НКТ или слом вала","Перегрузка двигателя из-за роста вязкости жидкости","Рост газосодержания на приёме и срыв подачи","Засорение приёмной сетки мехпримесями","Двигатель теряет нагрузку, а жидкость не поднимается, поэтому уровень в затрубье растёт."],["Ток ЭЦН колеблется, давление на приёме низкое, подача пульсирует. Что вероятнее всего?","Срыв подачи из-за газа или недостаточного притока","Износ подшипников без потери подачи","Рост пластового давления на участке","Заклинивание вала насоса","Газ и низкий уровень дают циклическую работу. Помогают снижение частоты, газосепаратор или заглубление."],["Подбираете способ эксплуатации: 300 м³/сут, низкий газовый фактор, вертикальная скважина. Какой вариант наиболее логичен?","УЭЦН","УШГН с насосом малого диаметра","Плунжерный лифт","Винтовой насос с приводом от штанг","ЭЦН рассчитан на большие подачи. УШГН экономичнее при малых дебитах."],["Дебит 5 м³/сут, вязкая нефть, небольшая глубина. Какой способ обычно выбирают?","УШГН или винтовой насос","УЭЦН с большой подачей и дросселированием","Непрерывный газлифт","Струйный насос с подачей воды с поверхности","На малых дебитах ЭЦН работает вне рабочей зоны и перегревается, а штанговые и винтовые насосы подходят лучше."],["На динамограмме видно резкое падение нагрузки в начале хода вниз и неполное заполнение насоса. О чём это говорит?","О недостаточном притоке или влиянии газа","О заклинивании плунжера в цилиндре","Об обрыве штанг в верхней части колонны","О негерметичности всасывающего клапана","Форма карты показывает заполнение плунжера: при неполном заполнении нагрузка падает с ударом."],["Как в узловом анализе определяют рабочую точку скважины?","По пересечению кривой притока и кривой подъёма","По максимальному значению кривой подъёма","По точке пересечения притока с давлением насыщения","По минимальному забойному давлению на кривой притока","Пересечение показывает дебит, при котором пласт отдаёт столько, сколько скважина может поднять."]]}],"color":"#3A7CE0"},{"id":"workover","name":"Текущий и капитальный ремонт скважин","subs":[{"name":"Текущий ремонт","q":[["Какая работа относится к текущему ремонту скважин?","Смена погружного насоса","Изоляция обводнившегося интервала цементом","Ликвидация негерметичности колонны","Перевод скважины на другой горизонт","ТРС включает работы с подземным оборудованием: смену насосов, НКТ, штанг. Вмешательство в ствол и пласт относится к КРС."],["Какое оборудование используется при спуско-подъёмных операциях в ремонте?","Подъёмный агрегат","Цементировочный агрегат","Паропередвижная установка","Насосный агрегат ЦА-320","Подъёмники на шасси, например серии А-50, поднимают и спускают НКТ и инструмент без стационарной буровой."],["Зачем проводят шаблонирование эксплуатационной колонны?","Чтобы проверить проходимость и внутренний диаметр","Чтобы определить интервалы негерметичности","Чтобы очистить стенки от парафина","Чтобы выявить заколонные перетоки","Шаблон заранее выявляет смятие или посторонние предметы, что снижает риск аварии при спуске оборудования."],["Что показывает межремонтный период (МРП)?","Среднюю продолжительность работы скважины между ремонтами","Среднее время простоя скважины в ожидании ремонта","Срок службы подземного оборудования до списания","Интервал между плановыми осмотрами устья","Рост МРП означает снижение затрат на ремонт и потерь добычи, поэтому показатель постоянно отслеживают."],["Что выполняют при ревизии погружного оборудования?","Подъём, осмотр и при необходимости замену","Опрессовку эксплуатационной колонны под пакером","Перфорацию нового интервала","Замену колонной головки","ТРС часто вызван отказом насоса или низкой подачей."],["Что такое обратная промывка?","Подача жидкости в затрубье с выходом по НКТ","Подача жидкости в НКТ с выходом в затрубье","Промывка с закачкой в пласт без выхода на устье","Циркуляция через боковой клапан в НКТ","Обратная промывка лучше выносит шлам из-за высокой скорости в НКТ."],["Для чего проводят опрессовку НКТ?","Для проверки герметичности под давлением","Для определения приёмистости пласта","Для снятия остаточных напряжений в трубах","Для очистки резьбы от герметика","Негерметичная колонна НКТ снижает подачу и приводит к повторным ремонтам."],["Что такое устьевая арматура?","Оборудование для герметизации и управления потоком на устье","Нижняя часть обсадной колонны с башмаком","Блок управления превенторами","Подземная компоновка с пакером и НКТ","Она направляет продукцию и позволяет проводить замеры и обработки."]]},{"name":"Капитальный ремонт","q":[["Какая работа относится к капитальному ремонту скважин?","Устранение негерметичности эксплуатационной колонны","Замена колонны НКТ на другой диаметр","Смена насоса на другой типоразмер","Ревизия и смена штанг","КРС восстанавливает работоспособность ствола или воздействует на пласт, а это сложнее и дороже работ с оборудованием."],["Для чего служат метчик и колокол?","Для захвата оставшихся в скважине труб","Для определения формы предмета на забое","Для фрезерования цементного моста","Для нарезания новой резьбы на муфтах НКТ","Это ловильные инструменты: метчик вворачивается внутрь трубы, колокол захватывает её снаружи."],["Что такое РИР?","Ремонтно-изоляционные работы","Работы по интенсификации притока реагентами","Ремонт и испытание резервуаров","Регламентные исследования режима","РИР ограничивают водопритоки, ликвидируют перетоки и негерметичность колонны с помощью тампонажных составов."],["Что такое зарезка бокового ствола (ЗБС)?","Бурение нового ствола из существующей скважины через окно в колонне","Углубление существующего ствола ниже забоя","Вырезание участка колонны для её замены","Гидропескоструйное вскрытие канала в пласте","ЗБС позволяет вовлечь недренируемые запасы без бурения новой скважины с поверхности."],["Для чего спускают свинцовую печать?","Для определения формы и положения предмета в скважине","Для герметизации интервала негерметичности","Для захвата оставшихся в скважине малых предметов","Для проверки проходимости колонны","Вмятины на мягком свинце показывают форму и положение головы аварийного объекта и помогают подобрать инструмент."],["Как обычно ликвидируют песчаную пробку на забое?","Промывкой скважины","Установкой цементного моста","Закачкой растворителя парафина","Увеличением депрессии на пласт","Песок размывают струёй жидкости и выносят на поверхность, иногда с применением гидробура или желонки."],["Какая работа выполняется при возврате на другой горизонт?","Изоляция текущего пласта и вскрытие другого","Углубление забоя без изоляции пласта","Перевод добывающей скважины под нагнетание","Смена насоса на другой типоразмер","Возврат вводит в разработку запасы другого объекта без бурения новой скважины."],["Что такое фрезерование в скважине?","Разрушение инструмента или цементного моста вращающимся фрезером","Прорезание щелей в колонне гидропескоструйной струёй","Очистка внутренних стенок колонны скребком","Калибровка ствола шаблоном","Фрезером удаляют аварийные объекты, мешающие работам."],["Как определяют интервал негерметичности колонны?","Опрессовкой с пакером и геофизическими методами","По изменению устьевого давления без спуска приборов","Только гамма-каротажем","По замерам обводнённости продукции","Термометрия, резистивиметрия и пошаговая опрессовка точно локализуют дефект."]]},{"name":"Глушение и пакеры","q":[["Для чего выполняется глушение скважины?","Чтобы создать противодавление на пласт и предотвратить приток при ремонте","Чтобы снизить забойное давление перед вызовом притока","Чтобы очистить призабойную зону от загрязнений","Чтобы проверить герметичность эксплуатационной колонны","Скважину заполняют жидкостью нужной плотности, чтобы забойное давление превышало пластовое и работы были безопасны."],["Для чего применяют пакер?","Для разобщения интервалов ствола скважины","Для центрирования колонны НКТ в обсадной","Для удержания столба жидкости при подъёме насоса","Для отделения газа на приёме насоса","Пакер герметично перекрывает кольцевое пространство, что важно при закачке, ГРП и изоляции интервалов."],["Почему для глушения стараются применять жидкости без твёрдой фазы?","Чтобы снизить загрязнение призабойной зоны","Чтобы обеспечить большую плотность жидкости","Чтобы снизить коррозию оборудования устья","Чтобы ускорить закачку через НКТ","Твёрдые частицы и несовместимый фильтрат снижают продуктивность, поэтому после ремонта возможны длительный вывод на режим и потери дебита."],["Какая жидкость обычно используется для глушения без твёрдой фазы?","Солевой раствор","Инвертно-эмульсионный раствор с баритом","Пресная вода с бентонитом","Нефть с добавкой мела","Растворы хлоридов дают нужную плотность без частиц, загрязняющих пласт."],["Как рассчитывают плотность жидкости глушения?","Из пластового давления, глубины и запаса противодавления","По забойному давлению работающей скважины и длине НКТ","По давлению насыщения и глубине спуска насоса","По весу колонны в растворе и давлению на устье","ρ = Рпл·(1+запас)/(g·H): давление столба должно превышать пластовое."],["Какая функция у разобщителя или клапана-отсекателя?","Перекрыть скважину при аварийной ситуации","Подать ингибитор в поток","Выравнивать давление между НКТ и затрубьем при подъёме","Удержать НКТ от осевого перемещения","Такие устройства снижают риск неконтролируемого выброса."]]},{"name":"Интенсификация притока","q":[["Какую кислоту обычно применяют для обработки карбонатного коллектора?","Соляную","Плавиковую","Смесь соляной и плавиковой (глинокислоту)","Сульфаминовую концентрированную","HCl растворяет кальцит и доломит, создавая каналы. Для терригенных коллекторов используют также глинокислоту."],["Для чего при ГРП закачивают проппант?","Чтобы удержать трещину открытой после снятия давления","Для растворения карбонатного цемента вдоль трещины","Для снижения потерь жидкости разрыва на трение","Для продолжения развития трещины по длине","Без проппанта трещина смыкается. Прочная упаковка песка или керамики создаёт канал высокой проводимости."],["Что такое глинокислотная обработка?","Обработка смесью соляной и плавиковой кислот","Обработка смесью соляной и уксусной кислот","Закачка глинистой суспензии для снижения приёмистости","Обработка серной кислотой для растворения глин","Смесь растворяет глинистые частицы и кварц в песчаниках."],["Для чего применяют ингибитор коррозии при кислотной обработке?","Для защиты труб от действия кислоты","Для замедления реакции кислоты с породой в глубине пласта","Для предотвращения вторичного осадкообразования железа","Для снижения поверхностного натяжения на границе с нефтью","Кислота разъедает металл, поэтому без ингибитора трубы сильно повреждаются."],["В каком случае ГРП наиболее эффективен?","В низкопроницаемых коллекторах с достаточными запасами","В высокопроницаемых пластах с положительным скином","В пластах с близким обводнённым пропластком без барьера","В истощённых пластах с малыми остаточными запасами","Трещина увеличивает зону дренирования, а близость воды создаёт риск обводнения."]]},{"name":"Практические ситуации","q":[["После ремонта с глушением дебит скважины вырос медленно и не вышел на прежний. Вероятная причина?","Загрязнение призабойной зоны жидкостью глушения","Рост пластового давления из-за остановки скважины","Снижение обводнённости после ремонта","Рост давления насыщения в призабойной зоне","Фильтрат и твёрдая фаза снижают проницаемость вблизи ствола, поэтому дебит падает."],["Как определить, откуда пришла вода в обводнившуюся скважину?","Сравнить состав воды, данные ПГИ и историю соседних нагнетательных скважин","Определить плотность воды и сравнить с пластовой без других данных","Сравнить с обводнённостью соседней скважины по кусту","Определить по росту газового фактора и депрессии","Разные источники дают разный состав и профиль притока: закачка, подошвенная вода, заколонный переток."],["По результатам ПГИ вода идёт из нижних перфорационных отверстий, а нефть из верхних. Какое мероприятие логично?","Изолировать нижний интервал","Провести кислотную обработку всего интервала","Перфорировать интервал ниже текущего забоя","Повысить депрессию для притока из верхнего интервала","Изоляция снижает приток воды. Кислота без отклонителя пойдёт в обводнённый интервал."],["Почему после кислотной обработки продукт реакции важно быстро извлечь из пласта?","Отработанная кислота и осадки могут снизить проницаемость","Отработанная кислота снижает пластовую температуру","Остаточная кислота вызывает рост вязкости нефти в пласте","Иначе растёт давление гидроразрыва в призабойной зоне","Соединения железа и продукты реакции выпадают в осадок и закупоривают поры."]]}],"color":"#D1495B"},{"id":"gather","name":"Сбор и подготовка скважинной продукции","subs":[{"name":"Сбор и замер","q":[["Для чего служит дожимная насосная станция (ДНС)?","Для сепарации и дальнейшей перекачки продукции при недостатке пластовой энергии","Для поддержания пластового давления закачкой воды","Для окончательной подготовки нефти до товарной","Для компримирования попутного газа в пласт","ДНС повышает давление жидкости и подаёт её на следующую ступень, а газ отводится отдельно."],["В чём преимущество герметизированной системы сбора?","Снижаются потери лёгких фракций и выбросы","Не требуются дожимные насосные станции","Снижается вязкость эмульсий","Можно обойтись без подготовки нефти","Контакт с атмосферой исключён, поэтому лёгкие углеводороды не испаряются и экологическая нагрузка ниже."],["Для чего предназначена групповая замерная установка типа «Спутник»?","Для поочерёдного замера дебита скважин куста","Для отделения воды перед сбросом на КНС","Для распределения ингибитора по скважинам","Для распределения закачиваемой воды","Замерные установки собирают продукцию нескольких скважин и поочерёдно измеряют каждую."],["Какая система служит для коммерческого учёта нефти?","СИКН — система измерений количества и показателей качества нефти","АГЗУ «Спутник»","Система измерений на ДНС по одному сепаратору","Комплекс телемеханики кустовых площадок","СИКН измеряет количество и качество нефти при передаче, поэтому на её данных основаны расчёты между сторонами."],["Что такое АГЗУ?","Автоматизированная групповая замерная установка","Автоматическая газоотводная запорная установка","Агрегат газлифтной закачки уровня","Аварийная группа защитных устройств","АГЗУ поочерёдно подключает скважины к замерному сепаратору."],["Для чего служат выкидные линии?","Для транспортировки продукции от скважины к замерной установке","Для отвода газа от затрубья на факел","Для соединения ДНС с УПН","Для подачи воды к нагнетательным скважинам","Выкидные линии соединяют скважины с системой сбора."],["Какое явление называется пульсацией в промысловом трубопроводе?","Неравномерный снарядный поток жидкости и газа","Периодическое изменение напряжения на станции управления","Волна гидроудара при резком закрытии задвижки","Образование стойких эмульсий на участке подъёма","Снарядный режим создаёт колебания давления и нагрузки на сепараторы."],["Какая проблема возникает при транспортировке высокопарафинистой нефти?","Отложения парафина и рост вязкости при охлаждении","Выпадение солей жёсткости в трубопроводе","Рост содержания сероводорода","Образование гидратов при плюсовой температуре","Применяют подогрев, ингибиторы и очистку скребками."]]},{"name":"Подготовка нефти","q":[["Какая главная задача сепарации?","Разделение продукции на нефть, газ и воду","Снижение содержания солей до товарной нормы","Разрушение стойких эмульсий","Стабилизация нефти по давлению паров","Сепарация проводится ступенчато при снижении давления, чтобы сохранить лёгкие фракции."],["Что делают на установке подготовки нефти (УПН)?","Обезвоживают, обессоливают и стабилизируют нефть","Только замеряют дебит и отделяют свободный газ","Получают бензин и дизельное топливо","Закачивают воду в нагнетательные скважины","Цель — довести сырьё до требований к товарной нефти перед сдачей в трубопровод."],["Для чего применяют деэмульгаторы?","Для разрушения водонефтяных эмульсий","Для снижения вязкости парафинистой нефти","Для предотвращения солеотложения","Для подавления сульфатвосстанавливающих бактерий","ПАВ-деэмульгатор разрушает защитные оболочки глобул, поэтому вода быстрее слипается и осаждается."],["Как обычно удаляют соли при подготовке нефти?","Промывкой пресной водой с последующим отделением","Адсорбцией на цеолитах","Ректификацией при высокой температуре","Обработкой щёлочью с осаждением","Соли растворены в капельках воды, поэтому после смешения с пресной водой их отделяют вместе с водой."],["Какой стандарт устанавливает требования к нефти для поставки в РФ?","ГОСТ Р 51858","ГОСТ 2477","ГОСТ 1510","ГОСТ 3900","Стандарт определяет группы и классы нефти по содержанию воды, солей, серы и по плотности."],["Какой тип эмульсии обычно образуется при добыче?","Вода в нефти","Нефть в воде","Множественная вода-нефть-вода как основной тип","Газ в нефти","Капли воды диспергированы в нефти и стабилизированы природными эмульгаторами: смолами и асфальтенами."],["Для чего проводят стабилизацию нефти?","Для удаления лёгких фракций и снижения давления насыщенных паров","Для снижения содержания воды и солей","Для снижения содержания серы","Для улучшения вязкостно-температурных свойств","Стабильная нефть меньше теряет при хранении и транспорте и безопаснее."],["Что такое ступенчатая сепарация?","Несколько последовательных сепараторов со снижением давления","Последовательная подача нефти через резервуары","Сепарация при постоянном давлении в нескольких аппаратах","Подогрев нефти на разных участках","Постепенное снижение давления сохраняет больше лёгких компонентов в нефти."],["Что такое электродегидратор?","Аппарат разрушения эмульсии в электрическом поле","Аппарат термохимического разрушения эмульсии без поля","Аппарат осушки газа в электрическом поле","Сепаратор с электроподогревом","Поле поляризует капли воды, которые сливаются и оседают."],["Как влияет подогрев на разрушение эмульсии?","Ускоряет за счёт снижения вязкости нефти","Замедляет, так как капли воды становятся мельче","Не влияет, если применён деэмульгатор","Ускоряет только для эмульсий нефти в воде","При нагреве капли воды быстрее осаждаются."],["Что означает ДНП для нефти?","Давление насыщенных паров","Дифференциальное нефтяное давление","Давление начала парафинизации","Давление на приёме дожимного насоса","ДНП ограничивают, чтобы снизить потери и обеспечить безопасность перекачки."]]},{"name":"Вода и газ","q":[["Где подготавливают и нагнетают воду для ППД?","На кустовых насосных станциях (КНС)","На дожимных насосных станциях (ДНС)","На установках подготовки газа (УКПГ)","На блочных кустовых установках дозирования","КНС повышают давление воды и распределяют её по нагнетательным скважинам."],["Для чего проводят осушку природного газа?","Чтобы снизить точку росы и предотвратить гидраты и конденсацию воды","Чтобы выделить гелий","Чтобы снизить содержание сернистых соединений","Чтобы повысить теплоту сгорания до нормы","Водяные пары при охлаждении конденсируются и образуют гидраты, которые могут закупорить трубопровод."],["Какой реагент чаще всего применяют против гидратов?","Метанол","Хлорид кальция в воде","Диэтаноламин","Этиленгликоль только в виде твёрдого осушителя","Метанол снижает температуру гидратообразования. Также применяют гликоли."],["Какой целевой уровень полезного использования попутного нефтяного газа установлен в РФ?","95 %","80 %","75 %","90 %","Норма введена для снижения сжигания ПНГ на факелах, а сверхнормативное сжигание ведёт к штрафным платежам."],["Какие показатели контролируют в воде для ППД?","Содержание нефти и механических примесей","Температуру и окраску воды","Содержание растворённого метана","Индекс вязкости и плотность нефти в воде","Частицы и нефть забивают поры, снижая приёмистость нагнетательных скважин."],["Что такое отстойник в подготовке воды?","Ёмкость для разделения воды и нефти гравитацией","Аппарат для фильтрации воды через песок","Ёмкость для смешения реагентов","Аппарат для флотации нефти","Капли нефти всплывают, а твёрдые частицы оседают."],["Какая проблема связана с закачкой несовместимых вод?","Отложение солей в пласте и оборудовании","Рост вязкости пластовой нефти","Снижение межфазного натяжения","Растворение карбонатного цемента коллектора","Смешение вод с разным составом вызывает выпадение барита и кальцита."],["Какая установка готовит природный газ на промысле?","УКПГ","УПН","БКНС","ЦПС нефти","Установка комплексной подготовки газа осушает его и выделяет конденсат."],["Какой процесс применяют для удаления сероводорода из газа?","Аминовую очистку","Низкотемпературную сепарацию","Метанольную осушку","Ректификацию газового конденсата","Амины поглощают кислые компоненты, после чего регенерируются."]]},{"name":"Практические ситуации","q":[["Обводнённость на входе УПН резко выросла, отстой не справляется. Что сделать в первую очередь?","Скорректировать подачу деэмульгатора и температуру, проверить уровень раздела","Увеличить скорость потока через отстойник","Снизить температуру, чтобы уменьшить вязкость эмульсии","Отключить отстойник и подать продукцию напрямую","Эмульсии разрушают реагентом и нагревом, а большой поток снижает время отстоя."],["Давление в выкидной линии скважины постепенно растёт, дебит падает. Что вероятнее всего?","Отложения парафина, солей или гидратная пробка в линии","Рост продуктивности пласта","Снижение газового фактора на устье","Снижение вязкости нефти в линии","Сечение уменьшается, поэтому сопротивление растёт. Диагностику проводят по участкам давления."],["Почему при пуске газопровода зимой нужен контроль?","Снижение давления и температуры способствует образованию гидратов","При низкой температуре газ перестаёт подчиняться закону реального газа","При снижении температуры растёт теплота сгорания газа","Метан конденсируется в жидкость при обычных рабочих давлениях","Без ингибитора и осушки возможны пробки, поэтому применяют метанол и контроль точки росы."],["Какой фактор сильнее всего влияет на устойчивость нефтяных эмульсий?","Природные стабилизаторы: асфальтены, смолы и твёрдые частицы","Отношение диаметра трубы к скорости потока","Содержание растворённого газа в нефти","Температура кипения лёгких фракций","Они формируют прочную оболочку на капле воды, которую разрушает деэмульгатор."]]}],"color":"#2E8B57"},{"id":"eor","name":"Методы увеличения нефтеотдачи пласта","subs":[{"name":"Химические методы","q":[["Что даёт закачка полимеров?","Повышает вязкость воды и улучшает охват вытеснением","Снижает межфазное натяжение до сверхнизких значений","Снижает вязкость нефти и приводит к смешиванию","Растворяет остаточную нефть в оторочке","Более вязкая вода меньше прорывается по пропласткам, а фронт вытеснения становится устойчивее."],["Как ПАВ увеличивают нефтеотдачу?","Снижают межфазное натяжение нефти и воды","Повышают вязкость закачиваемой воды","Снижают проницаемость промытых зон","Создают тепловой фронт в пласте","Малое натяжение уменьшает капиллярные силы, удерживающие нефть, и мобилизует её."],["Что входит в ASP-заводнение?","Щёлочь, ПАВ и полимер","Азот, углекислый газ и пар","Кислота, ПАВ и полимер","Щёлочь, азот и гелеобразователь","Компоненты дополняют друг друга: щёлочь снижает адсорбцию, ПАВ снижает натяжение, полимер повышает охват."],["Каково главное значение соотношения подвижностей M при вытеснении?","Чем меньше M, тем стабильнее вытеснение","Чем больше M, тем выше охват","M влияет только на вытеснение газом","M определяет только давление нагнетания","M = λвыт/λнефти. При M > 1 вода образует языки и прорывается к скважинам."],["Что означает рост капиллярного числа?","Преобладание вязких сил над капиллярными и снижение остаточной нефти","Преобладание капиллярных сил над вязкими и рост остаточной нефти","Рост смачиваемости нефтью и снижение подвижности воды в порах","Снижение проницаемости из-за набухания глин в промытой зоне","Nc = μv/σ. Его повышают снижением межфазного натяжения, что и делает ПАВ-заводнение."],["Для чего применяют потокоотклоняющие технологии?","Для перекрытия промытых каналов и подключения слабодренируемых зон","Для снижения вязкости нефти в пласте","Для вскрытия новых продуктивных пропластков","Для снижения давления нагнетания насосов","Гелевые и другие составы снижают проницаемость высокопроводящих зон, поэтому вода идёт в нефтенасыщенные пропластки."],["Что такое скрининг МУН?","Предварительный отбор подходящих методов по свойствам пласта и нефти","Опытная закачка реагента на одной скважине","Лабораторные фильтрационные исследования керна","Расчёт экономики при разных ценах","Скрининг отсеивает неприменимые методы до дорогих исследований."],["Что снижает эффективность полимера в пласте?","Высокая солёность и деструкция","Низкая температура и малая обводнённость","Высокая проницаемость пласта","Пресная вода и большая вязкость нефти","Соль уменьшает вязкость раствора, а сдвиг и температура разрушают молекулы."],["Что такое адсорбция ПАВ?","Потеря реагента на поверхности породы","Переход ПАВ в нефтяную фазу с ростом натяжения","Образование мицелл выше критической концентрации","Разложение реагента при высокой температуре","Потери увеличивают расход химии, поэтому проводят лабораторные исследования."],["Что такое мицеллярное заводнение?","Закачка оторочки раствора ПАВ со спиртами и солями","Закачка щелочного раствора без ПАВ","Закачка пены в нефтяной пласт","Закачка водного раствора полимера","Микроэмульсия обеспечивает сверхнизкое межфазное натяжение."]]},{"name":"Газовые методы","q":[["Почему CO₂ часто используют для МУН?","Он растворяется в нефти, снижает её вязкость и может смешиваться с ней","Он не растворяется в нефти и работает как поршень","Он снижает пластовую температуру и вязкость воды","Он создаёт твёрдые осадки в промытых зонах","При достаточном давлении вытеснение становится смешивающимся, а межфазное натяжение практически исчезает."],["Что такое минимальное давление смешивания (MMP)?","Наименьшее давление, при котором газ смешивается с нефтью","Наибольшее давление закачки без разрыва пласта","Давление начала выделения CO₂ из нефти","Давление насыщения нефти закачанным газом","Вытеснение смешивающимся газом проектируют при давлении выше MMP."],["Что такое водогазовое воздействие (ВГВ, WAG)?","Чередующаяся или совместная закачка воды и газа","Закачка газа в водонапорный пласт для создания шапки","Закачка пены в НКТ при освоении","Одновременная добыча воды и газа","Газ лучше вытесняет нефть, а вода контролирует подвижность и улучшает охват."],["Что такое несмешивающееся вытеснение газом?","Газ не растворяется полностью и образует отдельную фазу","Вытеснение при давлении выше MMP","Вытеснение горячей водой с газом","Многоконтактное смешивающееся вытеснение","Смешивающееся вытеснение эффективнее, но требует более высокого давления."],["Какой газ, помимо CO₂, закачивают для МУН?","Попутный углеводородный газ","Сероводород","Гелий","Смесь пропана с кислородом","Закачка ПНГ одновременно решает задачу его утилизации."],["Какое явление снижает эффективность закачки газа?","Прорыв газа из-за неблагоприятной подвижности","Набухание глин в призабойной зоне","Снижение вязкости нефти при контакте с газом","Рост охвата по толщине пласта","Газ подвижен и уходит к скважинам, не охватывая пласт, поэтому применяют ВГВ."]]},{"name":"Тепловые методы","q":[["К какому классу МУН относится закачка пара?","К тепловым","К газовым","К физико-химическим","К гидродинамическим","Пар снижает вязкость нефти и применяется для высоковязких и тяжёлых нефтей."],["Какой метод тепловых воздействий используют пара скважин с верхним паронагнетанием?","Парогравитационный дренаж (SAGD)","Пароциклическая обработка одной скважины","Внутрипластовое горение","Вытеснение горячей водой","Пар поднимается и формирует камеру, а разогретая нефть стекает в нижнюю горизонтальную скважину."],["Что происходит при внутрипластовом горении?","Часть нефти сгорает в пласте и создаёт тепловой фронт","Закачивается горячий пар с поверхности","Нагрев пласта с помощью электродов","Закачивается газ, смешивающийся с нефтью","Для этого в пласт подают воздух. Горение дает тепло и газы, вытесняющие нефть."],["Какой фактор часто ограничивает применение термических МУН?","Большая глубина и потери тепла","Высокая вязкость пластовой нефти","Низкая пластовая температура","Большая толщина пласта","С ростом глубины увеличиваются теплопотери по стволу, поэтому пар эффективен прежде всего на небольших глубинах."],["Что такое пароциклическая обработка?","Закачка пара, выдержка и отбор в одной скважине","Закачка пара в нагнетательную и отбор из соседних скважин","Пар и вода чередуются в одной нагнетательной скважине","Пар подают через горизонтальную пару скважин","Метод быстро прогревает призабойную зону, но охват ограничен."],["Какие теплоизолированные трубы применяют при закачке пара?","НКТ с теплоизоляцией","Обычные НКТ с пакером на устье","НКТ с внутренним полимерным покрытием","Обсадные трубы с резьбовыми муфтами","Это снижает потери тепла по стволу."],["Какое название у метода закачки горячей воды?","Вытеснение горячей водой","Тепловая оторочка паром","Внутрипластовое горение влажное","Пароциклика","Метод проще паровых, но передаёт меньше тепла, чем пар."]]},{"name":"Общие вопросы и другие методы","q":[["Какая цель методов увеличения нефтеотдачи (МУН)?","Извлечь нефть, оставшуюся после традиционных способов разработки","Поддержать пластовое давление на начальном уровне","Снизить обводнённость за счёт отключения скважин","Улучшить только приток к призабойной зоне","МУН воздействуют на остаточную и слабо охваченную нефть и повышают конечный КИН."],["Что используют микробиологические методы?","Бактерии и продукты их жизнедеятельности","Ферменты для кислотной обработки ПЗП","Нагрев бактериального раствора до 200 °C","Поверхностные биоцидные реагенты","Микроорганизмы образуют газы, ПАВ и кислоты, что улучшает вытеснение. Для них важны условия среды."],["Какие методы относятся к физическим МУН?","Гидроразрыв, горизонтальные скважины и волновое воздействие","Закачка полимерных и мицеллярных растворов","Закачка пара и горячей воды в пласт","Закачка CO₂ и попутного газа в пласт","Они улучшают условия вытеснения механическим воздействием на пласт."],["Какой этап предшествует промысловому внедрению МУН?","Лабораторные исследования и пилотный проект","Строительство полного комплекса наземного оборудования","Расширенный ввод на всём месторождении","Закупка реагентов на весь срок проекта","Пилот подтверждает эффект и экономику в реальных условиях."],["Какая главная причина применения МУН в поздней стадии?","Высокая обводнённость и большая остаточная нефть","Рост начального пластового давления","Завершение бурения новых скважин","Падение себестоимости подъёма жидкости","На этой стадии заводнение малоэффективно, а значительная часть запасов остаётся в пласте."]]},{"name":"Практические ситуации","q":[["Какой метод логичнее для тяжёлой нефти вязкостью 1000 мПа·с на глубине 300 м?","Тепловой, например закачка пара","Полимерное заводнение","Закачка CO₂ в смешивающемся режиме","Закачка сухого газа","Вязкость резко падает при нагреве, а малая глубина снижает теплопотери."],["Какой метод логичнее для лёгкой нефти на глубине 3000 м с высоким пластовым давлением?","Закачка газа в смешивающемся режиме","Закачка пара","Внутрипластовое горение","Пароциклическая обработка","Высокое давление способствует достижению MMP, а пар теряет тепло на большой глубине."],["Полимерное заводнение начали в пласт проницаемостью 2 мД. Что вероятнее всего станет проблемой?","Плохая приёмистость и механическая деструкция","Снижение вязкости нефти","Перегрев призабойной зоны","Прорыв газа по пропласткам","Крупные молекулы плохо проходят мелкие поры, поэтому метод подходит более проницаемым пластам."],["ПАВ-заводнение показало в лаборатории высокий эффект, а на пласте слабый. Вероятная причина?","Большая адсорбция на породе и неоднородность охвата","Малая обводнённость продукции перед закачкой","Рост пластовой температуры при закачке","Высокая минерализация только в лабораторной воде","Реагент теряется на породе и не доходит до нефти, поэтому важны оторочка и контроль подвижности."]]}],"color":"#EF7B1A"},{"id":"model","name":"Моделирование в нефтяной и газовой отрасли","subs":[{"name":"Геологическое моделирование","q":[["С чего обычно начинается геологическое моделирование?","Со сбора и анализа исходных данных","С построения структурного каркаса","С расчёта кубов пористости","С апскейлинга сетки","Качество модели определяется данными: скважинами, сейсмикой, керном и интерпретациями."],["Что описывает вариограмма?","Пространственную изменчивость свойства с расстоянием","Распределение вероятностей значений свойства","Корреляцию между двумя разными свойствами","Закон распределения пористости по гистограмме","Она определяет радиус корреляции и анизотропию, поэтому служит основой геостатистики."],["Что делает кригинг?","Даёт наилучшую линейную несмещённую оценку свойства между точками данных","Воспроизводит изменчивость через множество реализаций","Размещает геологические тела заданной формы","Рассчитывает разложение поля на тренд и шум","Веса определяются по вариограмме, но результат сглажен и не передаёт полную изменчивость."],["Чем стохастическое моделирование отличается от кригинга?","Воспроизводит изменчивость и даёт множество равновероятных реализаций","Не использует вариограмму и гистограмму данных","Всегда даёт одну, наилучшую оценку в каждой точке","Использует только сейсмические данные","Набор реализаций позволяет оценить неопределённость запасов."],["Какой тип сетки чаще применяется в геологических моделях с разломами?","Угловая точка (corner point)","Строго ортогональная декартова","Радиальная","Сетка Вороного (PEBI)","Corner point позволяет наклонять ячейки вдоль разломов и учитывать геометрию пластов."],["Чем обычно задают начальное насыщение в модели?","Высотой над ВНК и капиллярными кривыми","Только значениями в скважинах без учёта контактов","Средним значением по пласту","Обратным расчётом по истории обводнения","Насыщенность связана с капиллярным равновесием над контактом, что учитывается при инициализации."],["Что описывает фациальная модель?","Пространственное распределение обстановок осадконакопления и литотипов","Распределение давления и насыщенности по времени","Прогноз обводнённости скважин","Геометрию разломов и складок","Фации управляют пористостью и проницаемостью, поэтому свойства обычно моделируют внутри фаций."],["Что означает оценка P90 в вероятностном расчёте запасов?","Значение, которое будет превышено с вероятностью 90 %","Значение, которое будет превышено с вероятностью 10 %","Запасы с уровнем извлечения 90 %","Наиболее вероятная оценка","P90 — консервативная оценка, P50 — средняя, P10 — оптимистичная."],["Что такое структурный каркас модели?","Набор поверхностей и разломов, задающих геометрию пласта","Куб литологии внутри пласта","Модель скважин с траекториями","Распределение проницаемости по слоям","Именно на каркас опирается 3D-сетка."],["Что входит в петрофизическую модель?","Распределение пористости, проницаемости и насыщенности","Поверхности кровли и подошвы","Траектории скважин и инклинометрия","Интерпретация сейсмических горизонтов","Эти свойства определяют запасы и фильтрацию."],["Что такое NTG?","Отношение эффективной толщины к общей","Отношение нефтенасыщенной толщины к эффективной","Отношение объёма нефти к объёму газа","Отношение пористости к проницаемости","Net-to-gross показывает долю коллектора в разрезе."],["Зачем сравнивают запасы геологической модели с подсчётом?","Чтобы проверить корректность объёма модели","Чтобы настроить ОФП на историю разработки","Чтобы выбрать систему заводнения","Чтобы оценить размер ячейки по горизонтали","Сходимость подтверждает, что модель согласуется с принятыми параметрами."],["Что такое локально переменная анизотропия?","Изменение направления вариограммы в пределах модели","Различие размеров ячеек по площади","Изменение пористости по вертикали","Изменение радиуса вариограммы только с глубиной","Она помогает воспроизвести изгибы русловых тел."],["Какой максимальный размер ячейки (X, Y) ортогонального грида устанавливается при построении грида геологической модели?","Таким, чтобы между двумя ближайшими скважинами было более двух ячеек","В зависимости от средних значений пористости и проницаемости резервуара","250*250 м","В зависимости от свойств пластовых флюидов, частоты разломов и величин смещения по ним","Размер ячейки привязан к плотности сетки: между соседними скважинами должно оставаться несколько ячеек, иначе модель не воспроизведёт изменение свойств и взаимодействие скважин. Универсального размера вроде 250×250 м не существует.","lzs-35"],["Чем определяется минимальная толщина слоев (лейеринг) в геологической модели?","Наличием тонких продуктивных прослоев аномально высокой проницаемости; наличие тонких протяженных непроницаемых прослоев","Высокой литологической неоднородностью разреза, установленной на основании детальных описаний керна","Производительностью ПК","Нехваткой времени на моделирование","Слой должен быть не толще тех прослоев, которые управляют фильтрацией: суперколлекторов и выдержанных непроницаемых перемычек. Если их усреднить, модель неверно покажет обводнение и связность. Производительность ПК важна на практике, но геологически не обосновывает лейеринг.","lzs-36"],["Какие из нижеперечисленных методов можно отнести к пиксельному моделированию?","последовательное индикаторное и гауссово моделирование","метод тренировочных снимков","объектное моделирование","все указанные методы","Пиксельные методы задают значение в каждой ячейке по вариограмме: это SIS и SGS. Объектное моделирование размещает тела целиком, а метод тренировочных снимков (MPS) относится к многоточечной статистике.","lzs-48"],["Когда используется методика ко-кригинга?","когда существует определенная корреляция между моделируемыми свойствами","когда одновременно моделируется несколько свойств","в случаях когда сложно найти корреляцию между моделируемыми свойствами","в случаях когда сложно смоделировать распределение свойств с использованием вариограмм","Ко-кригинг использует вторичную переменную (например, сейсмический атрибут) для уточнения основного свойства. Смысл есть только при наличии между ними корреляции; без неё вторичные данные не дают пользы.","lzs-49"]]},{"name":"Гидродинамическое моделирование","q":[["Что такое апскейлинг?","Перенос свойств из детальной модели в более крупную сетку","Перенос скважинных данных на сетку модели","Сгущение сетки вокруг скважин","Построение модели по сейсмическим атрибутам","Он нужен, чтобы гидродинамический расчёт занимал разумное время при сохранении фильтрационных свойств."],["Что такое адаптация модели (history matching)?","Настройка модели на воспроизведение фактической истории разработки","Подбор сетки по геологическим данным","Сопоставление запасов модели с подсчётом","Настройка скорости расчёта симулятора","После адаптации прогнозы надёжнее, хотя решение неоднозначно: разные параметры могут дать одинаковую историю."],["Когда применяют композиционную модель вместо модели чёрной нефти?","Когда важен фазовый состав: газоконденсат, закачка CO₂ или сухого газа","Когда в пласте есть только вода и нефть в однофазном состоянии","Когда необходимо ускорить расчёт на крупной сетке","Когда моделируется чистое заводнение тяжёлой нефти","Модель чёрной нефти описывает только псевдокомпоненты, а композиционная — изменение состава фаз."],["На чём основан метод материального баланса?","На сопоставлении отбора и закачки флюидов с изменением давления в залежи","На решении фильтрации в каждой ячейке сетки","На аппроксимации падения добычи экспонентой","На сопоставлении притока с подъёмом по НКТ","Метод применим даже без сеточной модели и позволяет оценить запасы и активность аквифера."],["Что такое пропускная способность (трансмиссивность) ячейки?","Способность передавать поток между соседними ячейками","Отношение порового объёма ячейки к объёму модели","Доля активных ячеек в модели","Произведение пористости на насыщенность","Она зависит от проницаемости, геометрии и множителей разломов и определяет перетоки в модели."],["Что позволяет моделировать аквифер в гидродинамической модели?","Подток воды из законтурной области","Выпадение конденсата в призабойной зоне","Поступление газа из газовой шапки","Закачку воды через нагнетательные скважины","Аналитические модели, например Картера–Трейси или Фетковича, заменяют большие водоносные области."],["Что делает узловой анализ (NODAL)?","Сопоставляет приток из пласта с подъёмом по скважине для определения рабочей точки","Определяет запасы по изменению пластового давления","Настраивает модель на историю добычи","Прогнозирует падение дебита по кривым Арпса","Пересечение кривых притока и подъёма показывает дебит и давление на выбранном узле."],["Какие исходные данные используют в гидродинамической модели?","Геомодель, PVT, ОФП, капиллярные давления и история скважин","Геомодель и история скважин без PVT и ОФП, так как они уточняются при адаптации","Сейсмические кубы и фациальная модель без данных о работе скважин","Траектории и дебиты скважин, а свойства пласта задаются средними значениями","Эти данные описывают пласт и его поведение."],["Что такое инициализация модели?","Расчёт начального равновесного состояния давления и насыщения","Загрузка истории работы скважин","Настройка модели на накопленную добычу","Расчёт прогнозного варианта разработки","Начальные запасы должны быть согласованы с геологической моделью."],["Что такое псевдо-ОФП?","ОФП, приведённые к крупным ячейкам для учёта неоднородности","Лабораторные ОФП без поправок","Кривые ОФП, полученные на газе вместо нефти","Кривые, рассчитанные по гистограмме пористости","Они компенсируют эффекты, утраченные при укрупнении сетки."],["Какой подход используют для учёта трещин в карбонатах?","Двойная пористость и двойная проницаемость","Модель чёрной нефти без поправок","Модель фильтрации Дарси в одной среде","Двумерная модель без вертикальных связей","Он разделяет блоки матрицы и трещины, обменивающиеся флюидами."],["Что такое WOPR и FOPT в выводах симулятора?","Дебит нефти скважины и накопленная нефть по месторождению","Давление на устье скважины и накопленная вода по группе","Дебит воды скважины и накопленный газ месторождения","Обводнённость и давление на приёме насоса","Такая мнемоника принята в ECLIPSE-подобных симуляторах."],["Что такое численная дисперсия?","Искусственное размывание фронта из-за размера ячеек","Физическое смешение фаз на фронте","Ошибка округления чисел при вычислениях","Разброс реализаций стохастической модели","Чем крупнее ячейки, тем сильнее размыт фронт вытеснения."],["Какой вид проверки выполняют после адаптации модели?","Прогноз на контрольном периоде","Сравнение размера файлов","Анализ чувствительности к шагу времени без сравнения с фактом","Подбор другой PVT-модели без данных","Если модель воспроизводит период, не использованный при адаптации, ей больше доверяют."],["Зачем моделируют разные варианты разработки?","Чтобы сравнить добычу и экономику и выбрать лучший","Чтобы улучшить совпадение с историей","Чтобы уточнить структурную карту","Чтобы определить начальные контакты","Варианты отличаются сеткой, режимами, системой воздействия и МУН."]]},{"name":"Практические ситуации","q":[["Модель не воспроизводит обводнение участка: фактически вода пришла раньше. Что корректно проверить первым?","Высокопроницаемые прослои, разломы и связность в геомодели","Изменить ОФП одинаково на всей модели","Умножить проницаемость пласта на постоянный коэффициент","Уменьшить закачку в модели по сравнению с фактом","Адаптацию ведут в физически обоснованных пределах и начинают с факторов, управляющих прорывом."],["Чем геологическая модель отличается от гидродинамической?","Геологическая описывает строение и свойства, гидродинамическая рассчитывает течение флюидов во времени","Геологическая рассчитывает течение, гидродинамическая описывает строение пласта","Гидродинамическая строится только по данным добычи, без геологической основы","Геологическая учитывает давление и насыщенность во времени, а другая — только запасы","Статическая модель — основа для динамической, в которую добавляют PVT, ОФП и скважины."],["Почему хорошее совпадение с историей не гарантирует точный прогноз?","Задача неоднозначна: разные сочетания параметров дают одну и ту же историю","История содержит ошибки замеров, из-за которых модель всегда отклоняется от факта","Для прогноза нужна модель с более мелкой сеткой, чем при адаптации","Адаптация меняет запасы, что всегда приводит к завышению прогноза","Поэтому анализируют несколько адаптированных реализаций и диапазоны прогноза."],["Когда нужна чёрная нефть, а когда композиционная модель для закачки CO₂?","Для закачки CO₂ нужна композиционная модель, так как состав фаз меняется","Для закачки CO₂ достаточно чёрной нефти с поправкой к ОФП","Для закачки CO₂ нужна модель с двойной пористостью","Для закачки CO₂ нужна модель с крупной сеткой и средним PVT","Смешивание и массообмен описывает уравнение состояния, а не упрощённые PVT-таблицы."]]}],"color":"#6A5ACD"},{"id":"chem","name":"Химия нефти и газа","subs":[{"name":"Состав нефти и газа","q":[["Какое примерное содержание углерода в нефти?","83–87 %","70–75 %","75–80 %","90–95 %","Второй основной элемент — водород, примерно 11–14 %. Остальное приходится на серу, азот и кислород."],["Какие группы углеводородов составляют основу нефти?","Алканы, циклоалканы и арены","Алканы, алкены и алкины","Алкены, циклоалканы и спирты","Арены, эфиры и кетоны","Соотношение групп определяет тип нефти и её свойства."],["Какой углеводород является главным компонентом природного газа?","Метан","Этан","Пропан","Бутан","В сухом газе метан обычно составляет более 90 %."],["Что относится к высокомолекулярным неуглеводородным компонентам нефти?","Смолы и асфальтены","Нафтеновые кислоты и фенолы","Меркаптаны и сульфиды","Парафины и церезины","Они определяют цвет, вязкость и стабильность эмульсий и могут осаждаться при добыче."],["Что такое нефтяные парафины?","Твёрдые алканы, выпадающие при охлаждении","Твёрдые циклоалканы и арены","Высокомолекулярные смолы","Жидкие алканы C5–C15","Отложения парафина в НКТ и трубопроводах борют теплом, скребками и ингибиторами."],["Что такое меркаптаны?","Сернистые соединения с резким запахом","Азотистые основания нефти","Кислородные соединения с резким запахом","Тяжёлые гетероатомные смолы","Они коррозионны, поэтому нефть и газ от них очищают. Ими же одорируют бытовой газ."],["Что такое нафтеновые кислоты?","Кислородсодержащие соединения нефти на основе циклоалканов","Серосодержащие соединения циклического строения","Ароматические углеводороды с боковыми цепями","Неорганические соли в пластовой воде","Они повышают кислотность нефти и могут вызывать коррозию установок."],["Сколько структурных изомеров имеет бутан?","Два","Три","Один","Пять","Это нормальный бутан и изобутан. Разветвлённость влияет на температуру кипения и свойства топлив."],["Какая общая формула у алканов?","CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙH₂ₙ₋₆","Алканы насыщены и содержат только одинарные связи."],["Какова общая формула циклоалканов (нафтенов)?","CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₆","CₙH₂ₙ₋₂","Замыкание цикла убирает два атома водорода."],["Какое вещество является простейшим ареном?","Бензол","Толуол","Нафталин","Циклогексан","Шесть атомов углерода образуют кольцо с ароматической связью."],["Какие сернистые соединения наиболее коррозионны?","Сероводород и меркаптаны","Тиофены и их производные","Полисульфиды в смолах","Сульфиды в тяжёлых фракциях","Активная сера вызывает коррозию оборудования и опасна."],["Какие неуглеводородные газы часто присутствуют в природном газе?","Азот, углекислый газ и сероводород","Водород, кислород и аммиак","Фтор, хлор и сернистый газ","Озон и оксид азота","Они снижают теплоту сгорания или требуют очистки."]]},{"name":"Свойства и классификация","q":[["Какой нефти соответствует высокий градус API?","Лёгкой","Вязкой","Смолистой","Высокоасфальтеновой","API обратно связан с плотностью, поэтому большее значение соответствует более лёгкой нефти."],["К какому классу по ГОСТ относится нефть с содержанием серы до 0,6 %?","Малосернистая","Сернистая","Среднесернистая","Высокосернистая","Сернистая — 0,61–1,80 %, высокосернистая — 1,81–3,50 %, особо высокосернистая — более 3,50 %."],["Что такое газовые гидраты?","Кристаллические соединения воды и газа","Смеси лёгких углеводородов с солями","Жидкие конденсаты тяжёлых углеводородов","Минералы, образованные сероводородом","Они устойчивы при низкой температуре и высоком давлении и опасны образованием пробок."],["Какой газ называют жирным?","Газ с повышенным содержанием этана, пропана и бутанов","Газ с высоким содержанием сероводорода","Газ с низкой теплотой сгорания","Газ, содержащий более 95 % метана","Из него выделяют широкую фракцию лёгких углеводородов (ШФЛУ) и другие ценные компоненты."],["Что показывает кислотное число нефтепродукта?","Количество KOH на нейтрализацию кислот в 1 г образца","Содержание сернистых соединений в пересчёте на H₂S","Концентрацию хлористых солей","Объём кислоты для разложения эмульсии","Высокое значение указывает на коррозионность."],["Какие нефти называют парафинистыми?","С высоким содержанием твёрдых алканов","С высоким содержанием циклоалканов и аренов","С высокой плотностью и большим количеством смол","С низкой температурой застывания","Они застывают при более высокой температуре, что усложняет транспорт."],["Что такое температура застывания нефти?","Температура, при которой нефть теряет подвижность","Температура начала кристаллизации парафина","Температура, при которой образуются гидраты","Температура, при которой нефть становится вязкопластичной","Она определяет условия хранения и перекачки в холодном климате."],["Что такое температура вспышки?","Температура, при которой пары воспламеняются от внешнего источника","Температура устойчивого горения продукта","Температура начала кипения","Температура, при которой продукт загорается сам","Этот показатель определяет пожаробезопасность продукта."]]},{"name":"Переработка","q":[["Какая фракция нефти примерно выкипает до 180 °C?","Бензиновая","Керосиновая","Дизельная","Масляная","Керосин и дизельная фракция выкипают выше, а мазут является остатком атмосферной перегонки."],["На чём основана перегонка нефти?","На разности температур кипения компонентов","На разности плотностей компонентов","На различной растворимости в воде","На различии молекулярной полярности","Ректификационная колонна разделяет нефть на фракции при нагреве и многократной конденсации."],["Что такое крекинг?","Расщепление тяжёлых молекул на более лёгкие","Соединение лёгких молекул в более тяжёлые","Отделение воды от нефти при нагреве","Перегруппировка молекул без изменения их массы","Он увеличивает выход светлых продуктов из тяжёлых фракций."],["Что такое риформинг?","Процесс повышения октанового числа бензиновых фракций","Снижение содержания серы водородом","Расщепление мазута на бензин","Отделение парафинов от масел","Каталитический риформинг увеличивает долю аренов."],["Что такое гидроочистка?","Удаление серы и азота с помощью водорода","Разрушение тяжёлых молекул в присутствии катализатора","Обессоливание нефти пресной водой","Повышение октанового числа","Она позволяет выпускать малосернистые топлива."],["Что показывает октановое число?","Детонационную стойкость бензина","Склонность топлива к самовоспламенению при сжатии","Температуру начала кристаллизации","Содержание ароматических углеводородов","Чем оно выше, тем лучше бензин сопротивляется детонации."],["Что показывает цетановое число?","Воспламеняемость дизельного топлива","Стойкость бензина к детонации","Температуру застывания дизтоплива","Содержание серы в дизтопливе","Чем оно выше, тем быстрее воспламеняется топливо."]]},{"name":"Практические ситуации","q":[["Почему асфальтены могут выпадать при снижении давления выше давления насыщения?","Лёгкие компоненты расширяются, и растворяющая способность нефти падает","При снижении давления они кристаллизуются подобно парафинам","При снижении давления растёт концентрация смол","При снижении давления из нефти уходит вода, удерживающая их","Наибольший риск находится около давления насыщения, поэтому важен анализ стабильности нефти."],["Смешали две совместимые по отдельности нефти, и появился осадок. Что вероятнее всего?","Нарушена коллоидная стабильность асфальтенов","Застывание парафина из-за смешения","Выпадение солей жёсткости из пластовой воды","Образование гидратов при смешении","Смешение парафинистой нефти с тяжёлой снижает растворимость асфальтенов."]]}],"color":"#D6409F"},{"id":"econ","name":"Экономика в нефтегазовой отрасли","subs":[{"name":"Показатели эффективности","q":[["Что показывает чистый дисконтированный доход (ЧДД, NPV)?","Сумму дисконтированных денежных потоков проекта за расчётный период","Накопленную недисконтированную прибыль проекта за расчётный период","Отношение дисконтированных доходов к дисконтированным вложениям","Ставку, при которой дисконтированные потоки проекта уравновешены","ЧДД приводит все притоки и оттоки к текущему моменту по ставке дисконтирования. Проект экономически приемлем при ЧДД больше нуля."],["Внутренняя норма доходности (IRR) — это ставка дисконтирования, при которой:","ЧДД проекта равен нулю","ЧДД проекта достигает максимума","индекс доходности равен нулю","накопленный денежный поток становится положительным","IRR показывает предельную ставку, которую выдерживает проект. Её сравнивают с требуемой доходностью: проект принимают, если IRR выше барьерной ставки."],["Индекс доходности инвестиций (PI) больше 1 означает, что:","дисконтированные доходы превышают дисконтированные инвестиции","недисконтированная выручка превышает капитальные вложения","внутренняя норма доходности выше единицы","дисконтированный срок окупаемости меньше одного года","PI — это отдача на рубль вложений. PI > 1 соответствует положительному ЧДД, поэтому показатель удобен для сравнения проектов при ограниченном бюджете."],["Дисконтированный срок окупаемости по сравнению с простым:","не меньше простого срока окупаемости","обычно меньше простого, так как учитывает стоимость денег","равен простому при положительном ЧДД","больше простого только при отрицательном ЧДД","Дисконтирование уменьшает будущие поступления, поэтому для возврата вложений нужно столько же или больше времени."],["Как повышение ставки дисконтирования влияет на ЧДД типичного нефтяного проекта?","ЧДД снижается","ЧДД растёт, так как будущие доходы приводятся к большей базе","ЧДД меняется, только если изменилась цена нефти","ЧДД снижается лишь у проектов с IRR ниже ставки","Вложения приходятся на начало проекта, а доходы — на будущее. Чем выше ставка, тем сильнее обесцениваются будущие доходы."],["Для чего выполняют анализ чувствительности проекта?","Чтобы оценить изменение показателей при изменении цены, добычи и затрат","Чтобы найти ставку, при которой ЧДД проекта равен нулю","Чтобы рассчитать вероятность открытия залежи","Чтобы определить оптимальную плотность сетки скважин","Анализ показывает, какие параметры сильне
