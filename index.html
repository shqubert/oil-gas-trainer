м может значительно уменьшиться","Не влияет","Качество глинистых покрышек снижается","Качество глинистых покрышек только увеличивается","С глубиной глины уплотняются, поры сокращаются, и экранирующие свойства растут. На больших глубинах глины теряют пластичность, дегидратируются и растрескиваются, поэтому качество покрышки падает.","lzs-55"],["Какие факторы определяют экранирующие качества покрышки?","Мощность, литологические особенности, степень нарушенности сплошности, минеральный состав","Седиментационные условия","Только литология коллектора","Минералогические особенности и зона распространения","Экран зависит от совокупности свойств самой покрышки: толщины, литологии, минерального состава и отсутствия трещин и разрывов. Прочие варианты называют только часть факторов.","lzs-56"],["С какими процессами связано образование тектонических ловушек?","Формирование тектонических ловушек связано с образованием разломов и складок","Смещение блоков горных пород относительно друг друга только по вертикальной поверхности тектонического разрыва","Формирование тектонических ловушек связано с замещением пород","Формирование тектонических ловушек связано с миграцией углеводородов","Тектонические ловушки возникают при деформации толщ: складки образуют своды, а разломы — экраны. Замещение пород создаёт литологические ловушки, а миграция заполняет ловушки, но не создаёт их.","lzs-77"],["На какой стадии геологоразведочных работ, как правило, выделяется стратиграфическое положение региональных и зональных реперных горизонтов?","На стадии поисково-разведочных работ","На стадии подготовки объектов к поисковому бурению","На стадии разведки и пробной эксплуатации месторождения","На стадии промышленной эксплуатации месторождения","Региональные и зональные реперы нужны для обобщённого расчленения разреза ещё на ранней стадии, по первым глубоким скважинам. На разведке и эксплуатации работают уже с детальными местными реперами.","lzs-78"],["Что такое замкнутая высота ловушки (замыкание)?","Вертикальное расстояние от свода до точки перелива","Нерастворимое органическое вещество осадочных пород","Глубина залегания подошвы покрышки","Толщина глинистой покрышки","Ниже точки перелива УВ уходят из ловушки."],["Что ограничивает высоту столба нефти при капиллярной покрышке?","Давление входа в поры покрышки","Пористость коллектора","Толщина покрышки в своде","Вязкость нефти в пласте","Столб растёт, пока давление плавучести не превысит капиллярное."],["Какое положение занимает газовая шапка в залежи?","В своде над нефтью","Под нефтяной оторочкой","У водонефтяного контакта","В подошвенной воде","Разделение по плотности: газ, нефть, вода."],["Почему ВНК может быть наклонным?","Из-за гидродинамического потока в водоносной части","Из-за разной вязкости нефти в своде","Из-за высокой сжимаемости газа в шапке над нефтью","Из-за разной вязкости нефти в своде и на крыльях","Также наклон возможен при разной смачиваемости или блокировании."],["Что такое стратиграфическая ловушка?","Ловушка, созданная изменением литологии или выклиниванием","Величина, обратная объёмному коэффициенту нефти","Порода, в которой образуются углеводороды из органического вещества","Ловушка над соляным куполом","Экран образуется за счёт условий осадконакопления."],["Что такое литологически экранированная залежь?","Залежь, ограниченная замещением коллектора неколлектором","Залежь, ограниченная сбросами с обеих сторон и водой снизу","Залежь между двумя сбросами","Залежь в своде антиклинали с водой по всему контуру","Положение ВНК в таких залежах бывает неочевидным."],["Какое образование называют клиноформой?","Наклонная осадочная толща, наращивающая берег в сторону бассейна","Вертикальная зона трещиноватости, секущая осадочный чехол бассейна","Куполообразное поднятие над соляным штоком в центре прогиба","Толща в центре рифтового прогиба","Ачимовская толща Западной Сибири связана с клиноформами."],["Что такое риф как ловушка?","Карбонатная постройка с органогенной пористостью","Приливная равнина аридного климата с испарениями","Самая низкая изогипса, замыкающая структуру","Выступ фундамента без пор","Рифы часто запечатываются глинами или солью."]]},{"name":"Генерация и миграция","q":[["Что такое нефтегазоматеринская порода?","Порода, в которой образуются углеводороды из органического вещества","Порода, препятствующая выходу нефти и газа из ловушки вверх","Порода, в которой сейчас находится промышленное скопление нефти","Граница, отражающая наибольшее продвижение моря","Такие породы, как правило, тонкозернистые и богаты органикой. Генерация начинается при достаточном прогреве."],["Что такое кероген?","Нерастворимое органическое вещество осадочных пород","Смесь асфальтенов и смол в тяжёлой нефти","Растворимая в органических растворителях часть ОВ","Продукт окисления нефти в зоне гипергенеза","При прогреве кероген распадается, образуя жидкие и газообразные углеводороды."],["В каком примерном интервале температур находится главная зона нефтеобразования?","60–150 °C","30–60 °C","150–220 °C","200–300 °C","При меньших температурах кероген незрел, а при больших образуется преимущественно газ. Границы зависят от типа керогена и скорости нагрева."],["Что такое первичная миграция?","Выход углеводородов из материнской породы в коллектор","Метод оценки запасов газа по падению давления","Переток нефти из залежи в вышележащую ловушку","Перемещение газа через покрышку диффузией","Вторичная миграция — это уже движение по коллекторам к ловушке."],["Какой показатель часто используют для оценки зрелости органического вещества?","Отражательную способность витринита (Ro)","Индекс водорода (HI)","Индекс кислорода (OI)","Общий органический углерод (Сорг)","Ro растёт с прогревом. Обычно значения примерно 0,5–1,3 % соответствуют нефтяному окну."],["С каким типом органики обычно связан кероген II типа?","С морским планктоном и бактериальным материалом","С гумусовым растительным материалом","С переотложенной окисленной органикой","С озёрными водорослями с высоким H/C (I тип)","Кероген II типа богат водородом и нефтегенерирующий. Кероген III типа наземный и дает больше газа."],["Что такое главная фаза нефтеобразования (ГФН)?","Этап наиболее интенсивной генерации нефти при погружении","Этап вторичной миграции нефти в ловушки вдоль разломов","Этап образования биогенного метана в молодых осадках","Этап образования жирного газа и конденсата","В этой зоне керогены теряют водород и выделяют жидкие углеводороды."],["Что является основной движущей силой вторичной миграции?","Плавучесть углеводородов в воде","Давление уплотнения глин в зоне генерации","Диффузия растворённых углеводородов","Капиллярное давление в покрышке","Нефть и газ легче воды и поднимаются к ловушке."],["Что такое биодеградация нефти?","Разрушение углеводородов бактериями в неглубоких залежах","Вовлечение глин в плоскость сместителя, ухудшающее проводимость","Отношение разности акустических жёсткостей к их сумме","Осаждение асфальтенов при закачке газа","Бактерии потребляют лёгкие алканы, поэтому нефть становится тяжёлой и вязкой."],["Какая стадия катагенеза соответствует образованию основной части сухого газа?","Поздний катагенез (высокая температура)","Ранний мезокатагенез","Протокатагенез при начальном погружении","Ранний мезокатагенез (низкая температура)","С ростом температуры образуются всё более лёгкие углеводороды, и остаётся метан."],["В результате каких процессов нефть окисляется?","При обнажении нефтегазоматеринских толщ на дневной поверхности и их соприкосновении с кислородом","Никогда не окисляется","В результате опускания залежи углеводородов на большие глубины","В результате катастрофических стрессов","Для окисления нужен кислород, поэтому оно идёт у поверхности, в зоне гипергенеза: так образуются тяжёлые нефти и битумы. При погружении нефть, наоборот, попадает в восстановительную обстановку и подвергается термическому преобразованию.","lzs-54"],["Что такое материнская порода?","Порода с органическим веществом, способная генерировать УВ","Порода, в которой накапливается нефть","Порода с высокой пористостью, способная накапливать УВ","Порода с низкой проницаемостью, удерживающая УВ в ловушке","Обычно это тёмные глинистые или карбонатные толщи."],["Какой показатель характеризует содержание органики?","TOC","Tmax","Ro","S1","TOC — общий органический углерод, в процентах массы породы."],["Что показывает отражательная способность витринита Ro?","Степень катагенетической зрелости","Содержание органики","Тип керогена","Пористость материнской породы","Нефтяное окно обычно соответствует Ro примерно 0,5–1,3 %."],["Какой тип керогена преимущественно нефтематеринский?","I и II","III","IV","Только III и IV","Тип III более газоматеринский, тип IV практически инертен."],["Что показывает Tmax пиролиза Rock-Eval?","Температуру пика S2, связанную со зрелостью","Максимальную температуру залежи","Температуру начала кипения выделенных битумов","Пластовую температуру в момент отбора керна","Рост Tmax говорит о большей зрелости."],["Что движет вторичной миграцией?","Плавучесть и гидродинамика","Только капиллярное давление","Давление бурового раствора","Диффузия через глины в первую очередь","УВ легче воды и всплывают по пластам."]]},{"name":"Запасы и регионы","q":[["Какие запасы считаются наиболее изученными в российской классификации?","Категории А","Категории В1","Категории С1","Категории В2","Запасы А относятся к разрабатываемым залежам, разбуренным эксплуатационной сеткой. Категории D — это ресурсы, а не запасы."],["Какая свита считается главной нефтематеринской толщей Западной Сибири?","Баженовская","Тюменская","Абалакская","Покурская","Битуминозные отложения баженовской свиты верхней юры — нижнего мела формируют большую часть нефти региона. Доманик относится к Волго-Уралу."],["С какими отложениями связаны крупнейшие газовые залежи севера Западной Сибири?","С сеноманскими","С юрскими","С ачимовскими","С палеогеновыми","В сеноманских коллекторах под мощными туронскими глинами находятся газовые гиганты: Уренгой, Ямбург, Медвежье."],["Какая провинция включает Самотлорское месторождение?","Западно-Сибирская","Лено-Вилюйская","Тимано-Печорская","Волго-Уральская","Самотлор находится в ХМАО и является одним из крупнейших месторождений России."],["К какой провинции относится Ромашкинское месторождение?","Волго-Уральская","Тимано-Печорская","Прикаспийская","Днепровско-Припятская","Ромашкинское находится в Татарстане, а основные продуктивные пласты девонские."],["Как геологические запасы отличаются от извлекаемых?","Извлекаемые — часть геологических, которую можно добыть","Извлекаемые относятся только к разбуренным участкам","Геологические учитывают экономику, а извлекаемые — нет","Извлекаемые больше геологических на запасы растворённого газа","Связаны через КИН: извлекаемые = геологические × КИН."],["Какой метод часто используют для подсчёта запасов нефти?","Объёмный метод","Метод падения дебита для неразбуренных залежей","Метод материального баланса на стадии поиска","Метод сейсмических атрибутов без скважин","V = F·h·Kп·Kн·ρ·θ: площадь, толщина, пористость, насыщенность, плотность и пересчётный коэффициент."],["Что такое пересчётный коэффициент в подсчёте запасов нефти?","Величина, обратная объёмному коэффициенту нефти","Ловушка, созданная изменением литологии или выклиниванием","Порода, препятствующая движению флюидов","Величина, обратная коэффициенту пористости","Он приводит пластовый объём к поверхностным условиям."]]},{"name":"Сейсморазведка","q":[["Какое из ниже названных условий является обязательным требованием к сейсморегистрирующей расстановке?","Амплитудная и фазовая идентичность каналов","Подобие динамического диапазона сейсмоприемников","Одинаковая глубина установки сейсмоприемников","Одинаковый коэффициент усиления каналов","Записи разных каналов сравниваются и суммируются, поэтому все каналы должны одинаково передавать амплитуду и фазу сигнала. Иначе различия в записи будут вызваны аппаратурой, а не геологией, и синфазное суммирование исказится.","lzs-0"],["Чем определяется плотность сети наблюдений?","Количеством погонных километров сейсмических профилей на 1 кв. км площади исследований","Объемом работ, выполняемых сейсмопартией","Количеством отработанных пунктов возбуждения","Суммарной длиной отработанных сейсмопрофилей","Плотность сети — удельная величина: длина профилей (пог. км), приходящаяся на единицу площади (км/км²). Объём работ, число пунктов возбуждения и суммарная длина профилей без привязки к площади плотность не характеризуют.","lzs-1"],["Какие разрывные нарушения показываются на картах?","Главные и второстепенные","Все нарушения видимые сейсмикой","Только наиболее крупные","Все нарушения в данном регионе","На картах показывают разломы с разделением по значимости: главные и второстепенные (их выделяют разным типом и толщиной линии). Сейсмика видит не все нарушения, а масштаб карты не позволяет показать все существующие.","lzs-7"],["Как показываются любые предполагаемые границы?","Штриховыми линиями","Никак не показывается","Сплошными линиями","Двойными жирными линиями","По правилам геологической графики достоверные границы проводят сплошной линией, а предполагаемые — штриховой (пунктирной). Так читатель карты видит степень надёжности построения.","lzs-8"],["Основным источником данных для построения структурной карты являются:","результаты сейсмических съемок и скважинная информация (керн и каротаж)","результаты гидродинамических исследований и сиквенс-стратиграфические построения","седиментологическая интерпретация керна и результаты его петрофизических исследований","динамический уровень жидкости в скважинах и карта дневной поверхности","Структурная карта показывает абсолютные отметки кровли горизонта. Форму поверхности между скважинами даёт сейсмика, а точные отметки в точках — скважинные данные (каротаж и керн).","lzs-9"],["Что означает понятие \u003cтип волновой картины>?","Особенности изменения волнового поля, сопоставляемые с конкретным геологическим объектом","Область уменьшенных амплитуд отраженных волн","Область увеличенных амплитуд отраженных волн","Область смещенных осей синфазности","Тип волновой картины — это устойчивый рисунок записи (амплитуда, частота, форма осей), который можно связать с определённым геологическим телом. Отдельные амплитудные аномалии или смещение осей — лишь частные признаки.","lzs-28"],["Для чего выполняется анализ атрибутов сейсмического волнового поля?","Для прогнозирования свойств пород геологического разреза","Для определения невязок по времени","Для построения структурных карт","Для вычисления скоростей","Атрибуты (амплитуда, частота, когерентность и др.) статистически связывают со свойствами пород в скважинах и затем распространяют прогноз литологии и коллекторских свойств на межскважинное пространство.","lzs-29"],["Сейсмическая инверсия позволяет осуществить прогноз?","Коллекторских свойств пород","Скорости пробега упругих волн","Глубины залегания сейсмических границ","Геологического разреза","Инверсия преобразует волновое поле в акустический импеданс, связанный с пористостью и литологией. Поэтому она служит прогнозу коллекторских свойств в межскважинном пространстве.","lzs-72"],["Какой параметр наиболее сильно влияет на амплитуду отраженного сейсмического сигнала?","Коэффициент отражения","Акустическая жесткость слоя","Плотность горных пород","Скорость распространения упругих волн","Амплитуда отражённой волны прямо пропорциональна коэффициенту отражения на границе: R = (Z₂ − Z₁)/(Z₂ + Z₁). Плотность и скорость влияют только через него, причём важна не сама жёсткость слоя, а контраст на границе.","lzs-73"],["От чего зависит вертикальная разрешённость сейсморазведки?","От длины волны: обычно около четверти её длины","От числа сейсмоприёмников на профиле","От числа приёмников на профиле и кратности суммирования","От мощности источника и глубины его заложения","λ = V/f, поэтому с глубиной разрешённость ухудшается."],["Что такое коэффициент отражения при нормальном падении?","Отношение разности акустических жёсткостей к их сумме","Разрушение углеводородов бактериями в неглубоких залежах","Произведение плотностей двух слоёв","Расстояние между кровлей в своде и контактом","R = (Z₂ − Z₁)/(Z₂ + Z₁)."],["Что такое акустический импеданс?","Произведение плотности на скорость","Отношение скорости к плотности","Произведение скорости на частоту","Отношение амплитуды к времени","Z = ρ·V, его контраст создаёт отражения."],["Что называют синтетической сейсмограммой?","Трассу, рассчитанную по АК и ГГК-П для привязки к сейсмике","Запись с искусственным источником на море","Трассу, полученную суммированием записей по общей средней точке","Запись, снятую приёмниками в скважине при работе наземного источника","Она связывает временной разрез с глубинами по скважине."],["Зачем выполняют суммирование по ОГТ?","Для подавления шумов и усиления полезных отражений","Для восстановления истинного положения наклонных границ","Для перевода времён в глубины и учёта зоны малых скоростей","Для учёта статических поправок на море","Трассы с разными удалениями, отражённые от одной точки, складывают после поправки."],["Что делает миграция сейсмических данных?","Перемещает отражения в истинное положение","Подавляет кратные волны по скорости","Убирает влияние зоны малых скоростей","Рассчитывает атрибуты амплитуды","Особенно важна для крутых границ и сбросов."],["Как называется кратная волна?","Волна, многократно отразившаяся между границами","Волна, преломившаяся вдоль границы и вернувшаяся","Преломлённая волна вдоль границы","Волна с удвоенной частотой относительно основной","Кратные волны создают ложные отражения и подавляются при обработке."],["Что такое AVO-анализ?","Изучение изменения амплитуды с удалением","Сравнение скоростей двух съёмок","Произведение плотности на скорость","Расстояние между кровлей в своде и контактом","Газ может давать характерную зависимость амплитуды от удаления."],["Что такое «яркое пятно» на сейсмическом разрезе?","Аномально высокая амплитуда, часто над газом","Участок с полным отсутствием отражений","Зона несогласия внутри фундамента","Шум от источника в начале записи","Но яркие амплитуды дают и пласты с другой литологией."],["Что означает «плоское пятно» (flat spot)?","Горизонтальное отражение от контакта флюидов","Ровный рельеф морского дна","Выдержанный пласт с постоянной толщиной","Подошву зоны малых скоростей","Контакт флюидов почти горизонтален и может пересекать слои."],["Что такое 4D-сейсморазведка?","Повторные 3D-съёмки для контроля изменения залежи","Зубчатые швы растворения под давлением","Съёмка с регистрацией обменных волн","Обработка 3D-данных с учётом анизотропии","Сравнение съёмок показывает движение флюидов и изменение давления."],["Что такое вертикальное сейсмическое профилирование (ВСП)?","Регистрация волн приёмниками в скважине","Профиль скважин вдоль простирания пласта","Построение разреза по данным ГИС","Сейсмика с источником на забое при бурении","ВСП даёт точную связь времени и глубины."],["Какой атрибут обычно используют для выделения разломов на 3D-кубе?","Когерентность","Среднюю амплитуду по горизонту","Импеданс по горизонту","Толщину по изохронам","Когерентность падает там, где соседние трассы перестают быть похожими."],["Что такое инверсия сейсмических данных?","Пересчёт отражений в акустический импеданс","Смена полярности записи на всём кубе","Переворот разреза по вертикали","Перевод временного разреза в глубинный","Импеданс удобнее сопоставлять со свойствами пластов."],["Чем опасно пренебрежение скоростной анизотропией при глубинном построении?","Ошибками в глубинах, особенно на больших удалениях","Завышением пористости и потерей данных ГИС при привязке","Нарушением сетки скважин и ростом шумов на временных разрезах","Завышением вязкости нефти","Скорости вдоль и поперёк слоистости различаются."],["Двойное время пробега до отражения 2,4 с, средняя скорость 2500 м/с. Какова глубина?","3000 м","6000 м","3300 м","2700 м","Волна идёт вниз и вверх, поэтому время делим пополам.\nh = V·t/2 = 2500 × 2,4 ÷ 2 = 3000 м"],["Двойное время пробега до отражения 1,2 с, средняя скорость 3000 м/с. Какова глубина?","1800 м","3600 м","1980 м","1620 м","Волна идёт вниз и вверх, поэтому время делим пополам.\nh = V·t/2 = 3000 × 1,2 ÷ 2 = 1800 м"],["Двойное время пробега до отражения 1,8 с, средняя скорость 4000 м/с. Какова глубина?","3600 м","7200 м","3960 м","3240 м","Волна идёт вниз и вверх, поэтому время делим пополам.\nh = V·t/2 = 4000 × 1,8 ÷ 2 = 3600 м"],["Двойное время пробега до отражения 2 с, средняя скорость 3500 м/с. Какова глубина?","3500 м","7000 м","3850 м","3150 м","Волна идёт вниз и вверх, поэтому время делим пополам.\nh = V·t/2 = 3500 × 2 ÷ 2 = 3500 м"],["Двойное время пробега до отражения 2 с, средняя скорость 2500 м/с. Какова глубина?","2500 м","5000 м","2750 м","2250 м","Волна идёт вниз и вверх, поэтому время делим пополам.\nh = V·t/2 = 2500 × 2 ÷ 2 = 2500 м"],["Двойное время пробега до отражения 2,4 с, средняя скорость 4000 м/с. Какова глубина?","4800 м","9600 м","5280 м","4320 м","Волна идёт вниз и вверх, поэтому время делим пополам.\nh = V·t/2 = 4000 × 2,4 ÷ 2 = 4800 м"],["Скорость 3600 м/с, преобладающая частота 40 Гц. Какова примерная вертикальная разрешённость по критерию λ/4?","22,5 м","90 м","45 м","11,25 м","λ = V / f = 3600 ÷ 40 = 90 м\nλ / 4 = 22,5 м"],["Скорость 4800 м/с, преобладающая частота 30 Гц. Какова примерная вертикальная разрешённость по критерию λ/4?","40 м","160 м","80 м","20 м","λ = V / f = 4800 ÷ 30 = 160 м\nλ / 4 = 40 м"],["Скорость 4800 м/с, преобладающая частота 60 Гц. Какова примерная вертикальная разрешённость по критерию λ/4?","20 м","80 м","40 м","10 м","λ = V / f = 4800 ÷ 60 = 80 м\nλ / 4 = 20 м"],["Скорость 4800 м/с, преобладающая частота 40 Гц. Какова примерная вертикальная разрешённость по критерию λ/4?","30 м","120 м","60 м","15 м","λ = V / f = 4800 ÷ 40 = 120 м\nλ / 4 = 30 м"],["Акустические жёсткости верхнего и нижнего слоя 8 и 12 (в условных единицах). Чему равен коэффициент отражения?","0,2","0,5","0,667","0,3","R = (Z₂ − Z₁) / (Z₂ + Z₁)\n(12 − 8) ÷ (12 + 8) = 0,2"],["Акустические жёсткости верхнего и нижнего слоя 6 и 9 (в условных единицах). Чему равен коэффициент отражения?","0,2","0,5","0,667","0,3","R = (Z₂ − Z₁) / (Z₂ + Z₁)\n(9 − 6) ÷ (9 + 6) = 0,2"],["Акустические жёсткости верхнего и нижнего слоя 5 и 7 (в условных единицах). Чему равен коэффициент отражения?","0,167","0,4","0,714","0,267","R = (Z₂ − Z₁) / (Z₂ + Z₁)\n(7 − 5) ÷ (7 + 5) = 0,167"],["Акустические жёсткости верхнего и нижнего слоя 4 и 6 (в условных единицах). Чему равен коэффициент отражения?","0,2","0,5","0,667","0,3","R = (Z₂ − Z₁) / (Z₂ + Z₁)\n(6 − 4) ÷ (6 + 4) = 0,2"]]},{"name":"Литология и фации","q":[["Что понимается под термином - Компенсационная глубина карбонатонакопления?","Глубина, ниже которой кальций уже не откладывается на дне океана (скорость поступления карбоната кальция уравновешивается скоростью растворения кальцита на этой глубине)","Глубина, на которой кальций выпадает в осадок","Глубина, на которой формируются крупнейшие рифогенные постройки","Глубина формирования одиночных рифовых массивов","Это критическая глубина карбонатонакопления (CCD): с глубиной растворимость CaCO₃ растёт, и на определённом уровне растворение полностью компенсирует поступление карбоната. Ниже этого уровня карбонатные осадки не накапливаются. Рифы, наоборот, образуются на мелководье.","lzs-2"],["Рамп - это?","Склон бассейна","Рифовая постройка","Колония кораллов","Дельтовая лопасть","Рамп (карбонатный рамп) — пологий, почти без резкого перегиба склон, который постепенно переходит от мелководья к глубоководной части бассейна. От шельфа с бровкой он отличается отсутствием выраженного уступа. Рифовая постройка и колония кораллов — биогенные тела, а не форма склона.","lzs-3"],["Для какой обстановки седиментации характерны конседиментационные разломы?","Для дельтовой","Для мелководья","Для морского глубоководья","Для озерной","Дельты дают быстрое накопление мощных осадков на неуплотнённых глинах. Под их весом развиваются конседиментационные (ростовые) разломы, которые движутся одновременно с осадконакоплением, поэтому мощность толщи резко увеличивается в опущенном крыле.","lzs-4"],["Для какой обстановки седиментации характерны конседиментационные разломы?","Для дельтовой","Для озерной","Для турбидитовой","Для пойменной","Классическая обстановка ростовых разломов — дельта: большая скорость осадконакопления и гравитационное оползание осадков по неуплотнённым глинам. Турбидиты — это отложения мутьевых потоков, а не обстановка, порождающая такие разломы.","lzs-5"],["Какие данные необходимы для корректной диагностики и идентификации обстановок осадконакопления по керну скважин?","Необходима классификационная схема обстановок терригенного осадконакопления, охватывающая все многообразие типов, подтипов и индивидуальных литогенетических единиц легко распознаваемых как в обнажениях, так и в керне скважин","Необходимы эталонные геофизические разрезы скважин с привязкой основных керновых данных","Необходимы эталонные коллекции керна с подробным описанием всех морфологических типов текстур","Необходимы таблицы текстур и структур, разработанные для каждого региона","Диагностика — это отнесение наблюдаемого объекта к определённому классу, поэтому нужна единая классификационная схема обстановок, применимая и к обнажениям, и к керну. Остальные варианты — вспомогательные материалы: эталонные разрезы, коллекции и таблицы текстур сами по себе обстановку не определяют.","lzs-6"],["Какие процессы характерны для стадии гипергенеза?","Характерны процессы гидратации, окисления, восстановления и растворения","Процессы тепловой переработки минералов под действиями высоких температур и давлений","Процесс физического разрушения уже образованных консолидированных осадочных горных пород","Процесс химической переработки осадочного материала","Гипергенез идёт у поверхности под действием воды, кислорода и органики. Для него типичны химические реакции выветривания: гидратация, окисление, восстановление, растворение. Физическое разрушение — лишь часть процесса, а тепловая переработка относится к метаморфизму.","lzs-44"],["Какая обстановка чаще всего даёт песчаные тела с прямой градационной слоистостью и последовательностью Боума?","Турбидитовая","Эоловая","Приливная равнина","Баровая морская","Цикл Боума отражает осаждение из мутьевого потока."],["Какая форма кривой ПС/ГК типична для русловых отложений?","Колоколовидная, с укрупнением к подошве","Воронкообразная, с укрупнением вверх","Прямолинейная, без изменения","Пилообразная, с тонким переслаиванием","В русле зернистость уменьшается вверх по разрезу."],["Какая форма кривой типична для вдольбереговых баров?","Воронкообразная, с укрупнением вверх","Колоколовидная, с уменьшением зерна вверх","Гребневидная, без тренда","Ступенчатая вниз по разрезу","Бар проградирует, и более песчаные части лежат выше."],["Для какой обстановки типичны серповидные и ленточные песчаные тела извилистых рек?","Аллювиальной","Глубоководной","Рифовой","Сабхи","Песчаные тела меандрирующих рек извилисты и прерывисты."],["Что такое сабха?","Приливная равнина аридного климата с испарениями","Карбонатная постройка с органогенной пористостью","Самая низкая изогипса, замыкающая структуру","Рифовая лагуна влажного климата","В сабхах образуются ангидриты и доломиты."],["Что означает прямая градационная слоистость?","Зерно уменьшается снизу вверх в пределах слоя","Слойки наклонены к подошве в одну сторону","Зерно растёт снизу вверх в пределах слоя","Разнозернистая масса без сортировки","Она образуется при оседании из затухающего потока."],["Какая структура песчаника указывает на высокую зрелость осадка?","Хорошая сортировка и окатанность зёрен","Угловатые обломки полевого шпата","Высокое содержание слюды и глины","Плохая сортировка и матрикс","Зрелость растёт при длительной транспортировке."],["Какой диагенетический процесс чаще всего улучшает ёмкость карбонатов?","Выщелачивание","Цементация кальцитом","Уплотнение","Стилолитизация с заполнением пор","Растворение создаёт вторичную пористость: каверны и поры."],["Почему доломитизация часто улучшает коллекторские свойства?","Замещение уменьшает объём твёрдой фазы","Доломит заполняет поры глиной","Доломит растворяется легче кальцита","Доломит увеличивает плотность без пор","Объём доломита меньше объёма исходного кальцита."],["Что такое стилолиты?","Зубчатые швы растворения под давлением","Трещины отрыва при складкообразовании","Следы ползания бентоса","Ритмичные прослои ангидрита","Обычно они снижают проницаемость поперёк напластования."],["Что такое каолинит с позиции качества коллектора?","Глинистый минерал, мигрирующие частицы которого могут забивать поры","Цемент, повышающий проницаемость","Разбухающая глина группы смектита","Выдержанный на большой площади пласт, используемый для корреляции","Для смектита характерно набухание, для каолинита — миграция частиц."],["Какая глина наиболее склонна к набуханию?","Монтмориллонит","Каолинит","Хлорит","Гидрослюда","Межслоевые промежутки смектита поглощают воду."],["Что представляет собой шельфовая карбонатная платформа?","Мелководное накопление карбонатов с высокой биопродуктивностью","Глубоководный конус выноса терригенного материала","Глубоководное накопление глин и турбидитов у подножия склона","Мелководное накопление песков с обильным поступлением с суши","Там формируются рифы и банки."],["Что такое элементарный циклит?","Минимальная закономерная последовательность пород","Толща между двумя региональными несогласиями","Приливная равнина аридного климата с испарениями","Устойчивая область с чехлом на складчатом фундаменте","Циклиты отражают колебания условий осадконакопления."]]},{"name":"Корреляция и строение разреза","q":[["Что такое стратиграфическое расчленение разрезов?","Выделение в конкретном разрезе стратиграфических подразделений по их литологическим, физическим особенностям или составу остатков древних организмов.","Выделение в конкретном разрезе стратиграфических объёмов равных по толщине.","Выделение в конкретном разрезе литологически однородных толщ вне зависимости от их стратиграфической приуроченности.","Выделение в конкретном разрезе литологически разнородных толщ вне зависимости от их стратиграфической приуроченности","Расчленение — это выделение в разрезе стратиграфических подразделений по совокупности признаков: литология, физические свойства, палеонтологические остатки. Равенство толщин значения не имеет, а признак стратиграфической приуроченности обязателен.","lzs-13"],["Какая операция является первостепенной при проведении корреляционных построений?","Типизация разрезов и наметка линий корреляции","Построение стратиграфического каркаса","Обработка геофизических материалов","Машинная корреляция","Сначала разрезы скважин группируют по типам и намечают линии, по которым их будут сопоставлять. Каркас строится уже на этой основе, а машинная корреляция лишь проверяет и детализирует результат.","lzs-14"],["Что такое маркер ?","Пласт или серий пластов, хорошо выдержанных по простиранию и легко отличающихся по литологическим признакам от покрывающих и подстилающих пород","Слои (пласт) значительной мощности, характеризующийся четкой геофизической характеристикой и значительным содержанием органического вещества","Слой (пласт, горизонт) четко выделяемый на сейсмических разрезах","Пласт, содержащий обильную макрофауну","Маркер (репер) ценен выдержанностью по площади и узнаваемостью в разрезе, поэтому он служит опорной границей для корреляции. Большая мощность, органика или фауна для него не обязательны.","lzs-15"],["Что понимают под процедурой корреляции ?","Процедура прослеживания и сопоставления продуктивных горизонтов (пластов) в межскважинном пространстве","Процедура прослеживания биомаркеров в региональном плане","Процедура построения профильных разрезов глубинного строения продуктивных горизонтов","Копирование на светостоле каротажных кривых с целью выявления особенностей их конфигурации","Корреляция — это сопоставление разрезов скважин и прослеживание одновозрастных пластов между ними. Профильный разрез — уже результат корреляции, а наложение кривых лишь один из её старых приёмов.","lzs-16"],["В чем отличие активных окраин континентов от пассивных?","Активные окраины характеризуются повышенной сейсмической и вулканической активностью","Активные окраины испытывают постоянное наращивание мантийным веществом","Активные окраины отличаются от пассивных наличием большого количества сдвиговых нарушений","Активные окраины формируются в зоне субдукции, а пассивные - в зоне спрединга","Активная окраина находится на границе литосферных плит, поэтому там часты землетрясения и вулканы. Пассивная окраина лежит внутри плиты и тектонически спокойна; сама она не является зоной спрединга, хотя и возникла при раскрытии океана.","lzs-79"],["Дайте определение: Зона субдукции - это?","Линейная зона, вдоль которой происходит погружение одних блоков земной коры под другие","Базальная зона вдоль которой проявляется влияние контакта с ледниковым ложем","Зона океанского рифтогенеза","Зона эрозионного тектонического срезания","В зоне субдукции одна литосферная плита, обычно океаническая, погружается под другую. Рифтогенез — противоположный процесс раздвижения.","lzs-80"]]},{"name":"Стратиграфия и тектоника","q":[["Что такое региональный репер?","Выдержанный на большой площади пласт, используемый для корреляции","Самая мощная толща разреза","Точка привязки сейсмического профиля","Глинистый минерал, мигрирующие частицы которого могут забивать поры","Часто это глины, известняки или аргиллиты, надёжно видные на ГИС."],["Что такое секвенция в секвентной стратиграфии?","Толща между несогласиями и их корреляционными поверхностями","Набор скважин одной площади","Толща одного литологического состава с единым ВНК по площади","Цикл бурения скважин одного куста на один и тот же объект","Модель связывает слои с колебаниями относительного уровня моря."],["Что характерно для тракта низкого стояния уровня моря?","Перенос песка в глубоководную часть бассейна","Рост рифов на внешнем крае широкого шельфа","Максимальное затопление шельфа и накопление глин","Накопление солей в лагунах у берега","Шельф осушается, реки врезаются, материал идёт дальше в бассейн."],["Что такое поверхность максимального затопления?","Граница, отражающая наибольшее продвижение моря","Ловушка, созданная изменением литологии или выклиниванием","Величина, обратная объёмному коэффициенту нефти","Поверхность размыва при падении уровня","Часто это выдержанные глины, удобный репер."],["Что такое угловое несогласие?","Залегание слоёв на смятых и размытых нижних","Смещение слоёв по сбросу","Параллельный контакт пластов без перерыва","Постепенный переход литологии","Оно указывает на складчатость и размыв."],["Чем сброс отличается от взброса?","Висячий блок опущен относительно лежачего","Висячий блок поднят относительно лежачего","Блоки смещены только по горизонтали","Плоскость смещения всегда вертикальна","Сбросы типичны для растяжения, взбросы — для сжатия."],["Какой режим напряжений типичен для сбросов?","Растяжение","Сжатие","Сдвиг в чистом виде","Изостатическое поднятие","Вертикальное напряжение наибольшее, горизонтальные меньше."],["Что такое надвиг?","Пологий взброс с большим перемещением","Крутой сброс в рифтовой зоне","Вертикальная дайка в осадочном чехле","Складка без разрыва","Надвиги характерны для складчатых поясов."],["Что такое литологический экран разлома?","Запирание, когда коллектор примыкает к непроницаемой породе","Брекчия с высокой пористостью вдоль поверхности сместителя","Проницаемая зона вдоль разлома, по которой мигрирует нефть","Слабая брекчия в плоскости сместителя","Разлом может быть и проводящим, поэтому экранирование нужно доказывать."],["Что такое размазывание глин (smear) в разломе?","Вовлечение глин в плоскость сместителя, ухудшающее проводимость","Набухание глин в призабойной зоне","Отношение разности акустических жёсткостей к их сумме","Разрушение углеводородов бактериями в неглубоких залежах","Оценивается, например, по коэффициенту SGR."],["Что такое платформа в тектоническом понимании?","Устойчивая область с чехлом на складчатом фундаменте","Самая низкая изогипса, замыкающая структуру","Карбонатная постройка с органогенной пористостью","Центральная часть срединно-океанического хребта","Западно-Сибирская плита — пример молодой платформы."],["Что такое авлакоген?","Древний рифт на платформе, перекрытый чехлом","Складчатый хребет на окраине плиты","Пологий взброс с большим перемещением","Вулканическая дуга","Погребённые рифтовые прогибы часто контролируют нефтегазоносность."],["Какая структура называется антиклиналью?","Складка с более древними породами в ядре","Складка с более молодыми породами в ядре","Блок, опущенный по сбросам","Толща с горизонтальным залеганием","В синклинали всё наоборот."]]},{"name":"Подсчёт запасов","q":[["Какая классификация запасов действует в России?","Запасы A, B1, B2, C1, C2 по стадиям изученности и освоения","Только доказанные и вероятные","Запасы 1P, 2P, 3P по доказанности и рентабельности","Группы I–IV по экономической эффективности разработки","Классификация 2013 года: A, B1, B2, C1, C2, D0 и другие."],["Какие запасы соответствуют разрабатываемым и разбуренным залежам?","A","B2","C2","D0","Категория A — разрабатываемые, разбуренные эксплуатационной сеткой."],["Что такое геологические запасы?","Количество УВ в пласте","Количество нефти, которое можно добыть","Запасы на балансе предприятия за год","Запасы, пригодные только для рентабельной добычи","Извлекаемые запасы = геологические × КИН."],["Как рассчитать геологические запасы нефти объёмным методом?","F·h·Кп·Кн·ρ·θ","Q·t / (1 + B)","P·V/(Z·T)","k·h·Δp / (μ·B)","Площадь × толщина × пористость × нефтенасыщенность × плотность × пересчётный коэффициент."],["Что такое пересчётный коэффициент?","Величина, обратная объёмному коэффициенту нефти","Граница, отражающая наибольшее продвижение моря","Отношение плотности нефти к воде","Порода, препятствующая движению флюидов","Приводит объём нефти к поверхностным условиям."],["Что такое материальный баланс?","Уравнение сохранения массы флюидов в залежи","Залегание слоёв на смятых и размытых нижних","Метод анализа сейсмических атрибутов","Расстояние между кровлей в своде и контактом","Отбор компенсируется расширением флюидов, породы и приходом воды."],["Что такое P/Z-диаграмма?","Метод оценки запасов газа по падению давления","График проницаемости по пористости","Выход углеводородов из материнской породы в коллектор","Зависимость дебита от депрессии","В газовом режиме P/Z линейно снижается с добычей."],["Что отражает метод кривых падения Арпса?","Прогноз добычи по снижению дебита","Распределение проницаемости","Давление насыщения","Давление гидроразрыва","Арпс различал экспоненциальное, гармоническое и гиперболическое падение."],["Что характерно для ТрИЗ?","Низкая проницаемость, высокая вязкость или особый состав","Высокие дебиты при естественном режиме","Истощённые газовые шапки и высокая обводнённость продукции","Высокая проницаемость, малая вязкость и естественный режим","Термин охватывает разные типы низкопродуктивных запасов."],["Что такое баженовская свита с точки зрения запасов?","Нефтематеринская сланцевая толща с собственными ТрИЗ","Основной газовый горизонт сеномана","Минимальная закономерная последовательность пород","Устойчивая область с чехлом на складчатом фундаменте","Она богата органикой и низкопроницаема."],["Площадь залежи 1000 тыс. м², эффективная толщина 5 м, пористость 0,15, нефтенасыщенность 0,7, плотность 0,9 т/м³, пересчётный коэффициент 0,9. Каковы геологические запасы, тыс. т?","425,25 тыс. т","472,5 тыс. т","467,775 тыс. т","607,5 тыс. т","Q = F·h·Кп·Кн·ρ·θ\n1000 × 5 = 5000 тыс. м³ породы\n5000 × 0,15 × 0,7 = 525 тыс. м³ нефти в пласте\n× 0,9 × 0,9 = 425,25 тыс. т"],["Площадь залежи 4000 тыс. м², эффективная толщина 5 м, пористость 0,25, нефтенасыщенность 0,6, плотность 0,85 т/м³, пересчётный коэффициент 0,9. Каковы геологические запасы, тыс. т?","2295 тыс. т","2550 тыс. т","2524,5 тыс. т","2700 тыс. т","Q = F·h·Кп·Кн·ρ·θ\n4000 × 5 = 20 000 тыс. м³ породы\n20 000 × 0,25 × 0,6 = 3000 тыс. м³ нефти в пласте\n× 0,85 × 0,9 = 2295 тыс. т"],["Площадь залежи 5000 тыс. м², эффективная толщина 5 м, пористость 0,15, нефтенасыщенность 0,6, плотность 0,8 т/м³, пересчётный коэффициент 0,9. Каковы геологические запасы, тыс. т?","1620 тыс. т","1800 тыс. т","1782 тыс. т","2025 тыс. т","Q = F·h·Кп·Кн·ρ·θ\n5000 × 5 = 25 000 тыс. м³ породы\n25 000 × 0,15 × 0,6 = 2250 тыс. м³ нефти в пласте\n× 0,8 × 0,9 = 1620 тыс. т"],["Площадь залежи 2000 тыс. м², эффективная толщина 10 м, пористость 0,25, нефтенасыщенность 0,6, плотность 0,85 т/м³, пересчётный коэффициент 0,9. Каковы геологические запасы, тыс. т?","2295 тыс. т","2550 тыс. т","2524,5 тыс. т","2700 тыс. т","Q = F·h·Кп·Кн·ρ·θ\n2000 × 10 = 20 000 тыс. м³ породы\n20 000 × 0,25 × 0,6 = 3000 тыс. м³ нефти в пласте\n× 0,85 × 0,9 = 2295 тыс. т"],["Площадь залежи 5000 тыс. м², эффективная толщина 10 м, пористость 0,2, нефтенасыщенность 0,8, плотность 0,85 т/м³, пересчётный коэффициент 0,9. Каковы геологические запасы, тыс. т?","6120 тыс. т","6800 тыс. т","6732 тыс. т","7200 тыс. т","Q = F·h·Кп·Кн·ρ·θ\n5000 × 10 = 50 000 тыс. м³ породы\n50 000 × 0,2 × 0,8 = 8000 тыс. м³ нефти в пласте\n× 0,85 × 0,9 = 6120 тыс. т"],["Площадь залежи 5000 тыс. м², эффективная толщина 12 м, пористость 0,15, нефтенасыщенность 0,8, плотность 0,8 т/м³, пересчётный коэффициент 0,9. Каковы геологические запасы, тыс. т?","5184 тыс. т","5760 тыс. т","5702,4 тыс. т","6480 тыс. т","Q = F·h·Кп·Кн·ρ·θ\n5000 × 12 = 60 000 тыс. м³ породы\n60 000 × 0,15 × 0,8 = 7200 тыс. м³ нефти в пласте\n× 0,8 × 0,9 = 5184 тыс. т"],["Геологические запасы 2000 тыс. т, утверждённый КИН 0,35. Каковы начальные извлекаемые запасы?","700 тыс. т","1300 тыс. т","840 тыс. т","560 тыс. т","Qизвл = Qгеол × КИН\n2000 × 0,35 = 700 тыс. т"],["Геологические запасы 1500 тыс. т, утверждённый КИН 0,25. Каковы начальные извлекаемые запасы?","375 тыс. т","1125 тыс. т","450 тыс. т","300 тыс. т","Qизвл = Qгеол × КИН\n1500 × 0,25 = 375 тыс. т"],["Геологические запасы 2000 тыс. т, утверждённый КИН 0,45. Каковы начальные извлекаемые запасы?","900 тыс. т","1100 тыс. т","1080 тыс. т","720 тыс. т","Qизвл = Qгеол × КИН\n2000 × 0,45 = 900 тыс. т"],["Геологические запасы 2000 тыс. т, утверждённый КИН 0,4. Каковы начальные извлекаемые запасы?","800 тыс. т","1200 тыс. т","960 тыс. т","640 тыс. т","Qизвл = Qгеол × КИН\n2000 × 0,4 = 800 тыс. т"],["Геологические запасы 4000 тыс. т, утверждённый КИН 0,45. Каковы начальные извлекаемые запасы?","1800 тыс. т","2200 тыс. т","2160 тыс. т","1440 тыс. т","Qизвл = Qгеол × КИН\n4000 × 0,45 = 1800 тыс. т"]]},{"name":"Практические ситуации","q":[["Что ограничивает вертикальную разрешающую способность сейсморазведки?","Преобладающая частота и скорость, примерно четверть длины волны","Шаг между пунктами приёма и кратность наблюдений","Мощность источника и число приёмников в группе на пикете","Шаг между пунктами приёма и кратность наблюдений на профиле","Пласт тоньше λ/4 не разделяется отдельными отражениями, поэтому тонкие коллекторы часто не видны."],["Как привязывают сейсмику к скважине?","Строят синтетическую сейсмограмму по АК и ГГК с импульсом","Строят скоростную модель по преломлённым волнам","Переводят кривую ГК во время по средней скорости","Сопоставляют глубины ОГ со структурной картой соседнего участка","Синтетика переводит глубины во время и связывает отражения с пластами, а ВСП и check-shot уточняют связь."],["Вероятность успеха поисковой скважины оценивают как:","Произведение вероятностей существования коллектора, ловушки, покрышки, заряда и сохранности","Отношение числа открытий к числу скважин по соседнему нефтегазоносному району","Среднее взвешенное вероятностей ловушки, коллектора, покрышки и заряда","Вероятность наименее изученного из элементов системы, взятая без умножения","Для открытия нужны все элементы, поэтому геологические вероятности перемножают."],["Как отличить аномалию амплитуды от газа и от литологии?","Сопоставить с AVO, структурой, контактом и скважинами","Сравнить амплитуду со средним значением по всему кубу","Определить по частоте на временном разрезе","Определить по частоте на одном временном разрезе","Яркое пятно может быть вызвано угленосной пачкой или карбонатом. Подтверждающие признаки повышают надёжность."],["На каротаже ГК низкий, ПС отрицательная, сопротивление высокое, нейтронный и плотностной близки. Что это, вероятнее всего?","Нефтенасыщенный чистый песчаник","Глина с высоким содержанием органики","Водонасыщенный песчаник с пресной водой","Плотный ангидрит с нулевой пористостью","Чистый коллектор даёт низкий ГК, а высокое сопротивление при наличии пористости указывает на углеводороды."],["Кроссовер нейтронного и плотностного каротажа в коллекторе чаще всего указывает на:","Газ","Глинистость","Нефть высокой вязкости","Минерализованная вода","Газ занижает нейтронную и плотностную плотность, поэтому кривые расходятся характерным образом."],["Какие признаки разлома заметны на сейсмике?","Смещение и обрыв осей синфазности, смена рисунка записи","Плавное утонение пласта при постоянной амплитуде","Рост амплитуды вдоль оси с сохранением её непрерывности","Изменение частоты записи с глубиной без смещения осей","Разломы лучше всего выделяются на кубах когерентности и вертикальных разрезах."],["Как влияет наклон ВНК по площади залежи на подсчёт запасов?","Может указывать на гидродинамику или разобщённость и меняет объём","Указывает только на ошибки привязки каротажа и не меняет объём","Говорит о подъёме ВНК при разработке и не влияет на начальные запасы","Запасы растут всегда, а контуры нефтеносности не меняются","Наклон важен при оценке связанности блоков и уточнении контура нефтеносности."]]}],"color":"#A8703A"},{"id":"phys","name":"Физика пласта","subs":[{"name":"Фильтрационно-ёмкостные свойства","q":[["Что такое открытая пористость?","Доля объёма сообщающихся пор в объёме породы","Доля всех пустот в породе, включая изолированные","Доля пор, в которых вода подвижна","Объём трещин на единицу объёма породы","Для запасов важны связанные поры, поскольку изолированные не участвуют в фильтрации."],["В каких единицах в практике измеряют проницаемость?","В миллидарси","В мПа·с","В м³/(сут·МПа)","В м²/с","1 Дарси примерно равен 1 мкм². В практике используют мД, так как значения чаще составляют единицы и сотни мД."],["В чём заключается эффект Клинкенберга?","Газовая проницаемость завышена при низких давлениях из-за проскальзывания у стенок пор","Газовая проницаемость занижена при низких давлениях из-за набухания глин в порах","Проницаемость растёт при снижении эффективного давления","Жидкостная проницаемость завышена при низких давлениях из-за вязкого трения у стенок пор","Поэтому измерения газопроницаемости приводят к жидкостной проницаемости с поправкой."],["Что такое песчанистость?","Отношение эффективной толщины к общей толщине пласта","Отношение вертикальной проницаемости к горизонтальной","Заполнение пор минералами с ухудшением свойств","Отношение нефтенасыщенной толщины к эффективной","Песчанистость показывает, какая часть разреза пласта представлена коллектором."],["Что связывает уравнение Арчи?","Сопротивление породы с пористостью и водонасыщенностью","Проницаемость с пористостью и остаточной водой","Скорость волны с пористостью","Капиллярное давление с насыщенностью","Формула служит основой для определения насыщения по данным электрического каротажа."],["Что такое абсолютная проницаемость?","Проницаемость породы при насыщении одной инертной фазой","Проницаемость по нефти при остаточной водонасыщенности","Проницаемость при пластовом давлении и температуре для любых фаз","Сумма фазовых проницаемостей по нефти и воде","Её измеряют обычно по газу или инертной жидкости."],["Что такое эффективная пористость?","Доля пор, участвующих в фильтрации подвижных флюидов","Доля всех пор, включая изолированные","Пористость, измеренная по акустическому каротажу","Доля нефтенасыщенных пор","Связанная вода и микропоры в неё не входят."],["Какой метод определения пористости на керне основан на законе Бойля?","Газоволюметрический","Метод насыщения жидкостью Преображенского","Метод ртутной порометрии","Метод ядерного магнитного резонанса","Определяется объём пор или скелета по изменению давления газа."],["Как обычно связаны пористость и проницаемость в песчаниках?","Положительной, но не строго однозначной зависимостью","Строго функционально по закону Дарси","Обратной зависимостью: выше пористость — ниже проницаемость","Связь есть только в карбонатах","Важен размер пор: при одинаковой пористости проницаемость может отличаться на порядки."],["Термин \"бесконечно действующий пласт\" при проведении ГДИС означает, что:","изменение пластового давления, инициируемое разработкой пласта, не достигло внешних границ пласта (или границ зон дренирования скважины)","забойное давление постоянно","дебит нефти является постоянной величиной","изменение пластового давления, инициируемое разработкой пласта, достигло внешних границ пласта","Пока волна давления не дошла до границ, поведение скважины такое же, как в бесконечном пласте. Это режим радиального притока, по которому определяют проницаемость и скин. После достижения границ начинается граничный режим.","lzs-26"],["Радиус исследования при ГДИС составляет:","десятки-сотни метров","около 10 метров","первые метры","первые сантиметры","ГДИС охватывают зону дренирования вокруг скважины, поэтому радиус обычно составляет десятки и сотни метров и растёт с длительностью исследования. Сантиметры и первые метры — это масштаб керна и малоглубинных методов ГИС.","lzs-27"],["Дайте определение - Градиент - это:","вектор, характеризующий направление в сторону возрастания функции","величина, показывающая изменение давления в данной точке","нет правильного ответа","величина, равная сумме частных производных второго порядка","Градиент — вектор, направленный в сторону наибольшего возрастания функции, а его длина равна скорости этого возрастания. Сумма вторых частных производных — это оператор Лапласа, а не градиент.","lzs-30"],["Остаточная нефтенасыщенность определяется как:","Значение нефтенасыщенности, при котором нефть становится неподвижной фазой","Значение нефтенасыщенности, при котором нефть становится подвижной фазой","Значение нефтенасыщенности, при котором нефть и вода становятся неподвижными фазами","Нет правильных ответов","При снижении до Sor фазовая проницаемость по нефти становится нулевой: оставшаяся нефть удержана капиллярными силами и не течёт, а вода продолжает двигаться.","lzs-50"],["Относительная фазовая проницаемость по нефти изменяется в пределах:","от 0 до 1","от 0.5 до 1","от 0 до 10","от 0 до 0.5","ОФП — это отношение фазовой проницаемости к абсолютной, поэтому она безразмерна. Она равна 0, когда нефть неподвижна, и близка к 1, когда нефть является единственной подвижной фазой.","lzs-51"],["Как зависит проницаемость от диаметра пор?","Примерно пропорционально квадрату","Примерно обратно пропорционально","Обратно пропорционально","Примерно пропорционально кубу","Следует из модели Козени — Кармана."],["Что такое коэффициент анизотропии проницаемости?","Отношение вертикальной проницаемости к горизонтальной","Заполнение пор минералами с ухудшением свойств","Отношение газовой проницаемости к жидкостной","Отношение эффективной толщины к общей толщине пласта","Часто kv/kh менее 0,1 в слоистых песчаниках."],["Почему проницаемость образца при пластовых условиях ниже, чем при атмосферных?","Эффективное напряжение сжимает поры","Пластовая температура меняет вязкость воздуха","Керн высыхает при подъёме","В пласте нет насыщающих жидкостей","Поэтому измерения проводят с обжимом."],["Что такое сжимаемость порового пространства?","Изменение объёма пор на единицу давления","Изменение вязкости с давлением","Изменение плотности нефти с температурой","Изменение толщины пласта по площади","Она входит в упругий запас залежи."],["Что такое диагенетическая цементация с позиции ФЕС?","Заполнение пор минералами с ухудшением свойств","Создание вторичной пористости при растворении","Рост проницаемости при уплотнении","Появление трещин отрыва","Цемент уменьшает пористость и сужает горла пор."]]},{"name":"Смачиваемость и капиллярность","q":[["Что характеризует смачиваемость?","Предпочтение твёрдой поверхности контактировать с одной из фаз","Соотношение подвижностей воды и нефти","Способность породы впитывать бурый раствор под давлением","Межфазное натяжение между нефтью и водой","Смачиваемость определяет распределение флюидов в порах, ОФП и эффективность вытеснения."],["Что такое капиллярное давление?","Разность давлений между несмачивающей и смачивающей фазами","Разность давлений между кровлей и подошвой пласта","Проницаемость породы при насыщении одной инертной фазой","Разность давлений фаз на контакте и в скважине","Именно оно определяет переходную зону и удержание воды в мелких порах."],["Что такое остаточная (связанная) водонасыщенность?","Вода, которая удерживается в порах и не вытесняется при притоке нефти","Вода, оставшаяся после заводнения в промытой зоне","Вода подошвенной части, поступающая к забою при образовании конуса","Вода, оставшаяся в порах после вытеснения нефти при заводнении пласта","Она занимает часть порового объёма, поэтому её учитывают при расчёте запасов."],["Для чего используют J-функцию Леверетта?","Для приведения капиллярных кривых образцов разной пористости и проницаемости к одному виду","Для пересчёта лабораторных ОФП с образца на ячейку модели с другой толщиной","Для определения смачиваемости по результатам капилляриметрии образцов керна","Для приведения проницаемости по газу к проницаемости по жидкости","J-функция позволяет обобщать данные по керну и строить насыщенность по высоте над контактом."],["Чему равна сумма ОФП нефти и воды в двухфазном потоке?","Обычно меньше единицы","Строго единице при любом насыщении","Больше единицы в гидрофильных породах","Единице только при остаточной водонасыщенности","Фазы мешают друг другу, поэтому сумма относительных проницаемостей меньше единицы."],["Какому краевому углу соответствует гидрофильная поверхность?","Менее 90°, если угол измерен через воду","Более 120°, если угол измерен через воду","Около 90°, если угол измерен через нефть","Менее 90°, если угол измерен через нефть","Малый угол через воду означает, что вода растекается по породе и является смачивающей фазой."],["Что такое насыщенность породы?","Доля порового объёма, занятая данным флюидом","Отношение массы флюида к массе скелета","Доля пор, участвующих в фильтрации подвижных флюидов","Доля объёма сообщающихся пор в объёме породы","Сумма насыщенностей воды, нефти и газа равна единице."],["Что такое переходная зона в залежи?","Интервал изменения насыщенности над уровнем свободной воды","Интервал между кровлей и подошвой покрышки","Интервал между кровлей коллектора и подошвой покрышки","Интервал вокруг скважины, занятый фильтратом","Высота зоны тем больше, чем меньше проницаемость породы."],["Какой метод измерения смачиваемости считается стандартным лабораторным?","Метод Аммотта","Метод Закса-Бютнера","Метод центрифуги Закса","Метод Хасслера-Бруннера","Он основан на сравнении самопроизвольной и принудительной пропитки."],["Что такое уровень свободной воды (УСВ)?","Отметка, где капиллярное давление равно нулю","Положение ВНК по данным каротажа","Подошва переходной зоны с максимальным капиллярным давлением","Статический уровень в законсервированной скважине","ВНК лежит выше УСВ на высоту, соответствующую пороговому давлению."],["Как определить смачиваемость по углу контакта?","Угол менее 90° по воде означает гидрофильность","Угол более 90° по воде означает гидрофильность","Угол не зависит от смачиваемости","Угол определяет только вязкость","Угол измеряется через более плотную фазу."],["Какой метод определения смачиваемости использует самопроизвольное впитывание?","Метод Амотта","Метод Закса","Метод Дина — Старка","Метод пиролиза","Также известен индекс USBM по капиллярным кривым."],["Что отражает функция Леверетта J?","Обобщение капиллярных кривых с учётом φ и k","Обводнённость скважины как функция времени","Падение давления вдоль ствола с учётом φ и k","Отношение вязкостей нефти и воды","Помогает переносить данные с образца на пласт."],["Как выглядит остаточная нефть в гидрофильном коллекторе?","В виде изолированных капель в центре пор","В виде плёнки на поверхности зёрен","В виде сплошных фаз в мелких порах","В виде парафиновых отложений","Вода идёт по стенкам, нефть защемляется."],["Как влияет снижение межфазного натяжения на остаточную нефть?","Позволяет сдвинуть защемлённые капли","Повышает капиллярные силы","Увеличивает вязкость нефти","Снижает проницаемость для воды","Отсюда работа ПАВ при малых капиллярных числах."]]},{"name":"Свойства пластовых флюидов","q":[["Что показывает коэффициент сжимаемости нефти?","Относительное изменение объёма при изменении давления","Изменение вязкости при изменении давления","Относительное изменение плотности при растворении газа","Относительное изменение вязкости при изменении температуры","Сжимаемость определяет запас упругой энергии выше давления насыщения."],["Каково обычно значение объёмного коэффициента нефти?","Больше единицы","Меньше единицы","Равно единице выше давления насыщения","Равно плотности нефти","В пласте в нефти растворён газ, поэтому её объём больше объёма дегазированной нефти."],["Что такое газосодержание нефти?","Объём газа, растворённого в единице объёма дегазированной нефти","Объём свободного газа в единице порового объёма","Отношение добытого газа к добытой нефти за всю историю","Массовая доля метана в нефтяной смеси","Газосодержание влияет на плотность, вязкость и давление насыщения нефти."],["Как вязкость нефти меняется с ростом температуры?","Снижается","Не меняется до температуры начала кристаллизации парафина","Сначала растёт, потом снижается","Растёт из-за выделения газа","Поэтому тепловые методы эффективны для высоковязких нефтей."],["Что такое PVT-исследования?","Исследования зависимости свойств флюидов от давления, объёма и температуры","Исследования фазовых проницаемостей и капиллярного давления на керне","Исследования проницаемости при разных температурах","Исследования зависимости давления, вязкости и температуры в стволе","На основе PVT рассчитывают запасы и поведение пласта."],["Как изменяется вязкость нефти ниже давления насыщения при снижении давления?","Растёт из-за выделения газа","Снижается из-за расширения жидкости","Не меняется, так как нефть уже насыщена","Снижается, так как нефть теряет тяжёлые компоненты","Растворённый газ разжижает нефть, а его потеря делает её вязче."],["Что характеризует коэффициент сверхсжимаемости Z?","Отклонение реального газа от идеального","Отношение объёма газа в пласте к объёму на поверхности","Способность газа растворяться в нефти","Изменение вязкости газа с давлением","Уравнение состояния: PV = ZnRT."],["Что такое конденсатогазовый фактор?","Количество конденсата на единицу объёма газа","Отношение добытого газа к добытому конденсату за год","Отношение давления начала конденсации к пластовому","Доля тяжёлых фракций в нефти","Он характеризует содержание жидких углеводородов в газе."],["Какова типичная вязкость пластовой воды?","Около 0,3–1 мПа·с","Около 5–10 мПа·с","Около 20–50 мПа·с","Около 0,01–0,03 мПа·с","Вода маловязкая, её вязкость снижается с ростом температуры."],["Явление ретроградной конденсации - это","переход газовой фазы в жидкую при падении давления ниже точки росы и постоянной температуре в пределах критической и крикодентермы","переход жидкой фазы в газовую при падении давления ниже точки росы и постоянной температуре в пределах критической и крикодентермы","переход газовой фазы в жидкую при падении давления ниже точки росы","переход газовой фазы в жидкую при падении температуры","«Ретроградная» значит обратная: обычно при снижении давления жидкость испаряется, а здесь газ конденсируется. Эффект проявляется при температуре между критической точкой и крикондентермой. Третий вариант неполон — без условия по температуре это не ретроградный процесс.","lzs-17"],["Объемный коэффициент газа определяется как:","Объем газа в пластовых условиях, необходимый для производства одного кубического метра газа в стандартных условиях","Масса газа в пластовых условиях, необходимая для производства одного кубического метра газа в стандартных условиях","Количество газа в пластовых условиях, необходимое для производства одного кубического метра газа в стандартных условиях","Объем газа в стандартных условиях, необходимый для производства одного кубического метра газа в пластовых условиях","Bg = Vпл / Vст: это отношение объёмов, а не масс, и пластовый объём стоит в числителе. Поскольку газ в пласте сжат, Bg намного меньше единицы.","lzs-18"],["Давление насыщения определяется как давление, при котором:","начинается выделение газа из нефти","плотность нефти уменьшается","вязкость нефти уменьшается","происходит выпадение асфальтенов","Давление насыщения — максимальное давление, при котором из нефти при данной температуре выделяется первый пузырёк растворённого газа. Выше него нефть однофазна, ниже него появляется свободный газ.","lzs-19"],["Как ведёт себя вязкость нефти при Р > Рнас при снижении давления?","Слегка снижается","Резко растёт","Остаётся постоянной строго","Зависит только от температуры","Ниже Рнас при выделении газа вязкость начинает расти."],["Что такое газоконденсатный фактор?","Отношение объёма газа к объёму конденсата","Отношение плотности газа к воздуху","Заполнение пор минералами с ухудшением свойств","Изменение объёма пор на единицу давления","Обычно выражается в м³/м³ или г/м³ по конденсату."],["Что показывает Z-фактор газа?","Отклонение реального газа от идеального","Содержание тяжёлых компонентов","Отношение молярной массы газа к массе воздуха","Отношение плотности газа к плотности воздуха","PV = ZnRT."],["Какие воды наиболее агрессивны к обычному портландцементу?","Сульфатная","Пресная гидрокарбонатная","Кальциевая","Хлоридно-натриевая низкой минерализации","Сульфаты разрушают цементный камень."]]},{"name":"Механические свойства пород","q":[["Дайте определение коэффициента Пуассона - это?","Соотношение относительных поперечных и продольных деформаций","Относительное удлинение образца при растяжении","Коэффициент, характеризующий сдвиг при касательном напряжении","Относительное изменение поперечных размеров образца при растяжении","ν = −εпоперечн / εпродольн. Это отношение двух деформаций; для большинства пород оно составляет 0,1–0,4. Последний вариант называет лишь поперечную деформацию без сравнения с продольной.","lzs-65"],["Модуль упругости - это:","напряжение при относительной деформации, равной 1","сила, приходящаяся на единицу площади","напряжение при относительной деформации, равной 0.5","напряжение при относительной деформации, равной 0.75","По закону Гука σ = E·ε. Если подставить ε = 1, то σ = E: это физический смысл модуля. Сила на единицу площади — определение напряжения, а не модуля.","lzs-66"],["Что понимается под хрупкой деформацией горной породы?","Порода разрушается по трещинам дробления, субперпендикулярным наименьшему главному напряжению","Порода разрушается путем образования трещин скола","Порода \"течет\", т.к. деформация распределена равномерно","Порода не изменяется визуально","При хрупкой деформации порода разрушается без заметной пластической деформации, образуя трещины отрыва перпендикулярно наименьшему главному напряжению. «Течение» — это пластическая деформация.","lzs-81"]]},{"name":"Практические ситуации","q":[["Почему проницаемость керна по газу выше, чем по жидкости?","Из-за проскальзывания молекул газа у стенок пор","Из-за низкой плотности газа и турбулентности в порах","Из-за растворения цемента сухим газом","Из-за более высокой вязкости газа по сравнению с нефтью","Это эффект Клинкенберга, поэтому вводят поправку к жидкостной проницаемости."],["В гидрофильном коллекторе вода при заводнении обычно:","Занимает мелкие поры и вытесняет нефть капиллярной пропиткой","Движется только по крупным порам, оставляя нефть в мелких","Покрывает зёрна плёнкой нефти и не вытесняет её капиллярно","Занимает всё поровое пространство только после прорыва","Смачивающая фаза движется по стенкам и мелким порам, а нефть остаётся в центре крупных пор."],["Выше давления насыщения приток к скважине обеспечивается в основном:","Упругим расширением флюидов и породы или напором воды","Расширением выделившегося из нефти газа","Расширением газовой шапки и гравитационным стеканием нефти","Расширением выделившегося из нефти свободного газа и его подвижностью","Свободного газа выше Рнас нет, поэтому работает упругий запас или внешний напор."],["Что произойдёт с дебитом нефти, если забойное давление снизить ниже давления насыщения вокруг скважины?","Прирост замедлится из-за появления газа и снижения ОФП по нефти","Дебит будет расти строго пропорционально депрессии","Дебит упадёт до нуля при первых пузырьках газа","Дебит вырастет быстрее, так как вязкость нефти снизится","Свободный газ занимает поровое пространство, индикаторная линия изгибается."]]}],"color":"#16A5C4"},{"id":"lift","name":"Механические способы эксплуатации скважин","subs":[{"name":"УЭЦН","q":[["Что входит в состав погружной части УЭЦН?","Насос, газосепаратор, гидрозащита и электродвигатель","Плунжер, цилиндр, клапаны и якорь","Насос, станция управления, кабель и трансформатор","Статор, ротор и клапан-отсекатель","Двигатель вращает вал секций насоса. Гидрозащита предохраняет двигатель от пластовой жидкости, а сепаратор отводит газ."],["Для чего применяется частотный преобразователь с УЭЦН?","Для регулирования частоты вращения и подачи насоса","Для защиты кабеля от пробоя изоляции","Для компенсации реактивной мощности в сети","Для повышения напряжения на вводе трансформатора","Изменение частоты позволяет подобрать режим под приток и плавно запускать насос, уменьшая нагрузки."],["Что происходит при большом содержании свободного газа на приёме ЭЦН?","Падает напор, возможен срыв подачи","Растёт ток двигателя из-за увеличения подачи","Снижается вязкость и растёт напор насоса","Насос работает с повышенной подачей","Газ заполняет каналы рабочих колёс, поэтому применяют газосепараторы, диспергаторы или увеличивают глубину спуска."],["Что контролирует погружная телеметрия ТМС?","Давление на приёме, температуру и вибрацию погружного агрегата","Подачу насоса, напряжение сети и вязкость продукции на приёме","Обводнённость, плотность и газовый фактор продукции на устье скважины","Сопротивление изоляции станции управления","По этим данным защищают ЭЦН от перегрева и срыва подачи и оптимизируют режим скважины."],["Что означает маркировка ЭЦН5-125-1300?","Габарит 5, подача 125 м³/сут, напор 1300 м","Габарит 5, напор 125 м, подача 1300 м³/сут","Подача 5 м³/ч, напор 125 м, глубина спуска 1300 м","Габарит 5, мощность 125 кВт, напор 1300 м","Подача и напор указаны в номинальной точке. Насос подбирают так, чтобы рабочая точка находилась в рекомендуемой зоне."],["Что такое напорная характеристика ЭЦН?","Зависимость напора от подачи","Зависимость мощности от частоты вращения","Зависимость давления на приёме от дебита","Зависимость КПД от напряжения","С ростом подачи напор снижается, а рабочая точка должна быть в зоне высокого КПД."],["Почему нельзя допускать работу ЭЦН без притока?","Двигатель перегреется без охлаждения жидкостью","Снижается давление на приёме и растёт дебит","Рабочие колёса начинают вращаться в обратную сторону","Срабатывает обратный клапан и закрывает НКТ","ПЭД охлаждается потоком жидкости, поэтому при срыве подачи срабатывает защита."],["Что такое кабельная линия УЭЦН?","Подача электроэнергии с поверхности к двигателю","Передача сигнала обратной связи на станцию управления","Подвеска насоса в скважине","Контроль сопротивления изоляции НКТ","Кабель — один из частых элементов отказа, поэтому его контролируют при каждом спуске."],["Что происходит при неправильном направлении вращения ЭЦН?","Подача резко снижается","Двигатель сразу останавливается по защите от недогруза","Растёт напор, но падает КПД","Срабатывает обратный клапан","Правильное вращение проверяют при запуске сравнением подачи и давления."]]},{"name":"УШГН","q":[["Какую функцию выполняет станок-качалка?","Преобразует вращение электродвигателя в возвратно-поступательное движение штанг","Повышает давление на приёме насоса за счёт уравновешивания грузов","Создаёт вращение колонны штанг на устье для привода винтового насоса","Уравновешивает гидростатику столба жидкости в НКТ","Кривошипно-шатунный механизм и балансир передают движение колонне штанг, приводящей плунжер насоса."],["Что такое коэффициент подачи штангового насоса?","Отношение фактической подачи к теоретической","Отношение объёма цилиндра к объёму вредного пространства","Отношение длины хода плунжера к длине хода штока","Отношение давления на выкиде к давлению на приёме","На подачу влияют газ, утечки и деформация штанг, поэтому коэффициент обычно меньше единицы."],["Что такое динамический уровень?","Уровень жидкости в затрубье работающей скважины","Уровень жидкости в затрубье остановленной скважины","Высота столба жидкости над приёмом насоса","Уровень жидкости в НКТ работающей скважины","В простаивающей скважине определяют статический уровень. Разница между ними связана с депрессией на пласт."],["Каким прибором определяют уровень жидкости в затрубье?","Эхолотом","Дебитомером","Глубинным манометром на проволоке","Динамографом","Звуковой импульс отражается от поверхности жидкости, и по времени прихода рассчитывается глубина уровня."],["Что показывает динамограмма штанговой установки?","Зависимость нагрузки на полированный шток от его перемещения","Зависимость давления на приёме от времени","Зависимость давления на приёме от времени работы насоса","Зависимость вибрации станка от числа качаний в минуту","Форма карты позволяет диагностировать утечки, газ, неполное заполнение насоса и обрыв штанг."],["Для чего предназначен газовый якорь?","Для отделения свободного газа перед входом в насос","Для удержания НКТ от смещения при работе насоса","Для дополнительного растворения газа в нефти","Для сжатия газа перед входом в насос","Якорь уменьшает количество газа на приёме, повышая коэффициент наполнения насоса."],["Что входит в штанговый насос?","Цилиндр, плунжер и клапаны","Рабочие колёса и направляющие аппараты","Винт и обойма из эластомера","Сопло, камера смешения и диффузор","Движение плунжера открывает всасывающий и нагнетательный клапаны."],["Какие причины снижают подачу ШГН?","Газ в насосе, утечки и деформация штанг","Низкая плотность отбираемой жидкости","Большое погружение насоса под уровень","Увеличение диаметра плунжера","Все они снижают коэффициент подачи по сравнению с теоретическим."],["Что такое длина хода и число качаний?","Параметры режима работы штангового насоса","Параметры газлифтного клапана","Параметры подбора электродвигателя ЭЦН","Параметры скважинной диаграммы притока","Теоретическая подача пропорциональна площади плунжера, ходу и числу качаний."],["Для чего нужен противовес станка-качалки?","Для уравновешивания нагрузки на двигатель","Для увеличения длины хода точки подвеса","Для снижения веса колонны штанг в жидкости","Для компенсации растяжения штанг","Хорошая балансировка снижает пики тока и затраты на энергию."],["Какая проблема характерна для УШГН в искривлённых скважинах?","Истирание штанг и НКТ","Кавитация на приёме из-за низкой вязкости","Перегрев погружного двигателя","Срыв подачи из-за забивания рабочих колёс","Трение на участках набора кривизны ускоряет износ и обрывы."]]},{"name":"Другие способы и продуктивность","q":[["За счёт чего работает газлифт?","За счёт снижения плотности столба жидкости закачанным газом","За счёт энергии рабочей жидкости, подаваемой с поверхности","За счёт энергии сжатого газа, толкающего поршень","За счёт нагрева жидкости газом с поверхности","Газ разгазирует жидкость в трубах, забойное давление падает и пласт отдаёт больше жидкости."],["В каких условиях особенно эффективны винтовые насосы?","При добыче вязкой нефти и жидкости с механическими примесями","При высоком газовом факторе и больших глубинах","При большом дебите маловязкой жидкости","В скважинах с очень большой глубиной спуска и высокой температурой","Винтовая пара создаёт объёмную подачу без резких ускорений и хорошо работает с вязкими средами."],["Что такое коэффициент продуктивности скважины?","Отношение дебита к депрессии","Отношение дебита к забойному давлению","Отношение депрессии к дебиту","Отношение дебита к пластовому давлению","Он показывает, сколько жидкости даёт скважина на единицу перепада давления, и лежит в основе подбора насоса."],["За счёт чего работает скважинный струйный насос?","За счёт энергии рабочей жидкости, подаваемой с поверхности","За счёт перепада давления на гидромоторе","За счёт снижения плотности столба жидкости закачанным газом","За счёт вращения рабочих колёс от электродвигателя","Струя в сопле создаёт разрежение и подсасывает пластовую жидкость. В насосе нет движущихся частей."],["Что такое фонтанный способ эксплуатации?","Подъём жидкости только за счёт пластовой энергии","Подъём жидкости за счёт газа, закачиваемого с поверхности","Подъём жидкости в период глушения","Подъём за счёт закачки воды в НКТ","Фонтанирование возможно, пока забойное давление превышает давление столба жидкости."],["Что ограничивает эффективность газлифта?","Большие затраты энергии на сжатие газа","Невозможность работы с песком","Низкая надёжность скважинных клапанов при любых дебитах","Необходимость подъёма НКТ для регулировки режима","Газлифт прост, но энергетически менее эффективен при низких давлениях."],["Что характеризует индикаторная диаграмма скважины?","Зависимость дебита от депрессии","Зависимость забойного давления от времени после остановки","Зависимость напора насоса от подачи","Изменение уровня в затрубье со временем","По её наклону определяют коэффициент продуктивности."],["Что такое кривая притока Вогеля?","Зависимость притока от забойного давления при режиме растворённого газа","Зависимость потерь давления в НКТ от дебита при газлифте","Зависимость дебита от времени при падении пластового давления","Падение дебита во времени при постоянной депрессии","Ниже давления насыщения приток нелинеен, и прямая Дарси уже не работает."]]},{"name":"Подбор и диагностика","q":[["Что показывает динамограмма УШГН?","Нагрузку на полированный шток по ходу","Давление на приёме насоса по времени","Вибрацию станка-качалки","Температуру двигателя","Форма карты показывает утечки, газ, заедание."],["Чем опасна высокая доля свободного газа на приёме ЭЦН?","Падением напора и срывом подачи","Ростом вязкости нефти в рабочих колёсах","Перегрузкой двигателя по току","Подъёмом давления на приёме","Применяют сепараторы, диспергаторы, рост давления на приёме."],["Что такое срыв подачи ЭЦН?","Прекращение подачи из-за газа или нехватки притока","Отношение фактической подачи к теоретической","Выход из строя станции управления","Заклинивание вала в первые минуты","На токовой кривой видно падение до холостого хода."],["Как изменяется напор центробежного насоса при снижении частоты?","Пропорционально квадрату частоты","Пропорционально частоте","Пропорционально кубу частоты","Не меняется","Законы подобия: Q ~ n, H ~ n², N ~ n³."],["Какая мощность потребляется насосом при снижении частоты вдвое?","В 8 раз меньше","В 2 раза меньше","В 4 раза меньше","Та же","N пропорциональна кубу частоты."],["Какой привод ЭЦН позволяет плавно менять подачу?","Частотно-регулируемый","Прямой пуск от сети","Ручной шунт","Ступенчатый редуктор","ЧРП меняет частоту вращения вала."],["Что такое коэффициент подачи УШГН?","Отношение фактической подачи к теоретической","Прекращение подачи из-за газа или нехватки притока","Отношение длины хода к длине штанги","Отношение числа качаний к вязкости","Снижается из-за газа, утечек и деформации штанг."],["Что снижает потери хода плунжера?","Применение штанг большего диаметра и якоря","Увеличение глубины спуска","Снижение числа качаний всегда","Использование жидкости с большей плотностью","Удлинение НКТ и штанг уменьшается при их жёсткости."],["Почему в вязких нефтях ЭЦН работают хуже?","Растут потери на трение, падает напор и КПД","Падает частота тока, растёт давление насыщения","Снижается давление насыщения","Вал вращается быстрее, насос перегревается","Применяют винтовые насосы или разбавление."],["Какой насос лучше подходит для вязкой нефти с песком?","Винтовой насос","Газлифт с одной точкой","Плунжерный лифт","Струйный насос без притока","УЭВН хорошо работает с вязкими жидкостями и песком."],["Что такое газлифт?","Подъём жидкости за счёт закачки газа в НКТ","Откачка газа с забоя насосом","Закачка газа в пласт для поддержания давления","Подача газа в сепаратор","Газ снижает плотность столба."],["Что такое рабочий клапан газлифта?","Клапан, через который идёт постоянная закачка газа","Обратный клапан на устье у линии подачи газа","Клапан, срабатывающий только при запуске скважины","Предохранительный клапан сепаратора","Пусковые клапаны работают только при запуске."]]},{"name":"Практические ситуации","q":[["Ток УЭЦН снижен, подача упала, давление на приёме растёт. Наиболее вероятная причина?","Износ насоса, негерметичность НКТ или слом вала","Перегрузка двигателя из-за роста вязкости жидкости","Рост газосодержания на приёме и срыв подачи","Засорение приёмной сетки мехпримесями","Двигатель теряет нагрузку, а жидкость не поднимается, поэтому уровень в затрубье растёт."],["Ток ЭЦН колеблется, давление на приёме низкое, подача пульсирует. Что вероятнее всего?","Срыв подачи из-за газа или недостаточного притока","Рост пластового давления и увеличение притока к насосу","Рост пластового давления на участке","Износ подшипников без потери подачи и падения напора","Газ и низкий уровень дают циклическую работу. Помогают снижение частоты, газосепаратор или заглубление."],["Подбираете способ эксплуатации: 300 м³/сут, низкий газовый фактор, вертикальная скважина. Какой вариант наиболее логичен?","УЭЦН","УШГН с насосом малого диаметра","Плунжерный лифт","Винтовой насос с приводом от штанг","ЭЦН рассчитан на большие подачи. УШГН экономичнее при малых дебитах."],["Дебит 5 м³/сут, вязкая нефть, небольшая глубина. Какой способ обычно выбирают?","УШГН или винтовой насос","УЭЦН с большой подачей и дросселированием","Непрерывный газлифт","Струйный насос с подачей воды с поверхности","На малых дебитах ЭЦН работает вне рабочей зоны и перегревается, а штанговые и винтовые насосы подходят лучше."],["На динамограмме видно резкое падение нагрузки в начале хода вниз и неполное заполнение насоса. О чём это говорит?","О недостаточном притоке или влиянии газа","О заклинивании плунжера в цилиндре","Об обрыве штанг в верхней части колонны","О негерметичности всасывающего клапана","Форма карты показывает заполнение плунжера: при неполном заполнении нагрузка падает с ударом."],["Как в узловом анализе определяют рабочую точку скважины?","По пересечению кривой притока и кривой подъёма","По максимальному значению кривой подъёма","По точке пересечения притока с давлением насыщения","По минимальному забойному давлению на кривой притока","Пересечение показывает дебит, при котором пласт отдаёт столько, сколько скважина может поднять."]]}],"color":"#3A7CE0"},{"id":"workover","name":"Текущий и капитальный ремонт скважин","subs":[{"name":"Текущий ремонт","q":[["Какая работа относится к текущему ремонту скважин?","Смена погружного насоса","Изоляция обводнившегося интервала цементом","Ликвидация негерметичности колонны","Перевод скважины на другой горизонт","ТРС включает работы с подземным оборудованием: смену насосов, НКТ, штанг. Вмешательство в ствол и пласт относится к КРС."],["Какое оборудование используется при спуско-подъёмных операциях в ремонте?","Подъёмный агрегат","Цементировочный агрегат","Паропередвижная установка","Насосный агрегат ЦА-320","Подъёмники на шасси, например серии А-50, поднимают и спускают НКТ и инструмент без стационарной буровой."],["Зачем проводят шаблонирование эксплуатационной колонны?","Чтобы проверить проходимость и внутренний диаметр","Чтобы определить интервалы негерметичности","Чтобы очистить стенки от парафина","Чтобы выявить заколонные перетоки","Шаблон заранее выявляет смятие или посторо
