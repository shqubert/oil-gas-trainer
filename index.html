нние предметы, что снижает риск аварии при спуске оборудования."],["Что показывает межремонтный период (МРП)?","Среднюю продолжительность работы скважины между ремонтами","Среднее время простоя скважины в ожидании ремонта","Срок службы подземного оборудования до списания","Интервал между плановыми осмотрами устья","Рост МРП означает снижение затрат на ремонт и потерь добычи, поэтому показатель постоянно отслеживают."],["Что выполняют при ревизии погружного оборудования?","Подъём, осмотр и при необходимости замену","Опрессовку эксплуатационной колонны под пакером","Перфорацию нового интервала","Замену колонной головки","ТРС часто вызван отказом насоса или низкой подачей."],["Что такое обратная промывка?","Подача жидкости в затрубье с выходом по НКТ","Подача жидкости в НКТ с выходом в затрубье","Промывка с закачкой в пласт без выхода на устье","Циркуляция через боковой клапан в НКТ","Обратная промывка лучше выносит шлам из-за высокой скорости в НКТ."],["Для чего проводят опрессовку НКТ?","Для проверки герметичности под давлением","Для определения приёмистости пласта","Для снятия остаточных напряжений в трубах","Для очистки резьбы от герметика","Негерметичная колонна НКТ снижает подачу и приводит к повторным ремонтам."],["Что такое устьевая арматура?","Оборудование для герметизации и управления потоком на устье","Нижняя часть обсадной колонны с башмаком","Разрушение инструмента или цементного моста вращающимся фрезером","Бурение нового ствола из существующей скважины через окно в колонне","Она направляет продукцию и позволяет проводить замеры и обработки."]]},{"name":"Капитальный ремонт","q":[["Какая работа относится к капитальному ремонту скважин?","Устранение негерметичности эксплуатационной колонны","Замена колонны НКТ на другой диаметр","Промывка забоя и смена глубинного насоса в той же скважине","Замена колонны НКТ на другой типоразмер при смене насоса","КРС восстанавливает работоспособность ствола или воздействует на пласт, а это сложнее и дороже работ с оборудованием."],["Для чего служат метчик и колокол?","Для захвата оставшихся в скважине труб","Для определения формы предмета на забое","Для фрезерования цементного моста","Для нарезания новой резьбы на муфтах НКТ","Это ловильные инструменты: метчик вворачивается внутрь трубы, колокол захватывает её снаружи."],["Что такое РИР?","Ремонтно-изоляционные работы","Работы по интенсификации притока реагентами","Ремонт и испытание резервуаров","Регламентные исследования режима","РИР ограничивают водопритоки, ликвидируют перетоки и негерметичность колонны с помощью тампонажных составов."],["Что такое зарезка бокового ствола (ЗБС)?","Бурение нового ствола из существующей скважины через окно в колонне","Оборудование для герметизации и управления потоком на устье","Разрушение инструмента или цементного моста вращающимся фрезером","Гидропескоструйное вскрытие канала в пласте","ЗБС позволяет вовлечь недренируемые запасы без бурения новой скважины с поверхности."],["Для чего спускают свинцовую печать?","Для определения формы и положения предмета в скважине","Для герметизации интервала негерметичности","Для захвата оставшихся в скважине малых предметов","Для проверки проходимости колонны","Вмятины на мягком свинце показывают форму и положение головы аварийного объекта и помогают подобрать инструмент."],["Как обычно ликвидируют песчаную пробку на забое?","Промывкой скважины","Установкой цементного моста","Закачкой растворителя парафина","Увеличением депрессии на пласт","Песок размывают струёй жидкости и выносят на поверхность, иногда с применением гидробура или желонки."],["Какая работа выполняется при возврате на другой горизонт?","Изоляция текущего пласта и вскрытие другого","Углубление забоя без изоляции пласта","Перевод добывающей скважины под нагнетание","Смена насоса на другой типоразмер","Возврат вводит в разработку запасы другого объекта без бурения новой скважины."],["Что такое фрезерование в скважине?","Разрушение инструмента или цементного моста вращающимся фрезером","Прорезание щелей в колонне гидропескоструйной струёй","Бурение нового ствола из существующей скважины через окно в колонне","Оборудование для герметизации и управления потоком на устье","Фрезером удаляют аварийные объекты, мешающие работам."],["Как определяют интервал негерметичности колонны?","Опрессовкой с пакером и геофизическими методами","По изменению устьевого давления без спуска приборов","Только гамма-каротажем","По замерам обводнённости продукции","Термометрия, резистивиметрия и пошаговая опрессовка точно локализуют дефект."],["Что такое бурение бокового ствола?","Зарезка нового ствола из существующей скважины","Обработка смесью соляной и плавиковой кислот","Расширение ствола в пласте","Спуск хвостовика без зарезки","Повышает отбор из недренированных участков."],["Какое оборудование применяют для ликвидации обрыва НКТ в скважине?","Ловильный инструмент","Роторную управляемую систему","Центратор и скребок","Цементировочный агрегат","Метчики, колокола, труболовки."],["Что делают перед подъёмом НКТ?","Глушат скважину","Запускают насос на частоте 60 Гц","Разгазируют нефть в сепараторе","Закрывают фонтанную арматуру только по затрубу","Давление столба жидкости удерживает пласт."],["Что такое перевод на другой горизонт?","Вскрытие вышележащего или нижележащего пласта","Перемещение куста на новую площадку","Оборудование для герметизации и управления потоком на устье","Осаждение продуктов реакции в порах","Выполняется при исчерпании запасов на текущем интервале."]]},{"name":"Глушение и пакеры","q":[["Для чего выполняется глушение скважины?","Чтобы создать противодавление на пласт и предотвратить приток при ремонте","Чтобы снизить забойное давление и вызвать приток для очистки призабойной зоны","Чтобы разгазировать жидкость в стволе и облегчить подъём подземного оборудования","Чтобы проверить герметичность эксплуатационной колонны","Скважину заполняют жидкостью нужной плотности, чтобы забойное давление превышало пластовое и работы были безопасны."],["Для чего применяют пакер?","Для разобщения интервалов ствола скважины","Для центрирования колонны НКТ в обсадной","Для удержания столба жидкости при подъёме насоса","Для отделения газа на приёме насоса","Пакер герметично перекрывает кольцевое пространство, что важно при закачке, ГРП и изоляции интервалов."],["Почему для глушения стараются применять жидкости без твёрдой фазы?","Чтобы снизить загрязнение призабойной зоны","Чтобы обеспечить большую плотность жидкости","Чтобы снизить коррозию оборудования устья","Чтобы ускорить закачку через НКТ","Твёрдые частицы и несовместимый фильтрат снижают продуктивность, поэтому после ремонта возможны длительный вывод на режим и потери дебита."],["Какая жидкость обычно используется для глушения без твёрдой фазы?","Солевой раствор","Инвертно-эмульсионный раствор с баритом","Пресная вода с бентонитом","Нефть с добавкой мела","Растворы хлоридов дают нужную плотность без частиц, загрязняющих пласт."],["Как рассчитывают плотность жидкости глушения?","Из пластового давления, глубины и запаса противодавления","По забойному давлению работающей скважины и длине НКТ","По давлению насыщения и глубине спуска насоса","По весу колонны в растворе и давлению на устье","ρ = Рпл·(1+запас)/(g·H): давление столба должно превышать пластовое."],["Какая функция у разобщителя или клапана-отсекателя?","Перекрыть скважину при аварийной ситуации","Подать ингибитор в поток","Выравнивать давление между НКТ и затрубьем при подъёме","Удержать НКТ от осевого перемещения","Такие устройства снижают риск неконтролируемого выброса."]]},{"name":"Интенсификация притока","q":[["Какую кислоту обычно применяют для обработки карбонатного коллектора?","Соляную","Плавиковую","Смесь соляной и плавиковой (глинокислоту)","Сульфаминовую концентрированную","HCl растворяет кальцит и доломит, создавая каналы. Для терригенных коллекторов используют также глинокислоту."],["Для чего при ГРП закачивают проппант?","Чтобы удержать трещину открытой после снятия давления","Для растворения карбонатного цемента вдоль трещины","Для снижения потерь жидкости разрыва на трение","Для продолжения развития трещины по длине","Без проппанта трещина смыкается. Прочная упаковка песка или керамики создаёт канал высокой проводимости."],["Что такое глинокислотная обработка?","Обработка смесью соляной и плавиковой кислот","Обработка смесью соляной и уксусной кислот","Закачка глинистой суспензии для снижения приёмистости","Обработка серной кислотой для растворения глин","Смесь растворяет глинистые частицы и кварц в песчаниках."],["Для чего применяют ингибитор коррозии при кислотной обработке?","Для защиты труб от действия кислоты","Для замедления реакции кислоты с породой в глубине пласта","Для предотвращения вторичного осадкообразования железа","Для снижения поверхностного натяжения на границе с нефтью","Кислота разъедает металл, поэтому без ингибитора трубы сильно повреждаются."],["В каком случае ГРП наиболее эффективен?","В низкопроницаемых коллекторах с достаточными запасами","В высокопроницаемых пластах с положительным скином","В пластах с близким обводнённым пропластком без барьера","В истощённых пластах с малыми остаточными запасами","Трещина увеличивает зону дренирования, а близость воды создаёт риск обводнения."],["Что закачивают в песчаники для растворения глинистых частиц?","Смесь соляной и плавиковой кислоты","Только соляную кислоту 15 %","Щёлочь с добавкой хлорида калия","Уксусную кислоту с добавкой ПАВ","Плавиковая кислота растворяет силикаты, глинокислота применяется в терригенных пластах."],["Какая кислота традиционно применяется в карбонатах?","Соляная","Плавиковая","Серная","Лимонная","HCl растворяет кальцит и доломит."],["Что такое эффект вторичного выпадения при кислотной обработке?","Осаждение продуктов реакции в порах","Рост прочности цементного кольца","Вскрытие вышележащего или нижележащего пласта","Вынос кислоты в сепаратор","Поэтому вводят стабилизаторы железа и другие добавки."],["Что такое проппант?","Расклинивающий материал, удерживающий трещину открытой","Гелеобразующая жидкость разрыва","Гелеобразующая жидкость, создающая и развивающая трещину","Брейкер, снижающий вязкость геля после закрытия трещины","Песок или керамические гранулы."],["Что характеризует проводимость трещины ГРП?","Произведение проницаемости проппанта на ширину","Длина трещины, делённая на вязкость","Длина трещины, делённая на вязкость геля","Отношение давления разрыва к глубине кровли","Обозначается FCD после нормировки."],["Что показывает мини-ГРП?","Давление смыкания и утечки","Глубину залегания кровли","Плотность проппанта","Вязкость нефти","На его основе настраивается основной дизайн."],["В каких случаях ГРП нецелесообразен?","Рядом водоносная зона без барьера","Низкопроницаемый коллектор с запасами","Хорошая изоляция над и под пластом","Новая скважина в низкопроницаемом пласте","Трещина может войти в водонасыщенный пласт."],["Что называют повторным ГРП (рефрак)?","Новый разрыв на скважине с падающим дебитом","Опрессовка трещины водой","Вскрытие нового пласта перфорацией на депрессии","Опрессовка старой трещины водой без проппанта","Может вовлекать недренированные зоны."]]},{"name":"Практические ситуации","q":[["После ремонта с глушением дебит скважины вырос медленно и не вышел на прежний. Вероятная причина?","Загрязнение призабойной зоны жидкостью глушения","Рост пластового давления из-за остановки скважины","Снижение обводнённости после ремонта","Рост давления насыщения в призабойной зоне","Фильтрат и твёрдая фаза снижают проницаемость вблизи ствола, поэтому дебит падает."],["Как определить, откуда пришла вода в обводнившуюся скважину?","Сравнить состав воды, данные ПГИ и историю соседних нагнетательных скважин","Определить плотность воды и сравнить с пластовой без других данных","Сравнить с обводнённостью соседней скважины по кусту","Определить по росту газового фактора и депрессии","Разные источники дают разный состав и профиль притока: закачка, подошвенная вода, заколонный переток."],["По результатам ПГИ вода идёт из нижних перфорационных отверстий, а нефть из верхних. Какое мероприятие логично?","Изолировать нижний интервал","Провести кислотную обработку всего интервала","Перфорировать интервал ниже текущего забоя","Повысить депрессию для притока из верхнего интервала","Изоляция снижает приток воды. Кислота без отклонителя пойдёт в обводнённый интервал."],["Почему после кислотной обработки продукт реакции важно быстро извлечь из пласта?","Отработанная кислота и осадки могут снизить проницаемость","Отработанная кислота снижает пластовую температуру","Остаточная кислота вызывает рост вязкости нефти в пласте","Иначе растёт давление гидроразрыва в призабойной зоне","Соединения железа и продукты реакции выпадают в осадок и закупоривают поры."]]}],"color":"#D1495B"},{"id":"gather","name":"Сбор и подготовка скважинной продукции","subs":[{"name":"Сбор и замер","q":[["Для чего служит дожимная насосная станция (ДНС)?","Для сепарации и дальнейшей перекачки продукции при недостатке пластовой энергии","Для поддержания пластового давления закачкой воды","Для транспортировки продукции от скважины к замерной установке","Для удаления лёгких фракций и снижения давления насыщенных паров","ДНС повышает давление жидкости и подаёт её на следующую ступень, а газ отводится отдельно."],["В чём преимущество герметизированной системы сбора?","Снижаются потери лёгких фракций и выбросы","Не требуются дожимные насосные станции","Снижается вязкость эмульсий","Можно обойтись без подготовки нефти","Контакт с атмосферой исключён, поэтому лёгкие углеводороды не испаряются и экологическая нагрузка ниже."],["Для чего предназначена групповая замерная установка типа «Спутник»?","Для поочерёдного замера дебита скважин куста","Для отделения воды перед сбросом на КНС","Для распределения ингибитора по скважинам","Для распределения закачиваемой воды","Замерные установки собирают продукцию нескольких скважин и поочерёдно измеряют каждую."],["Какая система служит для коммерческого учёта нефти?","СИКН — система измерений количества и показателей качества нефти","СИКН — система контроля насосов на дожимной насосной станции","Система измерений на ДНС по одному сепаратору","ОЗНА — автоматизированная установка группового замера на кусте","СИКН измеряет количество и качество нефти при передаче, поэтому на её данных основаны расчёты между сторонами."],["Что такое АГЗУ?","Автоматизированная групповая замерная установка","Автоматическая газоотводная запорная установка","Агрегат газлифтной закачки уровня","Аварийная группа защитных устройств","АГЗУ поочерёдно подключает скважины к замерному сепаратору."],["Для чего служат выкидные линии?","Для транспортировки продукции от скважины к замерной установке","Для поочерёдного замера дебита скважин куста","Для сепарации и дальнейшей перекачки продукции при недостатке пластовой энергии","Для подачи воды к нагнетательным скважинам","Выкидные линии соединяют скважины с системой сбора."],["Какое явление называется пульсацией в промысловом трубопроводе?","Неравномерный снарядный поток жидкости и газа","Периодическое изменение напряжения на станции управления","Волна гидроудара при резком закрытии задвижки","Образование стойких эмульсий на участке подъёма","Снарядный режим создаёт колебания давления и нагрузки на сепараторы."],["Какая проблема возникает при транспортировке высокопарафинистой нефти?","Отложения парафина и рост вязкости при охлаждении","Выпадение солей жёсткости в трубопроводе","Рост содержания сероводорода","Образование гидратов при плюсовой температуре","Применяют подогрев, ингибиторы и очистку скребками."]]},{"name":"Подготовка нефти","q":[["Какая главная задача сепарации?","Разделение продукции на нефть, газ и воду","Снижение содержания солей до товарной нормы","Разрушение стойких эмульсий","Стабилизация нефти по давлению паров","Сепарация проводится ступенчато при снижении давления, чтобы сохранить лёгкие фракции."],["Что делают на установке подготовки нефти (УПН)?","Обезвоживают, обессоливают и стабилизируют нефть","Только замеряют дебит и отделяют свободный газ","Получают бензин и дизельное топливо","Закачивают воду в нагнетательные скважины","Цель — довести сырьё до требований к товарной нефти перед сдачей в трубопровод."],["Для чего применяют деэмульгаторы?","Для разрушения водонефтяных эмульсий","Для снижения вязкости парафинистой нефти","Для предотвращения солеотложения","Для подавления сульфатвосстанавливающих бактерий","ПАВ-деэмульгатор разрушает защитные оболочки глобул, поэтому вода быстрее слипается и осаждается."],["Как обычно удаляют соли при подготовке нефти?","Промывкой пресной водой с последующим отделением","Отстоем в резервуаре с подогревом без промывки","Ректификацией при высокой температуре","Ректификацией при атмосферном давлении на УПН","Соли растворены в капельках воды, поэтому после смешения с пресной водой их отделяют вместе с водой."],["Какой стандарт устанавливает требования к нефти для поставки в РФ?","ГОСТ Р 51858","ГОСТ 2477","ГОСТ 1510","ГОСТ 3900","Стандарт определяет группы и классы нефти по содержанию воды, солей, серы и по плотности."],["Какой тип эмульсии обычно образуется при добыче?","Вода в нефти","Нефть в воде","Множественная вода-нефть-вода как основной тип","Газ в нефти","Капли воды диспергированы в нефти и стабилизированы природными эмульгаторами: смолами и асфальтенами."],["Для чего проводят стабилизацию нефти?","Для удаления лёгких фракций и снижения давления насыщенных паров","Для сепарации и дальнейшей перекачки продукции при недостатке пластовой энергии","Для транспортировки продукции от скважины к замерной установке","Для улучшения вязкостно-температурных свойств","Стабильная нефть меньше теряет при хранении и транспорте и безопаснее."],["Что такое ступенчатая сепарация?","Несколько последовательных сепараторов со снижением давления","Последовательная подача нефти через резервуары","Сепарация при постоянном давлении в нескольких аппаратах","Подогрев нефти на разных участках","Постепенное снижение давления сохраняет больше лёгких компонентов в нефти."],["Что такое электродегидратор?","Аппарат разрушения эмульсии в электрическом поле","Аппарат термохимического разрушения эмульсии без поля","Аппарат осушки газа в электрическом поле","Сепаратор с электроподогревом","Поле поляризует капли воды, которые сливаются и оседают."],["Как влияет подогрев на разрушение эмульсии?","Ускоряет за счёт снижения вязкости нефти","Замедляет, так как капли воды становятся мельче","Не влияет, если применён деэмульгатор","Ускоряет только для эмульсий нефти в воде","При нагреве капли воды быстрее осаждаются."],["Что означает ДНП для нефти?","Давление насыщенных паров","Дифференциальное нефтяное давление","Давление начала парафинизации","Давление на приёме дожимного насоса","ДНП ограничивают, чтобы снизить потери и обеспечить безопасность перекачки."],["Что разрушает водонефтяную эмульсию на установке?","Деэмульгаторы, нагрев и отстой","Высокое давление без нагрева","Интенсивное перемешивание","Добавка пластовой воды","Нагрев снижает вязкость, деэмульгаторы разрушают бронирующие оболочки."],["Для чего нужна электродегидраторная секция?","Слияние капель воды в электрическом поле","Нагрев нефти за счёт тока в сети","Отделение лёгких фракций в поле","Разделение газа и конденсата","Поле ускоряет коалесценцию."],["Что контролирует стабилизация нефти?","Давление насыщенных паров","Содержание воды","Содержание хлоридов","Плотность воды","Удаляются лёгкие фракции, снижается давление паров."],["Какая группа качества нефти по ГОСТ зависит от воды и солей?","Группа подготовки","Класс серы","Тип плотности","Вид сероводорода","Кроме неё нормируются сера, плотность, сероводород."],["Что такое обессоливание?","Удаление солей промывкой пресной водой","Охлаждение газа для выделения влаги и конденсата","Снижение серы гидроочисткой","Удаление газа сепарацией","Соль вызывает коррозию на НПЗ."]]},{"name":"Вода и газ","q":[["Где подготавливают и нагнетают воду для ППД?","На кустовых насосных станциях (КНС)","На дожимных насосных станциях (ДНС)","На установках подготовки газа (УКПГ)","На блочных кустовых установках дозирования","КНС повышают давление воды и распределяют её по нагнетательным скважинам."],["Для чего проводят осушку природного газа?","Чтобы снизить точку росы и предотвратить гидраты и конденсацию воды","Чтобы выделить гелий и этан, а также повысить теплоту сгорания перед транспортом","Чтобы снизить содержание сернистых соединений","Чтобы снизить содержание сероводорода и углекислого газа до нормы ГОСТ","Водяные пары при охлаждении конденсируются и образуют гидраты, которые могут закупорить трубопровод."],["Какой реагент чаще всего применяют против гидратов?","Метанол","Хлорид кальция в воде","Диэтаноламин","Этиленгликоль только в виде твёрдого осушителя","Метанол снижает температуру гидратообразования. Также применяют гликоли."],["Какой целевой уровень полезного использования попутного нефтяного газа установлен в РФ?","95 %","80 %","75 %","90 %","Норма введена для снижения сжигания ПНГ на факелах, а сверхнормативное сжигание ведёт к штрафным платежам."],["Какие показатели контролируют в воде для ППД?","Содержание нефти и механических примесей","Температуру и окраску воды","Содержание растворённого метана","Индекс вязкости и плотность нефти в воде","Частицы и нефть забивают поры, снижая приёмистость нагнетательных скважин."],["Что такое отстойник в подготовке воды?","Ёмкость для разделения воды и нефти гравитацией","Аппарат для фильтрации воды через песок","Ёмкость для смешения реагентов","Аппарат для флотации нефти","Капли нефти всплывают, а твёрдые частицы оседают."],["Какая проблема связана с закачкой несовместимых вод?","Отложение солей в пласте и оборудовании","Рост вязкости пластовой нефти","Снижение межфазного натяжения","Растворение карбонатного цемента коллектора","Смешение вод с разным составом вызывает выпадение барита и кальцита."],["Какая установка готовит природный газ на промысле?","УКПГ","УПН","БКНС","ЦПС нефти","Установка комплексной подготовки газа осушает его и выделяет конденсат."],["Какой процесс применяют для удаления сероводорода из газа?","Аминовую очистку","Низкотемпературную сепарацию","Метанольную осушку","Ректификацию газового конденсата","Амины поглощают кислые компоненты, после чего регенерируются."],["Что вызывает необходимость подготовки подтоварной воды?","Нефть и мехпримеси засоряют пласт при закачке","Вода нужна для бытовых целей","Иначе вода не течёт по трубам","Вода разрушает НКТ только при дожиме","Качество воды влияет на приёмистость."],["Что такое каплеуловитель в газовой обвязке?","Аппарат для отделения жидкости из газа","Насос для откачки конденсата","Аппарат разрушения эмульсии в электрическом поле","Трубка для отбора проб","Защищает компрессоры и горелки."],["Что такое точка росы газа?","Температура начала конденсации","Давление начала выделения газа","Температура самовоспламенения","Максимальное давление в газопроводе","Нормируется при подготовке к транспорту."],["Что такое низкотемпературная сепарация?","Охлаждение газа для выделения влаги и конденсата","Нагрев газа перед компрессором для защиты от гидратов","Удаление солей промывкой пресной водой","Отстой воды из нефти при температуре около 0 °C","Используют дросселирование или турбодетандеры."],["Что характеризует сепаратор первой ступени?","Отделение основной части газа при высоком давлении","Удаление воды перед сдачей","Удаление воды из нефти перед сдачей потребителю","Подготовка подтоварной воды к закачке в пласт","Давление снижается по ступеням."]]},{"name":"Практические ситуации","q":[["Обводнённость на входе УПН резко выросла, отстой не справляется. Что сделать в первую очередь?","Скорректировать подачу деэмульгатора и температуру, проверить уровень раздела","Увеличить скорость потока через отстойник и снизить температуру, отключив подачу реагента","Снизить температуру, чтобы уменьшить вязкость эмульсии","Перевести установку на байпас и сдать нефть без подготовки до снижения обводнённости","Эмульсии разрушают реагентом и нагревом, а большой поток снижает время отстоя."],["Давление в выкидной линии скважины постепенно растёт, дебит падает. Что вероятнее всего?","Отложения парафина, солей или гидратная пробка в линии","Рост продуктивности пласта при снижении газового фактора на устье","Снижение газового фактора на устье","Снижение вязкости нефти и прорыв воды в затрубное пространство","Сечение уменьшается, поэтому сопротивление растёт. Диагностику проводят по участкам давления."],["Почему при пуске газопровода зимой нужен контроль?","Снижение давления и температуры способствует образованию гидратов","При низкой температуре газ перестаёт подчиняться закону реального газа","При снижении температуры растёт теплота сгорания газа","Метан конденсируется в жидкость при обычных рабочих давлениях","Без ингибитора и осушки возможны пробки, поэтому применяют метанол и контроль точки росы."],["Какой фактор сильнее всего влияет на устойчивость нефтяных эмульсий?","Природные стабилизаторы: асфальтены, смолы и твёрдые частицы","Отношение диаметра трубы к скорости потока","Плотность воды и разница температур между пластом и установкой","Содержание растворённого газа и отношение диаметра трубы к скорости потока","Они формируют прочную оболочку на капле воды, которую разрушает деэмульгатор."]]}],"color":"#2E8B57"},{"id":"eor","name":"Методы увеличения нефтеотдачи пласта","subs":[{"name":"Химические методы","q":[["Что даёт закачка полимеров?","Повышает вязкость воды и улучшает охват вытеснением","Снижает межфазное натяжение до сверхнизких значений","Снижает вязкость нефти и приводит к смешиванию","Растворяет остаточную нефть в оторочке","Более вязкая вода меньше прорывается по пропласткам, а фронт вытеснения становится устойчивее."],["Как ПАВ увеличивают нефтеотдачу?","Снижают межфазное натяжение нефти и воды","Повышают вязкость закачиваемой воды","Снижают проницаемость промытых зон","Создают тепловой фронт в пласте","Малое натяжение уменьшает капиллярные силы, удерживающие нефть, и мобилизует её."],["Что входит в ASP-заводнение?","Щёлочь, ПАВ и полимер","Азот, углекислый газ и пар","Кислота, ПАВ и полимер","Щёлочь, азот и гелеобразователь","Компоненты дополняют друг друга: щёлочь снижает адсорбцию, ПАВ снижает натяжение, полимер повышает охват."],["Каково главное значение соотношения подвижностей M при вытеснении?","Чем меньше M, тем стабильнее вытеснение","Чем больше M, тем выше охват","M влияет только на вытеснение газом","M определяет только давление нагнетания","M = λвыт/λнефти. При M > 1 вода образует языки и прорывается к скважинам."],["Что означает рост капиллярного числа?","Преобладание вязких сил над капиллярными и снижение остаточной нефти","Преобладание капиллярных сил над вязкими и рост остаточной нефти","Рост смачиваемости нефтью и снижение подвижности воды в порах","Снижение проницаемости из-за набухания глин в промытой зоне","Nc = μv/σ. Его повышают снижением межфазного натяжения, что и делает ПАВ-заводнение."],["Для чего применяют потокоотклоняющие технологии?","Для перекрытия промытых каналов и подключения слабодренируемых зон","Для снижения вязкости нефти и повышения давления насыщения в зоне отбора","Для вскрытия новых продуктивных пропластков","Для увеличения приёмистости по самым промытым пропласткам участка","Гелевые и другие составы снижают проницаемость высокопроводящих зон, поэтому вода идёт в нефтенасыщенные пропластки."],["Что такое скрининг МУН?","Предварительный отбор подходящих методов по свойствам пласта и нефти","Опытная закачка реагента на одной скважине","Лабораторные фильтрационные исследования керна","Парогравитационный дренаж в паре горизонтальных скважин","Скрининг отсеивает неприменимые методы до дорогих исследований."],["Что снижает эффективность полимера в пласте?","Высокая солёность и деструкция","Низкая температура и малая обводнённость","Высокая проницаемость пласта","Пресная вода и большая вязкость нефти","Соль уменьшает вязкость раствора, а сдвиг и температура разрушают молекулы."],["Что такое адсорбция ПАВ?","Потеря реагента на поверхности породы","Переход ПАВ в нефтяную фазу с ростом натяжения","Образование мицелл выше критической концентрации","Разложение реагента при высокой температуре","Потери увеличивают расход химии, поэтому проводят лабораторные исследования."],["Что такое мицеллярное заводнение?","Закачка оторочки раствора ПАВ со спиртами и солями","Закачка щелочного раствора без ПАВ","Закачка пара, выдержка и отбор в одной скважине","Закачка водного раствора полимера","Микроэмульсия обеспечивает сверхнизкое межфазное натяжение."]]},{"name":"Газовые методы","q":[["Почему CO₂ часто используют для МУН?","Он растворяется в нефти, снижает её вязкость и может смешиваться с ней","Он не растворяется в нефти и работает как поршень","Он увеличивает вязкость нефти и выравнивает фронт вытеснения в пласте","Он не растворяется в нефти и вытесняет её как поршень в любых условиях","При достаточном давлении вытеснение становится смешивающимся, а межфазное натяжение практически исчезает."],["Что такое минимальное давление смешивания (MMP)?","Наименьшее давление, при котором газ смешивается с нефтью","Наибольшее давление закачки без разрыва пласта","Давление начала выделения CO₂ из нефти","Давление насыщения нефти закачанным газом","Вытеснение смешивающимся газом проектируют при давлении выше MMP."],["Что такое водогазовое воздействие (ВГВ, WAG)?","Чередующаяся или совместная закачка воды и газа","Закачка газа в водонапорный пласт для создания шапки","Закачка пены в НКТ при освоении","Одновременная добыча воды и газа","Газ лучше вытесняет нефть, а вода контролирует подвижность и улучшает охват."],["Что такое несмешивающееся вытеснение газом?","Газ не растворяется полностью и образует отдельную фазу","Газ полностью растворяется и образует с нефтью одну фазу","Вытеснение при давлении выше минимального давления смесимости","Многоконтактное смешивающееся вытеснение","Смешивающееся вытеснение эффективнее, но требует более высокого давления."],["Какой газ, помимо CO₂, закачивают для МУН?","Попутный углеводородный газ","Сероводород","Гелий","Смесь пропана с кислородом","Закачка ПНГ одновременно решает задачу его утилизации."],["Какое явление снижает эффективность закачки газа?","Прорыв газа из-за неблагоприятной подвижности","Набухание глин в призабойной зоне","Снижение вязкости нефти при контакте с газом","Рост охвата по толщине пласта","Газ подвижен и уходит к скважинам, не охватывая пласт, поэтому применяют ВГВ."]]},{"name":"Тепловые методы","q":[["К какому классу МУН относится закачка пара?","К тепловым","К газовым","К физико-химическим","К гидродинамическим","Пар снижает вязкость нефти и применяется для высоковязких и тяжёлых нефтей."],["Какой метод тепловых воздействий используют пара скважин с верхним паронагнетанием?","Парогравитационный дренаж (SAGD)","Пароциклическая обработка одной скважины","Внутрипластовое горение","Вытеснение горячей водой","Пар поднимается и формирует камеру, а разогретая нефть стекает в нижнюю горизонтальную скважину."],["Что происходит при внутрипластовом горении?","Часть нефти сгорает в пласте и создаёт тепловой фронт","Пласт нагревается электродами, спущенными в скважины","Закачивается горячий пар с поверхности и прогревает пласт","Закачивается газ, смешивающийся с нефтью","Для этого в пласт подают воздух. Горение дает тепло и газы, вытесняющие нефть."],["Какой фактор часто ограничивает применение термических МУН?","Большая глубина и потери тепла","Высокая вязкость пластовой нефти","Низкая пластовая температура","Большая толщина пласта","С ростом глубины увеличиваются теплопотери по стволу, поэтому пар эффективен прежде всего на небольших глубинах."],["Что такое пароциклическая обработка?","Закачка пара, выдержка и отбор в одной скважине","Закачка пара в нагнетательную и отбор из соседних скважин","Пар и вода чередуются в одной нагнетательной скважине","Пар подают через горизонтальную пару скважин","Метод быстро прогревает призабойную зону, но охват ограничен."],["Какие теплоизолированные трубы применяют при закачке пара?","НКТ с теплоизоляцией","Обычные НКТ с пакером на устье","НКТ с внутренним полимерным покрытием","Обсадные трубы с резьбовыми муфтами","Это снижает потери тепла по стволу."],["Какое название у метода закачки горячей воды?","Вытеснение горячей водой","Тепловая оторочка паром","Внутрипластовое горение влажное","Пароциклика","Метод проще паровых, но передаёт меньше тепла, чем пар."]]},{"name":"Общие вопросы и другие методы","q":[["Какая цель методов увеличения нефтеотдачи (МУН)?","Извлечь нефть, оставшуюся после традиционных способов разработки","Поддержать пластовое давление на начальном уровне","Снизить себестоимость бурения и сократить число скважин","Поддержать пластовое давление на начальной стадии разработки","МУН воздействуют на остаточную и слабо охваченную нефть и повышают конечный КИН."],["Что используют микробиологические методы?","Бактерии и продукты их жизнедеятельности","Ферменты для кислотной обработки ПЗП","Нагрев бактериального раствора до 200 °C","Поверхностные биоцидные реагенты","Микроорганизмы образуют газы, ПАВ и кислоты, что улучшает вытеснение. Для них важны условия среды."],["Какие методы относятся к физическим МУН?","Гидроразрыв, горизонтальные скважины и волновое воздействие","Закачка полимерных и мицеллярных растворов","Закачка полимерных и мицеллярных растворов и щёлочи","Закачка пара, горячей воды и внутрипластовое горение","Они улучшают условия вытеснения механическим воздействием на пласт."],["Какой этап предшествует промысловому внедрению МУН?","Лабораторные исследования и пилотный проект","Строительство полного комплекса наземного оборудования","Расширенный ввод на всём месторождении","Закупка реагентов на весь срок проекта","Пилот подтверждает эффект и экономику в реальных условиях."],["Какая главная причина применения МУН в поздней стадии?","Высокая обводнённость и большая остаточная нефть","Завершение бурения и падение себестоимости подъёма","Рост начального пластового давления и газового фактора","Падение себестоимости подъёма жидкости","На этой стадии заводнение малоэффективно, а значительная ча
