<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Тренажёр нефтегазовых компетенций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: sign-in, then two assessment tiles, then a mosaic of colour-coded topics with drawn equipment; results follow the assessment scale chart. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --line:#D3DCDA; --fg:#13262B; --muted:#546569;
  --petrol:#0E5A63; --on-petrol:#F4FAF9; --red:#CF1F2B;
  --ok:#14774A; --ok-bg:#DDF2E6; --bad:#B4232E; --bad-bg:#FBE3E3; --warn:#8A5A00; --warn-bg:#F8ECD0;
  --lv1:#EE5A36; --lv2:#F4D94E; --lv3:#8FE07A; --lv4:#2C7A36; --lv5:#3D9BE0; --lvtext:#13262B;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181B; --surface:#16252A; --line:#2D4046; --fg:#E7EFEE; --muted:#9AAEB1;
  --petrol:#3FB3BD; --on-petrol:#06262A; --red:#FF7A7A;
  --ok:#59D39A; --ok-bg:#123A2A; --bad:#FF8E8E; --bad-bg:#47191D; --warn:#EDBE62; --warn-bg:#3A2C0C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181B; --surface:#16252A; --line:#2D4046; --fg:#E7EFEE; --muted:#9AAEB1;
  --petrol:#3FB3BD; --on-petrol:#06262A; --red:#FF7A7A;
  --ok:#59D39A; --ok-bg:#123A2A; --bad:#FF8E8E; --bad-bg:#47191D; --warn:#EDBE62; --warn-bg:#3A2C0C;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.tag{font:500 12px/1.3 var(--mono);letter-spacing:.04em;color:var(--muted)}
h1{font:700 clamp(24px,5vw,36px)/1.18 var(--display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font:500 18px/1.3 var(--display);margin:30px 0 12px}
.lead{margin:10px 0 0;color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:11px 18px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--petrol)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.stop{color:var(--red);border-color:var(--red);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:4px 0;color:var(--petrol);font-weight:600}
.bar-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.who{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pill{font:500 12px var(--mono);padding:4px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.pill.on{background:var(--ok-bg);color:var(--ok)}

/* Sign-in */
.gate{max-width:440px;margin:6vh auto 0}
.art-row{display:flex;gap:8px;margin-bottom:18px}
.art-row span{flex:1;border-radius:8px;padding:6px;display:block}
.art-row svg{display:block;width:100%;height:auto}
form label{display:block;font-weight:600;margin-top:14px}
form input{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
form .btn{width:100%;margin-top:18px}
.err{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.small{font-size:14px;color:var(--muted);margin:12px 0 0}

/* Home */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.tile{display:flex;flex-direction:column;text-align:left;border:0;border-radius:12px;padding:0;overflow:hidden;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tile:hover .tname{color:var(--petrol)}
.mosaic{display:grid;grid-template-columns:repeat(5,1fr)}
.mosaic span{padding:6px;display:block}
.mosaic svg{display:block;width:100%;height:auto}
.tbody{padding:16px 18px 18px}
.tname{font:700 clamp(17px,2.6vw,21px)/1.25 var(--display);display:block}
.tbody small{display:block;color:var(--muted);margin-top:6px;font-size:15px}
.meter{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--petrol)}
.wide{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:12px;padding:16px 18px;text-align:left}
.wide:hover b{color:var(--petrol)}
.wide b{font:700 17px/1.3 var(--display)}
.wide span span{display:block;color:var(--muted);font-size:15px}

/* Section */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.size{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:6px;font-size:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.card{display:flex;flex-direction:column;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface);text-align:left}
.card .pic{display:block;padding:10px 22px;background:var(--c)}
.card .pic svg{display:block;width:100%;height:auto;max-height:96px}
.card:hover .pic{filter:brightness(1.06)}
.card b{display:block;padding:10px 12px 2px;line-height:1.3;font-weight:600}
.card small{display:block;padding:0 12px 12px;color:var(--muted);font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.topicbar{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px}
.topicbar .pic{display:block;padding:8px;border-radius:8px;background:var(--c)}
.topicbar svg{display:block;width:100%;height:auto}
.sublist{display:flex;flex-direction:column;gap:8px}
.sub{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid transparent;border-radius:8px;padding:12px 14px;text-align:left}
.sub:hover{border-color:var(--c,var(--petrol))}
.sub span:last-child{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}

/* Test sheet */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.count{margin-left:auto;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;background:var(--c,var(--petrol));transition:width .25s}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,32px)}
.topic{font-size:18px;line-height:1.35;margin:4px 0 20px}
.q{color:var(--red);font:500 clamp(21px,3.6vw,27px)/1.35 var(--body);margin:4px 0 16px;text-wrap:pretty}
.hint{font-size:14px;font-weight:600;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.opt:hover{background:color-mix(in srgb,var(--petrol) 8%,transparent)}
.opt input{margin:4px 0 0;width:18px;height:18px;accent-color:var(--petrol)}
.opt.picked{border-color:var(--petrol)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);cursor:not-allowed}
.opt.bad span{text-decoration:line-through}
.opt.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.off{cursor:default}
.opt.off:hover{background:none}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .32s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;font-weight:600}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.note{background:var(--warn-bg);color:var(--warn)}
.expl{margin-top:14px;padding:14px;border-radius:8px;background:var(--ok-bg)}
.expl h3{margin:0 0 4px;font-size:15px;color:var(--ok)}
.expl p{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:20px}
.keys{margin:12px 0 0;font-size:13px;color:var(--muted)}
@media (hover:none){.keys{display:none}}

/* Assessment chart */
.report{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.scale-table{border:1px solid var(--lvtext);background:#fff;color:#13262B;font-size:14px;border-radius:4px;overflow:hidden}
.st-row{display:grid;grid-template-columns:minmax(0,38%) 52px minmax(0,1fr);align-items:stretch;border-top:1px solid #AEBBB9}
.st-row:first-child{border-top:0}
.st-row>div{padding:6px 8px;display:flex;align-items:center;min-width:0}
.st-row .pct{justify-content:flex-end;font-weight:700;font-variant-numeric:tabular-nums;border-left:1px solid #AEBBB9;border-right:1px solid #AEBBB9;padding:6px 6px}
.st-row.group{border-top:2px solid #13262B}
.st-row.group .nm{font-weight:700;font-size:15px}
.st-row.st-sub .nm{padding-left:18px;font-size:13px}
.st-row .track2{padding:4px 0;position:relative}
.fill{display:block;height:20px;min-width:2px}
.fill.none{height:0}
.st-head .scale{padding:0;display:block}
.bands{display:grid;grid-template-columns:30fr 20fr 20fr 20fr 10fr;width:100%}
.bands span{padding:4px 2px;text-align:center;font-size:11px;line-height:1.15;display:flex;align-items:center;justify-content:center;min-height:42px;color:#13262B}
.bands .b4{color:#fff}
.b1{background:var(--lv1)}.b2{background:var(--lv2)}.b3{background:var(--lv3)}.b4{background:var(--lv4)}.b5{background:var(--lv5)}
.ticks{display:grid;grid-template-columns:repeat(10,1fr);font:500 11px var(--mono);text-align:right;border-top:1px solid #AEBBB9}
.ticks span{padding:1px 2px 1px 0}
.overall .fill{height:14px}
.side{background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px}
.side dt{color:var(--muted);font-size:13px;margin-top:10px}
.side dd{margin:0;font-weight:600}
.side dt:first-child{margin-top:0}
.side .prof{color:var(--red)}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:700 22px/1.15 var(--display);font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 12px 10px 0;overflow:hidden}
.rec i{align-self:stretch;display:block}
.rec p{margin:0}
.rec p small{display:block;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hrow span:last-child{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.miss{padding:14px 0;border-top:1px solid var(--line)}
.miss p{margin:4px 0 0}
.miss .a{color:var(--ok);font-weight:600}
.transfer textarea{width:100%;height:96px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 12px var(--mono)}
.rowbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

@media (max-width:720px){
  .report{grid-template-columns:minmax(0,1fr)}
  .side{order:-1}
  .st-row{grid-template-columns:minmax(0,1fr) 52px}
  .st-row .track2{grid-column:1 / -1;border-top:1px solid #DDE4E2}
  .st-row .scale{grid-column:1 / -1}
  .st-row .pct{border-right:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .tiles{grid-template-columns:minmax(0,1fr)}
  .size{margin-left:0;width:100%}
  .acts .btn,.controls>.btn{flex:1 1 100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topicbar{grid-template-columns:80px minmax(0,1fr)}
}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script src="config.js"></script>
<script>
const DATA = {"prof":[{"id":"prod","name":"Добыча нефти и газа","subs":[{"name":"Внутрискважинное оборудование","q":[["Для чего служат насосно-компрессорные трубы (НКТ)?","Для подъёма продукции и закачки агентов внутри эксплуатационной колонны","Для крепления ствола в интервале продуктивного пласта","Для передачи вращения от ротора к забойному инструменту","Для разобщения пластов за эксплуатационной колонной","НКТ подбирают по дебиту и условиям работы; они защищают эксплуатационную колонну."],["Что такое циркуляционный клапан в компоновке НКТ?","Клапан для сообщения НКТ с затрубным пространством","Клапан, отсекающий поток при аварии на устье","Обратный клапан над приёмом ЭЦН","Клапан перепуска газа из затрубья в выкидную линию","Он используется при промывках и глушении скважин."],["Для чего применяют забойный штуцер?","Для ограничения дебита и снижения давления в потоке","Для отделения свободного газа на забое","Для герметизации затрубного пространства","Для удержания песка в призабойной зоне","Штуцер создаёт сопротивление и стабилизирует режим."],["Что такое фильтр на забое?","Устройство, удерживающее песок при притоке продукции","Устройство для разделения нефти и воды в стволе","Сетка на приёме устьевого манометра","Элемент, задерживающий парафин в НКТ","Фильтры защищают оборудование от абразивного выноса."],["Какую функцию выполняет посадочный ниппель?","Посадка и фиксация внутрискважинных инструментов","Герметизация кольцевого пространства под пакером","Подвеска НКТ в колонной головке","Центрирование НКТ в обсадной колонне","В ниппель можно установить заглушку или клапан."],["Что предотвращает клапан-отсекатель?","Неконтролируемое истечение продукции при аварии на устье","Срыв подачи насоса при высоком газосодержании","Переток воды между пластами за колонной","Обратный слив жидкости при остановке ЭЦН","Клапан закрывается при потере управляющего давления или потоке выше заданного."]]},{"name":"Обеспечение добычи","q":[["Что означает термин «обеспечение потока» (flow assurance)?","Предотвращение проблем транспорта продукции: парафинов, солей, гидратов, коррозии","Подбор насосного оборудования и режима под проектный дебит жидкости по скважинам","Поддержание пластового давления закачкой для сохранения проектного уровня отборов","Расчёт пропускной способности трубопроводов при максимальном уровне добычи","Цель — бесперебойное движение продукции от пласта до подготовки."],["Как предотвращают отложение солей в скважине?","Применяют ингибиторы солеотложения","Закачкой метанола в затрубье","Применением деэмульгатора на приёме насоса","Подогревом устья паром","Ингибитор мешает росту кристаллов; его дозируют постоянно или закачивают в пласт."],["Как удаляют парафин из НКТ?","Скребками, горячей промывкой и растворителями","Соляно-кислотной ванной","Закачкой ингибитора солеотложения","Увеличением депрессии на пласт","Парафин откладывается при охлаждении потока, поэтому применяют механические и тепловые способы."],["Что вызывает углекислотную коррозию?","Растворённый в воде CO₂","Сульфатвосстанавливающие бактерии","Растворённый в воде кислород воздуха","Сероводород в безводной нефти","Угольная кислота разъедает сталь, поэтому применяют ингибиторы и стойкие материалы."],["Как уменьшают вынос песка из слабосцементированного пласта?","Гравийной набивкой и ограничением депрессии","Ростом депрессии для быстрой очистки ПЗП","Закачкой глинокислоты в призабойную зону","Увеличением частоты работы ЭЦН","Сохранение прочности призабойной зоны снижает разрушение пласта."],["Что такое мониторинг добычи?","Регулярный контроль дебита, обводнённости и давления по скважинам","Ежемесячная сверка добычи с бизнес-планом и бюджетом цеха","Сопоставление запасов с накопленной добычей раз в год","Анализ работы подрядчиков по текущему ремонту скважин","Он позволяет быстро выявить проблемы и подобрать мероприятия."],["Что показывает падение дебита при постоянном напоре насоса и росте давления на устье?","Вероятные отложения или сужение проходного сечения","Рост п актор на режиме насоса","Сопротивление после устья поднимает давление и сдвигает рабочую точку насоса."]]}],"color":"#0E8F6E"},{"id":"drill","name":"Бурение скважин","subs":[{"name":"Инструмент и оборудование","q":[["Как разрушают породу долота PDC?","Срезанием породы резцами","Дроблением и скалыванием зубьями шарошек","Ударно-вращательным внедрением вставок","Истиранием импрегнированной алмазной матрицей","Поликристаллические алмазные резцы срезают породу. Шарошечные долота работают дробяще-скалывающим способом."],["За счёт чего обычно создаётся нагрузка на долото?","За счёт веса утяжелённых бурильных труб (УБТ)","За счёт веса бурильных труб всей колонны","За счёт давления на стояке","За счёт натяжения талевого каната","Бурильные трубы работают на растяжение, а сжимающую нагрузку на долото создают УБТ в нижней части компоновки."],["Что позволяет телесистема MWD?","Измерять траекторию и параметры бурения в реальном времени","Выполнять полный комплекс ГИС после подъёма инструмента","Задавать направление отклонения через роторную систему","Отбирать боковые образцы породы","Датчики у долота передают данные по гидроканалу или электромагнитным сигналом, что нужно при наклонно-направленном бурении."],["Что приводит в действие винтовой забойный двигатель?","Поток бурового раствора","Вращение бурильной колонны от ротора","Сжатый азот, подаваемый по кольцевому каналу","Энергия упругой деформации бурильных труб","Раствор, проходя через пару статор–ротор, вращает ротор двигателя и долото. Бурильная колонна при этом может не вращаться."],["Что показывает вынос керна?","Отношение длины поднятого керна к длине пройденного интервала отбора","Отношение пройденного интервала к глубине скважины","Долю коллекторов в поднятой породе","Отношение диаметра керна к диаметру долота","Чем выше вынос, тем полнее представлен разрез. Показатель обычно выражают в процентах."],["Для чего служит вертлюг?","Для подвода раствора во вращающуюся колонну и удержания её веса","Для передачи крутящего момента на бурильную колонну","Для подвески и подъёма свечей бурильных труб","Для свинчивания бурильных замков","Он соединяет неподвижную часть талевой системы с вращающейся бурильной колонной."],["Что такое ведущая труба (квадрат)?","Труба, передающая вращение от ротора к бурильной колонне","Толстостенная труба над долотом для создания нагрузки","Первая труба компоновки с калибратором","Переводник между бурильными трубами и забойным двигателем","Квадратное сечение позволяет ротору передавать крутящий момент."],["Для чего нужны центраторы на обсадной колонне?","Для равномерного расположения колонны в стволе при цементировании","Для направления забойного двигателя при наборе кривизны","Для предотвращения осевого смещения колонны при ОЗЦ","Для турбулизации бурового раствора в трубах","При центрированной колонне цемент лучше вытесняет раствор и образует сплошное кольцо."],["Как устроена буровая установка для кустового бурения?","Установка, перемещаемая по рельсам между скважинами на кусте","Вышечно-лебёдочный блок перемещается по направляющим между устьями","Вся установка разбирается и монтируется заново на каждом устье","Несколько вышек работают одновременно на каждое устье","Это сокращает время монтажа при бурении многих скважин с одной площадки."]]},{"name":"Буровые растворы","q":[["Что не является функцией бурового раствора?","Увеличение проницаемости продуктивного пласта","Передача гидравлической энергии забойному двигателю","Удержание шлама во взвешенном состоянии при остановке","Глинизация стенок ствола скважины","Раствор выносит шлам, удерживает пласт, охлаждает инструмент и укрепляет стенки. В коллекторе он, наоборот, может ухудшать проницаемость."],["Какой прибор используют для измерения условной вязкости раствора в полевых условиях?","Воронку (ВБР, Марша)","Ротационный вискозиметр","Ареометр АБР","Фильтр-пресс ВМ-6","Условная вязкость — это время истечения заданного объёма раствора через воронку. Метод прост и применяется прямо на буровой."],["По какому принципу выбирают плотность бурового раствора?","Чтобы гидростатическое давление с нормативным запасом превышало пластовое","Чтобы гидростатическое давление было равно пластовому","Чтобы забойное давление превышало давление гидроразрыва","Чтобы плотность равнялась среднему градиенту горного давления","Малая плотность грозит ГНВП, а излишняя — поглощениями и гидроразрывом, поэтому работают в безопасном окне давлений."],["Что учитывает эквивалентная циркуляционная плотность (ЭЦП)?","Гидростатику столба раствора и потери давления в затрубье при циркуляции","Гидростатику столба раствора без учёта движения","Давление на насосах за вычетом потерь в трубах","Плотность раствора с учётом шлама на устье","При циркуляции забойное давление выше статического. Если ЭЦП слишком высока, возможно поглощение раствора."],["Что характеризует водоотдача бурового раствора?","Способность отдавать фильтрат в проницаемый пласт","Способность удерживать шлам при остановке циркуляции","Количество воды, поступающей из пласта в раствор","Скорость разрушения глинистой корки","Высокая водоотдача ухудшает коллектор и вызывает набухание глин. Её контролируют реагентами."],["Для чего применяют барит?","Для утяжеления бурового раствора","Для снижения фильтрации через глинистую корку","Для увеличения вязкости без роста плотности","Для повышения pH бурового раствора","Плотность барита около 4,2 г/см³, поэтому он эффективно поднимает плотность."],["Какой раствор лучше сохраняет устойчивость глин?","Инвертно-эмульсионный на углеводородной основе","Пресный полимерный раствор без ингибиторов","Известково-битумный раствор на морской воде","Гуматно-лигносульфонатный раствор","Углеводородная среда препятствует гидратации глин, поэтому такие растворы применяют на сложных участках."],["Что такое тиксотропия раствора?","Способность загустевать в покое и разжижаться при движении","Снижение вязкости раствора при росте температуры","Способность раствора удерживать фильтрат","Зависимость плотности раствора от давления","Структура удерживает шлам при остановке циркуляции."]]},{"name":"Конструкция и крепление скважин","q":[["Для чего служит кондуктор?","Для перекрытия верхних неустойчивых и водоносных отложений и установки ПВО","Для предотвращения размыва устья при бурении под направление","Для разобщения продуктивных горизонтов между собой","Для крепления зон АВПД перед вскрытием пласта","Кондуктор изолирует пресноводные горизонты и обеспечивает опору для устьевого оборудования."],["Какова главная цель цементирования обсадной колонны?","Разобщение пластов и закрепление колонны","Повышение несущей способности устья и снижение веса колонны","Снижение проницаемости продуктивного пласта на забое","Выравнивание диаметра ствола перед спуском колонны","Цементный камень предотвращает перетоки между пластами и защищает колонну от коррозии и нагрузок."],["Что такое эксплуатационная колонна?","Обсадная колонна, по которой добывается продукция или закачивается вода","Промежуточная колонна, перекрывающая зоны осложнений","Колонна НКТ, по которой поднимается продукция","Хвостовик, спущенный только в интервал пласта","Она перекрывает весь ствол до продуктивного пласта и обеспечивает работу скважины."],["Для чего служит техническая (промежуточная) колонна?","Для перекрытия осложнённых интервалов до бурения ниже","Для подъёма жидкости к устью при освоении","Для обеспечения посадки ПВО на устье при бурении под кондуктор","Для разобщения эксплуатационного объекта с вышележащими","Она изолирует зоны поглощений, обвалов или аномальных давлений."],["Что такое ОЗЦ?","Ожидание затвердевания цемента","Определение зоны цементирования","Опрессовка затрубного цемента","Обработка забойной цементной пробки","Перед продолжением работ цементный камень должен набрать прочность."]]},{"name":"Траектория и режимы бурения","q":[["Что такое зенитный угол скважины?","Угол между осью скважины и вертикалью","Угол между проекцией ствола и направлением на север","Угол между осью скважины и горизонталью","Угол изменения кривизны на 10 м проходки","Зенитный угол показывает отклонение ствола от вертикали, а азимут — направление этого отклонения в плане."],["Что означает бурение на депрессии?","Давление в стволе поддерживается ниже пластового","Забойное давление поддерживается равным давлению гидроразрыва","Бурение с промывкой воздухом на репрессии","Бурение с регулируемым давлением выше пластового","Такой подход сохраняет призабойную зону и повышает скорость бурения, но требует специального устьевого оборудования и контроля притока."],["Какие параметры входят в режим бурения?","Нагрузка на долото, частота вращения и расход раствора","Плотность, вязкость и водоотдача раствора","Глубина, диаметр и зенитный угол ствола","Тип долота, число вставок и фазировка","От их сочетания зависят механическая скорость и износ долота."],["Что такое отход скважины?","Горизонтальное смещение забоя от устья","Смещение ствола от проектной траектории","Разница между длиной ствола и вертикальной глубиной","Расстояние между соседними устьями на кусте","Отход и азимут определяют положение забоя в плане."]]},{"name":"Осложнения при бурении","q":[["Что вызывает дифференциальный прихват инструмента?","Прижатие колонны к стенке перепадом давления против проницаемого пласта","Заклинивание долота в суженной части ствола","Осыпание стенок при снижении плотности раствора","Заклинивание замка в желобной выработке","Давление в скважине выше пластового и прижимает трубы к фильтрационной корке. Риск возрастает при неподвижном инструменте."],["При каком условии возникает поглощение бурового раствора?","Когда давление в скважине превышает давление поглощения пласта","Когда статический уровень раствора выше устья","Когда пластовое давление превышает забойное","Когда плотность раствора меньше плотности фильтрата","Раствор уходит в трещины или высокопроницаемые пласты. Снижение уровня может вызвать ГНВП, поэтому поглощение опасно вдвойне."],["Как обычно борются с поглощением?","Вводят кольматирующие материалы и снижают давление на пласт","Увеличивают плотность раствора для тампонирования трещин","Повышают расход насосов для промыва зоны","Переходят на раствор с высокой водоотдачей","Волокна, чешуйки и гранулы закупоривают каналы, а снижение плотности уменьшает перепад."],["Что такое сальник на бурильной колонне?","Налипание шлама и глины вокруг инструмента","Уплотнительный элемент в превенторе","Скопление цементной корки в обсадной колонне","Желобная выработка в стенке ствола","Сальник ухудшает циркуляцию и может вызвать прихват."]]},{"name":"Вскрытие пласта, консервация и ликвидация","q":[["Кто несет ответственность за качество проведения работ по консервации, сохранность скважин, проверку их состояния?","Пользователь недр","Подрядчик по геологическому сервису","Заказчик-недропользователь и подрядчик","Подрядчик, производивший консервацию скважины","Обязанность обеспечить безопасную консервацию и сохранность скважин лежит на пользователе недр как на владельце лицензии. Он может нанять подрядчика, но от ответственности перед надзором это его не освобождает.","lzs-20"],["На какой срок производится консервация части ствола скважин, защищенного обсадной колонной, при сезонном характере работ?","До продолжения строительства","3 месяца","1 месяц","6 месяцев","Ствол, закреплённый обсадной колонной, защищён от осыпания и пластовых флюидов, поэтому жёсткий короткий срок не нужен. При сезонных работах такую скважину держат законсервированной до возобновления строительства.","lzs-21"],["Каким из перечисленных способов проверяется наличие цементных мостов при ликвидации скважин?","Разгрузкой бурильного инструмента или НКТ на цементный мост","Опрессовкой колонны","При спуске инструмента на канате","С помощью ГИС","Наличие и прочность моста проверяют механически: на него ставят бурильные трубы или НКТ с нагрузкой. Если мост держит нагрузку и инструмент не проходит, он сформирован. Опрессовка показывает герметичность, а не положение моста.","lzs-59"],["Каким типом жидкости необходимо заполнить верхнюю часть скважины при консервации скважины с открытым стволом?","Незамерзающей жидкостью","Водным раствором ПАВ","Нефтью или дизельным топливом","Буровым раствором","В верхней части ствола возможно промерзание, поэтому туда закачивают незамерзающую жидкость. Это защищает устье и колонну от повреждения льдом, а остальной ствол остаётся заполнен раствором.","lzs-60"],["Допустимая концентрация твердой фазы в буровом растворе, при вскрытии пласта, должна быть не более:","0,5 - 1 %","1,5%","0,95 %","0,7 %","Твёрдые частицы проникают в поры и закупоривают их, ухудшая проницаемость призабойной зоны. Поэтому при вскрытии пласта их содержание стремятся свести к минимуму, порядка долей процента — одного процента.","lzs-82"],["Для чего в промывочную жидкость при первичном вскрытии пласта вводят поверхностно-активные вещества?","все ответы верны","уменьшение поверхностного натяжения на границе раздела вода- углеводородная среда","препятствие образованию эмульсий в пористой среде","уменьшение капиллярного давления в поровых каналах","ПАВ снижают поверхностное натяжение, что уменьшает капиллярное давление и облегчает удаление фильтрата из пор, а также препятствуют образованию эмульсий. Все эффекты взаимосвязаны и сохраняют проницаемость пласта.","lzs-83"]]},{"name":"Практические ситуации","q":[["Что такое запас на приток (kick tolerance)?","Максимальный объём притока, который можно закрыть и вымыть без гидроразрыва у башмака","Максимальный объём раствора, который можно потерять при поглощении без ГНВП","Разница между давлением гидроразрыва и пластовым давлением на забое","Допустимое превышение плотности раствора над градиентом порового давления","Показатель связывает объём притока, плотность раствора и прочность пород у башмака, поэтому влияет на глубину спуска колонн."],["При бурении падает механическая скорость, давление на стояке постоянно, нагрузка та же. Наиболее вероятная причина?","Износ долота или переход в более твёрдую породу","Промыв бурильной колонны","Рост водоотдачи раствора","Снижение плотности раствора из-за притока","Промыв снизил бы давление на стояке, а скорость проходки зависит от долота и породы."],["Давление на стояке медленно падает при том же расходе насоса. О чём это говорит в первую очередь?","Возможен промыв в бурильной колонне","Зашламление насадок долота","Повышение вязкости раствора","Сужение ствола против глинистых пород","Поток уходит через промоину, сопротивление снижается. Если не поднять инструмент, возможен обрыв."],["При расчёте обсадной колонны на смятие наихудшим обычно считают случай, когда:","Колонна опорожнена, а снаружи полный столб жидкости","Колонна заполнена тяжёлым раствором, а снаружи пластовая вода","Внутри колонны создано максимальное давление опрессовки","Внутреннее и внешнее давления равны, а действует только осевая нагрузка","Смятие создаёт внешнее давление при низком внутреннем, например при поглощении или газе в колонне."],["Что снижает риск дифференциального прихвата при бурении через истощённый пласт?","Минимальная репрессия, качественная корка и постоянное движение инструмента","Повышение плотности раствора и увеличение толщины корки","Снижение расхода и длительные остановки для контроля шлама","Увеличение длины УБТ в интервале проницаемых пластов","Прихват растёт с перепадом давления, площадью контакта и временем без движения."],["Почему при подъёме инструмента из скважины возможен приток даже при правильной плотности?","Поршневание снижает забойное давление","Вязкость раствора снижается при подъёме и падает гидростатика","Плотность раствора снижается из-за прогрева на забое","Циркуляция прекращается, и растёт эквивалентная плотность","Быстрый подъём создаёт разрежение под долотом, поэтому скорость ограничивают и контролируют долив."]]}],"color":"#7A4FD0"},{"id":"compl","name":"Освоение скважин","subs":[{"name":"Вызов притока","q":[["Что такое депрессия на пласт?","Разность пластового и забойного давлений","Разность забойного и устьевого давлений","Разность пластового давления и давления на его колеса создаёт напор","Сжатый газ поднимает жидкость порциями","Возвратно-поступательное движение плунжера","Струйная установка создаёт управляемую депрессию на пласт."],["Что такое освоение нагнетательной скважины?","Подготовка к приёму закачиваемой воды","Подбор ЭЦН для откачки сточной воды","Перевод скважины на газлифт","Спуск пакера для изоляции пласта","Важнейший показатель здесь — приёмистость скважины."],["Каким способом снижают забойное давление с целью вызова притока?","Все ответы правильные","Заменой жидкости в скважине на аэрированные или пенные системы","Снижением уровня жидкости в скважине","Заменой жидкости в скважине на жидкость меньшей плотности","Забойное давление равно гидростатике столба жидкости. Его можно уменьшить, снизив плотность жидкости (замена раствора, аэрация, пена) или высоту столба (свабирование, компрессор). Поэтому верны все варианты.","lzs-67"],["Охарактеризуйте процесс: Вызов притока из скважины при помощи УГИС - это:","Снижение давления в подпакерной зоне до значений, меньших гидростатического давления","Снижение уровня жидкости при помощи специального поршня с обратным клапаном, допускающим перетоки жидкости через поршень только в одном направлении при спуске его в скважину","Уменьшение уровня жидкости в скважине вследствие использования энергии сжатого воздуха","Снижение уровня жидкости в трубах за счет ее аэрации и последующего выброса","Установки такого типа создают депрессию под пакером с помощью струйного насоса: давление в подпакерной зоне становится меньше гидростатического, и пласт начинает отдавать флюид.","lzs-68"],["Дайте определение термину: Освоение скважины - это:","Комплекс технологических операций по вызову притока и обеспечению ее продуктивности, соответствующей локальным возможностям пласта","Комплекс перфорационных работ по скважине, обеспечивающих гидродинамическую связь пласта и забоя скважины","Комплекс работ по подготовке скважины к спуску УЭЦН и спуск УЭЦН в соответствии с технологическими регламентами","Комплекс работ по осуществлению операций, связанных с гидроразрывом пласта","Цель освоения — получить приток и вывести скважину на продуктивность, соответствующую возможностям пласта. Перфорация, спуск УЭЦН и ГРП могут быть отдельными этапами, но освоением в целом не являются.","lzs-69"],["Сущность операции по вызову притока и освоению скважины состоит в том, что:","создается депрессия на забое скважины, т.е. гидростатическое давление в стволе скважины становится ниже пластового, что обеспечивает поступление пластового флюида в скважину","Операции по вызову притока и освоению скважины сводятся к проведению гидроразрыва пород для обеспечения дополнительной добычи нефти","Операции по вызову притока и освоению скважины сводятся к проведению различных типов кислотных обработок для обеспечения дополнительной добычи нефти","Операции по вызову притока и освоению скважины сводятся к оптимизации работы глубинно-насосного оборудования (УЭЦН, УШГН)","Флюид идёт туда, где давление ниже. Пока забойное давление выше пластового, притока нет; поэтому суть вызова притока — создание депрессии. ГРП и кислотные обработки служат другой цели — интенсификации.","lzs-70"]]},{"name":"Вторичное вскрытие","q":[["Что такое вторичное вскрытие?","Перфорация колонны и цемента против продуктивного пласта","Вскрытие пласта долотом с промывкой раствором","Углубление скважины ниже проектного забоя","Бурение бокового ствола из обсадной колонны","Первичное вскрытие выполняется при бурении, вторичное — после крепления."],["Что такое плотность перфорации?","Число отверстий на метр интервала","Глубина каналов на метр вскрытой толщины","Плотность жидкости перфорации","Масса заряда на одно отверстие","Плотность выбирают по свойствам пласта и условиям притока."],["Что такое фазировка перфоратора?","Угол между соседними зарядами","Время задержки подрыва зарядов","Расстояние между отверстиями по вертикали","Угол входа канала относительно оси скважины","Фазировка влияет на продуктивность и прочность колонны. овиях","Отношение отбора жидкости к её потенциальному объёму","Доля закачанной воды, попавшей в добывающие скважины","При компенсации около 100 % пластовое давление поддерживается, поэтому показатель контролируют на всех этапах заводнения."],["Что такое темп отбора нефти?","Годовая добыча в процентах от извлекаемых запасов","Отношение текущего дебита к начальному по скважине","Скорость падения добычи в процентах за год","Отношение добычи жидкости к добыче нефти","Темп отбора показывает интенсивность разработки. Обычно его считают от начальных или текущих извлекаемых запасов."],["На сколько стадий обычно делят разработку нефтяной залежи?","На четыре","На три","На пять","На шесть","Выделяют нарастающую добычу, стабильную добычу, значительное снижение добычи и завершающую стадию."],["Что показывает обводнённость продукции?","Долю воды в добываемой жидкости","Долю порового объёма, занятую водой","Отношение закачанной воды к добытой нефти","Долю воды от всего объёма нефти на складе","Обводнённость растёт по мере продвижения фронта воды, и это один из главных показателей заводнения."],["Что такое водонефтяной фактор?","Отношение добытой воды к добытой нефти","Отношение закачанной воды к добытой нефти","Отношение нефти к воде на устье","Доля воды в добываемой жидкости","Показатель характеризует издержки на попутную воду на единицу нефти."],["Что такое текущая нефтеотдача?","Отношение накопленной добычи нефти к геологическим запасам","Отношение годовой добычи к геологическим запасам","Отношение накопленной добычи к извлекаемым запасам","Прогнозный КИН на конец разработки","Она показывает, сколько запасов извлечено на данный момент."],["Что показывает кратность промывки?","Сколько поровых объёмов закачано в пласт","Отношение накопленной закачки к накопленной добыче нефти","Частоту смены закачиваемых агентов","Отношение обводнённости к выработке запасов","Рост прокачанных поровых объёмов повышает нефтеотдачу, но снижает эффективность."],["Что показывают характеристики вытеснения?","Зависимость накопленной нефти от накопленной жидкости или воды","Зависимость дебита от времени при падающей добыче","Зависимость ОФП от водонасыщенности","Распределение остаточной нефти в разрезе","По ним оценивают извлекаемые запасы и эффект мероприятий."],["Скважины, бурящиеся при геологоразведочных работах и для разработки нефтяных и газовых месторождений подразделяют на следующие категории:","на 8 категорий: опорные, параметрические, структурные, поисковые, оценочные, разведочные, эксплуатационные, специальные.","на 6 категорий: разведочные, эксплуатационные, специальные, резервные, законсервированные, ликвидированные","на 4 категории: опорные, параметрические, разведочные, эксплуатационные","на 2 категории: разведочные и эксплуатационные","Классификация включает восемь категорий по назначению: от опорных и параметрических (изучение строения) через структурные, поисковые, оценочные и разведочные до эксплуатационных и специальных. Законсервированные и ликвидированные — это состояния скважин, а не категории назначения.","lzs-71"]]},{"name":"Системы заводнения","q":[["Когда применяют законтурное заводнение?","На небольших залежах с хорошей гидродинамической связью с законтурной зоной","На крупных залежах с низкой проницаемостью и широкой площадью","На залежах с резко ухудшенными свойствами за контуром","На массивных трещиноватых залежах с подошвенной водой","Вода закачивается за контур нефтеносности. На больших залежах эффект не доходит до центра, поэтому там применяют внутриконтурные системы."],["Каково соотношение нагнетательных и добывающих скважин в пятиточечной системе?","1:1","1:2","1:3","1:4","В обращённом пятиточечном элементе одна нагнетательная скважина окружена четырьмя добывающими, но с учётом их общих границ на всей площади соотношение равно 1:1."],["Что такое рядная система заводнения?","Чередование рядов нагнетательных и добывающих скважин","Расстановка всех скважин равномерно по треугольной сетке","Размещение нагнетательных скважин только по контуру","Ряд скважин вдоль разлома без закачки","Наиболее интенсивная — однорядная; трёхрядные и пятирядные менее интенсивны."],["Что такое очаговое заводнение?","Дополнительная закачка в участки, не охваченные основной системой","Закачка по всему контуру нефтеносности","Закачка воды через добывающие скважины по циклу","Закачка в купольную часть для создания газовой шапки","Очаги создаются для увеличения охвата на неработающих участках."],["Что такое циклическое заводнение?","Периодическое изменение режимов закачки и отбора","Смена воды на газ в нагнетательной скважине","Чередование закачки пресной и сточной воды","Одновременная закачка в несколько пластов","Перепады давления вызывают обмен жидкостью между высоко- и низкопроницаемыми пропластками."],["Уменьшение обводненности скважинной продукции приведет к:","Все ответы правильные","Уменьшению затрат на сепарацию воды и нефти","Увеличению добычи нефти","Уменьшению затрат на подъем воды","При том же дебите жидкости доля нефти растёт, а поднимать и отделять приходится меньше воды. Поэтому верны все перечисленные эффекты.","lzs-33"],["Фактор сопротивления определяется как отношение при ограничении водопритока:","подвижности воды к подвижности геля","подвижности нефти к подвижности геля","подвижности геля к подвижности воды","подвижности воды к подвижности нефти","RF = λводы / λгеля: показывает, во сколько раз гель снижает подвижность по сравнению с водой, то есть насколько возрастает сопротивление потоку. Отношение подвижностей воды и нефти — это другая величина, характеризующая вытеснение.","lzs-34"]]},{"name":"Режимы залежей","q":[["Как меняется газовый фактор при режиме растворённого газа?","Сначала растёт, затем падает по мере истощения газа","Сначала снижается, потом растёт до начального значения","Остаётся постоянным до конца разработки","Постоянно растёт вплоть до конца разработки","Ниже Рнас выделяется свободный газ, он начинает двигаться, и газовый фактор растёт. Когда газ истощается, показатель падает."],["Какой режим работает в газовой залежи без притока пластовых вод?","Газовый","Упруговодонапорный","Режим растворённого газа","Газонапорный режим с газовой шапкой","Газ вытесняется за счёт собственного расширения, а зависимость приведённого давления от добычи близка к прямой."],["Что такое сайклинг-процесс?","Закачка сухого газа в пласт для поддержания давления и снижения потерь конденсата","Циклическая закачка пара в газоконденсатную скважину","Попеременная закачка воды и газа в нефтяной пласт","Периодическая остановка скважин для отдыха пласта","Давление поддерживается выше начала конденсации, поэтому жидкие углеводороды не выпадают в пласте и извлекаются с газом."],["Что характерно для упруговодонапорного режима?","Вытеснение за счёт упругого расширения флюидов и породы и напора воды","Давление не снижается при любых отборах","Основная энергия — расширение газовой шапки","Приток обеспечивается только за счёт сил гравитации","Давление снижается постепенно, а зона упругого перераспределения расширяется."],["Что такое газонапорный режим?","Вытеснение нефти расширяющейся газовой шапкой","Вытеснение нефти выделяющимся растворённым газом","Вытеснение нефти закачанным азотом","Вытеснение газа подошвенной водой","Для него характерно снижение давления и рост газового фактора у скважин ближе к шапке."],["Основное условие проявления гравитационного режима работы залежи?","потенциальная энергия напора нефти превышает все другие виды энергии в пласте","отсутствие газовой шапки","крутозалегающие нефтеносные пласты","превышение пластового давления над давлением насыщения","Гравитационный режим наступает, когда другие источники энергии (упругость, растворённый газ, напор воды) исчерпаны и нефть движется к забоям только под действием силы тяжести.","lzs-63"],["Водонапорный режим разработки залежи - это:","Использование энергии водоносного горизонта, который способен поддерживать давление в залежи (пополнение водоносного горизонта происходит из поверхностных источников либо нет пополнения извне)","Это режим разработки, при котором источником энергии служит изменение порового давления и увеличение горного давления","Это режим разработки, при котором источником энергии служит расширение флюидов и сжатие породы","Это режим разработки, при котором источником энергии служит расширение газа, который растворен в флюиде","Нефть вытесняется напором законтурных вод, и давление поддерживается водоносным горизонтом. Расширение флюидов и породы — это упругий режим, а расширение растворённого газа — режим растворённого газа.","lzs-64"],["Что не следует допускать при режиме с газовой шапкой?","образования конуса газа","выделения растворенного газа","образования конуса воды","выпадения конденсата в газовой шапке","Энергия режима заключена в газовой шапке. Если газ по конусу прорвётся в скважину, она начнёт добывать газ вместо нефти, а шапка потеряет энергию. Поэтому дебиты ограничивают и перфорируют нижнюю часть пласта.","lzs-76"]]},{"name":"Подземная гидромеханика","q":[["Что описывает закон Дарси?","Линейную связь скорости фильтрации с градиентом давления","Квадратичную зависимость потерь давления от скорости","Связь сжимаемости породы с давлением","Распределение насыщенности за фронтом вытеснения","Расход пропорционален проницаемости и перепаду давления и обратно пропорционален вязкости. На этой основе строится большинство расчётов."],["Какая формула описывает установившийся радиальный приток к скважине?","Формула Дюпюи","Формула Форхгеймера","Формула Баклея–Леверетта","Формула Хорнера","Q = 2πkh(Рпл − Рзаб) / (μ·ln(Rк/rс)). Она показывает, как дебит зависит от свойств пласта и депрессии."],["Что означает положительный скин-фактор?","Ухудшенную проницаемость призабойной зоны","Улучшенную проницаемость призабойной зоны","Наличие трещины ГРП в призабойной зоне","Псевдорадиальный режим притока","Скин больше нуля обычно указывает на загрязнение ПЗП. Отрицательный скин бывает после успешного ГРП или кислотной обработки."],["Что такое пьезопроводность?","Скорость перераспределения давления в пласте","Способность пласта пропускать жидкость при перепаде","Произведение проницаемости на толщину","Отношение давления к расходу","Коэффициент равен k/(μ·φ·ct) и определяет, как быстро распространяется импульс давления."],["Что такое гидропроводность пласта?","Произведение проницаемости на толщину, делённое на вязкость","Отношение проницаемости к пористости и сжимаемости","Произведение пористости, толщины и насыщенности","Отношение дебита к перепаду давления","kh/μ определяет пропускную способность пласта."],["Какое течение наблюдается при нарушении закона Дарси вблизи скважины с большими дебитами?","Нелинейное, инерционное течение","Псевдорадиальное","Линейное течение в трещине","Ползущее течение","При больших скоростях растут инерционные потери, особенно при притоке газа к забою."],["Что показывает кривая восстановления давления (КВД)?","Рост забойного давления после остановки скважины","Падение забойного давления при пуске скважины","Рост дебита после обработки призабойной зоны","Рост устьевого давления в нагнетательной скважине","По КВД определяют проницаемость, скин и пластовое давление."]]},{"name":"Проектирование и регулирование разработки","q":[["С какой целью проводится анализ разработки?","Проводится для определения эффективности применяемой технологии разработки","Проводится для определения степени неоднородности залежи","Проводится с целью определения степени обводненности продукции","Проводится с целью уточнения остаточных запасов нефти","Анализ разработки отвечает на главный вопрос: достигаются ли проектные показатели выбранной технологией и что нужно изменить. Обводнённость, неоднородность и остаточные запасы — это частные данные, используемые в анализе.","lzs-31"],["Что относят к технологическим методам регулирования разработки нефтяных месторождений?","Все перечисленные методы","Увеличение давления нагнетания в скважинах вплоть до давления раскрытия трещин в призабойной зоне, поинтервальная закачка рабочих агентов в прослои пласта при дифференцированном давлении нагнетания","Изменение режимов эксплуатации добывающих и нагнетательных скважин путем уменьшения или увеличения их дебитов и расходов закачиваемых в пласты веществ, вплоть до прекращения эксплуатации (отключения) скважин","Воздействие на призабойную зону скважин с целью увеличения притока нефти из отдельных прослоев пласта или расхода закачиваемых в них веществ","Все три варианта — это управление процессом через существующие скважины: давление нагнетания, режимы работы и воздействие на призабойную зону. Систему разработки они не меняют, поэтому относятся к технологическим методам.","lzs-32"],["Для чего составляются проекты пробной эксплуатации?","Для получения информации, необходимой для подсчета запасов и составления технологической схемы разработки","Для устранения выявленных недостатков предыдущей проектной работы","Для выбора геометрии сетки скважин","Для восполнения фактической неполноты разведки извлекаемых запасов нефти","Пробная эксплуатация — это ранний этап: скважины работают, чтобы получить данные о продуктивности и режиме залежи. На этих данных затем подсчитывают запасы и составляют полноценный проектный документ.","lzs-37"],["Целью составления дополнения к технологическому проекту разработки месторождения является:","Интенсификация и регулирование процесса добычи","Уточнение геологических запасов","Отражение сложившейся на месторождении технологии добычи","Подготовка месторождения к ликвидации","Дополнение корректирует проектные решения по мере изучения залежи, чтобы улучшить показатели: уплотнить сетку, изменить закачку, применить новые методы. Запасы уточняют в отдельных подсчётах.","lzs-38"]]},{"name":"Практические ситуации","q":[["В чём разница применения материального баланса и численной модели?","Баланс оценивает запасы и энергию залежи в целом, модель показывает распределение по пласту","Баланс даёт распределение остаточной нефти, а модель — только запасы залежи","Модель применяют на ранней стадии, а баланс — только после полного разбуривания","Баланс учитывает геометрию скважин, а модель работает со средним давлением","Балансу не нужна геометрия, но он не показывает, где осталась нефть. Для размещения скважин нужна сеточная модель."],["Какую модель падения описывает постоянный относительный темп?","Экспоненциальную кривую Арпса","Гиперболическую кривую Арпса при b = 0,5","Гармоническую кривую Арпса при b = 1","Степенную зависимость накопленной добычи от времени","При b = 0 относительный темп падения постоянен. Экспонента даёт самый консервативный прогноз."],["Дебит скважины упал вдвое, обводнённость не изменилась, пластовое давление то же. Что проверить в первую очередь?","Состояние призабойной зоны и насосного оборудования","Сейсмические атрибуты вблизи скважины","Подсчёт запасов на участке дренирования","Положение ВНК и контур нефтеносности","При неизменных обводнённости и давлении причина скорее в скважине: скин, отказ насоса, отложения."],["Быстрый рост обводнённости одной скважины при низкой выработке запасов участка указывает на:","Прорыв воды по высокопроницаемому пропластку или трещине","Равномерный подъём ВНК по всей залежи","Снижение вязкости нефти в зоне закачки","Выход фронта вытеснения по всей толщине пласта","Вода идёт по пути наименьшего сопротивления, поэтому запасы остаются невыработанными."],["Пластовое давление на участке падает при компенсации 100 %. Что вероятнее всего?","Закачка уходит за пределы объекта или в другой пласт","Завышена обводнённость по данным замеров","Снизилась сжимаемость породы на участке","Занижена закачка из-за приписок на КНС при верном балансе","Компенсация считается по закачке, но фактически вода может уходить по заколонным перетокам или в непродуктивные пласты."],["Что важнее всего при вводе нефтяной оторочки с газовой шапкой и подошвенной водой?","Ограничить депрессию и выбрать положение ствола, чтобы отсрочить конусы","Вскрыть весь разрез и работать на максимальной депрессии","Закачивать газ в оторочку с первых дней разработки","Сохранять постоянный дебит независимо от прорыва газа","Узкая оторочка быстро прорывается газом и водой, поэтому часто применяют горизонтальные стволы и низкие депрессии."]]}],"color":"#1F9E89"},{"id":"geo","name":"Геология нефти и газа","subs":[{"name":"Ловушки и залежи","q":[["Что такое ловушка углеводородов?","Часть природного резервуара, где возможно скопление нефти и газа","Пласт, содержащий промышленное скопление нефти","Участок миграции вдоль разлома","Толща материнских пород в зоне генерации","Ловушка создаётся формой пласта и экранами, поэтому мигрирующие углеводороды не могут двигаться дальше."],["Что такое флюидоупор?","Порода, препятствующая движению флюидов","Пласт с нулевой пористостью любого состава","Зона цементации вблизи контакта","Коллектор с низкой подвижностью флюидов","Покрышками обычно служат глины, соли и ангидриты. От их качества зависит сохранность залежи."],["Какие породы называют коллекторами?","Породы, способные вмещать и отдавать флюиды","Породы, содержащие только нефть и газ","Породы с пористостью выше 20 %","Породы, в которых генерируются углеводороды","Для коллектора важны пористость и проницаемость, поэтому чаще всего это песчаники и карбонаты."],["Что такое ВНК?","Водонефтяной контакт — граница нефтенасыщенной и водонасыщенной частей пласта","Верхняя граница нефтенасыщенной части пласта","Уровень свободной воды, где капиллярное давление равно нулю","Граница между газом и водой в пласте","Положение контакта важно для подсчёта запасов, размещения скважин и перфорации."],["К какому типу относится ловушка в выклинивающемся песчаном пласте?","К литологической","К стратиграфической под поверхностью несогласия","К структурной сводовой","К рифогенной","Коллектор замещается непроницаемой породой, поэтому экран создаётся изменением литологии, а не деформацией."],["Какая структура образует ловушки на контакте с поднимающимся телом соли?","Соляной диапир","Рифовый массив","Эрозионный останец","Грабен с погребённым выступом","Соль поднимается и изгибает пласты вокруг себя, создавая своды и экраны, что типично для Прикаспия."],["Что такое ГНК?","Газонефтяной контакт","Граница нижнего коллектора","Глубина начала конденсации","Газоводяной контакт","ГНК отделяет газовую шапку от нефтяной части."],["Что такое высота залежи?","Расстояние между кровлей в своде и контактом","Расстояние от ВНК до забоя скважины","Эффективная нефтенасыщенная толщина пласта","Толщина пласта-коллектора в своде","Высота залежи определяет, какая часть ловушки заполнена."],["Что такое точка замыкания ловушки?","Самая низкая изогипса, замыкающая структуру","Точка перегиба крыла складки","Самая высокая отметка свода структуры","Точка пересечения двух разломов","Ловушка может быть заполнена лишь до этой отметки."],["Что такое тектонически экранированная залежь?","Залежь, ограниченная разломом, перекрывающим коллектор","Залежь в своде антиклинали без разломов","Залежь в выклинивающемся коллекторе на моноклинали","Залежь под поверхностью стратиграфического несогласия","Экран образуется благодаря контакту коллектора с непроницаемой породой по разлому."],["Какие залежи получили название рукавообразных?","Залежи, приуроченные к руслам древних рек, характеризуются извилистостью контуров в плане, резкой изменчивостью состава и отсортированности песчаного материала, а также выпуклым основанием песчаной линзы","Залежи, приуроченные к отложениям крупных турбидитовых течений, формирующих удлиненные осадочные образования","Залежи, приуроченные к морским дельтовым образованиям, характеризующие подводные рукава дельты","Залежи, приуроченные к отложениям головных течений морского прибрежья","Форма «рукава» повторяет русло палеореки: контуры извилисты, песчаное тело врезано в подстилающие породы (выпуклое вниз основание), состав резко меняется. Это типичная литологическая залежь.","lzs-45"],["Какие типы залежей имеют наибольшее распространение в природном состоянии?","Сводовые (антиклинальные)","Литологические","Тектонически экранированные","Стратиграфические","Антиклинальные ловушки образуются при складчатости и встречаются чаще всего. Именно с ними связана большая часть открытых запасов; неантиклинальные ловушки сложнее выявлять.","lzs-46"],["Какие залежи носят название структурных?","Сводовые, тектонически-экранированные и приконтактные","Только антиклинальные","Приуроченные к структурам I порядка","Антиклинальные и моноклинальные","Структурные залежи образуются из-за деформации пластов. К ним относят сводовые, тектонически экранированные и приконтактные (у соляных и магматических тел), поэтому ограничиваться антиклиналями нельзя.","lzs-47"],["Как влияет на качество глинистых покрышек возрастание глубины залегания?","Сначала повышается, потом может значительно уменьшиться","Не влияет","Качество глинистых покрышек снижается","Качество глинистых покрышек только увеличивается","С глубиной глины уплотняются, поры сокращаются, и экранирующие свойства растут. На больших глубинах глины теряют пластичность, дегидратируются и растрескиваются, поэтому качество покрышки падает.","lzs-55"],["Какие факторы определяют экранирующие качества покрышки?","Мощность, литологические особенности, степень нарушенности сплошности, минеральный состав","Седиментационные условия","Только литология коллектора","Минералогические особенности и зона распространения","Экран зависит от совокупности свойств самой покрышки: толщины, литологии, минерального состава и отсутствия трещин и разрывов. Прочие варианты называют только часть факторов.","lzs-56"],["С какими процессами связано образование тектонических ловушек?","Формирование тектонических ловушек связано с образованием разломов и складок","Смещение блоков горных пород относительно друг друга только по вертикальной поверхности тектонического разрыва","Формирование тектонических ловушек связано с замещением пород","Формирование тектонических ловушек связано с миграцией углеводородов","Тектонические ловушки возникают при деформации толщ: складки образуют своды, а разломы — экраны. Замещение пород создаёт литологические ловушки, а миграция заполняет ловушки, но не создаёт их.","lzs-77"],["На какой стадии геологоразведочных работ, как правило, выделяется стратиграфическое положение региональных и зональных реперных горизонтов?","На стадии поисково-разведочных работ","На стадии подготовки объектов к поисковому бурению","На стадии разведки и пробной эксплуатации месторождения","На стадии промышленной эксплуатации месторождения","Региональные и зональные реперы нужны для обобщённого расчленения разреза ещё на ранней стадии, по первым глубоким скважинам. На разведке и эксплуатации работают уже с детальными местными реперами.","lzs-78"]]},{"name":"Генерация и миграция","q":[["Что такое нефтегазоматеринская порода?","Порода, в которой образуются углеводороды из органического вещества","Порода, в которой сейчас находится залежь","Порода, через которую мигрируют углеводороды","Порода с первичным заполнением ловушки","Такие породы, как правило, тонкозернистые и богаты органикой. Генерация начинается при достаточном прогреве."],["Что такое кероген?","Нерастворимое органическое вещество осадочных пород","Смесь асфальтенов и смол в тяжёлой нефти","Растворимая в органических растворителях часть ОВ","Продукт окисления нефти в зоне гипергенеза","При прогреве кероген распадается, образуя жидкие и газообразные углеводороды."],["В каком примерном интервале температур находится главная зона нефтеобразования?","60–150 °C","30–60 °C","150–220 °C","200–300 °C","При меньших температурах кероген незрел, а при больших образуется преимущественно газ. Границы зависят от типа керогена и скорости нагрева."],["Что такое первичная миграция?","Выход углеводородов из материнской породы в коллектор","Перемещение нефти по коллектору к ловушке","Переток нефти из залежи в вышележащую ловушку","Перемещение газа через покрышку диффузией","Вторичная миграция — это уже движение по коллекторам к ловушке."],["Какой показатель часто используют для оценки зрелости органического вещества?","Отражательную способность витринита (Ro)","Индекс водорода (HI)","Индекс кислорода (OI)","Общий органический углерод (Сорг)","Ro растёт с прогревом. Обычно значения примерно 0,5–1,3 % соответствуют нефтяному окну."],["С каким типом органики обычно связан кероген II типа?","С морским планктоном и бактериальным материалом","С гумусовым растительным материалом","С переотложенной окисленной органикой","С озёрными водорослями с высоким H/C (I тип)","Кероген II типа богат водородом и нефтегенерирующий. Кероген III типа наземный и дает больше газа."],["Что такое главная фаза нефтеобразования (ГФН)?","Этап наиболее интенсивной генерации нефти при погружении","Этап раннего образования биогенного газа","Этап вторичной миграции к ловушке","Этап образования жирного газа и конденсата","В этой зоне керогены теряют водород и выделяют жидкие углеводороды."],["Что является основной движущей силой вторичной миграции?","Плавучесть углеводородов в воде","Давление уплотнения глин в зоне генерации","Диффузия растворённых углеводородов","Капиллярное давление в покрышке","Нефть и газ легче воды и поднимаются к ловушке."],["Что такое биодеградация нефти?","Разрушение углеводородов бактериями в неглубоких залежах","Распад нефти при высокой температуре","Смешение нефтей разного генезиса","Осаждение асфальтенов при закачке газа","Бактерии потребляют лёгкие алканы, поэтому нефть становится тяжёлой и вязкой."],["Какая стадия катагенеза соответствует образованию основной части сухого газа?","Поздний катагенез (высокая температура)","Ранний мезокатагенез","Протокатагенез","Диагенез","С ростом температуры образуются всё более лёгкие углеводороды, и остаётся метан."],["В результате каких процессов нефть окисляется?","При обнажении нефтегазоматеринских толщ на дневной поверхности и их соприкосновении с кислородом","Никогда не окисляется","В результате опускания залежи углеводородов на большие глубины","В результате катастрофических стрессов","Для окисления нужен кислород, поэтому оно идёт у поверхности, в зоне гипергенеза: так образуются тяжёлые нефти и битумы. При погружении нефть, наоборот, попадает в восстановительную обстановку и подвергается термическому преобразованию.","lzs-54"]]},{"name":"Запасы и регионы","q":[["Какие запасы считаются наиболее изученными в российской классификации?","Категории А","Категории В1","Категории С1","Категории В2","Запасы А относятся к разрабатываемым залежам, разбуренным эксплуатационной сеткой. Категории D — это ресурсы, а не запасы."],["Какая свита считается главной нефтематеринской толщей Западной Сибири?","Баженовская","Тюменская","Абалакская","Покурская","Битуминозные отложения баженовской свиты верхней юры — нижнего мела формируют большую часть нефти региона. Доманик относится к Волго-Уралу."],["С какими отложениями связаны крупнейшие газовые залежи севера Западной Сибири?","С сеноманскими","С юрскими","С ачимовскими","С палеогеновыми","В сеноманских коллекторах под мощными туронскими глинами находятся газовые гиганты: Уренгой, Ямбург, Медвежье."],["Какая провинция включает Самотлорское месторождение?","Западно-Сибирская","Лено-Вилюйская","Тимано-Печорская","Волго-Уральская","Самотлор находится в ХМАО и является одним из крупнейших месторождений России."],["К какой провинции относится Ромашкинское месторождение?","Волго-Уральская","Тимано-Печорская","Прикаспийская","Днепровско-Припятская","Ромашкинское находится в Татарстане, а основные продуктивные пласты девонские."],["Как геологические запасы отличаются от извлекаемых?","Извлекаемые — часть геологических, которую можно добыть","Извлекаемые относятся только к разбуренным участкам","Геологические учитывают экономику, а извлекаемые — нет","Извлекаемые больше геологических на запасы растворённого газа","Связаны через КИН: извлекаемые = геологические × КИН."],["Какой метод часто используют для подсчёта запасов нефти?","Объёмный метод","Метод падения дебита для неразбуренных залежей","Метод материального баланса на стадии поиска","Метод сейсмических атрибутов без скважин","V = F·h·Kп·Kн·ρ·θ: площадь, толщина, пористость, насыщенность, плотность и пересчётный коэффициент."],["Что такое пересчётный коэффициент в подсчёте запасов нефти?","Величина, обратная объёмному коэффициенту нефти","Отношение плотности нефти к плотности воды","Отношение эффективной толщины к общей","Величина, обратная коэффициенту пористости","Он приводит пластовый объём к поверхностным условиям."]]},{"name":"Сейсморазведка","q":[["Какое из ниже названных условий является обязательным требованием к сейсморегистрирующей расстановке?","Амплитудная и фазовая идентичность каналов","Подобие динамического диапазона сейсмоприемников","Одинаковая глубина установки сейсмоприемников","Одинаковый коэффициент усиления каналов","Записи разных каналов сравниваются и суммируются, поэтому все каналы должны одинаково передавать амплитуду и фазу сигнала. Иначе различия в записи будут вызваны аппаратурой, а не геологией, и синфазное суммирование исказится.","lzs-0"],["Чем определяется плотность сети наблюдений?","Количеством погонных километров сейсмических профилей на 1 кв. км площади исследований","Объемом работ, выполняемых сейсмопартией","Количеством отработанных пунктов возбуждения","Суммарной длиной отработанных сейсмопрофилей","Плотность сети — удельная величина: длина профилей (пог. км), приходящаяся на единицу площади (км/км²). Объём работ, число пунктов возбуждения и суммарная длина профилей без привязки к площади плотность не характеризуют.","lzs-1"],["Какие разрывные нарушения показываются на картах?","Главные и второстепенные","Все нарушения видимые сейсмикой","Только наиболее крупные","Все нарушения в данном регионе","На картах показывают разломы с разделением по значимости: главные и второстепенные (их выделяют разным типом и толщиной линии). Сейсмика видит не все нарушения, а масштаб карты не позволяет показать все существующие.","lzs-7"],["Как показываются любые предполагаемые границы?","Штриховыми линиями","Никак не показывается","Сплошными линиями","Двойными жирными линиями","По правилам геологической графики достоверные границы проводят сплошной линией, а предполагаемые — штриховой (пунктирной). Так читатель карты видит степень надёжности построения.","lzs-8"],["Основным источником данных для построения структурной карты являются:","результаты сейсмических съемок и скважинная информация (керн и каротаж)","результаты гидродинамических исследований и сиквенс-стратиграфические построения","седиментологическая интерпретация керна и результаты его петрофизических исследований","динамический уровень жидкости в скважинах и карта дневной поверхности","Структурная карта показывает абсолютные отметки кровли горизонта. Форму поверхности между скважинами даёт сейсмика, а точные отметки в точках — скважинные данные (каротаж и керн).","lzs-9"],["Что означает понятие <тип волновой картины>?","Особенности изменения волнового поля, сопоставляемые с конкретным геологическим объектом","Область уменьшенных амплитуд отраженных волн","Область увеличенных амплитуд отраженных волн","Область смещенных осей синфазности","Тип волновой картины — это устойчивый рисунок записи (амплитуда, частота, форма осей), который можно связать с определённым геологическим телом. Отдельные амплитудные аномалии или смещение осей — лишь частные признаки.","lzs-28"],["Для чего выполняется анализ атрибутов сейсмического волнового поля?","Для прогнозирования свойств пород геологического разреза","Для определения невязок по времени","Для построения структурных карт","Для вычисления скоростей","Атрибуты (амплитуда, частота, когерентность и др.) статистически связывают со свойствами пород в скважинах и затем распространяют прогноз литологии и коллекторских свойств на межскважинное пространство.","lzs-29"],["Сейсмическая инверсия позволяет осуществить прогноз?","Коллекторских свойств пород","Скорости пробега упругих волн","Глубины залегания сейсмических границ","Геологического разреза","Инверсия преобразует волновое поле в акустический импеданс, связанный с пористостью и литологией. Поэтому она служит прогнозу коллекторских свойств в межскважинном пространстве.","lzs-72"],["Какой параметр наиболее сильно влияет на амплитуду отраженного сейсмического сигнала?","Коэффициент отражения","Акустическая жесткость слоя","Плотность горных пород","Скорость распространения упругих волн","Амплитуда отражённой волны прямо пропорциональна коэффициенту отражения на границе: R = (Z₂ − Z₁)/(Z₂ + Z₁). Плотность и скорость влияют только через него, причём важна не сама жёсткость слоя, а контраст на границе.","lzs-73"]]},{"name":"Литология и фации","q":[["Что понимается под термином - Компенсационная глубина карбонатонакопления?","Глубина, ниже которой кальций уже не откладывается на дне океана (скорость поступления карбоната кальция уравновешивается скоростью растворения кальцита на этой глубине)","Глубина, на которой кальций выпадает в осадок","Глубина, на которой формируются крупнейшие рифогенные постройки","Глубина формирования одиночных рифовых массивов","Это критическая глубина карбонатонакопления (CCD): с глубиной растворимость CaCO₃ растёт, и на определённом уровне растворение полностью компенсирует поступление карбоната. Ниже этого уровня карбонатные осадки не накапливаются. Рифы, наоборот, образуются на мелководье.","lzs-2"],["Рамп - это?","Склон бассейна","Рифовая постройка","Колония кораллов","Дельтовая лопасть","Рамп (карбонатный рамп) — пологий, почти без резкого перегиба склон, который постепенно переходит от мелководья к глубоководной части бассейна. От шельфа с бровкой он отличается отсутствием выраженного уступа. Рифовая постройка и колония кораллов — биогенные тела, а не форма склона.","lzs-3"],["Для какой обстановки седиментации характерны конседиментационные разломы?","Для дельтовой","Для мелководья","Для морского глубоководья","Для озерной","Дельты дают быстрое накопление мощных осадков на неуплотнённых глинах. Под их весом развиваются конседиментационные (ростовые) разломы, которые движутся одновременно с осадконакоплением, поэтому мощность толщи резко увеличивается в опущенном крыле.","lzs-4"],["Для какой обстановки седиментации характерны конседиментационные разломы?","Для дельтовой","Для озерной","Для турбидитовой","Для пойменной","Классическая обстановка ростовых разломов — дельта: большая скорость осадконакопления и гравитационное оползание осадков по неуплотнённым глинам. Турбидиты — это отложения мутьевых потоков, а не обстановка, порождающая такие разломы.","lzs-5"],["Какие данные необходимы для корректной диагностики и идентификации обстановок осадконакопления по керну скважин?","Необходима классификационная схема обстановок терригенного осадконакопления, охватывающая все многообразие типов, подтипов и индивидуальных литогенетических единиц легко распознаваемых как в обнажениях, так и в керне скважин","Необходимы эталонные геофизические разрезы скважин с привязкой основных керновых данных","Необходимы эталонные коллекции керна с подробным описанием всех морфологических типов текстур","Необходимы таблицы текстур и структур, разработанные для каждого региона","Диагностика — это отнесение наблюдаемого объекта к определённому классу, поэтому нужна единая классификационная схема обстановок, применимая и к обнажениям, и к керну. Остальные варианты — вспомогательные материалы: эталонные разрезы, коллекции и таблицы текстур сами по себе обстановку не определяют.","lzs-6"],["Какие процессы характерны для стадии гипергенеза?","Характерны процессы гидратации, окисления, восстановления и растворения","Процессы тепловой переработки минералов под действиями высоких температур и давлений","Процесс физического разрушения уже образованных консолидированных осадочных горных пород","Процесс химической переработки осадочного материала","Гипергенез идёт у поверхности под действием воды, кислорода и органики. Для него типичны химические реакции выветривания: гидратация, окисление, восстановление, растворение. Физическое разрушение — лишь часть процесса, а тепловая переработка относится к метаморфизму.","lzs-44"]]},{"name":"Корреляция и строение разреза","q":[["Что такое стратиграфическое расчленение разрезов?","Выделение в конкретном разрезе стратиграфических подразделений по их литологическим, физическим особенностям или составу остатков древних организмов.","Выделение в конкретном разрезе стратиграфических объёмов равных по толщине.","Выделение в конкретном разрезе литологически однородных толщ вне зависимости от их стратиграфической приуроченности.","Выделение в конкретном разрезе литологически разнородных толщ вне зависимости от их стратиграфической приуроченности","Расчленение — это выделение в разрезе стратиграфических подразделений по совокупности признаков: литология, физические свойства, палеонтологические остатки. Равенство толщин значения не имеет, а признак стратиграфической приуроченности обязателен.","lzs-13"],["Какая операция является первостепенной при проведении корреляционных построений?","Типизация разрезов и наметка линий корреляции","Построение стратиграфического каркаса","Обработка геофизических материалов","Машинная корреляция","Сначала разрезы скважин группируют по типам и намечают линии, по которым их будут сопоставлять. Каркас строится уже на этой основе, а машинная корреляция лишь проверяет и детализирует результат.","lzs-14"],["Что такое маркер ?","Пласт или серий пластов, хорошо выдержанных по простиранию и легко отличающихся по литологическим признакам от покрывающих и подстилающих пород","Слои (пласт) значительной мощности, характеризующийся четкой геофизической характеристикой и значительным содержанием органического вещества","Слой (пласт, горизонт) четко выделяемый на сейсмических разрезах","Пласт, содержащий обильную макрофауну","Маркер (репер) ценен выдержанностью по площади и узнаваемостью в разрезе, поэтому он служит опорной границей для корреляции. Большая мощность, органика или фауна для него не обязательны.","lzs-15"],["Что понимают под процедурой корреляции ?","Процедура прослеживания и сопоставления продуктивных горизонтов (пластов) в межскважинном пространстве","Процедура прослеживания биомаркеров в региональном плане","Процедура построения профильных разрезов глубинного строения продуктивных горизонтов","Копирование на светостоле каротажных кривых с целью выявления особенностей их конфигурации","Корреляция — это сопоставление разрезов скважин и прослеживание одновозрастных пластов между ними. Профильный разрез — уже результат корреляции, а наложение кривых лишь один из её старых приёмов.","lzs-16"],["В чем отличие активных окраин континентов от пассивных?","Активные окраины характеризуются повышенной сейсмической и вулканической активностью","Активные окраины испытывают постоянное наращивание мантийным веществом","Активные окраины отличаются от пассивных наличием большого количества сдвиговых нарушений","Активные окраины формируются в зоне субдукции, а пассивные - в зоне спрединга","Активная окраина находится на границе литосферных плит, поэтому там часты землетрясения и вулканы. Пассивная окраина лежит внутри плиты и тектонически спокойна; сама она не является зоной спрединга, хотя и возникла при раскрытии океана.","lzs-79"],["Дайте определение: Зона субдукции - это?","Линейная зона, вдоль которой происходит погружение одних блоков земной коры под другие","Базальная зона вдоль которой проявляется влияние контакта с ледниковым ложем","Зона океанского рифтогенеза","Зона эрозионного тектонического срезания","В зоне субдукции одна литосферная плита, обычно океаническая, погружается под другую. Рифтогенез — противоположный процесс раздвижения.","lzs-80"]]},{"name":"Практические ситуации","q":[["Что ограничивает вертикальную разрешающую способность сейсморазведки?","Преобладающая частота и скорость, примерно четверть длины волны","Шаг между пунктами приёма и кратность наблюдений","Мощность источника и уровень регистрации","Плотность сетки профилей и размер бина","Пласт тоньше λ/4 не разделяется отдельными отражениями, поэтому тонкие коллекторы часто не видны."],["Как привязывают сейсмику к скважине?","Строят синтетическую сейсмограмму по АК и ГГК с импульсом","Строят скоростную модель по преломлённым волнам","Переводят кривую ГК во время по средней скорости","Сопоставляют глубины ОГ со структурной картой соседнего участка","Синтетика переводит глубины во время и связывает отражения с пластами, а ВСП и check-shot уточняют связь."],["Вероятность успеха поисковой скважины оценивают как:","Произведение вероятностей существования коллектора, ловушки, покрышки, заряда и сохранности","Отношение числа открытий к числу скважин по соседнему нефтегазоносному району","Среднее взвешенное вероятностей ловушки, коллектора, покрышки и заряда","Вероятность наименее изученного из элементов системы, взятая без умножения","Для открытия нужны все элементы, поэтому геологические вероятности перемножают."],["Как отличить аномалию амплитуды от газа и от литологии?","Сопоставить с AVO, структурой, контактом и скважинами","Сравнить амплитуду со средней по кубу","Определить по частоте на временном разрезе","Определить по глубине залегания горизонта","Яркое пятно может быть вызвано угленосной пачкой или карбонатом. Подтверждающие признаки повышают надёжность."],["На каротаже ГК низкий, ПС отрицательная, сопротивление высокое, нейтронный и плотностной близки. Что это, вероятнее всего?","Нефтенасыщенный чистый песчаник","Глина с высоким содержанием органики","Водонасыщенный песчаник с пресной водой","Плотный ангидрит с нулевой пористостью","Чистый коллектор даёт низкий ГК, а высокое сопротивление при наличии пористости указывает на углеводороды."],["Кроссовер нейтронного и плотностного каротажа в коллекторе чаще всего указывает на:","Газ","Глинистость","Нефть высокой вязкости","Минерализованная вода","Газ занижает нейтронную и плотностную плотность, поэтому кривые расходятся характерным образом."],["Какие признаки разлома заметны на сейсмике?","Смещение и обрыв осей синфазности, смена рисунка записи","Плавное утонение пласта при постоянной амплитуде","Рост амплитуды вдол
