<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Тренажёр нефтегазовых компетенций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: sign-in, then two assessment tiles, then a mosaic of colour-coded topics with drawn equipment; results follow the assessment scale chart. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --line:#D3DCDA; --fg:#13262B; --muted:#546569;
  --petrol:#0E5A63; --on-petrol:#F4FAF9; --red:#CF1F2B;
  --ok:#14774A; --ok-bg:#DDF2E6; --bad:#B4232E; --bad-bg:#FBE3E3; --warn:#8A5A00; --warn-bg:#F8ECD0;
  --lv1:#EE5A36; --lv2:#F4D94E; --lv3:#8FE07A; --lv4:#2C7A36; --lv5:#3D9BE0; --lvtext:#13262B;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181B; --surface:#16252A; --line:#2D4046; --fg:#E7EFEE; --muted:#9AAEB1;
  --petrol:#3FB3BD; --on-petrol:#06262A; --red:#FF7A7A;
  --ok:#59D39A; --ok-bg:#123A2A; --bad:#FF8E8E; --bad-bg:#47191D; --warn:#EDBE62; --warn-bg:#3A2C0C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181B; --surface:#16252A; --line:#2D4046; --fg:#E7EFEE; --muted:#9AAEB1;
  --petrol:#3FB3BD; --on-petrol:#06262A; --red:#FF7A7A;
  --ok:#59D39A; --ok-bg:#123A2A; --bad:#FF8E8E; --bad-bg:#47191D; --warn:#EDBE62; --warn-bg:#3A2C0C;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.tag{font:500 12px/1.3 var(--mono);letter-spacing:.04em;color:var(--muted)}
h1{font:700 clamp(24px,5vw,36px)/1.18 var(--display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font:500 18px/1.3 var(--display);margin:30px 0 12px}
.lead{margin:10px 0 0;color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:11px 18px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--petrol)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.stop{color:var(--red);border-color:var(--red);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:4px 0;color:var(--petrol);font-weight:600}
.bar-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.who{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pill{font:500 12px var(--mono);padding:4px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.pill.on{background:var(--ok-bg);color:var(--ok)}

/* Sign-in */
.gate{max-width:440px;margin:6vh auto 0}
.art-row{display:flex;gap:8px;margin-bottom:18px}
.art-row span{flex:1;border-radius:8px;padding:6px;display:block}
.art-row svg{display:block;width:100%;height:auto}
form label{display:block;font-weight:600;margin-top:14px}
form input{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
form .btn{width:100%;margin-top:18px}
.err{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.small{font-size:14px;color:var(--muted);margin:12px 0 0}

/* Home */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.tile{display:flex;flex-direction:column;text-align:left;border:0;border-radius:12px;padding:0;overflow:hidden;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tile:hover .tname{color:var(--petrol)}
.mosaic{display:grid;grid-template-columns:repeat(5,1fr)}
.mosaic span{padding:6px;display:block}
.mosaic svg{display:block;width:100%;height:auto}
.tbody{padding:16px 18px 18px}
.tname{font:700 clamp(17px,2.6vw,21px)/1.25 var(--display);display:block}
.tbody small{display:block;color:var(--muted);margin-top:6px;font-size:15px}
.meter{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--petrol)}
.wide{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:12px;padding:16px 18px;text-align:left}
.wide:hover b{color:var(--petrol)}
.wide b{font:700 17px/1.3 var(--display)}
.wide span span{display:block;color:var(--muted);font-size:15px}

/* Section */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.size{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:6px;font-size:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.card{display:flex;flex-direction:column;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface);text-align:left}
.card .pic{display:block;padding:10px 22px;background:var(--c)}
.card .pic svg{display:block;width:100%;height:auto;max-height:96px}
.card:hover .pic{filter:brightness(1.06)}
.card b{display:block;padding:10px 12px 2px;line-height:1.3;font-weight:600}
.card small{display:block;padding:0 12px 12px;color:var(--muted);font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.topicbar{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px}
.topicbar .pic{display:block;padding:8px;border-radius:8px;background:var(--c)}
.topicbar svg{display:block;width:100%;height:auto}
.sublist{display:flex;flex-direction:column;gap:8px}
.sub{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid transparent;border-radius:8px;padding:12px 14px;text-align:left}
.sub:hover{border-color:var(--c,var(--petrol))}
.sub span:last-child{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}

/* Test sheet */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.count{margin-left:auto;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;background:var(--c,var(--petrol));transition:width .25s}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,32px)}
.topic{font-size:18px;line-height:1.35;margin:4px 0 20px}
.q{color:var(--red);font:500 clamp(21px,3.6vw,27px)/1.35 var(--body);margin:4px 0 16px;text-wrap:pretty}
.hint{font-size:14px;font-weight:600;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.opt:hover{background:color-mix(in srgb,var(--petrol) 8%,transparent)}
.opt input{margin:4px 0 0;width:18px;height:18px;accent-color:var(--petrol)}
.opt.picked{border-color:var(--petrol)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);cursor:not-allowed}
.opt.bad span{text-decoration:line-through}
.opt.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.off{cursor:default}
.opt.off:hover{background:none}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .32s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;font-weight:600}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.note{background:var(--warn-bg);color:var(--warn)}
.expl{margin-top:14px;padding:14px;border-radius:8px;background:var(--ok-bg)}
.expl h3{margin:0 0 4px;font-size:15px;color:var(--ok)}
.expl p{margin:0;white-space:pre-line}
.expl.miss-e{background:var(--bad-bg)}
.expl.miss-e h3{color:var(--bad)}
.expl .ans{font-weight:600;margin-bottom:6px}
.q.long{font-size:clamp(17px,2.6vw,20px)}
.q p{margin:0 0 10px;white-space:pre-line}
.q table{border-collapse:collapse;margin:0 0 12px;font-size:15px;color:var(--fg);max-width:100%}
.q th,.q td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.q th{font-weight:600}
.lv{display:inline-block;margin-left:8px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.levels{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:20px}
.keys{margin:12px 0 0;font-size:13px;color:var(--muted)}
@media (hover:none){.keys{display:none}}

/* Assessment chart */
.report{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.scale-table{border:1px solid var(--lvtext);background:#fff;color:#13262B;font-size:14px;border-radius:4px;overflow:hidden}
.st-row{display:grid;grid-template-columns:minmax(0,38%) 52px minmax(0,1fr);align-items:stretch;border-top:1px solid #AEBBB9}
.st-row:first-child{border-top:0}
.st-row>div{padding:6px 8px;display:flex;align-items:center;min-width:0}
.st-row .pct{justify-content:flex-end;font-weight:700;font-variant-numeric:tabular-nums;border-left:1px solid #AEBBB9;border-right:1px solid #AEBBB9;padding:6px 6px}
.st-row.group{border-top:2px solid #13262B}
.st-row.group .nm{font-weight:700;font-size:15px}
.st-row.st-sub .nm{padding-left:18px;font-size:13px}
.st-row .track2{padding:4px 0;position:relative}
.fill{display:block;height:20px;min-width:2px}
.fill.none{height:0}
.st-head .scale{padding:0;display:block}
.bands{display:grid;grid-template-columns:30fr 20fr 20fr 20fr 10fr;width:100%}
.bands span{padding:4px 2px;text-align:center;font-size:11px;line-height:1.15;display:flex;align-items:center;justify-content:center;min-height:42px;color:#13262B}
.bands .b4{color:#fff}
.b1{background:var(--lv1)}.b2{background:var(--lv2)}.b3{background:var(--lv3)}.b4{background:var(--lv4)}.b5{background:var(--lv5)}
.ticks{display:grid;grid-template-columns:repeat(10,1fr);font:500 11px var(--mono);text-align:right;border-top:1px solid #AEBBB9}
.ticks span{padding:1px 2px 1px 0}
.overall .fill{height:14px}
.side{background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px}
.side dt{color:var(--muted);font-size:13px;margin-top:10px}
.side dd{margin:0;font-weight:600}
.side dt:first-child{margin-top:0}
.side .prof{color:var(--red)}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:700 22px/1.15 var(--display);font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 12px 10px 0;overflow:hidden}
.rec i{align-self:stretch;display:block}
.rec p{margin:0}
.rec p small{display:block;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hrow span:last-child{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.miss{padding:14px 0;border-top:1px solid var(--line)}
.miss p{margin:4px 0 0;white-space:pre-line}
.miss .mq{font-weight:600;white-space:pre-line}
.miss .a{color:var(--ok);font-weight:600}
.transfer textarea{width:100%;height:96px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 12px var(--mono)}
.rowbtn{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

@media (max-width:720px){
  .report{grid-template-columns:minmax(0,1fr)}
  .side{order:-1}
  .st-row{grid-template-columns:minmax(0,1fr) 52px}
  .st-row .track2{grid-column:1 / -1;border-top:1px solid #DDE4E2}
  .st-row .scale{grid-column:1 / -1}
  .st-row .pct{border-right:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .tiles{grid-template-columns:minmax(0,1fr)}
  .size{margin-left:0;width:100%}
  .acts .btn,.controls>.btn{flex:1 1 100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topicbar{grid-template-columns:80px minmax(0,1fr)}
}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script src="config.js"></script>
<script>
const DATA = {"prof":[{"id":"prod","name":"Добыча нефти и газа","subs":[{"name":"Внутрискважинное оборудование","q":[["Для чего служат насосно-компрессорные трубы (НКТ)?","Для подъёма продукции и закачки агентов внутри эксплуатационной колонны","Для крепления ствола и разобщения пластов в интервале продуктивного горизонта","Для передачи вращения от ротора к забойному инструменту","Для подачи раствора к забою и передачи осевой нагрузки на долото","НКТ подбирают по дебиту и условиям работы; они защищают эксплуатационную колонну."],["Что такое циркуляционный клапан в компоновке НКТ?","Клапан для сообщения НКТ с затрубным пространством","Клапан, отсекающий поток при аварии на устье","Обратный клапан над приёмом ЭЦН","Клапан перепуска газа из затрубья в выкидную линию","Он используется при промывках и глушении скважин."],["Для чего применяют забойный штуцер?","Для ограничения дебита и снижения давления в потоке","Для подъёма продукции и закачки агентов внутри эксплуатационной колонны","Для герметизации затрубного пространства","Для удержания песка в призабойной зоне","Штуцер создаёт сопротивление и стабилизирует режим."],["Что такое фильтр на забое?","Устройство, удерживающее песок при притоке продукции","Устройство для разделения нефти и воды в стволе","Сетка на приёме устьевого манометра","Элемент, задерживающий парафин в НКТ","Фильтры защищают оборудование от абразивного выноса."],["Какую функцию выполняет посадочный ниппель?","Посадка и фиксация внутрискважинных инструментов","Герметизация кольцевого пространства под пакером","Подвеска НКТ в колонной головке","Центрирование НКТ в обсадной колонне","В ниппель можно установить заглушку или клапан."],["Что предотвращает клапан-отсекатель?","Неконтролируемое истечение продукции при аварии на устье","Срыв подачи насоса при высоком газосодержании","Переток воды между пластами за колонной","Обратный слив жидкости при остановке ЭЦН","Клапан закрывается при потере управляющего давления или потоке выше заданного."]]},{"name":" ье выросло, дебит снизился, а частота ЭЦН не менялась. Что проверить?","Штуцер, линию и отложения на выкиде","Положение ВНК у скважины","Пластовое давление на участке","Газовый фактор на режиме насоса","Сопротивление после устья поднимает давление и сдвигает рабочую точку насоса."]]}],"color":"#0E8F6E"},{"id":"drill","name":"Бурение скважин","subs":[{"name":"Инструмент и оборудование","q":[["Как разрушают породу долота PDC?","Срезанием породы резцами","Дроблением и скалыванием зубьями шарошек","Ударно-вращательным внедрением вставок","Истиранием импрегнированной алмазной матрицей","Поликристаллические алмазные резцы срезают породу. Шарошечные долота работают дробяще-скалывающим способом."],["За счёт чего обычно создаётся нагрузка на долото?","За счёт веса утяжелённых бурильных труб (УБТ)","За счёт веса бурильных труб всей колонны","За счёт давления на стояке","За счёт натяжения талевого каната","Бурильные трубы работают на растяжение, а сжимающую нагрузку на долото создают УБТ в нижней части компоновки."],["Что позволяет телесистема MWD?","Измерять траекторию и параметры бурения в реальном времени","Выполнять полный комплекс ГИС после подъёма инструмента","Задавать направление отклонения через роторную систему","Отбирать боковые образцы породы","Датчики у долота передают данные по гидроканалу или электромагнитным сигналом, что нужно при наклонно-направленном бурении."],["Что приводит в действие винтовой забойный двигатель?","Поток бурового раствора","Вращение бурильной колонны от ротора","Сжатый азот, подаваемый по кольцевому каналу","Энергия упругой деформации бурильных труб","Раствор, проходя через пару статор–ротор, вращает ротор двигателя и долото. Бурильная колонна при этом может не вращаться."],["Что показывает вынос керна?","Отношение длины поднятого керна к длине пройденного интервала отбора","Отношение пройденного интервала к глубине скважины","Отношение длины поднятого керна к интервалу по всей глубине скважины","Отношение пористости керна к пористости по данным ГИС в том же интервале","Чем выше вынос, тем полнее представлен разрез. Показатель обычно выражают в процентах."],["Для чего служит вертлюг?","Для подвода раствора во вращающуюся колонну и удержания её веса","Для передачи крутящего момента на бурильную колонну","Для равномерного расположения колонны в стволе при цементировании","Для перекрытия осложнённых интервалов до бурения ниже","Он соединяет неподвижную часть талевой системы с вращающейся бурильной колонной."],["Что такое ведущая труба (квадрат)?","Труба, передающая вращение от ротора к бурильной колонне","Толстостенная труба над долотом для создания нагрузки","Первая труба компоновки с калибратором","Переводник между бурильными трубами и забойным двигателем","Квадратное сечение позволяет ротору передавать крутящий момент."],["Для чего нужны центраторы на обсадной колонне?","Для равномерного расположения колонны в стволе при цементировании","Для направления забойного двигателя при наборе кривизны","Для подвода раствора во вращающуюся колонну и удержания её веса","Для перекрытия осложнённых интервалов до бурения ниже","При центрированной колонне цемент лучше вытесняет раствор и образует сплошное кольцо."],["Как устроена буровая установка для кустового бурения?","Установка, перемещаемая по рельсам между скважинами на кусте","Вышечно-лебёдочный блок перемещается по направляющим между устьями","Вся установка разбирается и монтируется заново на каждом устье","Несколько вышек работают одновременно на каждое устье","Это сокращает время монтажа при бурении многих скважин с одной площадки."]]},{"name":"Буровые растворы","q":[["Что не является функцией бурового раствора?","Увеличение проницаемости продуктивного пласта","Передача гидравлической энергии забойному двигателю","Удержание шлама во взвешенном состоянии при остановке","Глинизация стенок ствола скважины","Раствор выносит шлам, удерживает пласт, охлаждает инструмент и укрепляет стенки. В коллекторе он, наоборот, может ухудшать проницаемость."],["Какой прибор используют для измерения условной вязкости раствора в полевых условиях?","Воронку (ВБР, Марша)","Ротационный вискозиметр","Ареометр АБР","Фильтр-пресс ВМ-6","Условная вязкость — это время истечения заданного объёма раствора через воронку. Метод прост и применяется прямо на буровой."],["По какому принципу выбирают плотность бурового раствора?","Чтобы гидростатическое давление с нормативным запасом превышало пластовое","Чтобы гидростатическое давление было равно пластовому","Чтобы забойное давление превышало давление гидроразрыва","Чтобы плотность равнялась среднему градиенту горного давления","Малая плотность грозит ГНВП, а излишняя — поглощениями и гидроразрывом, поэтому работают в безопасном окне давлений."],["Что учитывает эквивалентная циркуляционная плотность (ЭЦП)?","Гидростатику столба раствора и потери давления в затрубье при циркуляции","Гидростатику столба раствора без учёта движения","Гидростатику столба раствора и давление насосов на стояке при промывке","Плотность раствора в трубах и потери давления в долоте при циркуляции","При циркуляции забойное давление выше статического. Если ЭЦП слишком высока, возможно поглощение раствора."],["Что характеризует водоотдача бурового раствора?","Способность отдавать фильтрат в проницаемый пласт","Способность удерживать шлам при остановке циркуляции","Количество воды, поступающей из пласта в раствор","Скорость разрушения глинистой корки","Высокая водоотдача ухудшает коллектор и вызывает набухание глин. Её контролируют реагентами."],["Для чего применяют барит?","Для утяжеления бурового раствора","Для снижения фильтрации через глинистую корку","Для увеличения вязкости без роста плотности","Для повышения pH бурового раствора","Плотность барита около 4,2 г/см³, поэтому он эффективно поднимает плотность."],["Какой раствор лучше сохраняет устойчивость глин?","Инвертно-эмульсионный на углеводородной основе","Пресный полимерный раствор без ингибиторов","Известково-битумный раствор на морской воде","Гуматно-лигносульфонатный раствор","Углеводородная среда препятствует гидратации глин, поэтому такие растворы применяют на сложных участках."],["Что такое тиксотропия раствора?","Способность загустевать в покое и разжижаться при движении","Снижение вязкости раствора при росте температуры","Способность раствора удерживать фильтрат","Зависимость плотности раствора от давления","Структура удерживает шлам при остановке циркуляции."]]},{"name":"Конструкция и крепление скважин","q":[["Для чего служит кондуктор?","Для перекрытия верхних неустойчивых и водоносных отложений и установки ПВО","Для предотвращения размыва устья при бурении под направление","Для равномерного расположения колонны в стволе при цементировании","Для подвода раствора во вращающуюся колонну и удержания её веса","Кондуктор изолирует пресноводные горизонты и обеспечивает опору для устьевого оборудования."],["Какова главная цель цементирования обсадной колонны?","Разобщение пластов и закрепление колонны","Повышение несущей способности устья и снижение веса колонны","Снижение проницаемости продуктивного пласта на забое","Выравнивание диаметра ствола перед спуском колонны","Цементный камень предотвращает перетоки между пластами и защищает колонну от коррозии и нагрузок."],["Что такое эксплуатационная колонна?","Обсадная колонна, по которой добывается продукция или закачивается вода","Промежуточная колонна, перекрывающая зоны осложнений","Первая обсадная колонна, перекрывающая неустойчивые верхние отложения","Колонна труб, по которой к забою подают буровой раствор и нагрузку","Она перекрывает весь ствол до продуктивного пласта и обеспечивает работу скважины."],["Для чего служит техническая (промежуточная) колонна?","Для перекрытия осложнённых интервалов до бурения ниже","Для подъёма жидкости к устью при освоении","Для обеспечения посадки ПВО на устье при бурении под кондуктор","Для разобщения эксплуатационного объекта с вышележащими","Она изолирует зоны поглощений, обвалов или аномальных давлений."],["Что такое ОЗЦ?","Ожидание затвердевания цемента","Определение зоны цементирования","Опрессовка затрубного цемента","Обработка забойной цементной пробки","Перед продолжением работ цементный камень должен набрать прочность."]]},{"name":"Траектория и режимы бурения","q":[["Что такое зенитный угол скважины?","Угол между осью скважины и вертикалью","Угол между проекцией ствола и направлением на север","Угол между осью скважины и горизонталью","Угол изменения кривизны на 10 м проходки","Зенитный угол показывает отклонение ствола от вертикали, а азимут — направление этого отклонения в плане."],["Что означает бурение на депрессии?","Давление в стволе поддерживается ниже пластового","Забойное давление поддерживается равным давлению гидроразрыва","Бурение с промывкой воздухом на репрессии","Бурение с регулируемым давлением выше пластового","Такой подход сохраняет призабойную зону и повышает скорость бурения, но требует специального устьевого оборудования и контроля притока."],["Какие параметры входят в режим бурения?","Нагрузка на долото, частота вращения и расход раствора","Плотность, вязкость и водоотдача раствора","Диаметр долота, тип шарошек и компоновка низа","Плотность, условная вязкость и водоотдача раствора","От их сочетания зависят механическая скорость и износ долота."],["Что такое отход скважины?","Горизонтальное смещение забоя от устья","Смещение ствола от проектной траектории","Разница между длиной ствола и вертикальной глубиной","Расстояние между соседними устьями на кусте","Отход и азимут определяют положение забоя в плане."]]},{"name":"Осложнения при бурении","q":[["Что вызывает дифференциальный прихват инструмента?","Прижатие колонны к стенке перепадом давления против проницаемого пласта","Заклинивание долота в суженном участке из-за износа по диаметру","Осыпание стенок при снижении плотности раствора","Осыпание глин и сужение ствола против непроницаемой неустойчивой толщи","Давление в скважине выше пластового и прижимает трубы к фильтрационной корке. Риск возрастает при неподвижном инструменте."],["При каком условии возникает поглощение бурового раствора?","Когда давление в скважине превышает давление поглощения пласта","Когда статический уровень раствора выше устья","Когда пластовое давление превышает забойное","Когда плотность раствора меньше плотности фильтрата","Раствор уходит в трещины или высокопроницаемые пласты. Снижение уровня может вызвать ГНВП, поэтому поглощение опасно вдвойне."],["Как обычно борются с поглощением?","Вводят кольматирующие материалы и снижают давление на пласт","Увеличивают плотность раствора для тампонирования трещин","Повышают расход насосов для промыва зоны","Переходят на раствор с высокой водоотдачей","Волокна, чешуйки и гранулы закупоривают каналы, а снижение плотности уменьшает перепад."],["Что такое сальник на бурильной колонне?","Налипание шлама и глины вокруг инструмента","Уплотнительный элемент в превенторе","Скопление цементной корки в обсадной колонне","Желобная выработка в стенке ствола","Сальник ухудшает циркуляцию и может вызвать прихват."]]},{"name":"Вскрытие пласта, консервация и ликвидация","q":[["Кто несет ответственность за качество проведения работ по консервации, сохранность скважин, проверку их состояния?","Пользователь недр","Подрядчик по геологическому сервису","Заказчик-недропользователь и подрядчик","Подрядчик, производивший консервацию скважины","Обязанность обеспечить безопасную консервацию и сохранность скважин лежит на пользователе недр как на владельце лицензии. Он может нанять подрядчика, но от ответственности перед надзором это его не освобождает.","lzs-20"],["На какой срок производится консервация части ствола скважин, защищенного обсадной колонной, при сезонном характере работ?","До продолжения строительства","3 месяца","1 месяц","6 месяцев","Ствол, закреплённый обсадной колонной, защищён от осыпания и пластовых флюидов, поэтому жёсткий короткий срок не нужен. При сезонных работах такую скважину держат законсервированной до возобновления строительства.","lzs-21"],["Каким из перечисленных способов проверяется наличие цементных мостов при ликвидации скважин?","Разгрузкой бурильного инструмента или НКТ на цементный мост","Опрессовкой колонны","При спуске инструмента на канате","С помощью ГИС","Наличие и прочность моста проверяют механически: на него ставят бурильные трубы или НКТ с нагрузкой. Если мост держит нагрузку и инструмент не проходит, он сформирован. Опрессовка показывает герметичность, а не положение моста.","lzs-59"],["Каким типом жидкости необходимо заполнить верхнюю часть скважины при консервации скважины с открытым стволом?","Незамерзающей жидкостью","Водным раствором ПАВ","Нефтью или дизельным топливом","Буровым раствором","В верхней части ствола возможно промерзание, поэтому туда закачивают незамерзающую жидкость. Это защищает устье и колонну от повреждения льдом, а остальной ствол остаётся заполнен раствором.","lzs-60"],["Допустимая концентрация твердой фазы в буровом растворе, при вскрытии пласта, должна быть не более:","0,5 - 1 %","1,5%","0,95 %","0,7 %","Твёрдые частицы проникают в поры и закупоривают их, ухудшая проницаемость призабойной зоны. Поэтому при вскрытии пласта их содержание стремятся свести к минимуму, порядка долей процента — одного процента.","lzs-82"],["Для чего в промывочную жидкость при первичном вскрытии пласта вводят поверхностно-активные вещества?","все ответы верны","уменьшение поверхностного натяжения на границе раздела вода- углеводородная среда","препятствие образованию эмульсий в пористой среде","уменьшение капиллярного давления в поровых каналах","ПАВ снижают поверхностное натяжение, что уменьшает капиллярное давление и облегчает удаление фильтрата из пор, а также препятствуют образованию эмульсий. Все эффекты взаимосвязаны и сохраняют проницаемость пласта.","lzs-83"]]},{"name":"Буровая гидравлика и контроль","q":[["Какое соотношение должно быть при бурении обычно?","Давление столба раствора выше пластового, но ниже ГРП","Давление столба раствора выше ГРП, но ниже геостатического","Давление столба раствора выше давления ГРП","Давление столба раствора ниже пластового, но выше порового","Окно между поровым давлением и давлением разрыва."],["Что такое аномально высокое пластовое давление?","Давление выше гидростатического","Давление ниже гидростатического","Давление в зоне поглощения","Давление насосов на стояке","АВПД опасно ГНВП."],["Какой признак начинающегося ГНВП является основным?","Рост уровня в приёмных ёмкостях","Снижение нагрузки на крюке без причины","Падение крутящего момента","Рост температуры на вибросите","Также — уменьшение давления на стояке и увеличение скорости потока."],["Что делают в первую очередь при обнаружении притока?","Герметизируют устье и фиксируют давление","Поднимают инструмент на максимальной скорости","Увеличивают нагрузку на долото","Снижают плотность раствора","Действуют по плану ликвидации по профессии."],["Что такое метод бурильщика?","Вымыв пачки двумя циркуляциями с заменой раствора во второй","Вымыв пачки за один цикл утяжелённым раствором сразу","Закрытие превентора и стравливание пачки через дроссель без циркуляции","Метод расчёта профиля скважины","Метод ожидания и утяжеления — одна циркуляция."],["Что показывает тест на приёмистость пласта (LOT)?","Давление начала поглощения под башмаком колонны","Давление притока из пласта при опрессовке колонны","Давление продавки цемента за башмаком колонны","Давление разрушения долота","По нему определяют окно плотности раствора."],["Какой параметр раствора отвечает за вынос шлама?","Реологические свойства","Температура в ёмкости","Содержание хлор-иона","Плотность воздуха в трубах","Важны ДНС, СНС и скорость в затрубье."],["Что такое СНС бурового раствора?","Прочность геля после покоя","Содержание нефти в растворе","Скорость нагнетания на стояке","Смачиваемость породы","Тиксотропия удерживает шлам в покое."],["Что такое водоотдача раствора?","Объём фильтрата через фильтр за заданное время","Объём раствора, потерянный при поглощении за цикл","Потеря раствора в циркуляции","Объём воды, выделившейся при отстое раствора в покое","Высокая водоотдача загрязняет пласт и даёт толстую корку."],["Какие признаки указывают на осыпание глин?","Много крупного шлама и затяжки при подъёме","Падение давления и уход раствора","Мелкий шлам и рост давления на стояке при промывке","Падение нагрузки на крюке и снижение плотности","Лечат повышением плотности и ингибированием."],["Глубина 2000 м, плотность раствора 1200 кг/м³, потери в затрубье 3 МПа (g ≈ 10). Каково забойное давление при циркуляции?","27 МПа","24 МПа","21 МПа","30 МПа","Статика: 1200 × 10 × 2000 = 24 МПа\nПри циркуляции добавляем потери в затрубье: 24 + 3 = 27 МПа"],["Глубина 2500 м, плотность раствора 1300 кг/м³, потери в затрубье 1 МПа (g ≈ 10). Каково забойное давление при циркуляции?","33,5 МПа","32,5 МПа","31,5 МПа","34,5 МПа","Статика: 1300 × 10 × 2500 = 32,5 МПа\nПри циркуляции добавляем потери в затрубье: 32,5 + 1 = 33,5 МПа"],["Глубина 3000 м, плотность раствора 1400 кг/м³, потери в затрубье 3 МПа (g ≈ 10). Каково забойное давление при циркуляции?","45 МПа","42 МПа","39 МПа","48 МПа","Статика: 1400 × 10 × 3000 = 42 МПа\nПри циркуляции добавляем потери в затрубье: 42 + 3 = 45 МПа"],["Глубина 2500 м, плотность раствора 1400 кг/м³, потери в затрубье 1 МПа (g ≈ 10). Каково забойное давление при циркуляции?","36 МПа","35 МПа","34 МПа","37 МПа","Статика: 1400 × 10 × 2500 = 35 МПа\nПри циркуляции добавляем потери в затрубье: 35 + 1 = 36 МПа"],["Глубина 2500 м, плотность раствора 1400 кг/м³, потери в затрубье 2 МПа (g ≈ 10). Каково забойное давление при циркуляции?","37 МПа","35 МПа","33 МПа","39 МПа","Статика: 1400 × 10 × 2500 = 35 МПа\nПри циркуляции добавляем потери в затрубье: 35 + 2 = 37 МПа"],["Пластовое давление 24 МПа на глубине 2000 м. Какой минимальной плотности должен быть раствор, чтобы уравновесить пласт (g ≈ 10)?","1200 кг/м³","1250 кг/м³","1300 кг/м³","1150 кг/м³","ρ = P / (g·h)\n24 млн Па ÷ (10 × 2000) = 1200 кг/м³"],["Пластовое давление 22 МПа на глубине 2000 м. Какой минимальной плотнос отности?","Поршневание снижает забойное давление","Вязкость раствора снижается при подъёме и падает гидростатика","Плотность раствора снижается из-за прогрева на забое","Циркуляция прекращается, и растёт эквивалентная плотность","Быстрый подъём создаёт разрежение под долотом, поэтому скорость ограничивают и контролируют долив."]]}],"color":"#7A4FD0"},{"id":"compl","name":"Освоение скважин","subs":[{"name":"Вызов притока","q":[["Что такое депрессия на пласт?","Разность пластового и забойного давлений","Разность забойного и устьевого давлений","Разность пластового давления и давления насыщения","Превышение забойного давления над пластовым","Именно перепад заставляет флюид поступать в скважину."],["Какая технология использует поршень на канате?","Свабирование","Компрессирование","Тартание желонкой","Плунжерный лифт","Сваб поднимает столб жидкости из НКТ и снижает уровень."],["Что делает компрессорный метод освоения?","Вытесняет жидкость из ствола сжатым газом","Закачивает азот в пласт для повышения давления","Снижает плотность за счёт пенообразователя в НКТ","Откачивает жидкость струйным насосом","Обычно используют азот или воздух с мерами взрывобезопасности."],["Почему для компрессирования предпочитают азот?","Он инертен и не образует взрывоопасной смеси с углеводородами","Он лучше растворяется в нефти, чем воздух","Он дешевле воздуха и лучше растворяется в нефти при любых условиях","Он повышает плотность жидкости и за счёт этого снижает депрессию","Воздух в смеси с нефтяным газом взрывоопасен."],["Что такое замена раствора при освоении?","Замена тяжёлой жидкости на лёгкую","Замена жидкости в пласте на закачиваемую воду","Закачка кислоты вместо глинистого раствора","Смена насоса на другой типоразмер","Снижение плотности уменьшает забойное давление."],["Что такое аэрирование жидкости?","Насыщение жидкости газом для снижения её плотности","Удаление газа из раствора дегазатором","Обработка призабойной зоны паром","Закачка азота в пласт для вытеснения нефти","Газожидкостная смесь создаёт меньшее гидростатическое давление."],["Что такое пенная система?","Жидкость со стабилизированным газом","Эмульсия воды в нефти","Глинистый раствор с углеводородной фазой","Раствор полимера в солевой воде","Пена выносит загрязнения и сильно снижает забойное давление."],["Чем опасно слишком быстрое создание большой депрессии?","Разрушением коллектора и прорывом воды","Снижением давления насыщения и ростом вязкости","Загрязнением пласта фильтратом и ростом скина","Ростом вязкости нефти на забое","Депрессию снижают плавно, контролируя вынос песка."],["На каком принципе работает эжектор при освоении?","Рабочая жидкость создаёт разрежение на приёме","Вращение рабочего колеса создаёт напор","Сжатый газ поднимает жидкость порциями","Возвратно-поступательное движение плунжера","Струйная установка создаёт управляемую депрессию на пласт."],["Что такое освоение нагнетательной скважины?","Подготовка к приёму закачиваемой воды","Подбор ЭЦН для откачки сточной воды","Перевод скважины на газлифт","Спуск пакера для изоляции пласта","Важнейший показатель здесь — приёмистость скважины."],["Каким способом снижают забойное давление с целью вызова притока?","Все ответы правильные","Заменой жидкости в скважине на аэрированные или пенные системы","Снижением уровня жидкости в скважине","Заменой жидкости в скважине на жидкость меньшей плотности","Забойное давление равно гидростатике столба жидкости. Его можно уменьшить, снизив плотность жидкости (замена раствора, аэрация, пена) или высоту столба (свабирование, компрессор). Поэтому верны все варианты.","lzs-67"],["Охарактеризуйте процесс: Вызов притока из скважины при помощи УГИС - это:","Снижение давления в подпакерной зоне до значений, меньших гидростатического давления","Снижение уровня жидкости при помощи специального поршня с обратным клапаном, допускающим перетоки жидкости через поршень только в одном направлении при спуске его в скважину","Уменьшение уровня жидкости в скважине вследствие использования энергии сжатого воздуха","Снижение уровня жидкости в трубах за счет ее аэрации и последующего выброса","Установки такого типа создают депрессию под пакером с помощью струйного насоса: давление в подпакерной зоне становится меньше гидростатического, и пласт начинает отдавать флюид.","lzs-68"],["Дайте определение термину: Освоение скважины - это:","Комплекс технологических операций по вызову притока и обеспечению ее продуктивности, соответствующей локальным возможностям пласта","Комплекс перфорационных работ по скважине, обеспечивающих гидродинамическую связь пласта и забоя скважины","Комплекс работ по подготовке скважины к спуску УЭЦН и спуск УЭЦН в соответствии с технологическими регламентами","Комплекс работ по осуществлению операций, связанных с гидроразрывом пласта","Цель освоения — получить приток и вывести скважину на продуктивность, соответствующую возможностям пласта. Перфорация, спуск УЭЦН и ГРП могут быть отдельными этапами, но освоением в целом не являются.","lzs-69"],["Сущность операции по вызову притока и освоению скважины состоит в том, что:","создается депрессия на забое скважины, т.е. гидростатическое давление в стволе скважины становится ниже пластового, что обеспечивает поступление пластового флюида в скважину","Операции по вызову притока и освоению скважины сводятся к проведению гидроразрыва пород для обеспечения дополнительной добычи нефти","Операции по вызову притока и освоению скважины сводятся к проведению различных типов кислотных обработок для обеспечения дополнительной добычи нефти","Операции по вызову притока и освоению скважины сводятся к оптимизации работы глубинно-насосного оборудования (УЭЦН, УШГН)","Флюид идёт туда, где давление ниже. Пока забойное давление выше пластового, притока нет; поэтому суть вызова притока — создание депрессии. ГРП и кислотные обработки служат другой цели — интенсификации.","lzs-70"],["Каким способом вызывают приток замещением раствора на более лёгкую жидкость?","Промывка на воду или нефть","Гидроразрыв пласта","Солянокислотная обработка","Спуск пакера без промывки","Снижается давление столба жидкости на забой."],["Что такое освоение аэрацией?","Нагнетание газа или воздуха в жидкость для снижения её плотности","Закачка кислоты с воздухом для растворения загрязнений в призабойной зоне","Продувка эксплуатационной колонны воздухом до спуска лифтовых труб","Закачка азота в пласт как агента вытеснения","Давление снижается плавно, можно регулировать депрессию."],["Что применяют для безопасного вызова притока при рисках взрыва воздушной смеси?","Азот","Сжатый воздух","Природный газ из линии","Кислород","Азот инертен, поэтому смесь не горит."],["Зачем применяют свабирование при освоении?","Снизить уровень жидкости в скважине","Опрессовать колонну на герметичность","Отмыть забой от проппанта","Отмыть забой от шлама и проппанта","Поршень на канате откачивает жидкость порциями."],["Что такое пластоиспытатель?","Инструмент для испытания пласта с регистрацией притока","Прибор ГИС для определения пористости","Манометр, спускаемый на проволоке для замера давления","Прибор ГИС для определения пористости в открытом стволе","Испытание на бурильных трубах даёт дебит и давление."],["Почему в газовых пластах ограничивают депрессию при освоении?","Чтобы не разрушить призабойную зону и не подтянуть воду","Чтобы не снизить давление насыщения и не увеличить вязкость газа","Чтобы сохранить цементное кольцо от тепла","Чтобы сохранить устьевую температуру и защитить арматуру от перегрева","Резкая депрессия опасна выносом песка и прорывом воды."]]},{"name":"Вторичное вскрытие","q":[["Что такое вторичное вскрытие?","Перфорация колонны и цемента против продуктивного пласта","Вскрытие пласта долотом с промывкой раствором","Углубление скважины ниже проектного забоя","Бурение бокового ствола из обсадной колонны","Первичное вскрытие выполняется при бурении, вторичное — после крепления."],["Что такое плотность перфорации?","Число отверстий на метр интервала","Глубина каналов на метр вскрытой толщины","Плотность жидкости пер ритока при расчётной депрессии. Что проверить?","Качество вскрытия, привязку интервала и загрязнение ПЗП","Срок службы арматуры, вязкость нефти и наличие ингибитора в затрубье","Марку НКТ, температуру устья и давление в линии сбора","Вязкость жидкости в приёмной ёмкости","Причина может быть в неверном интервале, низкой проницаемости или закупорке, поэтому проводят ГИС и исследования."],["Что снижает риск повреждения пласта при освоении слабосцементированного песчаника?","Плавное снижение уровня и контроль выноса песка","Резкое снижение уровня для быстрого выноса песка","Запуск насоса сразу на максимальной частоте","Создание большой депрессии на коротком цикле","Резкие перепады разрушают каркас и приводят к образованию пробок."],["При освоении дебит растёт, но обводнённость выше ожидаемой. Первое подозрение?","Заколонный переток из-за некачественного цементирования","Высокая вязкость нефти из-за выделения газа ниже давления насыщения","Рост пластового давления из-за закачки на соседнем участке","Высокое содержание парафина","Цементометрия покажет связь с водоносным пластом через затрубье."]]}],"color":"#C7402D"},{"id":"dev","name":"Разработка нефтяных и газовых месторождений","subs":[{"name":"Показатели разработки","q":[["Что такое коэффициент извлечения нефти (КИН)?","Отношение извлекаемых запасов к начальным геологическим","Отношение накопленной добычи к текущим извлекаемым запасам","Отношение подвижных запасов к геологическим","Доля пласта, охваченная вытеснением","КИН показывает, какую долю нефти из пласта удаётся добыть. Он зависит от геологии, вязкости и технологии разработки."],["Из каких основных коэффициентов складывается КИН?","Коэффициента вытеснения и коэффициента охвата","Коэффициента вытеснения и коэффициента песчанистости","Коэффициента охвата и коэффициента эксплуатации","Коэффициента продуктивности и коэффициента приёмистости","КИН = Квыт × Кохв. Первый отражает полноту вытеснения в промытом объёме, второй — долю пласта, охваченную воздействием."],["Что характеризует плотность сетки скважин?","Площадь залежи, приходящуюся на одну скважину","Количество скважин на единицу объёма запасов нефти","Расстояние между кустовыми площадками","Отношение добывающих скважин к нагнетательным","Обычно её выражают в га/скв. Сетка влияет на охват, темпы отбора и экономику проекта."],["Что такое компенсация отбора закачкой?","Отношение объёма закачанной воды к отобранной жидкости в пластовых условиях","Отношение объёма закачки к отбору нефти в поверхностных условиях","Чередование рядов нагнетательных и добывающих скважин","Произведение проницаемости на толщину, делённое на вязкость","При компенсации около 100 % пластовое давление поддерживается, поэтому показатель контролируют на всех этапах заводнения."],["Что такое темп отбора нефти?","Годовая добыча в процентах от извлекаемых запасов","Отношение текущего дебита к начальному по скважине","Скорость падения добычи в процентах за год","Отношение добычи жидкости к добыче нефти","Темп отбора показывает интенсивность разработки. Обычно его считают от начальных или текущих извлекаемых запасов."],["На сколько стадий обычно делят разработку нефтяной залежи?","На четыре","На три","На пять","На шесть","Выделяют нарастающую добычу, стабильную добычу, значительное снижение добычи и завершающую стадию."],["Что показывает обводнённость продукции?","Долю воды в добываемой жидкости","Долю порового объёма, занятую водой","Отношение закачанной воды к добытой нефти","Долю воды от всего объёма нефти на складе","Обводнённость растёт по мере продвижения фронта воды, и это один из главных показателей заводнения."],["Что такое водонефтяной фактор?","Отношение добытой воды к добытой нефти","Отношение закачанной воды к добытой нефти","Отношение нефти к воде на устье","Доля воды в добываемой жидкости","Показатель характеризует издержки на попутную воду на единицу нефти."],["Что такое текущая нефтеотдача?","Отношение накопленной добычи нефти к геологическим запасам","Исследование связи скважин по изменению давления","Отношение накопленной добычи к извлекаемым запасам","Разрезание залежи рядами нагнетательных скважин на блоки","Она показывает, сколько запасов извлечено на данный момент."],["Что показывает кратность промывки?","Сколько поровых объёмов закачано в пласт","Отношение накопленной закачки к накопленной добыче нефти","Частоту смены закачиваемых агентов","Отношение обводнённости к выработке запасов","Рост прокачанных поровых объёмов повышает нефтеотдачу, но снижает эффективность."],["Что показывают характеристики вытеснения?","Зависимость накопленной нефти от накопленной жидкости или воды","Зависимость дебита от времени при падающей добыче","Зависимость давления от накопленной закачки или времени работы","Зависимость вязкости нефти от температуры и газового фактора","По ним оценивают извлекаемые запасы и эффект мероприятий."],["Скважины, бурящиеся при геологоразведочных работах и для разработки нефтяных и газовых месторождений подразделяют на следующие категории:","на 8 категорий: опорные, параметрические, структурные, поисковые, оценочные, разведочные, эксплуатационные, специальные.","на 6 категорий: разведочные, эксплуатационные, специальные, резервные, законсервированные, ликвидированные","на 4 категории: опорные, параметрические, разведочные, эксплуатационные","на 2 категории: разведочные и эксплуатационные","Классификация включает восемь категорий по назначению: от опорных и параметрических (изучение строения) через структурные, поисковые, оценочные и разведочные до эксплуатационных и специальных. Законсервированные и ликвидированные — это состояния скважин, а не категории назначения.","lzs-71"],["Что такое текущий коэффициент нефтеизвлечения?","Отношение накопленной добычи к начальным геологическим запасам","Отношение накопленной добычи к извлекаемым запасам","Чередование рядов нагнетательных и добывающих скважин","Произведение проницаемости на толщину, делённое на вязкость","КИН оценивают на дату, а утверждённый КИН — на конец разработки."],["Как считается коэффициент извлечения нефти при заводнении через составляющие?","Кв × Кохв × Кзав","Кв + Кохв + Кзав","Кв ÷ Кохв","Кохв − Кзав","Вытеснение, охват заводнением и другие составляющие перемножаются."],["Что такое темп отбора от текущих извлекаемых запасов?","Годовая добыча, делённая на остаточные извлекаемые запасы","Годовая добыча, делённая на начальные геологические запасы","Накопленная добыча, делённая на годовую","Прирост обводнённости за год","Показатель выше на поздних стадиях, когда остаётся мало запасов."],["Что такое выработка запасов по разрезу?","Степень вовлечения пропластков в разработку","Распределение запасов по годам","Снижение пластового давления по разрезу","Изменение ГНК при добыче","Изучается по ГИС-контролю и трассерам."],["Что такое эксплуатационный объект?","Один или несколько пластов, разрабатываемых одной сеткой","Одна скважина с одним насосом","Группа скважин одного куста, подключённых к одной замерной установке","Участок лицензии с единым проектом обустройства и транспорта","Объекты выделяют по свойствам, давлению и запасам."],["Когда объединять пласты в один объект менее оправданно?","При сильном различии проницаемости и давлений","При близких свойствах нефти и одной системе","При близком положении пластов в разрезе","При одинаковой системе разработки","Иначе слабый пласт будет недоразрабатываться."],["Какой показатель на диаграмме Холла указывает на образование трещин при закачке?","Снижение наклона кривой","Рост наклона кривой","Постоянный наклон","Излом вверх после остановки","Падение наклона означает снижение сопротивления — проводимость выросла."],["Дебит жидкости 120 м³/сут, обводнённость 90 %. Каков дебит нефти?","12 м³/сут","108 м³/сут","14,4 м³/сут","22 м³/сут","Нефть — это остаток от жидкости за вычетом воды.\n120 × (1 − 0,9) = 12 м³/сут"],["Дебит жидкости 100 м³/сут, обводнённость 70 %. Каков дебит нефти?","30 м³/сут","70 м³/сут","36 м³/сут","40 м³/сут","Нефть — это остаток от жидкости за вычетом воды.\n100 × (1 − 0,7) = 30 м³/сут"],["Дебит жидкости 250 м³/сут, обводнённость 50 %. Каков дебит нефти?","125 м³/сут","150 м³/сут","135 м³/сут","62,5 м³/сут","Нефть — это остаток от жидкости за вычетом воды.\n250 × (1 − 0,5) = 125 м³/сут"],["Дебит жидкости 200 м³/сут, обводнённость 80 %. Каков дебит нефти?","40 м³/сут","160 м³/сут","48 м³/сут","50 м³/сут","Нефть — это остаток от жидкости за вычетом воды.\n200 × (1 − 0,8) = 40 м³/сут"],["Дебит жидкости 200 м³/сут, обводнённость 50 %. Каков дебит нефти?","100 м³/сут","120 м³/сут","110 м³/сут","50 м³/сут","Нефть — это остаток от жидкости за вычетом воды.\n200 × (1 − 0,5) = 100 м³/сут"],["Накопленная добыча 900 тыс. т, начальные геологические запасы 1500 тыс. т. Каков текущий КИН?","0,6","0,167","0,72","1,5","КИН = Qнак / Qгеол\n900 ÷ 1500 = 0,6"],["Накопленная добыча 450 тыс. т, начальные геологические запасы 3000 тыс. т. Каков текущий КИН?","0,15","0,667","0,18","0,176","КИН = Qнак / Qгеол\n450 ÷ 3000 = 0,15"],["Накопленная добыча 900 тыс. т, начальные геологические запасы 2000 тыс. т. Каков текущий КИН?","0,45","0,222","0,54","0,818","КИН = Qнак / Qгеол\n900 ÷ 2000 = 0,45"],["Накопленная добыча 600 тыс. т, начальные геологические запасы 3000 тыс. т. Каков текущий КИН?","0,2","0,5","0,24","0,25","КИН = Qнак / Qгеол\n600 ÷ 3000 = 0,2"],["Годовая добыча 80 тыс. т, текущие извлекаемые запасы 1000 тыс. т. Каков темп отбора от текущих извлекаемых запасов?","8 %","12,5 %","4 %","10 %","80 ÷ 1000 = 0,08, то есть 8 %"],["Годовая добыча 100 тыс. т, текущие извлекаемые запасы 800 тыс. т. Каков темп отбора от текущих извлекаемых запасов?","12,5 %","8 %","6,25 %","14,5 %","100 ÷ 800 = 0,125, то есть 12,5 %"],["Годовая добыча 120 тыс. т, текущие извлекаемые запасы 800 тыс. т. Каков темп отбора от текущих извлекаемых запасов?","15 %","6,667 %","7,5 %","17 %","120 ÷ 800 = 0,15, то есть 15 %"],["Годовая добыча 60 тыс. т, текущие извлекаемые запасы 800 тыс. т. Каков темп отбора от текущих извлекаемых запасов?","7,5 %","13,333 %","3,75 %","9,5 %","60 ÷ 800 = 0,075, то есть 7,5 %"],["За месяц закачано 800 тыс. м³, отобрано 1200 тыс. м³ в пластовых условиях. Какова компенсация отбора закачкой?","66,7 %","150 %","53,3 %","80 %","800 ÷ 1200 ≈ 0,667\nКомпенсация: 66,7 %"],["За месяц закачано 900 тыс. м³, отобрано 1200 тыс. м³ в пластовых условиях. Какова компенсация отбора закачкой?","75 %","133,3 %","60 %","90 %","900 ÷ 1200 ≈ 0,75\nКомпенсация: 75 %"],["За месяц закачано 1000 тыс. м³, отобрано 1200 тыс. м³ в пластовых условиях. Какова компенсация отбора закачкой?","83,3 %","120 %","66,7 %","100 %","1000 ÷ 1200 ≈ 0,833\nКомпенсация: 83,3 %"],["За месяц закачано 800 тыс. м³, отобрано 1000 тыс. м³ в пластовых условиях. Какова компенсация отбора закачкой?","80 %","125 %","64 %","96 %","800 ÷ 1000 ≈ 0,8\nКомпенсация: 80 %"]]},{"name":"Системы заводнения","q":[["Когда применяют законтурное заводнение?","На небольших залежах с хорошей гидродинамической связью с законтурной зоной","На крупных залежах с низкой проницаемостью и широкой площадью","На залежах с резко ухудшенными свойствами за контуром","На массивных трещиноватых залежах с подошвенной водой","Вода закачивается за контур нефтеносности. На больших залежах эффект не доходит до центра, поэтому там применяют внутриконтурные системы."],["Каково соотношение нагнетательных и добывающих скважин в пятиточечной системе?","1:1","1:2","1:3","1:4","В обращённом пятиточечном элементе одна нагнетательная скважина окружена четырьмя добывающими, но с учётом их общих границ на всей площади соотношение равно 1:1."],["Что такое рядная система заводнения?","Чередование рядов нагнетательных и добывающих скважин","Расстановка всех скважин равномерно по треугольной сетке","Размещение нагнетательных скважин только по контуру","Ряд скважин вдоль разлома без закачки","Наиболее интенсивная — однорядная; трёхрядные и пятирядные менее интенсивны."],["Что такое очаговое заводнение?","Дополнительная закачка в участки, не охваченные основной системой","Годовая добыча в процентах от извлекаемых запасов","Годовая добыча, делённая на остаточные извлекаемые запасы","Закачка в купольную часть для создания газовой шапки","Очаги создаются для увеличения охвата на неработающих участках."],["Что такое циклическое заводнение?","Периодическое изменение режимов закачки и отбора","Смена воды на газ в нагнетательной скважине","Чередование закачки пресной и сточной воды","Дополнительное сопротивление в призабойной зоне","Перепады давления вызывают обмен жидкостью между высоко- и низкопроницаемыми пропластками."],["Уменьшение обводненности скважинной продукции приведет к:","Все ответы правильные","Уменьшению затрат на сепарацию воды и нефти","Увеличению добычи нефти","Уменьшению затрат на подъем воды","При том же дебите жидкости доля нефти растёт, а поднимать и отделять приходится меньше воды. Поэтому верны все перечисленные эффекты.","lzs-33"],["Фактор сопротивления определяется как отношение при ограничении водопритока:","подвижности воды к подвижности геля","подвижности нефти к подвижности геля","подвижности геля к подвижности воды","подвижности воды к подвижности нефти","RF = λводы / λгеля: показывает, во сколько раз гель снижает подвижность по сравнению с водой, то есть насколько возрастает сопротивление потоку. Отношение подвижностей воды и нефти — это другая величина, характеризующая вытеснение.","lzs-34"]]},{"name":"Режимы залежей","q":[["Как меняется газовый фактор при режиме растворённого газа?","Сначала растёт, затем падает по мере истощения газа","Сначала снижается, потом растёт до начального значения","Остаётся постоянным до конца разработки","Постоянно растёт вплоть до конца разработки","Ниже Рнас выделяется свободный газ, он начинает двигаться, и газовый фактор растёт. Когда газ истощается, показатель падает."],["Какой режим работает в газовой залежи без притока пластовых вод?","Газовый","Упруговодонапорный","Режим растворённого газа","Газонапорный режим с газовой шапкой","Газ вытесняется за счёт собственного расширения, а зависимость приведённого давления от добычи близка к прямой."],["Что такое сайклинг-процесс?","Закачка сухого газа в пласт для поддержания давления и снижения потерь конденсата","Циклическая закачка пара в газоконденсатную скважину","Циклическая закачка пара в одну скважину с последующим отбором продукции","Попеременная закачка воды и газа для снижения подвижности вытесняющего агента","Давление поддерживается выше начала конденсации, поэтому жидкие углеводороды не выпадают в пласте и извлекаются с газом."],["Что характерно для упруговодонапорного режима?","Вытеснение за счёт упругого расширения флюидов и породы и напора воды","Вытеснение расширением выделившегося газа при падении давления ниже Рнас","Постоянное давление при расширении газовой шапки без притока законтурной воды","Приток обеспечивается только за счёт сил гравитации","Давление снижается постепенно, а зона упругого перераспределения расширяется."],["Что такое газонапорный режим?","Вытеснение нефти расширяющейся газовой шапкой","Вытеснение нефти выделяющимся растворённым газом","Вытеснение нефти закачанным азотом","Вытеснение газа подошвенной водой","Для него характерно снижение давления и рост газового фактора у скважин ближе к шапке."],["Основное условие проявления гравитационного режима работы залежи?","потенциальная энергия напора нефти превышает все другие виды энергии в пласте","отсутствие газовой шапки","крутозалегающие нефтеносные пласты","превышение пластового давления над давлением насыщения","Гравитационный режим наступает, когда другие источники энергии (упругость, растворённый газ, напор воды) исчерпаны и нефть движется к забоям только под действием силы тяжести.","lzs-63"],["Водонапорный режим разработки залежи - это:","Использование энергии водоносного горизонта, который способен поддерживать давление в залежи (пополнение водоносного горизонта происходит из поверхностных источников либо нет пополнения извне)","Это режим разработки, при котором источником энергии служит изменение порового давления и увеличение горного давления","Это режим разработки, при котором источником энергии служит расширение флюидов и сжатие породы","Это режим разработки, при котором источником энергии служит расширение газа, который растворен в флюиде","Нефть вытесняется напором законтурных вод, и давление поддерживается водоносным горизонтом. Расширение флюидов и породы — это упругий режим, а расширение растворённого газа — режим растворённого газа.","lzs-64"],["Что не следует допускать при режиме с газовой шапкой?","образования конуса газа","выделения растворенного газа","образования конуса воды","выпадения конденсата в газовой шапке","Энергия режима заключена в газовой шапке. Если газ по конусу прорвётся в скважину, она начнёт добывать газ вместо нефти, а шапка потеряет энергию. Поэтому дебиты ограничивают и перфорируют нижнюю часть пласта.","lzs-76"],["Какой режим обеспечивает высокий КИН при активном притоке законтурной воды?","Упруговодонапорный","Растворённого газа","Гравитационный","Газонапорный","Вода замещает нефть и поддерживает давление."],["Какие признаки характерны для режима растворённого газа?","Быстрое падение давления и рост газового фактора","Стабильное давление и рост обводнённости","Постоянный газовый фактор и давление","Рост давления при отборе","Газ выделяется при Р ниже Рнас, а его подвижность быстро растёт."],["Что такое давление насыщения?","Давление, при котором из нефти начинает выделяться газ","Давление, при котором нефть заполняет поры","Давление, при котором начинается закачка воды в пласт","Давление, при котором нефть полностью заполняет поры","Определяется PVT-исследованиями."],["Что такое конусообразование воды?","Подтягивание подошвенной воды к забою","Прорыв воды по верхнему пропластку","Отношение фазовой проницаемости к вязкости","Вытеснение нефти расширяющейся газовой шапкой","Снижают депрессией, горизонтальными скважинами, барьерами."],["Почему нельзя чрезмерно снижать давление в нефтяной залежи?","Выделится газ, снизится фазовая проницаемость по нефти","Снизится вязкость нефти, упадёт её относительная подвижность","Коллектор станет проницаемее","Коллектор станет проницаемее, а вода прорвётся через покрышку","Ниже Рнас растёт вязкость нефти и падает подвижность."],["Что характерно для газонапорного режима?","Расширение газовой шапки вытесняет нефть","Вода вытесняет нефть к центру","Нефть идёт только под действием гравитации","Закачка пара создаёт напор","Обычно КИН ниже, чем при водонапорном режиме."]]},{"name":"Подземная гидромеханика","q":[["Что описывает закон Дарси?","Линейную связь скорости фильтрации с градиентом давления","Квадратичную зависимость потерь давления от скорости","Связь сжимаемости породы с давлением","Распределение насыщенности за фронтом вытеснения","Расход пропорционален проницаемости и перепаду давления и обратно пропорционален вязкости. На этой основе строится большинство расчётов."],["Какая формула описывает установившийся радиальный приток к скважине?","Формула Дюпюи","Формула Форхгеймера","Формула Баклея–Леверетта","Формула Хорнера","Q = 2πkh(Рпл − Рзаб) / (μ·ln(Rк/rс)). Она показывает, как дебит зависит от свойств пласта и депрессии."],["Что означает положительный скин-фактор?","Ухудшенную проницаемость призабойной зоны","Улучшенную проницаемость призабойной зоны","Наличие трещины ГРП в призабойной зоне","Псевдорадиальный режим притока","Скин больше нуля обычно указывает на загрязнение ПЗП. Отрицательный скин бывает после успешного ГРП или кислотной обработки."],["Что такое пьезопроводность?","Скорость перераспределения давления в пласте","Способность пласта пропускать жидкость при перепаде","Произведение проницаемости на толщину","Отношение давления к расходу","Коэффициент равен k/(μ·φ·ct) и определяет, как быстро распространяется импульс давления."],["Что такое гидропроводность пласта?","Произведение проницаемости на толщину, делённое на вязкость","Отношение проницаемости к пористости и сжимаемости","Отношение накопленной добычи к начальным геологическим запасам","Отношение накопленной добычи нефти к геологическим запасам","kh/μ определяет пропускную способность пласта."],["Какое течение наблюдается при нарушении закона Дарси вблизи скважины с большими дебитами?","Нелинейное, инерционное течение","Псевдорадиальное","Линейное течение в трещине","Ползущее течение","При больших скоростях растут инерционные потери, особенно при притоке газа к забою."],["Что показывает кривая восстановления давления (КВД)?","Рост забойного давления после остановки скважины","Падение забойного давления при пуске скважины","Рост дебита после обработки призабойной зоны","Рост устьевого давления в нагнетательной скважине","По КВД определяют проницаемость, скин и пластовое давление."],["Что такое закон Дарси при линейной фильтрации?","Q = k·S·Δp / (μ·L)","Q = μ·S·Δp / (k·L)","Q = k·μ·Δp / (S·L)","Q = S·L / (k·Δp)","Расход пропорционален проницаемости, площади и перепаду и обратно пропорционален вязкости и длине."],["Что такое формула Дюпюи?","Приток к скважине при плоскорадиальной фильтрации","Расчёт запасов объёмным методом","Зависимость вязкости от температуры","Определение критической депрессии при конусе","Q = 2πkhΔp / (μ·ln(Rк/rс))."],["Как зависит дебит от радиуса контура питания?","Слабо, логарифмически","Прямо пропорционально","Квадратично","Обратно пропорционально","Rк стоит под логарифмом."],["Что такое фазовая проницаемость?","Проницаемость для фазы при многофазном потоке","Проницаемость по газу в лаборатории","Проницаемость, приведённая к вязкости","Скорость перераспределения давления в пласте","Относительная фазовая проницаемость меняется с насыщенностью."],["Что показывает функция Баклея — Леверетта?","Перемещение фронта вытеснения","Отношение нефти к газу при сепарации","Распределение размера пор","Падение давления вдоль НКТ","Описывает одномерное двухфазное вытеснение без капиллярных сил."],["Что такое подвижность фазы?","Отношение фазовой проницаемости к вязкости","Произведение вязкости на плотность","Вытеснение нефти расширяющейся газовой шапкой","Подтягивание подошвенной воды к забою","Если подвижность вытесняющего агента выше, фронт неустойчив."],["Что такое соотношение подвижностей M > 1?","Вытесняющий агент подвижнее нефти, возможна неустойчивость","Нефть подвижнее воды, поэтому фронт вытеснения остаётся устойчивым","Вязкость нефти ниже вязкости воды, прорывы воды исключены","Обводнённость в начале падает","Отсюда прорывы и «языки» обводнения."]]},{"name":"Проектирование и регулирование разработки","q":[["С какой целью проводится анализ разработки?","Проводится для определения эффективности применяемой технологии разработки","Проводится для определения степени неоднородности залежи","Проводится с целью определения степени обводненности продукции","Проводится с целью уточнения остаточных запасов нефти","Анализ разработки отвечает на главный вопрос: достигаются ли проектные показатели выбранной технологией и что нужно изменить. Обводнённость, неоднородность и остаточные запасы — это частные данные, используемые в анализе.","lzs-31"],["Что относят к технологическим методам регулирования разработки нефтяных месторождений?","Все перечисленные методы","Увеличение давления нагнетания в скважинах вплоть до давления раскрытия трещин в призабойной зоне, поинтервальная закачка рабочих агентов в прослои пласта при дифференцированном давлении нагнетания","Изменение режимов эксплуатации добывающих и нагнетательных скважин путем уменьшения или увеличения их дебитов и расходов закачиваемых в пласты веществ, вплоть до прекращения эксплуатации (отключения) скважин","Воздействие на призабойную зону скважин с целью увеличения притока нефти из отдельных прослоев пласта или расхода закачиваемых в них веществ","Все три варианта — это управление процессом через существующие скважины: давление нагнетания, режимы работы и воздействие на призабойную зону. Систему разработки они не меняют, поэтому относятся к технологическим методам.","lzs-32"],["Для чего составляются проекты пробной эксплуатации?","Для получения информации, необходимой для подсчета запасов и составления технологической схемы разработки","Для устранения выявленных недостатков предыдущей проектной работы","Для выбора геометрии сетки скважин","Для восполнения фактической неполноты разведки извлекаемых запасов нефти","Пробная эксплуатация — это ранний этап: скважины работают, чтобы получить данные о продуктивности и режиме залежи. На этих данных затем подсчитывают запасы и составляют полноценный проектный документ.","lzs-37"],["Целью составления дополнения к технологическому проекту разработки месторождения является:","Интенсификация и регулирование процесса добычи","Уточнение геологических запасов","Отражение сложившейся на месторождении технологии добычи","Подготовка месторождения к ликвидации","Дополнение корректирует проектные решения по мере изучения залежи, чтобы улучшить показатели: уплотнить сетку, изменить закачку, применить новые методы. Запасы уточняют в отдельных подсчётах.","lzs-38"],["Какой документ обосновывает технологию добычи на этапе основной разработки?","Технологический проект разработки","План развития горных работ на квартал","План ликвидации разливов","Лицензионное соглашение на пользование","Проектные документы рассматривает ЦКР Роснедр."],["Что входит в задачу регулирования разработки?","Изменение отборов и закачки для равномерной выработки","Обоснование границ лицензии и выбор площадок","Подсчёт запасов и перевод их между категориями","Переоценка сейсмических данных","Управляют также циклическим заводнением и изменением направлений фильтрации."],["Что такое блоковая система заводнения?","Разрезание залежи рядами нагнетательных скважин на блоки","Отношение накопленной добычи нефти к геологическим запасам","Отношение накопленной добычи к начальным геологическим запасам","Морская платформа с подводными устьями","Блочные системы применяют при больших площадях."],["Чем отличаются площадные системы заводнения от рядных?","Нагнетательные и добывающие равномерно чередуются по площади","Добывающие размещают в своде, а нагнетательные только за контуром","Скважины размещают только в своде","Вода подаётся через ряды скважин только вдоль контура нефтеносности","Варианты: пяти-, семи-, девятиточечные."],["Что такое законтурное заводнение?","Закачка за внешним контуром нефтеносности","Закачка в своде залежи","Закачка в зоне ГНК","Закачка в подошву пласта внутри контура","Эффективно при малой ширине залежи и хорошей связи с законтурной областью."],["Почему в низкопроницаемых коллекторах применяют уплотнённую сетку?","Чтобы компенсировать малый радиус дренирования","Чтобы снизить капзатраты на бурение новых скважин","Чтобы увеличить вязкость нефти","Чтобы увеличить вязкость нефти и ослабить конусы","Активный контакт с пластом быстрее достигается при сближении скважин."],["Для чего применяют горизонтальные скважины с МГРП?","Чтобы увеличить площадь контакта с низкопроницаемым пластом","Чтобы снизить стоимость бурения","Чтобы избавиться от необходимости закачки навсегда","Чтобы отказаться от цементирования","Несколько трещин вдоль ствола дают большую площадь дренирования."]]},{"name":"Гидродинамические исследования","q":[["Что определяют по кривой восстановления давления?","Проницаемость и скин-фактор","Пористость и насыщенность","Глинистость и плотность","Концентрацию мехпримесей","КВД показывает фильтрационные свойства и состояние призабойной зоны."],["Что такое скин-фактор?","Дополнительное сопротивление в призабойной зоне","Толщина глинистой корки на керне","Отношение дебита к депрессии","Периодическое изменение режимов закачки и отбора","Положительный — загрязнение, отрицательный — стимуляция."],["Какой скин-фактор ожидается после успешного ГРП?","Отрицательный","Положительный около 10","Равный нулю всегда","Равный проницаемости","Трещина увеличивает связь пласта и скважины."],["Что такое радиальный режим на диагностическом графике производной давления?","Горизонтальный участок производной","Участок с наклоном 1 от начала","Участок резкого падения","Наклон 1/2 после остановки","Именно по нему определяют проницаемость."],["Что означает наклон 1/2 на логарифмическом графике производной?","Линейный поток, например в трещине или вдоль стволов","Радиальный поток","Влияние ствола скважины","Псевдоустановившийся режим в ограниченном объёме","Такой участок характерен для трещин и горизонтальных скважин."],["Что такое влияние ствола скважины на КВД?","Послеприток, искажающий начало кривой","Перетоки между пластами","Влияние соседних нагнетательных скважин","Трение на забое","На графике это ранний участок с наклоном 1."],["Что показывает индикаторная диаграмма?","Зависимость дебита от депрессии","Зависимость давления от времени","Зависимость нагрузки от хода штока","Зависимость вязкости от давления","Прямая указывает на линейный приток, выпуклая — на нарушение закона Дарси или другие эффекты."],["Что такое гидропрослушивание?","Исследование связи скважин по изменению давления","Отношение накопленной добычи нефти к геологическим запасам","Чередование рядов нагнетательных и добывающих скважин","Прослушивание колонны на негерметичность","Импульс от одной скважины фиксируют в другой."],["Дебит 100 м³/сут при депрессии 4 МПа. Каков коэффициент продуктивности?","25 м³/(сут·МПа)","400 м³/(сут·МПа)","30 м³/(сут·МПа)","4 м³/(сут·МПа)","Кпр = Q / ΔP\n100 ÷ 4 = 25"],["Дебит 40 м³/сут при депрессии 4 МПа. Каков коэффициент продуктивности?","10 м³/(сут·МПа)","160 м³/(сут·МПа)","12 м³/(сут·МПа)","15 м³/(сут·МПа)","Кпр = Q / ΔP\n40 ÷ 4 = 10"],["Дебит 60 м³/сут при депрессии 2 МПа. Каков коэффициент продуктивности?","30 м³/(сут·МПа)","120 м³/(сут·МПа)","36 м³/(сут·МПа)","35 м³/(сут·МПа)","Кпр = Q / ΔP\n60 ÷ 2 = 30"],["Дебит 100 м³/сут при депрессии 2 МПа. Каков коэффициент продуктивности?","50 м³/(сут·МПа)","200 м³/(сут·МПа)","60 м³/(сут·МПа)","55 м³/(сут·МПа)","Кпр = Q / ΔP\n100 ÷ 2 = 50"],["При депрессии 3 МПа дебит 50 м³/сут, пластовое давление 30 МПа. Какой дебит ожидать при депрессии 4 МПа по линейному закону?","66,667 м³/сут","200 м³/сут","54 м³/сут","80 м³/сут","Кпр = 50 ÷ 3 = 16,667\nQ = 16,667 × 4 = 66,667 м³/сут"],["При депрессии 3 МПа дебит 80 м³/сут, пластовое давление 20 МПа. Какой дебит ожидать при депрессии 5 МПа по линейному закону?","133,333 м³/сут","400 м³/сут","85 м³/сут","160 м³/сут","Кпр = 80 ÷ 3 = 26,667\nQ = 26,667 × 5 = 133,333 м³/сут"],["При депрессии 5 МПа дебит 100 м³/сут, пластовое давление 20 МПа. Какой дебит ожидать при депрессии 8 МПа по линейному закону?","160 м³/сут","800 м³/сут","108 м³/сут","192 м³/сут","Кпр = 100 ÷ 5 = 20\nQ = 20 × 8 = 160 м³/сут"],["При депрессии 2 МПа дебит 80 м³/сут, пластовое давление 20 МПа. Какой дебит ожидать при депрессии 3 МПа по линейному закону?","120 м³/сут","240 м³/сут","83 м³/сут","144 м³/сут","Кпр = 80 ÷ 2 = 40\nQ = 40 × 3 = 120 м³/сут"]]},{"name":"Практические ситуации","q":[["В чём разница применения материального баланса и численной модели?","Баланс оценивает запасы и энергию залежи в целом, модель показывает распределение по пласту","Баланс даёт распределение остаточной нефти, а модель — только запасы залежи","Модель применяют на ранней стадии, а баланс — только после полного разбуривания","Баланс учитывает геометрию скважин, а модель работает со средним давлением","Балансу не нужна геометрия, но он не показывает, где осталась нефть. Для размещения скважин нужна сеточная модель."],["Какую модель падения описывает постоянный относительный темп?","Экспоненциальную кривую Арпса","Гиперболическую кривую Арпса при b = 0,5","Гармоническую кривую Арпса при b = 1","Степенную зависимость накопленной добычи от времени","При b = 0 относительный темп падения постоянен. Экспонента даёт самый консервативный прогноз."],["Дебит скважины упал вдвое, обводнённость не изменилась, пластовое давление то же. Что проверить в первую очередь?","Состояние призабойной зоны и насосного оборудования","Положение ВНК и начальные геологические запасы по блоку","Подсчёт запасов на участке дренирования","Сейсмические атрибуты и структурную карту вблизи скважины","При неизменных обводнённости и давлении причина скорее в скважине: скин, отказ насоса, отложения."],["Быстрый рост обводнённости одной скважины при низкой выработке запасов участка указывает на:","Прорыв воды по высокопроницаемому пропластку или трещине","Равномерный подъём ВНК по всей залежи","Снижение вязкости нефти в зоне закачки","Выход фронта вытеснения по всей толщине пласта","Вода идёт по пути наименьшего сопротивления, поэтому запасы остаются невыработанными."],["Пластовое давление на участке падает при компенсации 100 %. Что вероятнее всего?","Закачка уходит за пределы объекта или в другой пласт","Завышена обводнённость по данным замеров","Снизилась сжимаемость породы на участке","Занижена закачка из-за приписок на КНС при верном балансе","Компенсация считается по закачке, но фактически вода может уходить по заколонным перетокам или в непродуктивные пласты."],["Что важнее всего при вводе нефтяной оторочки с газовой шапкой и подошвенной водой?","Ограничить депрессию и выбрать положение ствола, чтобы отсрочить конусы","Вскрыть весь разрез и работать на максимальной депрессии","Вскрыть весь разрез и работать на максимальной депрессии для быстрого отбора","Бурить ствол строго у ВНК и увеличивать дебит до прорыва газа из шапки","Узкая оторочка быстро прорывается газом и водой, поэтому часто применяют горизонтальные стволы и низкие депрессии."]]}],"color":"#1F9E89"},{"id":"geo","name":"Геология нефти и газа","subs":[{"name":"Ловушки и залежи","q":[["Что такое ловушка углеводородов?","Часть природного резервуара, где возможно скопление нефти и газа","Пласт, содержащий промышленное скопление нефти","Часть пласта, полностью насыщенная нефтью без пластовой воды","Толща покрышки, удерживающая газ в своде структуры над нефтью","Ловушка создаётся формой пласта и экранами, поэтому мигрирующие углеводороды не могут двигаться дальше."],["Что такое флюидоупор?","Порода, препятствующая движению флюидов","Пласт с нулевой пористостью любого состава","Зона цементации вблизи контакта","Коллектор с низкой подвижностью флюидов","Покрышками обычно служат глины, соли и ангидриты. От их качества зависит сохранность залежи."],["Какие породы называют коллекторами?","Породы, способные вмещать и отдавать флюиды","Породы, содержащие только нефть и газ","Породы с пористостью выше 20 %","Породы, в которых генерируются углеводороды","Для коллектора важны пористость и проницаемость, поэтому чаще всего это песчаники и карбонаты."],["Что такое ВНК?","Водонефтяной контакт — граница нефтенасыщенной и водонасыщенной частей пласта","Водонефтяной контакт — граница между покрышкой и нефтенасыщенным пластом","Уровень свободной воды, где капиллярное давление равно нулю","Водонефтяной контакт — верхняя граница нефтенасыщенной части пласта у свода","Положение контакта важно для подсчёта запасов, размещения скважин и перфорации."],["К какому типу относится ловушка в выклинивающемся песчаном пласте?","К литологической","К стратиграфической под поверхностью несогласия","К структурной сводовой","К рифогенной","Коллектор замещается непроницаемой породой, поэтому экран создаётся изменением литологии, а не деформацией."],["Какая структура образует ловушки на контакте с поднимающимся телом соли?","Соляной диапир","Рифовый массив","Эрозионный останец","Грабен с погребённым выступом","Соль поднимается и изгибает пласты вокруг себя, создавая своды и экраны, что типично для Прикаспия."],["Что такое ГНК?","Газонефтяной контакт","Граница нижнего коллектора","Глубина начала конденсации","Газоводяной контакт","ГНК отделяет газовую шапку от нефтяной части."],["Что такое высота залежи?","Расстояние между кровлей в своде и контактом","Расстояние от ВНК до забоя скважины","Эффективная нефтенасыщенная толщина пласта","Толщина пласта-коллектора в своде","Высота залежи определяет, какая часть ловушки заполнена."],["Что такое точка замыкания ловушки?","Самая низкая изогипса, замыкающая структуру","Нефтематеринская сланцевая толща с собственными ТрИЗ","Самая высокая отметка свода структуры","Карбонатная постройка с органогенной пористостью","Ловушка может быть заполнена лишь до этой отметки."],["Что такое тектонически экранированная залежь?","Залежь, ограниченная разломом, перекрывающим коллектор","Залежь в своде антиклинали без разломов","Залежь в выклинивающемся коллекторе на моноклинали","Залежь под поверхностью стратиграфического несогласия","Экран образуется благодаря контакту коллектора с непроницаемой породой по разлому."],["Какие залежи получили название рукавообразных?","Залежи, приуроченные к руслам древних рек, характеризуются извилистостью контуров в плане, резкой изменчивостью состава и отсортированности песчаного материала, а также выпуклым основанием песчаной линзы","Залежи, приуроченные к отложениям крупных турбидитовых течений, формирующих удлиненные осадочные образования","Залежи, приуроченные к морским дельтовым образованиям, характеризующие подводные рукава дельты","Залежи, приуроченные к отложениям головных течений морского прибрежья","Форма «рукава» повторяет русло палеореки: контуры извилисты, песчаное тело врезано в подстилающие породы (выпуклое вниз основание), состав резко меняется. Это типичная литологическая залежь.","lzs-45"],["Какие типы залежей имеют наибольшее распространение в природном состоянии?","Сводовые (антиклинальные)","Литологические","Тектонически экранированные","Стратиграфические","Антиклинальные ловушки образуются при складчатости и встречаются чаще всего. Именно с ними связана большая часть открытых запасов; неантиклинальные ловушки сложнее выявлять.","lzs-46"],["Какие залежи носят название структурных?","Сводовые, тектонически-экранированные и приконтактные","Только антиклинальные","Приуроченные к структурам I порядка","Антиклинальные и моноклинальные","Структурные залежи образуются из-за деформации пластов. К ним относят сводовые, тектонически экранированные и приконтактные (у соляных и магматических тел), поэтому ограничиваться антиклиналями нельзя.","lzs-47"],["Как влияет на качество глинистых покрышек возрастание глубины залегания?","Сначала повышается, пото
