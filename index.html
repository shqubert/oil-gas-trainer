кой максимальный размер ячейки (X, Y) ортогонального грида устанавливается при построении грида геологической модели?","Таким, чтобы между двумя ближайшими скважинами было более двух ячеек","В зависимости от средних значений пористости и проницаемости резервуара","250*250 м","В зависимости от свойств пластовых флюидов, частоты разломов и величин смещения по ним","Размер ячейки привязан к плотности сетки: между соседними скважинами должно оставаться несколько ячеек, иначе модель не воспроизведёт изменение свойств и взаимодействие скважин. Универсального размера вроде 250×250 м не существует.","lzs-35"],["Чем определяется минимальная толщина слоев (лейеринг) в геологической модели?","Наличием тонких продуктивных прослоев аномально высокой проницаемости; наличие тонких протяженных непроницаемых прослоев","Высокой литологической неоднородностью разреза, установленной на основании детальных описаний керна","Производительностью ПК","Нехваткой времени на моделирование","Слой должен быть не толще тех прослоев, которые управляют фильтрацией: суперколлекторов и выдержанных непроницаемых перемычек. Если их усреднить, модель неверно покажет обводнение и связность. Производительность ПК важна на практике, но геологически не обосновывает лейеринг.","lzs-36"],["Какие из нижеперечисленных методов можно отнести к пиксельному моделированию?","последовательное индикаторное и гауссово моделирование","метод тренировочных снимков","объектное моделирование","все указанные методы","Пиксельные методы задают значение в каждой ячейке по вариограмме: это SIS и SGS. Объектное моделирование размещает тела целиком, а метод тренировочных снимков (MPS) относится к многоточечной статистике.","lzs-48"],["Когда используется методика ко-кригинга?","когда существует определенная корреляция между моделируемыми свойствами","когда одновременно моделируется несколько свойств","в случаях когда сложно найти корреляцию между моделируемыми свойствами","в случаях когда сложно смоделировать распределение свойств с использованием вариограмм","Ко-кригинг использует вторичную переменную (например, сейсмический атрибут) для уточнения основного свойства. Смысл есть только при наличии между ними корреляции; без неё вторичные данные не дают пользы.","lzs-49"],["Что такое вариограмма?","Зависимость различия значений от расстояния","Распределение скважин по карте","График проницаемости по пористости","Способность передавать поток между соседними ячейками","Описывает пространственную связь свойства."],["Что показывает ранг вариограммы?","Расстояние, на котором значения перестают коррелировать","Максимальную дисперсию свойства","Максимальный разброс значений между двумя скважинами","Шаг сетки, на котором рассчитывается вариограмма","За пределами ранга вариограмма выходит на плато."],["Что такое SIS?","Последовательное индикаторное моделирование для дискретных свойств","Стохастическая инверсия сейсмических данных по импедансу","Искусственное размывание фронта из-за размера ячеек","Последовательное гауссово моделирование для непрерывных свойств","Подходит для распределения фаций и литотипов."],["Что такое SGS?","Последовательное гауссово моделирование непрерывных свойств","Индикаторное моделирование","Объектное моделирование тел","Искусственное размывание фронта из-за размера ячеек","Обычно применяется для пористости и проницаемости."],["Когда уместно объектное моделирование фаций?","Когда нужно воспроизвести форму песчаных тел","Когда важна только средняя пористость","Когда скважин нет совсем","Когда разрез однороден","Например, для русел и баров."],["Что такое перемасштабирование (апскейлинг)?","Перенос свойств с мелкой ячейки на более крупную","Увеличение числа скважин в модели","Перенос скважинных данных на сетку модели","Сгущение ячеек вокруг скважин и разломов","Сохраняют статистику, важны проницаемость и связность."],["Что необходимо для построения каркаса модели?","Структурные поверхности и разломы","Кривые вязкости и фазовые проницаемости","Лабораторные PVT-данные","Лабораторные PVT-данные и графики падения","Сначала строят каркас и сетку, затем заполняют свойствами."],["Какой размер ячейки по вертикали обычно задают?","Такой, чтобы сохранить основные неоднородности разреза","Равный шагу сейсмической трассы","Всегда больше общей толщины моделируемого пласта","Равный шагу сейсмической трассы по горизонтали","Толщину слоя выбирают с учётом пропластков и фаций."],["Зачем использовать сейсмический тренд в модели?","Чтобы учесть изменение свойств между скважинами","Чтобы заменить данные ГИС","Чтобы определить вязкость нефти","Чтобы описать трещины и матрицу раздельно","Импеданс или атрибут может управлять распределением пористости."],["Что такое анализ неопределённости в модели?","Оценка диапазона результатов при вариации параметров","Настройка модели на воспроизведение фактической истории разработки","Поиск единственного лучшего варианта","Настройка параметров по фактическим показателям","Получают P10, P50, P90 по запасам."],["Что обозначает P90 в оценке запасов?","Значение, которое будет превышено с вероятностью 90 %","Значение, которое не превысит 90 % реализаций как максимум","90 % запасов будет добыто","Коэффициент извлечения 90 %","Это консервативная оценка, P10 — оптимистичная."]]},{"name":"Гидродинамическое моделирование","q":[["Что такое апскейлинг?","Перенос свойств из детальной модели в более крупную сетку","Сгущение сетки вокруг скважин и разломов","Перенос скважинных данных на ближайшие ячейки","Построение модели по сейсмическим атрибутам","Он нужен, чтобы гидродинамический расчёт занимал разумное время при сохранении фильтрационных свойств."],["Что такое адаптация модели (history matching)?","Настройка модели на воспроизведение фактической истории разработки","Оценка диапазона результатов при вариации параметров","Построение модели заново по новым данным сейсморазведки и бурения","Подбор сетки и шага по времени для ускорения расчёта без потери точности","После адаптации прогнозы надёжнее, хотя решение неоднозначно: разные параметры могут дать одинаковую историю."],["Когда применяют композиционную модель вместо модели чёрной нефти?","Когда важен фазовый состав: газоконденсат, закачка CO₂ или сухого газа","Когда в пласте есть только вода и нефть в однофазном состоянии","Когда необходимо ускорить расчёт на крупной сетке","Когда моделируется чистое заводнение тяжёлой нефти","Модель чёрной нефти описывает только псевдокомпоненты, а композиционная — изменение состава фаз."],["На чём основан метод материального баланса?","На сопоставлении отбора и закачки флюидов с изменением давления в залежи","На аппроксимации падения добычи экспонентой по истории скважин участка","На аппроксимации падения добычи экспонентой","На решении уравнений фильтрации в каждой ячейке трёхмерной сетки модели","Метод применим даже без сеточной модели и позволяет оценить запасы и активность аквифера."],["Что такое пропускная способность (трансмиссивность) ячейки?","Способность передавать поток между соседними ячейками","Отношение порового объёма ячейки к объёму модели","Зависимость различия значений от расстояния","Произведение пористости на насыщенность","Она зависит от проницаемости, геометрии и множителей разломов и определяет перетоки в модели."],["Что позволяет моделировать аквифер в гидродинамической модели?","Подток воды из законтурной области","Выпадение конденсата в призабойной зоне","Поступление газа из газовой шапки","Закачку воды через нагнетательные скважины","Аналитические модели, например Картера–Трейси или Фетковича, заменяют большие водоносные области."],["Что делает узловой анализ (NODAL)?","Сопоставляет приток из пласта с подъёмом по скважине для определения рабочей точки","Определяет запасы по изменению пластового давления","Определяет запасы по изменению давления и накопленной добыче в газовой залежи","Сравнивает дебиты скважин одного куста для поиска лучшего режима работы","Пересечение кривых притока и подъёма показывает дебит и давление на выбранном узле."],["Какие исходные данные используют в гидродинамической модели?","Геомодель, PVT, ОФП, капиллярные давления и история скважин","Геомодель и история скважин без PVT и ОФП, так как они уточняются при адаптации","Сейсмические кубы и фациальная модель без данных о работе скважин","Траектории и дебиты скважин, а свойства пласта задаются средними значениями","Эти данные описывают пласт и его поведение."],["Что такое инициализация модели?","Расчёт начального равновесного состояния давления и насыщения","Загрузка истории работы скважин и контроль её полноты","Настройка проницаемости по фактическим дебитам скважин","Расчёт прогнозного варианта разработки","Начальные запасы должны быть согласованы с геологической моделью."],["Что такое псевдо-ОФП?","ОФП, приведённые к крупным ячейкам для учёта неоднородности","Лабораторные ОФП без поправок на масштаб и слоистость","Кривые ОФП, полученные на одном образце керна в опыте","Кривые, рассчитанные по гистограмме пористости","Они компенсируют эффекты, утраченные при укрупнении сетки."],["Какой подход используют для учёта трещин в карбонатах?","Двойная пористость и двойная проницаемость","Модель чёрной нефти без поправок","Модель фильтрации Дарси в одной среде","Двумерная модель без вертикальных связей","Он разделяет блоки матрицы и трещины, обменивающиеся флюидами."],["Что такое WOPR и FOPT в выводах симулятора?","Дебит нефти скважины и накопленная нефть по месторождению","Давление на устье скважины и накопленная вода по группе","Дебит воды скважины и накопленный газ месторождения","Обводнённость и давление на приёме насоса","Такая мнемоника принята в ECLIPSE-подобных симуляторах."],["Что такое численная дисперсия?","Искусственное размывание фронта из-за размера ячеек","Последовательное индикаторное моделирование для дискретных свойств","Последовательное гауссово моделирование непрерывных свойств","Разброс реализаций стохастической модели","Чем крупнее ячейки, тем сильнее размыт фронт вытеснения."],["Какой вид проверки выполняют после адаптации модели?","Прогноз на контрольном периоде","Сравнение размера файлов","Анализ чувствительности к шагу времени без сравнения с фактом","Подбор другой PVT-модели без данных","Если модель воспроизводит период, не использованный при адаптации, ей больше доверяют."],["Зачем моделируют разные варианты разработки?","Чтобы сравнить добычу и экономику и выбрать лучший","Чтобы улучшить совпадение с историей","Чтобы улучшить совпадение с историей разработки","Чтобы уточнить структурную карту и контакты","Варианты отличаются сеткой, режимами, системой воздействия и МУН."],["Что такое адаптация модели на историю?","Настройка параметров по фактическим показателям","Перевод модели на новую версию ПО","Смена сетки на более крупную","Оценка диапазона результатов при вариации параметров","Настраивают давление, дебиты, обводнённость и т.п."],["Чем чёрная нефть (black oil) отличается от композиционной модели?","Фазы описаны упрощённо, без покомпонентного расчёта","Учитывает каждый компонент смеси","Применяется только для газоконденсатных систем","Учитывает каждый компонент смеси при расчёте фаз","Композиционная нужна при важном фазовом поведении."],["Зачем использовать двойную пористость?","Чтобы описать трещины и матрицу раздельно","Чтобы учесть изменение свойств между скважинами","Чтобы ускорить счёт на сетке","Чтобы описать две фации","Подходит для трещиноватых коллекторов."],["Что такое локальное измельчение сетки (LGR)?","Уменьшение ячеек вокруг скважин или разломов","Увеличение ячеек к границе пласта","Изменение направления вариограммы в пределах модели","Отношение эффективной толщины к общей","Точнее описываются градиенты рядом со скважиной."],["Что такое аквифер Картера — Трейси в модели?","Аналитическая модель притока законтурной воды","Лабораторная установка для определения ОФП","Численный метод расчёта капиллярного давления","Кривая капиллярного давления","Позволяет не строить всю водоносную область."],["Какая причина чаще всего вызывает неадекватно быстрый прорыв воды в модели?","Завышенная проницаемость высокопроводящих прослоев","Завышенная плотность нефти и ошибка в давлении насыщения","Занижение вязкости воды на порядок","Занижение вязкости воды на порядок в таблице свойств","Настраивают распределение проницаемости или ОФП."],["Что значит многовариантный прогноз?","Расчёт нескольких сценариев с разной стратегией","Разбиение модели на блоки для ускорения расчёта","Разбиение модели на блоки при счёте","Многократный запуск одного сценария на разных серверах","Сравнивают технологические и экономические показатели."],["Зачем проверяют материальный баланс в расчёте?","Чтобы подтвердить сохранение массы в модели","Чтобы определить стоимость проекта","Чтобы проверить версию ПО и настройки лицензии","Чтобы определить стоимость проекта и его NPV","Большая ошибка баланса говорит о некачественном счёте."]]},{"name":"Практические ситуации","q":[["Модель не воспроизводит обводнение участка: фактически вода пришла раньше. Что корректно проверить первым?","Высокопроницаемые прослои, разломы и связность в геомодели","Изменить ОФП одинаково на всей модели","Умножить проницаемость пласта на постоянный коэффициент","Уменьшить закачку в модели по сравнению с фактом","Адаптацию ведут в физически обоснованных пределах и начинают с факторов, управляющих прорывом."],["Чем геологическая модель отличается от гидродинамической?","Геологическая описывает строение и свойства, гидродинамическая рассчитывает течение флюидов во времени","Геологическая рассчитывает течение, гидродинамическая описывает строение пласта","Гидродинамическая строится только по данным добычи, без геологической основы","Геологическая учитывает давление и насыщенность во времени, а другая — только запасы","Статическая модель — основа для динамической, в которую добавляют PVT, ОФП и скважины."],["Почему хорошее совпадение с историей не гарантирует точный прогноз?","Задача неоднозначна: разные сочетания параметров дают одну и ту же историю","История содержит ошибки замеров, из-за которых модель всегда отклоняется от факта","Для прогноза нужна модель с более мелкой сеткой, чем при адаптации","Адаптация меняет запасы, что всегда приводит к завышению прогноза","Поэтому анализируют несколько адаптированных реализаций и диапазоны прогноза."],["Когда нужна чёрная нефть, а когда композиционная модель для закачки CO₂?","Для закачки CO₂ нужна композиционная модель, так как состав фаз меняется","Для закачки CO₂ достаточно чёрной нефти с поправкой к ОФП","Для закачки CO₂ нужна модель с двойной пористостью","Для закачки CO₂ нужна модель с крупной сеткой и средним PVT","Смешивание и массообмен описывает уравнение состояния, а не упрощённые PVT-таблицы."]]}],"color":"#6A5ACD"},{"id":"chem","name":"Химия нефти и газа","subs":[{"name":"Состав нефти и газа","q":[["Какое примерное содержание углерода в нефти?","83–87 %","70–75 %","75–80 %","90–95 %","Второй основной элемент — водород, примерно 11–14 %. Остальное приходится на серу, азот и кислород."],["Какие группы углеводородов составляют основу нефти?","Алканы, циклоалканы и арены","Алканы, алкены и алкины","Алкены, циклоалканы и спирты","Арены, эфиры и кетоны","Соотношение групп определяет тип нефти и её свойства."],["Какой углеводород является главным компонентом природного газа?","Метан","Этан","Пропан","Бутан","В сухом газе метан обычно составляет более 90 %."],["Что относится к высокомолекулярным неуглеводородным компонентам нефти?","Смолы и асфальтены","Нафтеновые кислоты и фенолы","Меркаптаны и сульфиды","Парафины и церезины","Они определяют цвет, вязкость и стабильность эмульсий и могут осаждаться при добыче."],["Что такое нефтяные парафины?","Твёрдые алканы, выпадающие при охлаждении","Твёрдые циклоалканы и арены","Высокомолекулярные смолы","Сернистые соединения с резким запахом","Отложения парафина в НКТ и трубопроводах борют теплом, скребками и ингибиторами."],["Что такое меркаптаны?","Сернистые соединения с резким запахом","Азотистые основания нефти","Кислородные соединения с резким запахом","Тяжёлые гетероатомные смолы","Они коррозионны, поэтому нефть и газ от них очищают. Ими же одорируют бытовой газ."],["Что такое нафтеновые кислоты?","Кислородсодержащие соединения нефти на основе циклоалканов","Серосодержащие соединения циклического строения","Ароматические углеводороды с боковыми цепями","Расщепление тяжёлых молекул на более лёгкие","Они повышают кислотность нефти и могут вызывать коррозию установок."],["Сколько структурных изомеров имеет бутан?","Два","Три","Один","Пять","Это нормальный бутан и изобутан. Разветвлённость влияет на температуру кипения и свойства топлив."],["Какая общая формула у алканов?","CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙH₂ₙ₋₆","Алканы насыщены и содержат только одинарные связи."],["Какова общая формула циклоалканов (нафтенов)?","CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₆","CₙH₂ₙ₋₂","Замыкание цикла убирает два атома водорода."],["Какое вещество является простейшим ареном?","Бензол","Толуол","Нафталин","Циклогексан","Шесть атомов углерода образуют кольцо с ароматической связью."],["Какие сернистые соединения наиболее коррозионны?","Сероводород и меркаптаны","Тиофены и их производные","Полисульфиды в смолах","Сульфиды в тяжёлых фракциях","Активная сера вызывает коррозию оборудования и опасна."],["Какие неуглеводородные газы часто присутствуют в природном газе?","Азот, углекислый газ и сероводород","Фтор, хлор и сернистый ангидрид","Фтор, хлор и сернистый газ","Водород, кислород и угарный газ","Они снижают теплоту сгорания или требуют очистки."],["Какие классы УВ преобладают в парафинистых нефтях?","Алканы","Арены","Спирты","Сульфиды","Твёрдые алканы выпадают при снижении температуры."],["Какие соединения называют гетероатомными?","Содержащие серу, азот, кислород","Только углерод и водород","Только ароматические углеводороды","Кристаллические парафины","Они концентрируются в смолах и асфальтенах."],["Что такое асфальтены?","Высокомолекулярные полициклические компоненты, нерастворимые в н-алканах","Лёгкие ароматические фракции, выкипающие при атмосферной перегонке нефти","Растворённые газы нефти","Низкомолекулярные парафиновые компоненты, растворимые в лёгких алканах и воде","Асфальтены стабилизируют эмульсии."],["Какой углеводород наиболее распространён в природном газе?","Метан","Этан","Пропан","Бутан","Содержание метана обычно более 80 %."]]},{"name":"Свойства и классификация","q":[["Какой нефти соответствует высокий градус API?","Лёгкой","Вязкой","Смолистой","Высокоасфальтеновой","API обратно связан с плотностью, поэтому большее значение соответствует более лёгкой нефти."],["К какому классу по ГОСТ относится нефть с содержанием серы до 0,6 %?","Малосернистая","Сернистая","Среднесернистая","Высокосернистая","Сернистая — 0,61–1,80 %, высокосернистая — 1,81–3,50 %, особо высокосернистая — более 3,50 %."],["Что такое газовые гидраты?","Кристаллические соединения воды и газа","Смеси лёгких углеводородов с солями","Жидкие конденсаты тяжёлых углеводородов","Минералы, образованные сероводородом","Они устойчивы при низкой температуре и высоком давлении и опасны образованием пробок."],["Какой газ называют жирным?","Газ с повышенным содержанием этана, пропана и бутанов","Газ с высоким содержанием сероводорода","Газ с высоким содержанием сероводорода и углекислоты","Газ, содержащий более 95 % метана и мало азота","Из него выделяют широкую фракцию лёгких углеводородов (ШФЛУ) и другие ценные компоненты."],["Что показывает кислотное число нефтепродукта?","Количество KOH на нейтрализацию кислот в 1 г образца","Содержание сернистых соединений в пересчёте на H₂S","Концентрацию хлористых солей","Объём кислоты для разложения эмульсии","Высокое значение указывает на коррозионность."],["Какие нефти называют парафинистыми?","С высоким содержанием твёрдых алканов","С высоким содержанием циклоалканов и аренов","С высокой плотностью и большим количеством смол","С низкой температурой застывания","Они застывают при более высокой температуре, что усложняет транспорт."],["Что такое температура застывания нефти?","Температура, при которой нефть теряет подвижность","Температура начала кристаллизации парафина","Температура, при которой образуются гидраты","Температура, при которой нефть становится вязкопластичной","Она определяет условия хранения и перекачки в холодном климате."],["Что такое температура вспышки?","Температура, при которой пары воспламеняются от внешнего источника","Температура, при которой продукт самовоспламеняется без внешнего источника","Температура, при которой нефть теряет подвижность","Температура устойчивого горения продукта после поджигания","Этот показатель определяет пожаробезопасность продукта."],["Что такое API?","Шкала плотности нефти: чем выше, тем легче","Содержание серы в нефти","Содержание серы в нефти в массовых процентах","Шкала вязкости нефти: чем выше, тем гуще","API = 141,5/ρ − 131,5, где ρ — относительная плотность."],["Какие нефти считают тяжёлыми?","С плотностью примерно выше 870–900 кг/м³","С высоким содержанием твёрдых алканов","С содержанием парафина выше 2 %","С содержанием серы менее 0,5 %","Границы зависят от классификации."],["Что значит «сернистая» нефть?","С содержанием серы 0,61–1,8 %","С содержанием серы до 0,6 %","С содержанием серы выше 3,5 %","С содержанием H₂S менее 20 ppm","По ГОСТ: малосернистые, сернистые, высокосернистые."],["Что такое разгонка по Энглеру?","Определение фракционного состава","Метод определения вязкости","Определение серы сжиганием","Определение воды по Дину и Старку","Показывает выход фракций по температурам."]]},{"name":"Переработка","q":[["Какая фракция нефти примерно выкипает до 180 °C?","Бензиновая","Керосиновая","Дизельная","Масляная","Керосин и дизельная фракция выкипают выше, а мазут является остатком атмосферной перегонки."],["На чём основана перегонка нефти?","На разности температур кипения компонентов","На разности плотностей компонентов","На различной растворимости в воде","На различии молекулярной полярности","Ректификационная колонна разделяет нефть на фракции при нагреве и многократной конденсации."],["Что такое крекинг?","Расщепление тяжёлых молекул на более лёгкие","Соединение лёгких молекул в более тяжёлые","Отделение воды от нефти при нагреве","Перегруппировка молекул без изменения их массы","Он увеличивает выход светлых продуктов из тяжёлых фракций."],["Что такое риформинг?","Процесс повышения октанового числа бензиновых фракций","Снижение содержания серы водородом","Снижение содержания серы в топливе с помощью водорода","Расщепление мазута на бензин при высокой температуре","Каталитический риформинг увеличивает долю аренов."],["Что такое гидроочистка?","Удаление серы и азота с помощью водорода","Разрушение тяжёлых молекул в присутствии катализатора","Обессоливание нефти пресной водой","Повышение октанового числа","Она позволяет выпускать малосернистые топлива."],["Что показывает октановое число?","Детонационную стойкость бензина","Склонность топлива к самовоспламенению при сжатии","Температуру начала кристаллизации","Содержание ароматических углеводородов","Чем оно выше, тем лучше бензин сопротивляется детонации."],["Что показывает цетановое число?","Воспламеняемость дизельного топлива","Стойкость бензина к детонации","Температуру застывания дизтоплива","Содержание серы в дизтопливе","Чем оно выше, тем быстрее воспламеняется топливо."]]},{"name":"Практические ситуации","q":[["Почему асфальтены могут выпадать при снижении давления выше давления насыщения?","Лёгкие компоненты расширяются, и растворяющая способность нефти падает","При снижении давления они кристаллизуются подобно парафинам","При снижении давления растёт концентрация смол","При снижении давления из нефти уходит вода, удерживающая их","Наибольший риск находится около давления насыщения, поэтому важен анализ стабильности нефти."],["Смешали две совместимые по отдельности нефти, и появился осадок. Что вероятнее всего?","Нарушена коллоидная стабильность асфальтенов","Застывание парафина из-за смешения","Выпадение солей жёсткости из пластовой воды","Образование гидратов при смешении","Смешение парафинистой нефти с тяжёлой снижает растворимость асфальтенов."]]}],"color":"#D6409F"},{"id":"econ","name":"Экономика в нефтегазовой отрасли","subs":[{"name":"Показатели эффективности","q":[["Что показывает чистый дисконтированный доход (ЧДД, NPV)?","Сумму дисконтированных денежных потоков проекта за расчётный период","Накопленную недисконтированную прибыль проекта за расчётный период","Отношение дисконтированных доходов к дисконтированным вложениям","Ставку, при которой дисконтированные потоки проекта уравновешены","ЧДД приводит все притоки и оттоки к текущему моменту по ставке дисконтирования. Проект экономически приемлем при ЧДД больше нуля."],["Внутренняя норма доходности (IRR) — это ставка дисконтирования, при которой:","ЧДД проекта равен нулю","ЧДД проекта достигает максимума","индекс доходности равен нулю","накопленный денежный поток становится положительным","IRR показывает предельную ставку, которую выдерживает проект. Её сравнивают с требуемой доходностью: проект принимают, если IRR выше барьерной ставки."],["Индекс доходности инвестиций (PI) больше 1 означает, что:","дисконтированные доходы превышают дисконтированные инвестиции","недисконтированная выручка превышает капитальные вложения","внутренняя норма доходности выше единицы","дисконтированный срок окупаемости меньше одного года","PI — это отдача на рубль вложений. PI > 1 соответствует положительному ЧДД, поэтому показатель удобен для сравнения проектов при ограниченном бюджете."],["Дисконтированный срок окупаемости по сравнению с простым:","не меньше простого срока окупаемости","обычно меньше простого, так как учитывает стоимость денег","равен простому при положительном ЧДД","больше простого только при отрицательном ЧДД","Дисконтирование уменьшает будущие поступления, поэтому для возврата вложений нужно столько же или больше времени."],["Как повышение ставки дисконтирования влияет на ЧДД типичного нефтяного проекта?","ЧДД снижается","ЧДД растёт, так как будущие доходы приводятся к большей базе","ЧДД меняется, только если изменилась цена нефти","ЧДД снижается лишь у проектов с IRR ниже ставки","Вложения приходятся на начало проекта, а доходы — на будущее. Чем выше ставка, тем сильнее обесцениваются будущие доходы."],["Для чего выполняют анализ чувствительности проекта?","Чтобы оценить изменение показателей при изменении цены, добычи и затрат","Чтобы найти ставку, при которой ЧДД проекта равен нулю","Чтобы найти ставку, при которой ЧДД проекта равен нулю при базовых допущениях","Чтобы рассчитать вероятность геологического успеха разведочной скважины","Анализ показывает, какие параметры сильнее всего влияют на ЧДД. Результат обычно изображают диаграммой-торнадо."],["Относительно чего определяют дополнительную добычу от ГТМ?","Относительно базового варианта — добычи без мероприятия","Относительно проектного уровня добычи на этот год","Относительно максимального дебита скважины в истории","Относительно дебита соседних скважин на участке","Эффект мероприятия — это разница между фактической добычей и той, что была бы без него. Обычно базу строят по характеристикам падения."],["Какой критерий предпочтительнее при выборе одного из взаимоисключающих проектов?","Наибольший ЧДД","Наибольшая внутренняя норма доходности","Наибольший индекс доходности","Наименьший срок окупаемости","ЧДД показывает абсолютный прирост стоимости, а IRR и PI могут вводить в заблуждение при разных масштабах проектов."],["Что такое денежный поток от инвестиционной деятельности?","Движение средств, связанное с вложениями в активы","Движение средств от привлечения кредитов и выплаты дивидендов","Поступления от продажи продукции за вычетом затрат","Разница между выручкой и амортизацией за период","Сюда относят капитальные вложения и продажу активов. Операционный поток связан с текущей деятельностью."],["Что такое барьерная ставка (hurdle rate)?","Минимальная доходность, которую компания требует от проекта","Ставка налога на прибыль для нефтяных компаний","Ставка, при которой ЧДД проекта равен нулю","Средняя доходность уже реализованных проектов","Проект с IRR ниже барьера обычно отклоняется, поскольку не окупает стоимость капитала и риски."],["Что отражает кумулятивный денежный поток в точке минимума?","Максимальную потребность проекта в финансировании","Полную окупаемость проекта без учёта дисконтирования","Конечную накопленную прибыль проекта","Момент достижения проектного максимума добычи","До этой точки расходы превышают поступления. Глубина минимума показывает, сколько денег нужно вложить."],["Если в результате реализации геолого-технических мероприятий наблюдается уменьшение добычи нефти по сравнению с базовым вариантом, то это может вызвать следующее:","все ответы верны","экономию на эксплуатационных затратах в этот период","снижение выручки в этот период","неэффективность реализации проекта","Все три следствия связаны. Меньше добыча — меньше выручка. Часть эксплуатационных затрат зависит от объёма добычи, поэтому они тоже снижаются. Если потери выручки не перекрываются, проект оказывается неэффективным.","lzs-10"],["Характерной чертой проведения геолого-технических мероприятий является следующее:","Проведение геолого-технических мероприятий требует затрат","Проведение геолого-технических мероприятий производится за счет подрядчика","Геолого-технические мероприятия всегда эффективны","Геолого-технические мероприятия всегда прибыльны","Любое ГТМ — это работы, оборудование и простой скважины, то есть затраты. Именно поэтому их эффективность оценивают заранее: успех и прибыль не гарантированы, а платит за работы недропользователь, а не подрядчик.","lzs-11"],["Оценка экономической эффективности геолого-технических мероприятий производится для:","Отбора и ранжирования предлагаемых геолого-технических мероприятий","Учёта инфляции в период после проведения геолого-технических мероприятий","Расчёта дивидендов акционеров","Расчёта налогов","Бюджет ограничен, а скважин-кандидатов много. Экономическая оценка отсекает неэффективные мероприятия и выстраивает остальные по приоритету, чтобы вложить средства в самые выгодные.","lzs-12"],["Под ранжированием инвестиционных проектов понимают:","Сравнение уже отобранных проектов с целью выбора наилучшего","Все перечисленное","Отсечение неэффективных проектов","Выбор критериев для сравнения проектов","Ранжирование — выстраивание проектов по убыванию привлекательности. Отсечение неэффективных проектов — это предшествующий этап отбора, а выбор критериев — подготовительный шаг.","lzs-24"],["Какой метод оценки эффективности инвестиционного проекта наиболее приемлем при покупке лицензии на разработку месторождения?","Метод денежных потоков","Любой из перечисленных","Метод балансовой стоимости активов","Метод рыночной стоимости активов","Ценность лицензии определяется будущей добычей, поэтому её оценивают дисконтированием будущих денежных потоков. Балансовая стоимость отражает прошлые затраты, а рыночных аналогов у конкретного участка часто нет.","lzs-25"],["Что показывает IRR?","Ставку дисконтирования, при которой NPV равен нулю","Срок возврата инвестиций в годах","Отношение прибыли к выручке за год","Индекс прибыльности проекта","Проект приемлем, если IRR выше требуемой доходности."],["Что такое индекс доходности (PI)?","Отношение дисконтированных притоков к инвестициям","Отношение выручки к затратам в первый год","Движение средств, связанное с вложениями в активы","Изменение показателей при изменении исходных данных","PI > 1 означает NPV > 0."],["Чем дисконтированный срок окупаемости отличается от простого?","Учитывает стоимость денег во времени","Не учитывает инвестиции","Рассчитывается по геологическим запасам","Всегда короче простого","Он длиннее простого при положительной ставке."],["Что сильнее всего снижает NPV проекта при прочих равных?","Сдвиг денежных притоков на более поздний срок","Рост числа сценариев расчёта","Округление выручки до млн","Перенос инвестиций на более поздний срок","Ранние притоки дисконтируются меньше."],["Что такое чувствительность проекта?","Изменение показателей при изменении исходных данных","Вероятность добычи за контурный период","Движение средств, связанное с вложениями в активы","Отношение дисконтированных притоков к инвестициям","Обычно строят «торнадо» по цене, капзатратам, добыче."],["Что такое точка безубыточности?","Объём, при котором выручка равна затратам","Момент ввода первой скважины проекта","Момент ввода первой скважины","Цена, при которой выручка покрывает налоги","Ниже этой точки проект убыточен."],["Что такое EBITDA?","Прибыль до процентов, налогов и амортизации","Чистая прибыль после налогов","Выручка за вычетом капитальных затрат","Прибыль после налогов и выплаты дивидендов","Показатель не учитывает капзатраты."],["Инвестиции 1000 млн руб. сейчас. Притоки: 600 млн за первый год и 2000 млн за второй. Ставка 10 %. Каков NPV? Округлите до 1 млн.","1198 млн руб.","1600 млн руб.","1298 млн руб.","1364 млн руб.","Первый год: 600 ÷ 1,1 = 545\nВторой год: 2000 ÷ 1,21 = 1653\nNPV = −1000 + 545 + 1653 = 1198"],["Инвестиции 5000 млн руб. сейчас. Притоки: 1000 млн за первый год и 1200 млн за второй. Ставка 10 %. Каков NPV? Округлите до 1 млн.","3099 млн руб.","2800 млн руб.","3199 млн руб.","3000 млн руб.","Первый год: 1000 ÷ 1,1 = 909\nВторой год: 1200 ÷ 1,21 = 992\nNPV = −5000 + 909 + 992 = −3099\nМинус означает, что проект не окупается при этой ставке, а по модулю это 3099."],["Инвестиции 2000 млн руб. сейчас. Притоки: 800 млн за первый год и 2000 млн за второй. Ставка 10 %. Каков NPV? Округлите до 1 млн.","380 млн руб.","800 млн руб.","480 млн руб.","545 млн руб.","Первый год: 800 ÷ 1,1 = 727\nВторой год: 2000 ÷ 1,21 = 1653\nNPV = −2000 + 727 + 1653 = 380"],["Инвестиции 5000 млн руб. сейчас. Притоки: 800 млн за первый год и 1500 млн за второй. Ставка 10 %. Каков NPV? Округлите до 1 млн.","3033 млн руб.","2700 млн руб.","3133 млн руб.","2909 млн руб.","Первый год: 800 ÷ 1,1 = 727\nВторой год: 1500 ÷ 1,21 = 1240\nNPV = −5000 + 727 + 1240 = −3033\nМинус означает, что проект не окупается при этой ставке, а по модулю это 3033."],["Инвестиции 1000 млн руб. сейчас. Притоки: 1000 млн за первый год и 1200 млн за второй. Ставка 10 %. Каков NPV? Округлите до 1 млн.","901 млн руб.","1200 млн руб.","1001 млн руб.","1000 млн руб.","Первый год: 1000 ÷ 1,1 = 909\nВторой год: 1200 ÷ 1,21 = 992\nNPV = −1000 + 909 + 992 = 901"],["Инвестиции 1200 млн руб., ежегодный денежный поток 200 млн руб. Каков простой срок окупаемости?","6 лет","1,667 лет","7 лет","8 лет","T = I / CF\n1200 ÷ 200 = 6 лет"],["Инвестиции 1500 млн руб., ежегодный денежный поток 400 млн руб. Каков простой срок окупаемости?","3,75 лет","2,667 лет","4,75 лет","5,75 лет","T = I / CF\n1500 ÷ 400 = 3,75 лет"],["Инвестиции 1200 млн руб., ежегодный денежный поток 300 млн руб. Каков простой срок окупаемости?","4 лет","2,5 лет","5 лет","6 лет","T = I / CF\n1200 ÷ 300 = 4 лет"],["Инвестиции 900 млн руб., ежегодный денежный поток 500 млн руб. Каков простой срок окупаемости?","1,8 лет","5,556 лет","2,8 лет","3,8 лет","T = I / CF\n900 ÷ 500 = 1,8 лет"],["Инвестиции 900 млн руб., ежегодный денежный поток 400 млн руб. Каков простой срок окупаемости?","2,25 лет","4,444 лет","3,25 лет","4,25 лет","T = I / CF\n900 ÷ 400 = 2,25 лет"]]},{"name":"Затраты и себестоимость","q":[["Какой из расходов относится к капитальным затратам (CAPEX)?","Бурение новой эксплуатационной скважины","Смена отказавшего ЭЦН на аналогичный при текущем ремонте","Закупка деэмульгатора на год для установки подготовки","Оплата услуг подрядчика по обслуживанию скважин","CAPEX создаёт новый актив со сроком службы больше года. Энергия, реагенты и зарплата относятся к текущим эксплуатационным затратам (OPEX)."],["Предел рентабельной эксплуатации скважины наступает, когда:","выручка перестаёт покрывать текущие затраты на её эксплуатацию","накопленный денежный поток скважины становится нулевым","обводнённость достигает проектного максимума","окупаются капитальные вложения в её бурение","Экономический предел зависит от цены и затрат. Прошлые вложения на решение не влияют: важно, приносит ли скважина положительный текущий поток."],["Что произойдёт с удельной себестоимостью тонны нефти при падении добычи и неизменных условно-постоянных затратах?","Она вырастет","Она снизится из-за уменьшения переменных затрат","Она не изменится, так как тариф на энергию постоянен","Она снизится вслед за налоговой нагрузкой","Постоянные затраты распределяются на меньший объём, поэтому на каждую тонну приходится большая их часть."],["Какую роль играет амортизация в расчёте денежного потока?","Это неденежный расход, который уменьшает налог на прибыль","Это денежный расход на восстановление основных средств","Это резерв, который уменьшает ЧДД на всю свою величину","Это налоговый платёж, не влияющий на прибыль","Амортизация снижает налогооблагаемую прибыль, но деньги при этом не уходят. Поэтому в денежном потоке её прибавляют обратно к чистой прибыли."],["К условно-переменным затратам в добыче обычно относят:","Затраты на энергию для подъёма жидкости","Амортизацию нефтепромысловых сооружений","Оплату труда аппарата управления","Налог на имущество организации","Они зависят от объёма добычи. Амортизация и административные расходы от него почти не зависят."],["Что такое удельные капитальные вложения?","Капитальные вложения на единицу мощности или запасов","Капитальные вложения, отнесённые на год реализации проекта","Эксплуатационные затраты на тонну добычи","Доля капитальных вложений в выручке","Показатель позволяет сравнивать проекты разного масштаба, например по рублям на тонну запасов."],["Какой фактор сильнее всего увеличивает OPEX при высокой обводнённости?","Подъём и подготовка большого объёма воды","Рост амортизации насосного оборудования","Снижение цены на нефть","Увеличение ставки дисконтирования","На тонну нефти приходится всё больше жидкости, поэтому затраты на энергию и подготовку растут."],["Что такое FID в инвестиционном цикле?","Окончательное инвестиционное решение","Этап выбора концепции проекта","Окончание опытно-промышленных работ","Завершение подсчёта запасов","После FID компания выделяет основные средства на реализацию проекта."],["Основными путями снижения себестоимости в капиталоемких отраслях являются:","Лучшее использование основных производственных фондов, максимальное извлечение из недр нефти и газа.","Механизация и автоматизация производственных процессов.","Внедрение энергосберегающих технологий, минимизация затрат при транспортировке.","Внедрение материалосберегающих и безотходных технологий, глубокая переработка нефти и газа.","В капиталоёмкой отрасли основная часть себестоимости — амортизация и другие постоянные затраты, поэтому главный рычаг — эффективнее загружать фонды и больше извлекать из недр на единицу вложений. Остальные варианты тоже полезны, но второстепенны.","lzs-74"],["Какая группа затрат наиболее присуща стадии разведки месторождения?","Разведочные затраты","Капитальные затраты","Налоговые затраты","Эксплуатационные затраты","На стадии разведки добычи ещё нет, поэтому эксплуатационных затрат практически нет, а капитальные на обустройство ещё не начались. Основные расходы — геолого-разведочные: сейсмика и разведочное бурение.","lzs-75"],["Какие затраты относятся к CAPEX?","Бурение и обустройство","Электроэнергия на насосы","Зарплата операторов","Текущий ремонт скважин","Капитальные вложения амортизируются."],["Какие затраты относятся к OPEX?","Энергия, персонал, текущие ремонты","Строительство трубопровода и подстанции","Строительство трубопровода","Бурение, обустройство, покупка лицензии","Операционные затраты относятся к текущей деятельности."],["Что такое условно-постоянные затраты?","Не зависят напрямую от объёма добычи","Растут пропорционально добыче","Возникают один раз за проект","Покрываются только из прибыли","Например, аренда, содержание персонала."],["Что такое амортизация?","Перенос стоимости основных средств на затраты","Снижение рыночной цены нефти","Снижение рыночной цены актива","Выплата процентов по основному средству","Она снижает налог на прибыль, но денежный поток не уменьшает."],["Переменные затраты 2000 руб./т, постоянные 2000 млн руб. в год, добыча 2000 тыс. т. Какова себестоимость тонны?","3000 руб./т","2000 руб./т","1000 руб./т","3500 руб./т","Постоянные на тонну: 2000 млн ÷ 2000 тыс. т = 1000 руб./т\n2000 + 1000 = 3000 руб./т"],["Переменные затраты 2000 руб./т, постоянные 1000 млн руб. в год, добыча 2000 тыс. т. Какова себестоимость тонны?","2500 руб./т","2000 руб./т","500 руб./т","3000 руб./т","Постоянные на тонну: 1000 млн ÷ 2000 тыс. т = 500 руб./т\n2000 + 500 = 2500 руб./т"],["Переменные затраты 2000 руб./т, постоянные 3000 млн руб. в год, добыча 1000 тыс. т. Какова себестоимость тонны?","5000 руб./т","2000 руб./т","3000 руб./т","5500 руб./т","Постоянные на тонну: 3000 млн ÷ 1000 тыс. т = 3000 руб./т\n2000 + 3000 = 5000 руб./т"],["Переменные затраты 1200 руб./т, постоянные 1000 млн руб. в год, добыча 2000 тыс. т. Какова себестоимость тонны?","1700 руб./т","1200 руб./т","500 руб./т","2200 руб./т","Постоянные на тонну: 1000 млн ÷ 2000 тыс. т = 500 руб./т\n1200 + 500 = 1700 руб./т"]]},{"name":"Налоги и рынок","q":[["Какой налог в России начисляется на количество добытого полезного ископаемого?","НДПИ","НДД","Налог на имущество организаций","Вывозная таможенная пошлина","Налог на добычу полезных ископаемых рассчитывается от объёма добытого сырья, поэтому его платят независимо от прибыльности добычи."],["Что в упрощённом виде облагается налогом на дополнительный доход (НДД)?","Расчётная выручка за вычетом затрат на добычу и транспорт","Объём добытой нефти, умноженный на ставку и коэффициенты","Чистая прибыль компании по всем лицензионным участкам","Экспортная выручка за вычетом таможенных платежей","НДД учитывает экономику участка: чем выше доход за вычетом затрат, тем больше налог. В этом его отличие от НДПИ, привязанного к объёму добычи."],["Что такое нетбэк (netback) нефти?","Цена реализации за вычетом расходов на транспортировку и сбыт","Биржевая цена маркерного сорта за вычетом налогов","Операционная прибыль на баррель после всех вложений","Разница между ценой сорта и ценой Brent","Нетбэк показывает, сколько производитель получает в точке добычи. По нему сравнивают направления поставок."],["Сколько примерно баррелей содержится в одной тонне нефти средней плотности?","Около 7,3","Около 6,3","Около 8,5","Около 10","Баррель равен примерно 159 литрам. При плотности около 0,87 т/м³ получается примерно 7,3 барреля на тонну."],["Что означает маржа переработки для нефтепереработчика?","Разницу между стоимостью продуктов и стоимостью нефти","Разницу между внутренней и экспортной ценой нефти","Разницу между ценой нефти и затратами на её добычу","Сумму акцизов на произведённые нефтепродукты","Она показывает, сколько зарабатывает завод на превращении нефти в продукты."],["Почему цена тяжёлых сернистых сортов обычно ниже цены лёгких малосернистых?","Из них сложнее и дороже получать светлые продукты","Такие сорта сложнее транспортировать по трубопроводам зимой","Такие сорта облагаются повышенным НДПИ","На такие сорта установлены экспортные квоты","Лёгкая малосернистая нефть даёт больше ценных фракций и требует меньше затрат на обессеривание."],["Что такое дифференциал цены сорта нефти?","Разница между ценой сорта и ценой эталонного сорта","Разница между ценами покупки и продажи на бирже","Разница цен одного сорта в разные месяцы поставки","Разница между ценой нефти и нефтепродукта","Сорта торгуются со скидкой или премией к бенчмарку, например Brent."],["Какой орган выдаёт лицензии на пользование недрами в РФ?","Федеральное агентство по недропользованию (Роснедра)","Министерство природных ресурсов и экологии РФ","Федеральная служба по надзору в сфере природопользования","Федеральная служба по экологическому, технологическому и атомному надзору","Лицензия удостоверяет право пользования участком недр на определённых условиях."],["Какой показатель связан с валютным риском экспортёра нефти?","Курс рубля к иностранным валютам","Ставка НДПИ на текущий месяц","Индекс цен производителей в отрасли","Тариф на прокачку нефти по трубопроводу","Выручка часто зависит от валюты, а затраты — рублёвые, поэтому курс влияет на рентабельность."],["От чего зависит НДД?","От финансового результата участка","Только от цены на дизельное топливо","Только от цены на дизель","Только от объёма добытой нефти на участке","НДД применяется к выделенным группам участков."],["Какой налог традиционно взимается с тонны добытой нефти?","НДПИ","НДФЛ","НДС на бурение","Налог на имущество","Его база связана с объёмом и ценой нефти."],["Что такое нетбэк?","Цена за вычетом транспорта и пошлин","Отпускная цена НПЗ без учёта качества","Выручка за вычетом налогов","Выручка за вычетом налогов и зарплаты","Показывает доход на устье или на границе."],["Что такое дисконт Urals к Brent?","Разница цен из-за качества и логистики","Плата за транзит по трубопроводу","Разница между ценой сорта и ценой эталонного сорта","Скидка для НПЗ внутри страны","Определяется спросом, качеством и условиями поставки."]]},{"name":"Практические ситуации","q":[["Проект А: ЧДД 500 млн ₽, IRR 18 %. Проект Б: ЧДД 300 млн ₽, IRR 25 %. Проекты взаимоисключающие, ставка 12 %. Что выбрать?","Проект А: при таком выборе важнее абсолютный прирост стоимости","Проект Б: выше внутренняя норма доходности","Проект Б: при IRR 25 % меньше риск снижения цены","Проект А: у него наибольший индекс доходности по определению","При взаимоисключении сравнивают ЧДД: IRR не учитывает масштаб проекта и может указать на меньший проект."],["Дополнительная скважина даёт 20 т/сут нефти при обводнённости 90 %. Что проверить в первую очередь, принимая решение?","Покрывает ли выручка от нефти затраты на подъём и подготовку всей жидкости","Окупаются ли затраты на бурение за счёт начального дебита нефти за первый год","Выше ли дебит нефти среднего по участку независимо от обводнённости","Хватит ли мощности насоса для заданного дебита нефти при текущем газовом факторе","На 20 т нефти приходится около 200 т жидкости, поэтому экономика определяется затратами на всю жидкость."],["Цена нефти упала на 30 %. Какие решения обычно принимают первыми?","Пересматривают проекты с низким запасом прочности и откладывают неокупаемые ГТМ","Останавливают скважины с дебитом ниже среднего по фонду независимо от их экономики","Увеличивают ставку дисконтирования во всех проектах на величину падения цены","Отменяют все ремонты на действующем фонде до восстановления цены","Рентабельный фонд продолжает работать, а чувствительные к цене вложения перепроверяются."],["ГТМ стоит 15 млн ₽ и даёт 6 тыс. т дополнительной нефти. Какой подход к оценке корректен?","Сравнить дисконтированный денежный поток с мероприятием и без него","Разделить стоимость на тонны и сравнить с выручкой от тонны нефти","Сравнить добычу скважины после мероприятия с дебитом соседних скважин","Сравнить накопленную выручку за первый год со стоимостью мероприятия","Оценивается приростный эффект с учётом налогов, затрат и времени, то есть разница двух вариантов."],["Почему два месторождения с равными запасами могут иметь разную стоимость?","Различаются глубина, дебиты, инфраструктура, налоговые льготы и сроки ввода","Различаются только запасы категорий, а прочие условия на стоимость не влияют","Стоимость определяется в основном ставкой НДПИ на дату оценки","Различие возникает из-за разных методик подсчёта геологических запасов","Стоимость отражает будущие денежные потоки, а они зависят не только от объёма запасов."]]}],"color":"#F2A900"},{"id":"safety","name":"Промышленная безопасность в нефтегазовой отрасли","subs":[{"name":"Законы и документы","q":[["Какой закон устанавливает основы промышленной безопасности опасных производственных объектов в РФ?","Федеральный закон № 116-ФЗ от 21.07.1997","Федеральный закон № 184-ФЗ «О техническом регулировании»","Федеральный закон № 68-ФЗ о защите от чрезвычайных ситуаций","Федеральный закон № 69-ФЗ «О пожарной безопасности»","Закон № 116-ФЗ определяет правовые и экономические основы безопасной эксплуатации ОПО и обязанности организаций."],["На сколько классов опасности делятся опасные производственные объекты?","На четыре (I–IV)","На три (I–III)","На пять (I–V)","На шесть (I–VI)","Самый опасный — I класс (чрезвычайно высокая опасность), самый низкий — IV (пониженная опасность). От класса зависят требования надзора."],["Какой документ определяет действия персонала при аварии на ОПО?","План мероприятий по локализации и ликвидации последствий аварий (ПМЛА)","Декларация промышленной безопасности опасного производственного объекта","Паспорт скважины с перечнем аварийных служб и схемой эвакуации","Паспорт опасного производственного объекта","ПМЛА содержит сценарии аварий, действия и ответственность персонала, порядок оповещения и эвакуации."],["Какой инструктаж проводят при вводе нового оборудования или изменении технологии?","Внеплановый","Первичный на рабочем месте","Целевой","Повторный","Внеплановый инструктаж проводят при изменении условий работы, новых правилах, а также после нарушений и несчастных случаев."],["Какой документ заменил ПБ 08-624-03 в нефтегазовой отрасли?","ФНП «Правила безопасности в нефтяной и газовой промышленности»","ФНП «Правила безопасности опасных производственных объектов»","ФНП «Правила безопасности при бурении на шельфе»","Технический регламент о безопасности машин и оборудования","ПБ 08-624-03 утратили силу. Сейчас действуют федеральные нормы и правила Ростехнадзора; их последняя редакция утверждена приказом № 534 от 15.12.2020."],["Что такое опасный производственный объект?","Объект, где обращаются опасные вещества или применяется оборудование, указанное в законе","Объект, расположенный в зоне с повышенным риском землетрясений и подтоплений","Объект, на котором работают более 100 человек и есть электроустановки до 1000 В","Объект с годовым оборотом опасных веществ свыше 1000 т","Признаки ОПО перечислены в приложении к закону № 116-ФЗ, и объект подлежит регистрации в реестре."],["Что такое авария по закону о промышленной безопасности?","Разрушение сооружений или технических устройств, неконтролируемый взрыв или выброс опасных веществ","Любой несчастный случай на производстве, повлекший потерю трудоспособности сотрудника","Поступление пластового флюида в скважину, не предусмотренное технологией работ","Отказ или повреждение технических устройств, отклонение от режима технологического процесса без разрушения","Закон разделяет аварию и инцидент: инцидент — это отказ или отклонение без признаков аварии."],["Кто имеет право проводить экспертизу промышленной безопасности?","Организация с соответствующей лицензией","Служба производственного контроля самого предприятия","Только территориальный орган Ростехнадзора","Любая организация с разрешением органов местной власти","Экспертизу проводят лицензированные организации и аттестованные эксперты."],["Что должна обеспечить организация, эксплуатирующая ОПО?","Производственный контроль за соблюдением требований промбезопасности","Ежегодную аттестацию всех работников в Ростехнадзоре","Ежегодную аттестацию всех работников в территориальном органе Ростехнадзора","Постоянное присутствие инспектора Ростехнадзора на опасном объекте","Производственный контроль — обязательная система внутреннего надзора на ОПО."],["Укажите периодичность проверки знания плана ликвидации аварий?","Проверяется во время учебных и тренировочных занятий с персоналом объекта, проводимых по графику, утвержденному техническим руководителем опасного производственного объекта","Проверяется один раз в год при проведении проверки знаний по основной профессии и при внесении изменений и дополнений в ПЛА","Проверяется с периодичностью - один раз в три года","Проверяется один раз в 6 месяцев при проведении повторного инструктажа","Знание ПЛА — практический навык, поэтому его проверяют на учебно-тренировочных занятиях по утверждённому графику, а не разовым экзаменом с фиксированным сроком.","lzs-61"],["Укажите условия допуска рабочих к выполнению работ, по совмещаемой профессии?","Должны пройти обучение и получить соответствующую классификацию по видам выполняемых работ, а также иметь допуски к самостоятельной работе по совмещаемым профессиям","Должны пройти курс обучение по переподготовке специалистов","Должны пройти стажировку на предприятии и проверку знаний по видам выполняемых работ при совмещении профессий","Должны пройти обучение и стажировку на предприятии","Работа по совмещаемой профессии требует полного набора условий: обучение, квалификация по этому виду работ и допуск к самостоятельной работе. Стажировка и проверка знаний без допуска недостаточны. В файле написано «классификацию», по смыслу это «квалификацию».","lzs-62"],["Какой закон определяет основы промышленной безопасности ОПО?","116-ФЗ","7-ФЗ","89-ФЗ","2395-1","№ 116-ФЗ «О промышленной безопасности опасных производственных объектов»."],["Что заменило ПБ 08-624-03 в части нефтегазовой отрасли?","Федеральные нормы и правила","Постановление местной администрации","Отраслевые ГОСТ на нефть","Внутренний приказ предприятия","Действующие ФНП утверждены Ростехнадзором."],["Какой документ обязателен для ОПО I–III классов?","План мероприятий по локализации и ликвидации аварий","Паспорт скважины в архиве","Журнал регистрации инструктажей на рабочем месте","Декларация промышленной безопасности на весь объект","ПМЛА регламентирует действия персонала при авариях."],["Чем отличается авария от инцидента?","Авария — разрушение объекта или взрыв, инцидент — отказ или отклонение","Авария всегда приводит к гибели людей","Инцидент касается только оборудования, а авария — только персонала","Авария всегда приводит к гибели людей, инцидент — к травмам персонала","Определения даны в 116-ФЗ."],["Что такое наряд-допуск?","Разрешение на проведение работ повышенной опасности","Табель учёта рабочего времени","Журнал регистрации инструктажа","Газонефтеводопроявление — приток флюида в скважину","Определяет меры безопасности и ответственных."],["Какой вид инструктажа проводят перед работами по наряду?","Целевой","Вводный","Повторный","Первичный на рабочем месте","Целевой — перед работами с особыми условиями."]]},{"name":"ГНВП и противовыбросовое оборудование","q":[["Что такое газонефтеводопроявление (ГНВП)?","Поступление пластового флюида в скважину, не предусмотренное технологией работ","Поглощение бурового раствора с последующим переливом","Вызов притока при освоении скважины свабированием","Разрушение сооружений или технических устройств, неконтролируемый взрыв или выброс опасных веществ","ГНВП возникает, когда забойное давление становится ниже пластового. Без контроля оно может перейти в открытый фонтан."],["Какой признак прямо указывает на начало ГНВП при бурении?","Рост объёма раствора в приёмных ёмкостях при постоянной подаче насосов","Снижение давления на стояке при том же расходе из-за износа долота","Рост механической скорости бурения в плотных породах","Увеличение крутящего момента на роторе","Лишний объём в ёмкостях означает, что в скважину поступает пластовый флюид. Это один из первых и самых надёжных признаков."],["Для чего предназначено противовыбросовое оборудование (ПВО)?","Для герметизации устья и управления скважиной при ГНВП","Для регулирования давления на стояке при обычной циркуляции","Для удержания бурильной колонны при спуско-подъёме","Для отвода раствора на систему очистки","Превенторы закрывают устье, а манифольд позволяет выпустить флюид через штуцер и задавить скважину."],["Каково первое действие вахты при обнаружении ГНВП?","Загерметизировать устье и оповестить руководителя работ","Остановить циркуляцию и наблюдать за скважиной 30 минут","Поднять инструмент в башмак обсадной колонны","Начать утяжеление раствора в ёмкостях","Быстрое закрытие устья ограничивает объём поступившего флюида. Подъём инструмента в такой момент опасен: поршневание только усиливает приток."],["Что такое открытый фонтан?","Неуправляемое истечение пластового флюида через устье","Управляемое истечение через штуцерную линию при глушении","Нормальная работа скважины фонтанным способом","Перелив раствора при спуске инструмента","Это наиболее тяжёлая авария при строительстве и ремонте скважин, часто сопровождаемая пожаром."],["Как называется процедура вымыва поступившего флюида с утяжелением раствора?","Глушение скважины","Дожим","Реверсивная промывка","Ликвидация поглощения","Плотность раствора повышают, а флюид удаляют через штуцерную линию, поддерживая постоянное забойное давление."],["Какой признак при подъёме инструмента может указывать на ГНВП?","Скважина не доливается расчётным объёмом","Скважина доливается объёмом больше расчётного","Вес на крюке растёт на расхаживании","Выход раствора снижается при циркуляции","Если долив меньше объёма поднятого металла, значит, в скважину поступает флюид."]]},{"name":"Опасные вещества и газоопасные работы","q":[["Какова ПДК сероводорода в воздухе рабочей зоны?","10 мг/м³","3 мг/м³ для чистого сероводорода","30 мг/м³","20 мг/м³","Максимальная разовая ПДК сероводорода — 10 мг/м³. В смеси с углеводородами C₁–C₅ норма жёстче — 3 мг/м³."],["Для каких работ оформляется наряд-допуск?","Для огневых, газоопасных и других работ повышенной опасности","Для любых работ, выполняемых подрядной организацией","Для всех работ на территории ОПО без исключения","Только для работ на высоте более 5 метров","Наряд-допуск фиксирует объём работ, меры безопасности, ответственных и исполнителей, поэтому без него такие работы не начинают."],["Каков примерно нижний концентрационный предел распространения пламени метана в воздухе?","Около 5 % об.","Около 1,5 % об.","Около 10 % об.","Около 17 % об.","Метан воспламеняется в смеси с воздухом в диапазоне примерно 4,4–17 % об. Ниже него смесь слишком бедная, выше — слишком богатая."],["Почему сероводород особенно опасен в колодцах, приямках и низинах?","Он тяжелее воздуха и скапливается в низких местах","Он немного легче воздуха, но конденсируется при охлаждении","Он образует с водой тяжёлый аэрозоль только зимой","Он вытесняет воздух лишь при давлении выше атмосферного","Плотность H₂S выше плотности воздуха. Кроме того, при опасных концентрациях обоняние быстро притупляется, и запах перестаёт предупреждать."],["Что обязательно делают перед началом работ внутри ёмкости?","Проводят анализ воздушной среды","Проверяют наличие фильтрующего противогаза у каждого","Заполняют ёмкость азотом на время работ","Подогревают ёмкость для испарения остатков","В ёмкости могут быть пары углеводородов, сероводород или нехватка кислорода, поэтому состав воздуха проверяют до входа и контролируют во время работ."],["Какое средство защиты применяют при неизвестной или высокой концентрации сероводорода?","Изолирующий дыхательный аппарат","Фильтрующий противогаз с коробкой марки В","Фильтрующий противогаз с коробкой марки КД","Респиратор с угольным фильтром","Изолирующий аппарат подаёт воздух независимо от окружающей среды. Фильтрующие средства не защищают при высокой концентрации или нехватке кислорода."],["Что означает маркировка «Ex» на оборудовании?","Взрывозащищённое исполнение","Оборудование с повышенной стойкостью к низким температурам","Оборудование для внешней установки вне помещений","Оборудование с защитой от пыли и влаги IP65","Такое оборудование допускается в зонах с возможной взрывоопасной средой."],["Почему перед ремонтом трубопровода его продувают или пропаривают?","Чтобы удалить горючие и токсичные вещества","Чтобы проверить его герметичность","Чтобы снять внутренние напряжения в металле","Чтобы удалить продукты коррозии","Остатки углеводородов создают риск взрыва при огневых работах."],["Что такое заземление резервуара?","Защита от накопления статического электричества и удара молнии","Защита от перелива через дыхательный клапан при наполнении","Защита от смещения резервуара при осадке грунта","Катодная защита днища от почвенной коррозии и блуждающих токов","Разряд статического электричества может воспламенить пары нефти."],["На каком принципе основаны стационарные газоанализаторы на кустовых площадках?","На непрерывном контроле концентрации газа в воздухе","На измерении давления в трубопроводах площадки","На периодических пробах лаборатории","На фиксации снижения температуры при утечке","Система автоматически подаёт сигнал при превышении порога."],["Какова первая помощь при отравлении сероводородом на безопасном участке?","Вынести пострадавшего на свежий воздух и вызвать медиков","Дать выпить воды и уложить на месте до приезда врачей","Сделать промывание желудка содовым раствором","Вывести на холод и растереть конечности спиртом","Спасатель обязан сначала защитить себя изолирующим СИЗОД, чтобы не стать второй жертвой."],["Что запрещено делать при работе в загазованной зоне без разрешения?","Применять открытый огонь и искрящий инструмент","Находиться там дольше одного часа в СИЗОД","Работать вдвоём со страхующим","Применять омедненный инструмент","Искра может воспламенить смесь, поэтому огневые работы допускаются только по наряду."],["Какой уровень H₂S в воздухе рабочей зоны указан как ПДК в смеси с углеводородами?","3 мг/м³","10 мг/м³","30 мг/м³","100 мг/м³","Чистый сероводород — 10 мг/м³, а в смеси с углеводородами C1–C5 — 3 мг/м³."],["Что делать при срабатывании сигнала H₂S?","Надеть СИЗОД и покинуть зону навстречу ветру","Бежать вниз по склону в ближайшую низину","Лечь на землю и закрыть лицо мокрой тканью","Открыть задвижку на линии сброса","H₂S тяжелее воздуха, собирается в низинах."],["Что такое НКПР?","Минимальная концентрация, при которой смесь способна воспламениться","Максимальная концентрация горючего в трубе","Концентрация, при которой срабатывает сигнализатор на объекте","Максимальная концентрация, выше которой смесь уже не горит","У метана НКПР около 4,4 %."],["Что такое искробезопасная среда?","Цепи, которые не могут воспламенить смесь энергией искры","Помещение без электрооборудования","Территория с запретом курения и открытого огня","Помещение, в котором полностью отсутствует электрооборудование","Маркировка оборудования Ex указывает допустимую зону."],["Что такое ГНВП?","Газонефтеводопроявление — приток флюида в скважину","Разрешение на проведение работ повышенной опасности","Глушение через насосный агрегат","Гравитационный насос высокого перепада","Без контроля оно переходит в открытый фонтан."],["Какой тип превентора перекрывает пустое устье и трубу любого диаметра?","Универсальный","Глухой плашечный","Трубный плашечный","Срезной","Кольцевой элемент уплотняет по любой поверхности."],["Какой превентор перерезает трубу?","Срезной","Кольцевой","Глухой","Трубный","Применяется при потере контроля."]]},{"name":"Практические ситуации","q":[["При циркуляции на буровой внезапно вырос уровень в приёмной ёмкости. Что должен сделать бурильщик?","Остановить вращение и насос, поднять инструмент для закрытия превентора и загерметизировать устье","Увеличить подачу насоса, чтобы быстрее вымыть пачку газа, не поднимая инструмент с забоя","Поднять инструмент в башмак колонны и после этого закрыть превентор на устье скважины","Перейти на утяжелённый раствор и продолжить циркуляцию при открытом устье скважины","Рост объёма — признак притока. Главное — быстро закрыть скважину и ограничить объём поступившего флюида."],["Сработал сигнализатор сероводорода на кустовой площадке. Ваше первое действие?","Надеть изолирующий СИЗОД и выйти поперёк ветра, оповестив диспетчера","Надеть фильтрующий противогаз и пройти к источнику для проверки задвижек","Выйти по направлению ветра и сообщить диспетчеру после выхода из зоны","Перекрыть скважины куста, затем надеть СИЗОД и сообщить о срабатывании","Сначала защита себя и выход из зоны поперёк ветра, потом оповещение и работа по плану."],["Подрядчик просит начать огневые работы рядом с устьем, анализ воздуха пока не сделан. Как поступить?","Не допускать работы до оформления наряда-допуска и анализа воздушной среды","Разрешить, если замер воздуха был выполнен в предыдущую смену","Разрешить при наличии пожарного поста и огнетушителей на площадке","Разрешить под письменное обязательство руководителя подрядчика","Наряд-допуск и анализ воздуха обязательны независимо от длительности и опыта бригады."],["Какой из документов проверит инспектор в первую очередь при расследовании инцидента с газоопасными работами?","Наряд-допуск и журнал инструктажей","Паспорт объекта и лицензию на эксплуатацию ОПО","Проект производства работ и договор с подрядчиком","Декларацию промышленной безопасности объекта","Эти документы подтверждают, что работа была разрешена, а персонал проинструктирован."],["Коллега без каски спешит закончить работу на устье. Правильная реакция?","Остановить работу и потребовать применения СИЗ","Сделать устное замечание и позволить закончить операцию","Сообщить мастеру по окончании операции","Выдать ему каску после завершения работы на устье","Право и обязанность остановить опасную работу — основа культуры безопасности."]]}],"color":"#E4572E"},{"id":"env","name":"Охрана окружающей среды","subs":[{"name":"Правовые основы","q":[["Какой закон является базовым в охране окружающей среды?","Федеральный закон № 7-ФЗ «Об охране окружающей среды»","Федеральный закон № 174-ФЗ «Об экологической экспертизе»","Федеральный закон № 89-ФЗ «Об отходах производства и потребления»","Федеральный закон № 96-ФЗ «Об охране атмосферного воздуха»","Закон устанавливает принципы, требования и виды нормирования."],["Какой документ регулирует обращение с отходами?","Федеральный закон № 89-ФЗ","Федеральный закон № 7-ФЗ","Федеральный закон № 52-ФЗ","Федеральный закон № 174-ФЗ","Закон № 89-ФЗ определяет требования к сбору и утилизации отходов."],["Какой закон посвящён охране атмосферного воздуха?","Федеральный закон № 96-ФЗ","Федеральный закон № 7-ФЗ","Федеральный закон № 52-ФЗ","Федеральный закон № 174-ФЗ","Закон определяет нормирование выбросов и контроль."],["Какой документ регулирует использование водных объектов?","Водный кодекс РФ","Закон РФ «О недрах»","Федеральный закон № 7-ФЗ","Земельный кодекс РФ","Он устанавливает водоохранные зоны и правила пользования."],["Что такое ОВОС?","Оценка воздействия на окружающую среду","Оценка вероятности опасных событий","Очистка загрязнённых почв с помощью микроорганизмов","Отчёт о выбросах отходов и сбросах","ОВОС проводят для выявления последствий проектов до принятия решения."],["Что такое государственная экологическая экспертиза?","Проверка документации на соответствие экологическим требованиям","Очистка загрязнённых почв с помощью микроорганизмов","Внутренний аудит службы охраны окружающей среды","Плановая проверка объекта природоохранной прокуратурой","Для определённых объектов положительное заключение обязательно."],["На какие категории делятся объекты негативного воздействия?","На четыре категории (I–IV)","На три категории","На пять категорий","На две категории: опасные и неопасные","Категория определяет объём разрешительной документации и контроля."],["Что такое НДТ?","Наилучшие доступные технологии","Нормативы допустимых токсичностей","Наибольшие допустимые технологические выбросы","Нормы деятельности территорий","Для объектов I категории требования основаны на НДТ."],["Что такое КЭР?","Комплексное экологическое разрешение","Кадастр экологических рисков","Классификатор экологических ресурсов","Комплексная экспертиза реконструкции","Его получают объекты I категории."],["Что такое плата за НВОС?","Плата за негативное воздействие на окружающую среду","Штраф за аварийный разлив нефти","Налог на добычу, зачисляемый в экологический фонд","Возмещение вреда водным объектам","Её вносят за выбросы, сбросы и размещение отходов."]]},{"name":"Экологический контроль","q":[["Что такое производственный экологический контроль (ПЭК)?","Контроль компании за выбросами, сбросами и отходами","Надзор Росприроднадзора за предприятием","Экспертиза проектной документации перед стройкой","Проверка промышленной безопасности на ОПО","Программа ПЭК и отчётность обязательны для многих предприятий."],["Что такое ПДК?","Предельно допустимая концентрация вещества","Предельно допустимый коэффициент выброса","Показатель допустимого количества отходов","Плата за допустимую концентрацию","ПДК устанавливает безопасный уровень вещества в среде."],["Что такое мониторинг на месторождении?","Наб ":"#16A5C4","subs":[{"name":"Петрофизика","q":[["Почему глинистость по методу ГК может быть завышена?","При повышенном содержании радиоактивных минералов скелета породы.","Ошибки измерения радиоактивности","Математический аппарат расчета может быть ошибочен","Расхождение необъяснимо","ГК реагирует на естественную радиоактивность, а не на саму глину. Калиевые полевые шпаты, слюды, глауконит и другие радиоактивные минералы повышают показания, и чистый песчаник выглядит более глинистым, чем есть.","lzs-22"],["Для расчета пористости через объемную плотность необходимо знать","плотность скелета породы и плотность порового флюида","плотность породообразующих минералов","плотность фильтрата бурового раствора","плотность бурового раствора","Kп = (ρск − ρ) / (ρск − ρфл). Измеренная плотность складывается из скелета и флюида в порах, поэтому для расчёта нужны обе эти величины.","lzs-23"]]},{"name":"Приток и эксплуатация пластов","q":[["Метод рассеянного гамма излучения при исследовании обсаженных скважин позволяет определить:","Качество цементирования ствола скважины","Состояние контакта цемента и обсадных труб","Плотность и пористость горных пород","Плотность бурового раствора","В обсаженной скважине гамма-гамма-цементометрия фиксирует плотность вещества за колонной, а значит, наличие и равномерность цементного камня. Контакт цемента с трубой определяют акустической цементометрией.","lzs-42"],["В методе влагометрии используется различие свойств нефти и воды по:","Диэлектрической проницаемости","Плотности","Поглощающее способности нейтронов","Электропроводности","Диэлькометрическая влагометрия основана на резком различии: у воды диэлектрическая проницаемость около 80, у нефти около 2–3. Датчик измеряет проницаемость смеси и по ней оценивает долю воды.","lzs-43"]]},{"name":"Техническое состояние скважин","q":[["Что такое резистивиметрия скважины?","Это измерение удельного электрического сопротивления жидкости, заполняющей ствол скважины.","Это измерение скорости потока жидкости по стволу скважины с целью определения характера (профиля) притока жидкости.","Измерение температуры поступающего флюида с целью определения нарушения герметичности эксплуатационной колонны","Измерение скин-фактора и неоднородности продуктивного интервала с использованием меченной жидкости","Резистивиметр измеряет УЭС жидкости в стволе. Это нужно для учёта влияния бурового раствора и для выделения пресных и солёных притоков. Скорость потока измеряют расходомером, а температуру — термометром.","lzs-52"],["Для чего проводится барометрия обсаженных скважин?","Определение гидродинамических параметров (пластового и забойного давлений, оценка депрессии на пласты)","Метод определения пространственного положения ствола скважины","Для оценки изменения скорости пробега упругих волн","Определения состава жидкости в стволе скважины","Барометрия — это прямое измерение давления в стволе. По ней получают пластовое и забойное давления и депрессию на пласт. Положение ствола определяет инклинометрия, а состав жидкости — влагометрия и плотнометрия.","lzs-53"]]},{"name":"Планирование исследований","q":[["Какие из методов контроля технического состояния скважины обязательны при проведении ГИС в необсаженных скважинах?","Инклинометрия, кавернометрия","Кавернометрия, термометрия","Инклинометрия, термометрия","Инклинометрия, кавернометрия, термометрия, резистивиметрия","Инклинометрия задаёт положение ствола в пространстве, а кавернометрия — его фактический диаметр, без которого нельзя корректно интерпретировать другие методы. Поэтому эта пара составляет обязательную основу контроля.","lzs-57"],["Какой набор методов ГИС позволяет надежно определить водонефтенасыщение в продуктивном горизонте?","Электрические методы разной глубинности исследования","Кавернометрия и инклинометрия скважин","Акустический и нейтронный каротажи","Метод полей самопроизвольной поляризации и нейтронный метод","Нефть не проводит ток, а пластовая вода проводит, поэтому насыщение определяют по сопротивлению. Разная глубинность позволяет отделить зону проникновения фильтрата от неизменённой части пласта. Акустика и нейтронный метод в основном показывают пористость.","lzs-58"]]},{"name":"Методы ГИС","q":[["Какой метод ГИС измеряет естественную радиоактивность пород?","Гамма-каротаж","Нейтронный каротаж","Гамма-гамма-плотностной каротаж","Индукционный каротаж","ГК регистрирует собственное гамма-излучение, поэтому хорошо выделяет глинистые прослои."],["Почему в карбонатах ГК не всегда надёжно показывает глинистость?","Уран может давать высокие значения без глин","Карбонаты полностью экранируют гамма-излучение","Радиоактивность зависит только от пористости","Калий в карбонатах всегда отсутствует","Поэтому применяют спектральный ГК: он разделяет вклад урана, тория и калия."],["Что показывает спектральный гамма-каротаж?","Содержание тория, урана и калия","Распределение водорода по стволу","Объёмную плотность породы","Интервальное время пробега волны","Спектр позволяет отделить вклад каждого элемента и уточнить литологию."],["На что прямо реагирует нейтронный каротаж?","На водородосодержание","На электронную плотность","На глинистость через калий","На минерализацию фильтрата","Водород замедляет нейтроны, поэтому метод связан с пористостью и насыщающей жидкостью."],["Почему в газонасыщенном интервале нейтронная пористость занижена?","В газе мало водорода на единицу объёма","Газ поглощает тепловые нейтроны","Газ повышает плотность пласта","Газ увеличивает проводимость пласта","Отсюда «газовый эффект»: расхождение нейтронного и плотностного каротажей."],["Что измеряет плотностной каротаж ГГК-П?","Рассеянное гамма-излучение, связанное с электронной плотностью","Время затухания тепловых нейтронов, связанное с содержанием хлора","Естественное гамма-излучение, связанное с содержанием глин в пласте","Амплитуду отражённой продольной волны","Объёмная плотность затем пересчитывается в пористость."],["Какой показатель фотоэлектрического поглощения (PEF) наиболее типичен для известняка?","Около 5",
